<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#6366f1">
<title>WorkBoard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --primary:#6366f1;--primary-dark:#4f46e5;--primary-light:#e0e7ff;
  --success:#10b981;--warning:#f59e0b;--danger:#ef4444;--info:#3b82f6;
  --bg:#f1f5f9;--surface:#ffffff;--surface2:#f8fafc;
  --border:#e2e8f0;--border2:#cbd5e1;
  --text:#0f172a;--text2:#475569;--text3:#94a3b8;
  --sidebar:#0f172a;--sidebar-active:#6366f1;
  --radius:12px;--radius-sm:8px;--radius-lg:16px;
  --shadow:0 1px 3px rgba(0,0,0,.08),0 4px 16px rgba(0,0,0,.06);
  --shadow-lg:0 8px 32px rgba(0,0,0,.12);
  --font:'Inter',system-ui,sans-serif;
  --safe-bottom:env(safe-area-inset-bottom,0px);
}
html,body{height:100%;font-family:var(--font);background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased}
button{font-family:var(--font);cursor:pointer;border:none;background:none}
input,textarea,select{font-family:var(--font)}
a{text-decoration:none;color:inherit}

/* ─── SCROLLBAR ─── */
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:4px}

/* ─── LOGIN ─── */
#login-screen{
  position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,#0f172a 0%,#1e1b4b 50%,#312e81 100%);
  z-index:1000;padding:24px;
}
.login-card{
  width:100%;max-width:400px;background:rgba(255,255,255,.06);
  backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.12);
  border-radius:24px;padding:40px 32px;
}
.login-logo{text-align:center;margin-bottom:32px}
.login-logo .icon{
  width:64px;height:64px;background:var(--primary);border-radius:18px;
  display:inline-flex;align-items:center;justify-content:center;margin-bottom:12px;
  box-shadow:0 8px 32px rgba(99,102,241,.4);
}
.login-logo h1{color:#fff;font-size:1.6rem;font-weight:800;letter-spacing:-.02em}
.login-logo p{color:rgba(255,255,255,.5);font-size:.85rem;margin-top:4px}
.login-field{margin-bottom:16px}
.login-field label{display:block;color:rgba(255,255,255,.6);font-size:.78rem;font-weight:500;margin-bottom:6px;letter-spacing:.05em;text-transform:uppercase}
.login-field input{
  width:100%;padding:12px 16px;border-radius:var(--radius-sm);
  background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);
  color:#fff;font-size:.95rem;transition:.2s;outline:none;
}
.login-field input::placeholder{color:rgba(255,255,255,.3)}
.login-field input:focus{border-color:var(--primary);background:rgba(99,102,241,.15);box-shadow:0 0 0 3px rgba(99,102,241,.2)}
.login-error{background:rgba(239,68,68,.15);border:1px solid rgba(239,68,68,.3);color:#fca5a5;padding:10px 14px;border-radius:var(--radius-sm);font-size:.85rem;margin-bottom:16px;display:none}
.btn-login{
  width:100%;padding:14px;background:var(--primary);color:#fff;font-weight:700;
  font-size:1rem;border-radius:var(--radius-sm);margin-top:4px;
  transition:.2s;letter-spacing:.02em;
}
.btn-login:hover{background:var(--primary-dark);transform:translateY(-1px);box-shadow:0 4px 16px rgba(99,102,241,.4)}
.login-hint{text-align:center;margin-top:20px;color:rgba(255,255,255,.3);font-size:.78rem}

/* ─── APP SHELL ─── */
#app{display:none;height:100vh;overflow:hidden}
#app.visible{display:flex}

/* ─── SIDEBAR (desktop) ─── */
.sidebar{
  width:240px;flex-shrink:0;background:var(--sidebar);
  display:flex;flex-direction:column;padding:0;overflow:hidden;
}
.sidebar-brand{
  padding:24px 20px 20px;display:flex;align-items:center;gap:12px;
  border-bottom:1px solid rgba(255,255,255,.06);
}
.sidebar-brand .icon{
  width:36px;height:36px;background:var(--primary);border-radius:10px;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.sidebar-brand h2{color:#fff;font-size:1.1rem;font-weight:700;letter-spacing:-.01em}
.sidebar-user{
  padding:16px 20px;display:flex;align-items:center;gap:10px;
  border-bottom:1px solid rgba(255,255,255,.06);
}
.avatar{
  width:36px;height:36px;border-radius:50%;display:flex;align-items:center;
  justify-content:center;font-weight:700;font-size:.85rem;flex-shrink:0;color:#fff;
}
.sidebar-user-info{min-width:0}
.sidebar-user-info strong{color:#fff;font-size:.85rem;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sidebar-user-info span{color:rgba(255,255,255,.4);font-size:.75rem}
.sidebar-nav{flex:1;padding:12px 12px;overflow-y:auto}
.nav-label{color:rgba(255,255,255,.25);font-size:.68rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;padding:8px 8px 4px}
.nav-item{
  display:flex;align-items:center;gap:10px;padding:10px 12px;
  border-radius:var(--radius-sm);color:rgba(255,255,255,.55);font-size:.88rem;font-weight:500;
  cursor:pointer;transition:.15s;margin-bottom:2px;
}
.nav-item:hover{background:rgba(255,255,255,.06);color:rgba(255,255,255,.85)}
.nav-item.active{background:rgba(99,102,241,.2);color:#c7d2fe}
.nav-item svg{width:18px;height:18px;flex-shrink:0}
.nav-badge{
  margin-left:auto;background:var(--danger);color:#fff;font-size:.68rem;
  font-weight:700;padding:2px 6px;border-radius:10px;
}
.sidebar-footer{padding:12px;border-top:1px solid rgba(255,255,255,.06)}
.btn-logout{
  width:100%;padding:10px;border-radius:var(--radius-sm);color:rgba(255,255,255,.4);
  font-size:.85rem;display:flex;align-items:center;gap:8px;transition:.15s;
}
.btn-logout:hover{background:rgba(255,255,255,.06);color:rgba(255,255,255,.7)}

/* ─── MAIN CONTENT ─── */
.main{flex:1;display:flex;flex-direction:column;min-width:0;overflow:hidden}
.topbar{
  padding:16px 24px;background:var(--surface);border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:12px;flex-shrink:0;
}
.topbar-title{font-size:1.15rem;font-weight:700;flex:1;letter-spacing:-.02em}
.topbar-menu{display:none;width:40px;height:40px;border-radius:var(--radius-sm);align-items:center;justify-content:center}
.content{flex:1;overflow-y:auto;padding:24px;padding-bottom:calc(24px + var(--safe-bottom))}

/* ─── BOTTOM NAV (mobile) ─── */
.bottom-nav{
  display:none;background:var(--surface);border-top:1px solid var(--border);
  padding:8px 0 calc(8px + var(--safe-bottom));flex-shrink:0;
}
.bottom-nav-items{display:flex}
.bn-item{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;
  padding:6px 4px;cursor:pointer;color:var(--text3);font-size:.65rem;font-weight:500;transition:.15s;
  position:relative;
}
.bn-item.active{color:var(--primary)}
.bn-item svg{width:22px;height:22px}
.bn-badge{
  position:absolute;top:2px;right:calc(50% - 22px);background:var(--danger);
  color:#fff;font-size:.6rem;font-weight:700;padding:1px 5px;border-radius:10px;min-width:16px;text-align:center;
}

/* ─── RESPONSIVE ─── */
@media(max-width:768px){
  .sidebar{display:none}
  .topbar-menu{display:flex}
  .bottom-nav{display:block}
  .content{padding:16px;padding-bottom:calc(80px + var(--safe-bottom))}
  .topbar{padding:12px 16px}
}

/* ─── MOBILE SIDEBAR OVERLAY ─── */
.sidebar-overlay{
  display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;
}
.sidebar-overlay.open{display:block}
.sidebar.mobile-open{display:flex;position:fixed;left:0;top:0;bottom:0;z-index:201}

/* ─── STATS ROW ─── */
.stats-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:24px}
.stat-card{
  background:var(--surface);border-radius:var(--radius);padding:16px;
  border:1px solid var(--border);display:flex;align-items:flex-start;gap:12px;
}
.stat-icon{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.stat-info strong{font-size:1.5rem;font-weight:800;letter-spacing:-.03em;display:block}
.stat-info span{font-size:.75rem;color:var(--text2);font-weight:500}

/* ─── SECTION / WORKER COLUMNS ─── */
.sections-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px}
@media(max-width:768px){.sections-grid{grid-template-columns:1fr}}
.section-card{background:var(--surface);border-radius:var(--radius-lg);border:1px solid var(--border);overflow:hidden}
.section-header{
  padding:16px 16px 12px;display:flex;align-items:center;gap:10px;
  border-bottom:1px solid var(--border);
}
.section-avatar{width:32px;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.8rem;color:#fff;flex-shrink:0}
.section-name{font-weight:700;font-size:.95rem;flex:1}
.section-count{font-size:.75rem;color:var(--text3);background:var(--bg);padding:2px 8px;border-radius:20px;font-weight:600}
.section-tasks{padding:12px}
.section-empty{text-align:center;padding:32px 16px;color:var(--text3);font-size:.85rem}

/* ─── TASK CARD ─── */
.task-card{
  background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);
  padding:12px 14px;margin-bottom:8px;cursor:pointer;transition:.15s;position:relative;
  border-left:3px solid transparent;
}
.task-card:hover{box-shadow:var(--shadow);transform:translateY(-1px)}
.task-card.priority-urgent{border-left-color:#ef4444}
.task-card.priority-high{border-left-color:#f97316}
.task-card.priority-medium{border-left-color:#f59e0b}
.task-card.priority-low{border-left-color:#10b981}
.task-card-title{font-weight:600;font-size:.88rem;margin-bottom:8px;line-height:1.3}
.task-card-meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.badge{
  display:inline-flex;align-items:center;gap:4px;
  padding:3px 8px;border-radius:20px;font-size:.7rem;font-weight:600;white-space:nowrap;
}
.badge-pending{background:#f1f5f9;color:#64748b}
.badge-in_progress{background:#dbeafe;color:#1d4ed8}
.badge-completed{background:#d1fae5;color:#065f46}
.badge-overdue{background:#fee2e2;color:#b91c1c}
.badge-low{background:#d1fae5;color:#065f46}
.badge-medium{background:#fef3c7;color:#92400e}
.badge-high{background:#fed7aa;color:#9a3412}
.badge-urgent{background:#fee2e2;color:#b91c1c}
.deadline-text{font-size:.72rem;color:var(--text3);display:flex;align-items:center;gap:3px;margin-left:auto}
.deadline-text.overdue{color:var(--danger);font-weight:600}
.deadline-text.soon{color:var(--warning);font-weight:600}

/* ─── MY TASKS (worker view) ─── */
.my-tasks-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:12px}
.filter-row{display:flex;gap:8px;flex-wrap:wrap}
.filter-chip{
  padding:6px 12px;border-radius:20px;font-size:.8rem;font-weight:500;
  border:1px solid var(--border);background:var(--surface);color:var(--text2);cursor:pointer;transition:.15s;
}
.filter-chip.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.tasks-list{display:flex;flex-direction:column;gap:8px}

/* ─── BUTTONS ─── */
.btn{
  display:inline-flex;align-items:center;gap:6px;padding:9px 16px;
  border-radius:var(--radius-sm);font-weight:600;font-size:.85rem;transition:.15s;cursor:pointer;
}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{background:var(--primary-dark)}
.btn-secondary{background:var(--surface);color:var(--text);border:1px solid var(--border)}
.btn-secondary:hover{background:var(--bg)}
.btn-danger{background:var(--danger);color:#fff}
.btn-danger:hover{background:#dc2626}
.btn-success{background:var(--success);color:#fff}
.btn-sm{padding:6px 12px;font-size:.8rem}
.btn-icon{width:36px;height:36px;padding:0;display:inline-flex;align-items:center;justify-content:center;border-radius:var(--radius-sm)}
.btn-fab{
  position:fixed;right:20px;bottom:calc(80px + var(--safe-bottom));
  width:52px;height:52px;border-radius:50%;background:var(--primary);color:#fff;
  display:flex;align-items:center;justify-content:center;box-shadow:0 4px 20px rgba(99,102,241,.4);
  font-size:1.5rem;transition:.2s;z-index:50;
}
.btn-fab:hover{transform:scale(1.08)}
@media(min-width:769px){.btn-fab{bottom:24px}}

/* ─── MODAL ─── */
.modal-overlay{
  display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:300;
  align-items:flex-end;justify-content:center;
}
.modal-overlay.open{display:flex}
@media(min-width:769px){.modal-overlay{align-items:center}}
.modal{
  background:var(--surface);border-radius:24px 24px 0 0;width:100%;max-width:560px;
  max-height:92vh;display:flex;flex-direction:column;overflow:hidden;
  animation:slideUp .25s ease;
}
@media(min-width:769px){.modal{border-radius:var(--radius-lg);max-height:88vh}}
@keyframes slideUp{from{transform:translateY(40px);opacity:0}to{transform:translateY(0);opacity:1}}
.modal-handle{width:40px;height:4px;background:var(--border2);border-radius:2px;margin:12px auto 0;flex-shrink:0}
@media(min-width:769px){.modal-handle{display:none}}
.modal-header{
  padding:16px 20px;display:flex;align-items:center;justify-content:space-between;
  border-bottom:1px solid var(--border);flex-shrink:0;
}
.modal-header h3{font-size:1rem;font-weight:700}
.btn-close{width:32px;height:32px;border-radius:50%;background:var(--bg);color:var(--text2);display:flex;align-items:center;justify-content:center;font-size:1.1rem}
.modal-body{padding:20px;overflow-y:auto;flex:1}
.modal-footer{padding:16px 20px;border-top:1px solid var(--border);display:flex;gap:10px;justify-content:flex-end;flex-shrink:0}

/* ─── FORM ─── */
.form-group{margin-bottom:16px}
.form-group label{display:block;font-size:.8rem;font-weight:600;color:var(--text2);margin-bottom:6px}
.form-control{
  width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:var(--radius-sm);
  font-size:.9rem;color:var(--text);background:var(--surface);outline:none;transition:.15s;
}
.form-control:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(99,102,241,.12)}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:480px){.form-row{grid-template-columns:1fr}}
textarea.form-control{resize:vertical;min-height:80px}

/* ─── TASK DETAIL MODAL ─── */
.detail-status-row{display:flex;align-items:center;gap:10px;margin-bottom:20px;flex-wrap:wrap}
.detail-field{margin-bottom:16px}
.detail-field label{font-size:.75rem;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.05em;display:block;margin-bottom:4px}
.detail-field p{font-size:.9rem;color:var(--text)}
.action-row{display:flex;gap:8px;flex-wrap:wrap;padding:16px 20px;border-top:1px solid var(--border)}

/* ─── JUSTIFY MODAL ─── */
.justify-warning{
  background:#fef2f2;border:1px solid #fecaca;border-radius:var(--radius-sm);
  padding:12px 14px;margin-bottom:16px;font-size:.85rem;color:#991b1b;
}

/* ─── ANALYTICS ─── */
.analytics-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px;margin-top:20px}
.chart-card{background:var(--surface);border-radius:var(--radius-lg);padding:20px;border:1px solid var(--border)}
.chart-card h4{font-size:.9rem;font-weight:700;margin-bottom:16px;color:var(--text)}
.worker-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--border)}
.worker-row:last-child{border-bottom:none}
.worker-row-info{flex:1;min-width:0}
.worker-row-name{font-weight:600;font-size:.85rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.worker-row-sub{font-size:.75rem;color:var(--text3)}
.progress-bar{height:6px;background:var(--bg);border-radius:3px;margin-top:6px;overflow:hidden}
.progress-fill{height:100%;border-radius:3px;background:var(--primary);transition:.6s}
.perf-badge{
  padding:3px 10px;border-radius:20px;font-size:.72rem;font-weight:700;white-space:nowrap;
}

/* ─── SETTINGS ─── */
.users-list{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.user-row{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:14px 16px;display:flex;align-items:center;gap:12px;
}
.user-row-info{flex:1;min-width:0}
.user-row-name{font-weight:600;font-size:.9rem}
.user-row-meta{font-size:.78rem;color:var(--text3)}
.user-actions{display:flex;gap:6px}

/* ─── FIREBASE SETUP BANNER ─── */
.setup-banner{
  background:linear-gradient(135deg,#fef3c7,#fde68a);border:1px solid #f59e0b;
  border-radius:var(--radius);padding:16px;margin-bottom:20px;
}
.setup-banner h4{font-size:.9rem;font-weight:700;color:#92400e;margin-bottom:6px}
.setup-banner p{font-size:.8rem;color:#78350f;line-height:1.5}
.setup-banner code{background:rgba(0,0,0,.08);padding:1px 4px;border-radius:3px;font-family:monospace;font-size:.78rem}

/* ─── EMPTY STATE ─── */
.empty-state{text-align:center;padding:48px 24px;color:var(--text3)}
.empty-state svg{width:56px;height:56px;margin-bottom:12px;opacity:.4}
.empty-state h3{font-size:1rem;font-weight:600;color:var(--text2);margin-bottom:6px}
.empty-state p{font-size:.85rem}

/* ─── TOAST ─── */
#toast-container{position:fixed;bottom:calc(80px + var(--safe-bottom) + 8px);right:16px;z-index:999;display:flex;flex-direction:column;gap:8px}
@media(min-width:769px){#toast-container{bottom:24px}}
.toast{
  background:#1e293b;color:#fff;padding:12px 16px;border-radius:var(--radius-sm);
  font-size:.85rem;font-weight:500;max-width:300px;box-shadow:var(--shadow-lg);
  animation:toastIn .25s ease;display:flex;align-items:center;gap:8px;
}
.toast.success{border-left:3px solid var(--success)}
.toast.error{border-left:3px solid var(--danger)}
.toast.info{border-left:3px solid var(--info)}
@keyframes toastIn{from{transform:translateX(40px);opacity:0}to{transform:translateY(0);opacity:1}}

/* ─── MISC ─── */
.page-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:12px}
.page-title{font-size:1.2rem;font-weight:800;letter-spacing:-.02em}
.chip-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.chip{padding:5px 12px;border-radius:20px;font-size:.78rem;font-weight:600;cursor:pointer;transition:.15s;border:1px solid var(--border);background:var(--surface);color:var(--text2)}
.chip.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.divider{height:1px;background:var(--border);margin:16px 0}
.text-muted{color:var(--text3);font-size:.82rem}
.overdue-banner{
  background:#fef2f2;border:1px solid #fecaca;border-radius:var(--radius);
  padding:12px 16px;margin-bottom:16px;font-size:.85rem;color:#991b1b;
  display:flex;align-items:center;gap:8px;
}
</style>
</head>
<body>

<!-- ═══════════════ LOGIN ═══════════════ -->
<div id="login-screen">
  <div class="login-card">
    <div class="login-logo">
      <div class="icon">
        <svg width="32" height="32" fill="none" viewBox="0 0 24 24">
          <path fill="#fff" d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2M9 5a2 2 0 0 0 2 2h2a2 2 0 0 0 2-2M9 5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2m-6 9 2 2 4-4"/>
        </svg>
      </div>
      <h1>WorkBoard</h1>
      <p>Team Task Management</p>
    </div>
    <div id="login-error" class="login-error"></div>
    <div class="login-field">
      <label>Username</label>
      <input type="text" id="login-user" placeholder="Enter your username" autocomplete="username">
    </div>
    <div class="login-field">
      <label>Password</label>
      <input type="password" id="login-pass" placeholder="Enter your password" autocomplete="current-password">
    </div>
    <button class="btn-login" onclick="doLogin()">Sign In</button>

<!-- Toast container -->
<div id="toast-container"></div>

<script>
// ════════════════════════════════════════════════
//  FIREBASE CONFIG  — replace with your project
// ════════════════════════════════════════════════
const FB_BASE = 'https://bangle-tracker-default-rtdb.firebaseio.com';
const FB_CONFIGURED = true;

// ════════════════════════════════════════════════
//  STATE
// ════════════════════════════════════════════════
let S = {
  users: {},   // { id: {id,name,username,password,role,dept,color} }
  tasks: {},   // { id: {id,title,desc,assignedTo,createdBy,section,status,priority,deadline,completedAt,delayReason,createdAt} }
  currentUser: null,
  view: 'tasks',        // tasks | overview | analytics | settings
  taskFilter: 'all',    // all | pending | in_progress | overdue | completed
  editingTaskId: null,
  editingUserId: null,
  justifyTaskId: null,
};

const COLORS = ['#6366f1','#10b981','#f59e0b','#ef4444','#3b82f6','#8b5cf6','#ec4899','#14b8a6','#f97316','#06b6d4'];
let fbListenerAbort = null;
let deadlineTimer = null;

// ════════════════════════════════════════════════
//  FIREBASE HELPERS
// ════════════════════════════════════════════════
async function fbGet(path) {
  if (!FB_CONFIGURED) return null;
  try {
    const r = await fetch(`${FB_BASE}${path}.json`);
    if (!r.ok) return null;
    return await r.json();
  } catch { return null; }
}
async function fbPut(path, data) {
  if (!FB_CONFIGURED) return;
  try { await fetch(`${FB_BASE}${path}.json`, {method:'PUT',body:JSON.stringify(data)}); } catch {}
}
async function fbPatch(path, data) {
  if (!FB_CONFIGURED) return;
  try { await fetch(`${FB_BASE}${path}.json`, {method:'PATCH',body:JSON.stringify(data)}); } catch {}
}
async function fbDelete(path) {
  if (!FB_CONFIGURED) return;
  try { await fetch(`${FB_BASE}${path}.json`, {method:'DELETE'}); } catch {}
}
function fbListen() {
  if (!FB_CONFIGURED) return;
  if (fbListenerAbort) fbListenerAbort.abort();
  fbListenerAbort = new AbortController();
  const es = new EventSource(`${FB_BASE}/wb.json?limitToLast=1`);
  es.addEventListener('put', () => { loadFromFB(); });
  es.addEventListener('patch', () => { loadFromFB(); });
}
async function loadFromFB() {
  const data = await fbGet('/wb');
  if (!data) return;
  if (data.users) S.users = data.users;
  if (data.tasks) S.tasks = data.tasks;
  saveLocal();
  checkDeadlines();
  render();
}
async function pushToFB() {
  if (!FB_CONFIGURED) return;
  await fbPut('/wb', { users: S.users, tasks: S.tasks });
}

// ════════════════════════════════════════════════
//  LOCAL STORAGE
// ════════════════════════════════════════════════
const LS_KEY = 'workboard_v1';
function saveLocal() {
  try { localStorage.setItem(LS_KEY, JSON.stringify({users:S.users,tasks:S.tasks})); } catch {}
}
function loadLocal() {
  try {
    const d = JSON.parse(localStorage.getItem(LS_KEY) || 'null');
    if (d) { if(d.users) S.users=d.users; if(d.tasks) S.tasks=d.tasks; }
  } catch {}
}
const LS_SESSION = 'wb_session';
function saveSession(uid) { try { sessionStorage.setItem(LS_SESSION, uid); } catch {} }
function loadSession() { try { return sessionStorage.getItem(LS_SESSION); } catch { return null; } }
function clearSession() { try { sessionStorage.removeItem(LS_SESSION); } catch {} }

// ════════════════════════════════════════════════
//  AUTH
// ════════════════════════════════════════════════
function doLogin() {
  const u = document.getElementById('login-user').value.trim().toLowerCase();
  const p = document.getElementById('login-pass').value;
  const errEl = document.getElementById('login-error');
  errEl.style.display = 'none';
  const user = Object.values(S.users).find(x => x.username.toLowerCase() === u && x.password === p);
  if (!user) { errEl.textContent = 'Invalid username or password.'; errEl.style.display='block'; return; }
  S.currentUser = user;
  saveSession(user.id);
  startApp();
}
function doLogout() {
  S.currentUser = null;
  clearSession();
  document.getElementById('app').classList.remove('visible');
  document.getElementById('app').style.display = 'none';
  document.getElementById('login-screen').style.display = 'flex';
  document.getElementById('login-user').value = '';
  document.getElementById('login-pass').value = '';
  if (deadlineTimer) clearInterval(deadlineTimer);
}
function startApp() {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app').style.display = 'flex';
  document.getElementById('app').classList.add('visible');
  S.view = S.currentUser.role === 'owner' ? 'overview' : 'tasks';
  renderNav();
  checkDeadlines();
  render();
  fbListen();
  deadlineTimer = setInterval(checkDeadlines, 60000);
}

// ════════════════════════════════════════════════
//  DEADLINE ENFORCEMENT
// ════════════════════════════════════════════════
function checkDeadlines() {
  const now = Date.now();
  let changed = false;
  Object.values(S.tasks).forEach(t => {
    if ((t.status === 'pending' || t.status === 'in_progress') && t.deadline && t.deadline < now) {
      t.status = 'overdue';
      changed = true;
    }
  });
  if (changed) { saveLocal(); pushToFB(); render(); }
}

// ════════════════════════════════════════════════
//  TASK CRUD
// ════════════════════════════════════════════════
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2,6); }

function saveTask() {
  const title = document.getElementById('task-title').value.trim();
  const assignee = document.getElementById('task-assignee').value;
  const dateVal = document.getElementById('task-date').value;
  if (!title) { toast('Task title is required','error'); return; }
  if (!assignee) { toast('Please assign the task to someone','error'); return; }
  if (!dateVal) { toast('Please set a deadline','error'); return; }

  const timeVal = document.getElementById('task-time').value || '23:59';
  const deadline = new Date(`${dateVal}T${timeVal}:00`).getTime();
  const assigneeUser = S.users[assignee];
  const section = document.getElementById('task-section').value.trim() || (assigneeUser ? assigneeUser.dept || assigneeUser.name : 'General');

  const isEdit = !!S.editingTaskId;
  const id = isEdit ? S.editingTaskId : uid();
  const existing = isEdit ? S.tasks[id] : {};

  let status = document.getElementById('task-status').value;
  if (isEdit && existing.status === 'overdue') status = 'overdue'; // preserve overdue
  if (deadline < Date.now() && !isEdit) status = 'overdue';

  S.tasks[id] = {
    ...existing,
    id, title,
    desc: document.getElementById('task-desc').value.trim(),
    assignedTo: assignee,
    section,
    priority: document.getElementById('task-priority').value,
    status,
    deadline,
    createdBy: S.currentUser.id,
    createdAt: existing.createdAt || Date.now(),
  };

  saveLocal(); pushToFB(); closeModal('modal-task');
  toast(isEdit ? 'Task updated' : 'Task created');
  S.editingTaskId = null;
  render();
}

function deleteTask(id) {
  if (!confirm('Delete this task?')) return;
  delete S.tasks[id];
  saveLocal(); pushToFB(); closeModal('modal-detail');
  toast('Task deleted'); render();
}

function completeTask(id) {
  const t = S.tasks[id];
  if (!t) return;
  if (t.status === 'overdue') { S.justifyTaskId = id; showModal('modal-justify'); return; }
  t.status = 'completed'; t.completedAt = Date.now();
  saveLocal(); pushToFB(); closeModal('modal-detail');
  toast('Task marked complete!'); render();
}

function submitJustification() {
  const reason = document.getElementById('justify-reason').value.trim();
  if (!reason) { toast('Please provide a reason','error'); return; }
  const t = S.tasks[S.justifyTaskId];
  if (!t) return;
  t.status = 'completed'; t.completedAt = Date.now(); t.delayReason = reason;
  saveLocal(); pushToFB();
  closeModal('modal-justify'); closeModal('modal-detail');
  toast('Task completed with justification'); render();
  S.justifyTaskId = null;
  document.getElementById('justify-reason').value = '';
}

function reopenTask(id) {
  const t = S.tasks[id];
  if (!t) return;
  const now = Date.now();
  t.status = t.deadline && t.deadline < now ? 'overdue' : 'in_progress';
  t.completedAt = null; t.delayReason = null;
  saveLocal(); pushToFB(); closeModal('modal-detail');
  toast('Task reopened'); render();
}

// ════════════════════════════════════════════════
//  USER CRUD
// ════════════════════════════════════════════════
function saveUser() {
  const name = document.getElementById('user-name').value.trim();
  const username = document.getElementById('user-username').value.trim().toLowerCase();
  const password = document.getElementById('user-password').value;
  const role = document.getElementById('user-role').value;
  const dept = document.getElementById('user-dept').value.trim();

  if (!name || !username) { toast('Name and username are required','error'); return; }
  const isEdit = !!S.editingUserId;
  if (!isEdit && !password) { toast('Password is required','error'); return; }

  // Check username uniqueness
  const dup = Object.values(S.users).find(u => u.username.toLowerCase() === username && u.id !== S.editingUserId);
  if (dup) { toast('Username already taken','error'); return; }

  const id = isEdit ? S.editingUserId : uid();
  const existing = isEdit ? S.users[id] : {};
  const colorIndex = Object.keys(S.users).length % COLORS.length;

  S.users[id] = {
    ...existing,
    id, name, username, role, dept,
    password: password || existing.password,
    color: existing.color || COLORS[colorIndex],
  };

  if (S.currentUser && S.currentUser.id === id) S.currentUser = S.users[id];
  saveLocal(); pushToFB(); closeModal('modal-user');
  toast(isEdit ? 'User updated' : 'Team member added');
  S.editingUserId = null; render(); renderNav();
}

function deleteUser(id) {
  if (id === S.currentUser.id) { toast('Cannot delete yourself','error'); return; }
  if (!confirm('Delete this user? Their tasks will remain.')) return;
  delete S.users[id];
  saveLocal(); pushToFB(); toast('User removed'); render();
}

// ════════════════════════════════════════════════
//  MODALS
// ════════════════════════════════════════════════
function showAddTask(preAssignTo) {
  S.editingTaskId = null;
  document.getElementById('modal-task-title').textContent = 'New Task';
  document.getElementById('task-title').value = '';
  document.getElementById('task-desc').value = '';
  document.getElementById('task-section').value = '';
  document.getElementById('task-priority').value = 'medium';
  document.getElementById('task-status').value = 'pending';
  // Set default deadline to tomorrow
  const tom = new Date(); tom.setDate(tom.getDate()+1);
  document.getElementById('task-date').value = tom.toISOString().slice(0,10);
  document.getElementById('task-time').value = '18:00';
  // Populate assignee dropdown
  populateAssigneeSelect(preAssignTo || (S.currentUser.role === 'worker' ? S.currentUser.id : ''));
  showModal('modal-task');
  setTimeout(()=>document.getElementById('task-title').focus(), 300);
}

function showEditTask(id) {
  const t = S.tasks[id];
  if (!t) return;
  S.editingTaskId = id;
  document.getElementById('modal-task-title').textContent = 'Edit Task';
  document.getElementById('task-title').value = t.title;
  document.getElementById('task-desc').value = t.desc || '';
  document.getElementById('task-section').value = t.section || '';
  document.getElementById('task-priority').value = t.priority;
  document.getElementById('task-status').value = t.status;
  const dl = t.deadline ? new Date(t.deadline) : new Date();
  document.getElementById('task-date').value = dl.toISOString().slice(0,10);
  document.getElementById('task-time').value = dl.toTimeString().slice(0,5);
  populateAssigneeSelect(t.assignedTo);
  closeModal('modal-detail');
  showModal('modal-task');
}

function populateAssigneeSelect(selected) {
  const sel = document.getElementById('task-assignee');
  sel.innerHTML = '<option value="">-- Select person --</option>';
  const workers = Object.values(S.users);
  if (S.currentUser.role === 'worker') {
    // Workers can only assign to themselves
    const u = S.currentUser;
    sel.innerHTML = `<option value="${u.id}" selected>${u.name}</option>`;
    return;
  }
  workers.forEach(u => {
    const opt = document.createElement('option');
    opt.value = u.id; opt.textContent = u.name;
    if (u.id === selected) opt.selected = true;
    sel.appendChild(opt);
  });
}

function showTaskDetail(id) {
  const t = S.tasks[id];
  if (!t) return;
  const assignee = S.users[t.assignedTo];
  const creator = S.users[t.createdBy];
  const dl = t.deadline ? new Date(t.deadline) : null;
  const dlStr = dl ? `${dl.toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'})} at ${dl.toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'})}` : 'No deadline';
  const isOverdue = t.status === 'overdue';
  const now = Date.now();
  const canComplete = S.currentUser.role === 'owner' || S.currentUser.id === t.assignedTo;
  const isCompleted = t.status === 'completed';

  document.getElementById('detail-body').innerHTML = `
    <div class="detail-status-row">
      <span class="badge badge-${t.status}">${statusLabel(t.status)}</span>
      <span class="badge badge-${t.priority}">${capFirst(t.priority)}</span>
      ${isOverdue ? '<span style="color:var(--danger);font-size:.82rem;font-weight:600">⚠ Deadline passed</span>' : ''}
    </div>
    <h3 style="font-size:1.1rem;font-weight:700;margin-bottom:12px;line-height:1.4">${esc(t.title)}</h3>
    ${t.desc ? `<p style="color:var(--text2);font-size:.88rem;margin-bottom:16px;line-height:1.5">${esc(t.desc)}</p>` : ''}
    <div class="divider"></div>
    <div class="form-row">
      <div class="detail-field">
        <label>Assigned To</label>
        <p>${assignee ? assignee.name : 'Unknown'}</p>
      </div>
      <div class="detail-field">
        <label>Section</label>
        <p>${esc(t.section || '—')}</p>
      </div>
    </div>
    <div class="form-row">
      <div class="detail-field">
        <label>Deadline</label>
        <p style="color:${isOverdue?'var(--danger)':'inherit'}">${dlStr}</p>
      </div>
      <div class="detail-field">
        <label>Created By</label>
        <p>${creator ? creator.name : 'Unknown'}</p>
      </div>
    </div>
    ${isCompleted && t.completedAt ? `<div class="detail-field"><label>Completed At</label><p>${new Date(t.completedAt).toLocaleString('en-IN')}</p></div>` : ''}
    ${t.delayReason ? `<div class="detail-field"><label>Delay Justification</label><p style="color:var(--warning);font-style:italic">${esc(t.delayReason)}</p></div>` : ''}
  `;

  const actions = document.getElementById('detail-actions');
  actions.innerHTML = '';
  if (!isCompleted && canComplete) {
    const btn = document.createElement('button');
    btn.className = 'btn btn-success';
    btn.innerHTML = `<svg width="16" height="16" fill="none" viewBox="0 0 24 24"><path stroke="#fff" stroke-width="2" d="M5 13l4 4L19 7"/></svg> Mark Complete`;
    btn.onclick = () => completeTask(id);
    actions.appendChild(btn);
  }
  if (isCompleted) {
    const btn = document.createElement('button');
    btn.className = 'btn btn-secondary';
    btn.textContent = 'Reopen Task';
    btn.onclick = () => reopenTask(id);
    actions.appendChild(btn);
  }
  if (S.currentUser.role === 'owner' || S.currentUser.id === t.createdBy) {
    const editBtn = document.createElement('button');
    editBtn.className = 'btn btn-secondary';
    editBtn.textContent = 'Edit';
    editBtn.onclick = () => showEditTask(id);
    actions.appendChild(editBtn);

    const delBtn = document.createElement('button');
    delBtn.className = 'btn btn-danger btn-sm';
    delBtn.textContent = 'Delete';
    delBtn.onclick = () => deleteTask(id);
    actions.appendChild(delBtn);
  }

  showModal('modal-detail');
}

function showModal(id) { document.getElementById(id).classList.add('open'); }
function closeModal(id) { document.getElementById(id).classList.remove('open'); }

// Close modals on overlay click
document.querySelectorAll('.modal-overlay').forEach(el => {
  el.addEventListener('click', e => { if(e.target === el) closeModal(el.id); });
});

// ════════════════════════════════════════════════
//  NAV RENDERING
// ════════════════════════════════════════════════
function renderNav() {
  const u = S.currentUser;
  if (!u) return;

  // Sidebar user
  const color = u.color || '#6366f1';
  document.getElementById('sidebar-user').innerHTML = `
    <div class="avatar" style="background:${color}">${initials(u.name)}</div>
    <div class="sidebar-user-info">
      <strong>${esc(u.name)}</strong>
      <span>${capFirst(u.role)}</span>
    </div>
  `;

  // Nav items
  const overdueCnt = Object.values(S.tasks).filter(t => t.status==='overdue' && (u.role==='owner'||t.assignedTo===u.id)).length;
  const isOwner = u.role === 'owner';
  const navItems = isOwner ? [
    {id:'overview',icon:gridIcon(),label:'All Tasks'},
    {id:'tasks',icon:taskIcon(),label:'My Tasks'},
    {id:'analytics',icon:chartIcon(),label:'Analytics'},
    {id:'settings',icon:settingsIcon(),label:'Settings'},
  ] : [
    {id:'tasks',icon:taskIcon(),label:'My Tasks'},
  ];

  document.getElementById('sidebar-nav').innerHTML = navItems.map(n => `
    <div class="nav-item ${S.view===n.id?'active':''}" onclick="setView('${n.id}')">
      ${n.icon} ${n.label}
      ${n.id==='overview'&&overdueCnt>0?`<span class="nav-badge">${overdueCnt}</span>`:''}
      ${n.id==='tasks'&&!isOwner&&overdueCnt>0?`<span class="nav-badge">${overdueCnt}</span>`:''}
    </div>
  `).join('');

  // Bottom nav
  document.getElementById('bottom-nav-items').innerHTML = navItems.map(n => `
    <div class="bn-item ${S.view===n.id?'active':''}" onclick="setView('${n.id}')">
      ${n.icon.replace('width="18"','width="22"').replace('height="18"','height="22"')}
      ${n.id==='overview'&&overdueCnt>0?`<span class="bn-badge">${overdueCnt}</span>`:''}
      ${n.id==='tasks'&&!isOwner&&overdueCnt>0?`<span class="bn-badge">${overdueCnt}</span>`:''}
      <span>${n.label}</span>
    </div>
  `).join('');
}

function setView(v) {
  S.view = v; closeSidebar(); renderNav(); render();
}

function openSidebar() {
  document.getElementById('sidebar').classList.add('mobile-open');
  document.getElementById('sidebar-overlay').classList.add('open');
}
function closeSidebar() {
  document.getElementById('sidebar').classList.remove('mobile-open');
  document.getElementById('sidebar-overlay').classList.remove('open');
}

// ════════════════════════════════════════════════
//  MAIN RENDER
// ════════════════════════════════════════════════
function render() {
  const titles = {tasks:'My Tasks',overview:'All Tasks',analytics:'Analytics',settings:'Settings'};
  document.getElementById('topbar-title').textContent = titles[S.view] || 'WorkBoard';
  const fab = document.getElementById('fab');
  fab.style.display = (S.view==='tasks'||S.view==='overview') ? 'flex' : 'none';

  const topActions = document.getElementById('topbar-actions');
  topActions.innerHTML = '';
  if (S.view==='overview'||S.view==='tasks') {
    const btn = document.createElement('button');
    btn.className='btn btn-primary btn-sm';
    btn.innerHTML=`<svg width="14" height="14" fill="none" viewBox="0 0 24 24"><path stroke="#fff" stroke-width="2.5" d="M12 5v14M5 12h14"/></svg> New Task`;
    btn.onclick=()=>showAddTask();
    topActions.appendChild(btn);
  }

  if (S.view === 'tasks') renderMyTasks();
  else if (S.view === 'overview') renderOverview();
  else if (S.view === 'analytics') renderAnalytics();
  else if (S.view === 'settings') renderSettings();
  renderNav();
}

// ════════════════════════════════════════════════
//  MY TASKS VIEW (worker)
// ════════════════════════════════════════════════
function renderMyTasks() {
  const myTasks = Object.values(S.tasks)
    .filter(t => t.assignedTo === S.currentUser.id)
    .sort((a,b) => (a.deadline||0) - (b.deadline||0));

  const counts = {all:myTasks.length};
  ['pending','in_progress','overdue','completed'].forEach(s => { counts[s] = myTasks.filter(t=>t.status===s).length; });

  const filtered = S.taskFilter === 'all' ? myTasks : myTasks.filter(t=>t.status===S.taskFilter);
  const overdueCnt = counts.overdue;

  document.getElementById('content').innerHTML = `
    ${!FB_CONFIGURED ? setupBanner() : ''}
    ${overdueCnt > 0 ? `<div class="overdue-banner"><svg width="18" height="18" fill="none" viewBox="0 0 24 24"><path fill="currentColor" d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2zm1 15h-2v-2h2zm0-4h-2V7h2z"/></svg><span>You have <strong>${overdueCnt} overdue task${overdueCnt>1?'s':''}</strong> requiring attention.</span></div>` : ''}
    <div class="stats-row">
      ${statCard(counts.all,'Total Tasks','#6366f1','📋')}
      ${statCard(counts.in_progress,'In Progress','#3b82f6','⚡')}
      ${statCard(counts.overdue,'Overdue','#ef4444','⏰')}
      ${statCard(counts.completed,'Completed','#10b981','✓')}
    </div>
    <div class="chip-row">
      ${['all','pending','in_progress','overdue','completed'].map(s=>`
        <div class="chip ${S.taskFilter===s?'active':''}" onclick="setFilter('${s}')">${filterLabel(s)} ${counts[s]||''}</div>
      `).join('')}
    </div>
    ${filtered.length === 0 ? emptyState('No tasks found','Try changing the filter or add a new task') : `
      <div class="tasks-list">${filtered.map(t=>taskCard(t,true)).join('')}</div>
    `}
  `;
}

// ════════════════════════════════════════════════
//  OVERVIEW (owner sees all workers)
// ════════════════════════════════════════════════
function renderOverview() {
  const allTasks = Object.values(S.tasks);
  const counts = {all:allTasks.length};
  ['pending','in_progress','overdue','completed'].forEach(s=>{counts[s]=allTasks.filter(t=>t.status===s).length});

  // Group tasks by assignee
  const byUser = {};
  Object.values(S.users).forEach(u => { byUser[u.id] = []; });
  allTasks.forEach(t => {
    if (!byUser[t.assignedTo]) byUser[t.assignedTo] = [];
    byUser[t.assignedTo].push(t);
  });
  // Unassigned
  const unassigned = allTasks.filter(t => !S.users[t.assignedTo]);

  const filteredTasks = S.taskFilter === 'all' ? null : true;

  document.getElementById('content').innerHTML = `
    ${!FB_CONFIGURED ? setupBanner() : ''}
    <div class="stats-row">
      ${statCard(counts.all,'Total Tasks','#6366f1','📋')}
      ${statCard(counts.in_progress,'In Progress','#3b82f6','⚡')}
      ${statCard(counts.overdue,'Overdue','#ef4444','⏰')}
      ${statCard(counts.completed,'Completed','#10b981','✓')}
    </div>
    <div class="chip-row">
      ${['all','pending','in_progress','overdue','completed'].map(s=>`
        <div class="chip ${S.taskFilter===s?'active':''}" onclick="setFilter('${s}')">${filterLabel(s)} ${counts[s]||''}</div>
      `).join('')}
    </div>
    <div class="sections-grid">
      ${Object.values(S.users).map(u => {
        let tasks = byUser[u.id] || [];
        if (S.taskFilter !== 'all') tasks = tasks.filter(t=>t.status===S.taskFilter);
        return sectionColumn(u, tasks);
      }).join('')}
      ${unassigned.length > 0 ? sectionColumnRaw('Unassigned','#94a3b8','UN', unassigned.filter(t=>S.taskFilter==='all'||t.status===S.taskFilter)) : ''}
    </div>
  `;
}

function sectionColumn(user, tasks) {
  const sorted = tasks.sort((a,b)=>(a.deadline||0)-(b.deadline||0));
  const overdueCnt = tasks.filter(t=>t.status==='overdue').length;
  return `
    <div class="section-card">
      <div class="section-header">
        <div class="section-avatar" style="background:${user.color||'#6366f1'}">${initials(user.name)}</div>
        <span class="section-name">${esc(user.name)}${user.dept?`<br><span style="font-size:.72rem;font-weight:400;color:var(--text3)">${esc(user.dept)}</span>`:''}</span>
        <span class="section-count">${tasks.length}</span>
        ${overdueCnt>0?`<span class="badge badge-overdue">${overdueCnt} overdue</span>`:''}
        <button class="btn btn-primary btn-sm btn-icon" onclick="showAddTask('${user.id}')" title="Add task for ${esc(user.name)}">
          <svg width="14" height="14" fill="none" viewBox="0 0 24 24"><path stroke="#fff" stroke-width="2.5" d="M12 5v14M5 12h14"/></svg>
        </button>
      </div>
      <div class="section-tasks">
        ${sorted.length === 0 ? `<div class="section-empty">No tasks${S.taskFilter!=='all'?' matching filter':''}</div>` : sorted.map(t=>taskCard(t,false)).join('')}
      </div>
    </div>
  `;
}

function sectionColumnRaw(label, color, abbr, tasks) {
  return `
    <div class="section-card">
      <div class="section-header">
        <div class="section-avatar" style="background:${color}">${abbr}</div>
        <span class="section-name">${label}</span>
        <span class="section-count">${tasks.length}</span>
      </div>
      <div class="section-tasks">
        ${tasks.length===0?`<div class="section-empty">No tasks</div>`:tasks.map(t=>taskCard(t,false)).join('')}
      </div>
    </div>
  `;
}

function taskCard(t, showSection) {
  const dl = t.deadline ? new Date(t.deadline) : null;
  const now = Date.now();
  const dlDiff = dl ? dl.getTime() - now : null;
  const dlClass = t.status==='overdue' ? 'overdue' : (dlDiff && dlDiff < 86400000 && dlDiff > 0 ? 'soon' : '');
  const dlText = dl ? formatDeadline(dl, t.status) : '';
  return `
    <div class="task-card priority-${t.priority}" onclick="showTaskDetail('${t.id}')">
      <div class="task-card-title">${esc(t.title)}</div>
      <div class="task-card-meta">
        <span class="badge badge-${t.status}">${statusLabel(t.status)}</span>
        ${showSection&&t.section?`<span class="badge" style="background:var(--bg);color:var(--text3)">${esc(t.section)}</span>`:''}
        ${dlText?`<span class="deadline-text ${dlClass}"><svg width="10" height="10" fill="none" viewBox="0 0 24 24"><path fill="currentColor" d="M12 2a10 10 0 1 0 10 10A10.011 10.011 0 0 0 12 2zm.5 5v5.25l4.5 2.67-.75 1.23L11 13V7z"/></svg>${dlText}</span>`:''}
      </div>
    </div>
  `;
}

// ════════════════════════════════════════════════
//  ANALYTICS VIEW
// ════════════════════════════════════════════════
function renderAnalytics() {
  const allTasks = Object.values(S.tasks);
  const workers = Object.values(S.users).filter(u => u.role !== 'owner' || true); // show all users

  // Per-user stats
  const stats = workers.map(u => {
    const ut = allTasks.filter(t => t.assignedTo === u.id);
    const completed = ut.filter(t => t.status === 'completed');
    const onTime = completed.filter(t => !t.delayReason);
    const late = completed.filter(t => !!t.delayReason);
    const overdue = ut.filter(t => t.status === 'overdue');
    const rate = ut.length ? Math.round(completed.length / ut.length * 100) : 0;
    return { user:u, total:ut.length, completed:completed.length, onTime:onTime.length, late:late.length, overdue:overdue.length, rate };
  }).sort((a,b) => b.rate - a.rate);

  const statusCounts = {
    pending: allTasks.filter(t=>t.status==='pending').length,
    in_progress: allTasks.filter(t=>t.status==='in_progress').length,
    completed: allTasks.filter(t=>t.status==='completed').length,
    overdue: allTasks.filter(t=>t.status==='overdue').length,
  };

  document.getElementById('content').innerHTML = `
    <div class="stats-row">
      ${statCard(allTasks.length,'Total Tasks','#6366f1','📋')}
      ${statCard(statusCounts.completed,'Completed','#10b981','✓')}
      ${statCard(statusCounts.overdue,'Overdue','#ef4444','⏰')}
      ${statCard(allTasks.length>0?Math.round(statusCounts.completed/allTasks.length*100):0+'%','Completion Rate','#f59e0b','%')}
    </div>
    <div class="analytics-grid">
      <div class="chart-card" style="grid-column:1/-1">
        <h4>Team Performance</h4>
        <div style="overflow-x:auto">
          ${stats.map(s => `
            <div class="worker-row">
              <div class="avatar" style="background:${s.user.color||'#6366f1'};width:36px;height:36px;font-size:.8rem;border-radius:50%">${initials(s.user.name)}</div>
              <div class="worker-row-info">
                <div class="worker-row-name">${esc(s.user.name)}</div>
                <div class="worker-row-sub">${s.completed}/${s.total} completed • ${s.onTime} on time • ${s.late} late • ${s.overdue} overdue</div>
                <div class="progress-bar"><div class="progress-fill" style="width:${s.rate}%;background:${s.rate>=80?'var(--success)':s.rate>=50?'var(--warning)':'var(--danger)'}"></div></div>
              </div>
              <span class="perf-badge" style="background:${s.rate>=80?'#d1fae5':s.rate>=50?'#fef3c7':'#fee2e2'};color:${s.rate>=80?'#065f46':s.rate>=50?'#92400e':'#b91c1c'}">${s.rate}%</span>
            </div>
          `).join('')}
          ${stats.length===0?`<p class="text-muted" style="padding:24px;text-align:center">No team members yet</p>`:''}
        </div>
      </div>
      <div class="chart-card">
        <h4>Tasks by Status</h4>
        <canvas id="donut-chart" style="max-height:220px"></canvas>
      </div>
      <div class="chart-card">
        <h4>Tasks per Person</h4>
        <canvas id="bar-chart" style="max-height:220px"></canvas>
      </div>
    </div>
  `;

  // Render charts after DOM update
  requestAnimationFrame(() => {
    // Donut chart
    const ctx1 = document.getElementById('donut-chart');
    if (ctx1) {
      new Chart(ctx1, {
        type: 'doughnut',
        data: {
          labels: ['Pending','In Progress','Completed','Overdue'],
          datasets: [{
            data: [statusCounts.pending, statusCounts.in_progress, statusCounts.completed, statusCounts.overdue],
            backgroundColor: ['#94a3b8','#3b82f6','#10b981','#ef4444'],
            borderWidth: 0, hoverOffset: 6,
          }]
        },
        options: {
          responsive:true, maintainAspectRatio:true,
          plugins:{legend:{position:'bottom',labels:{font:{family:'Inter',size:11},padding:12}}},
          cutout:'65%',
        }
      });
    }
    // Bar chart
    const ctx2 = document.getElementById('bar-chart');
    if (ctx2 && stats.length > 0) {
      new Chart(ctx2, {
        type: 'bar',
        data: {
          labels: stats.map(s => s.user.name.split(' ')[0]),
          datasets: [
            {label:'Completed',data:stats.map(s=>s.completed),backgroundColor:'#10b981',borderRadius:4},
            {label:'Overdue',data:stats.map(s=>s.overdue),backgroundColor:'#ef4444',borderRadius:4},
            {label:'Pending',data:stats.map(s=>s.total-s.completed-s.overdue),backgroundColor:'#94a3b8',borderRadius:4},
          ]
        },
        options: {
          responsive:true,maintainAspectRatio:true,
          plugins:{legend:{position:'bottom',labels:{font:{family:'Inter',size:11},padding:10}}},
          scales:{x:{stacked:true,grid:{display:false},ticks:{font:{family:'Inter',size:11}}},y:{stacked:true,grid:{color:'#f1f5f9'},ticks:{font:{family:'Inter',size:11}}}},
        }
      });
    }
  });
}

// ════════════════════════════════════════════════
//  HELPERS
// ════════════════════════════════════════════════
function setFilter(f) { S.taskFilter = f; render(); }
function initials(name) { return name.split(' ').map(w=>w[0]).join('').toUpperCase().slice(0,2); }
function capFirst(s) { return s ? s.charAt(0).toUpperCase()+s.slice(1) : ''; }
function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function statusLabel(s) {
  return {pending:'Pending',in_progress:'In Progress',completed:'Completed',overdue:'Overdue'}[s] || s;
}
function filterLabel(s) {
  return {all:'All',pending:'Pending',in_progress:'In Progress',overdue:'Overdue',completed:'Done'}[s] || s;
}
function formatDeadline(dl, status) {
  const now = new Date();
  const diff = dl - now;
  if (status === 'completed') return dl.toLocaleDateString('en-IN',{day:'numeric',month:'short'});
  if (status === 'overdue') return 'Overdue';
  if (diff < 3600000) return `${Math.max(0,Math.floor(diff/60000))}m left`;
  if (diff < 86400000) return `${Math.floor(diff/3600000)}h left`;
  return dl.toLocaleDateString('en-IN',{day:'numeric',month:'short'});
}
function statCard(val, label, color, icon) {
  return `<div class="stat-card">
    <div class="stat-icon" style="background:${color}18">
      <span style="font-size:1.1rem">${icon}</span>
    </div>
    <div class="stat-info">
      <strong style="color:${color}">${val}</strong>
      <span>${label}</span>
    </div>
  </div>`;
}
function emptyState(title, sub) {
  return `<div class="empty-state">
    <svg fill="none" viewBox="0 0 24 24"><path stroke="currentColor" stroke-width="1.5" d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2M9 5a2 2 0 0 0 2 2h2a2 2 0 0 0 2-2M9 5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2"/></svg>
    <h3>${title}</h3><p>${sub}</p>
  </div>`;
}
function setupBanner() {
  return `<div class="setup-banner">
    <h4>Firebase Not Configured — Local Mode</h4>
    <p>Data is saved locally on this device only. To sync across all devices, configure Firebase in the Settings tab.</p>
  </div>`;
}

// ─── Toast ───
function toast(msg, type='success') {
  const el = document.createElement('div');
  el.className=`toast ${type}`;
  const icons={success:'✓',error:'✕',info:'ℹ'};
  el.innerHTML=`<span>${icons[type]||'•'}</span> ${msg}`;
  document.getElementById('toast-container').appendChild(el);
  setTimeout(()=>el.remove(), 3500);
}

// ─── Keyboard shortcuts ───
document.getElementById('login-pass').addEventListener('keydown', e => { if(e.key==='Enter') doLogin(); });
document.getElementById('login-user').addEventListener('keydown', e => { if(e.key==='Enter') document.getElementById('login-pass').focus(); });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    document.querySelectorAll('.modal-overlay.open').forEach(m => closeModal(m.id));
    closeSidebar();
  }
});

// ════════════════════════════════════════════════
//  INIT — seed default data & start
// ════════════════════════════════════════════════
async function init() {
  loadLocal();

  // If no users exist, seed default owner
  if (Object.keys(S.users).length === 0) {
    const ownerId = 'owner_default';
    S.users[ownerId] = {
      id: ownerId, name: 'Owner', username: 'owner',
      password: 'admin123', role: 'owner', dept: 'Management', color: '#6366f1',
    };
    saveLocal();
  }

  // Try to load from Firebase
  if (FB_CONFIGURED) await loadFromFB();

  // Check session
  const sid = loadSession();
  if (sid && S.users[sid]) {
    S.currentUser = S.users[sid];
    startApp();
  }
}

init();
</script>
