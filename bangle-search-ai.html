<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bangle AI Search — Siddhi Bangles</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0f0e1a; color: #e2e0f0; min-height: 100vh; }

  header { background: #1a1750; padding: 16px 24px; border-bottom: 1px solid #2d2a5e; display: flex; align-items: center; gap: 16px; }
  header h1 { font-size: 1.2rem; color: #a89cff; }
  header p  { font-size: 0.8rem; color: #7b72c9; margin-top: 2px; }
  .ai-badge { background: #2d4a2d; color: #6dffaa; font-size: 0.7rem; font-weight: 700; padding: 3px 10px; border-radius: 20px; border: 1px solid #3d6a3d; }

  .container { max-width: 960px; margin: 0 auto; padding: 24px 16px; }

  /* Upload zone */
  .upload-zone {
    border: 2px dashed #3d3880; border-radius: 16px; padding: 40px 20px;
    text-align: center; cursor: pointer; transition: all 0.2s; background: #15132a; position: relative;
  }
  .upload-zone:hover, .upload-zone.drag-over { border-color: #7c6fff; background: #1e1b3a; }
  .upload-zone input[type=file] { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%; }
  .upload-icon { font-size: 3rem; margin-bottom: 12px; }
  .upload-zone h2 { font-size: 1.1rem; color: #c4beff; margin-bottom: 8px; }
  .upload-zone p  { color: #7b72c9; font-size: 0.9rem; }

  /* Preview */
  .preview-section { display: none; margin-top: 24px; }
  .preview-section.visible { display: block; }
  .preview-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .preview-header h3 { color: #a89cff; }
  .preview-img { max-width: 100%; max-height: 350px; border-radius: 12px; border: 1px solid #2d2a5e; display: block; }

  /* Buttons */
  .btn-row { display: flex; gap: 10px; margin-top: 16px; flex-wrap: wrap; }
  .btn { padding: 10px 22px; border: none; border-radius: 8px; font-size: 0.9rem; font-weight: 600; cursor: pointer; transition: opacity 0.15s; }
  .btn:hover { opacity: 0.85; }
  .btn-primary   { background: #534AB7; color: #fff; }
  .btn-danger    { background: #3d1f1f; color: #ff8080; }

  /* Status */
  .status { margin-top: 16px; padding: 14px 18px; border-radius: 10px; font-size: 0.9rem; display: none; }
  .status.visible { display: flex; align-items: flex-start; gap: 12px; }
  .status.loading { background: #1e1b3a; color: #a89cff; }
  .status.error   { background: #2a1515; color: #ff8080; }
  .spinner { width: 18px; height: 18px; border: 2px solid #3d3880; border-top-color: #7c6fff; border-radius: 50%; animation: spin 0.7s linear infinite; flex-shrink: 0; margin-top: 2px; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Claude description box */
  .description-box { margin-top: 20px; padding: 16px; background: #15132a; border: 1px solid #2d2a5e; border-radius: 12px; display: none; }
  .description-box.visible { display: block; }
  .description-box h4 { color: #7b72c9; font-size: 0.8rem; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px; }
  .description-box p  { color: #a89cff; font-size: 0.85rem; line-height: 1.6; white-space: pre-wrap; }

  /* Results grouped by bangle */
  .bangle-group { margin-top: 28px; }
  .bangle-group-title { color: #a89cff; font-size: 1rem; font-weight: 700; margin-bottom: 14px; padding-bottom: 8px; border-bottom: 1px solid #2d2a5e; }

  .results-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(155px, 1fr)); gap: 12px; }

  .result-card { background: #15132a; border: 1px solid #2d2a5e; border-radius: 12px; overflow: hidden; cursor: pointer; transition: all 0.2s; position: relative; }
  .result-card:hover { border-color: #7c6fff; transform: translateY(-2px); }
  .result-card.selected { border-color: #7c6fff; box-shadow: 0 0 0 2px #7c6fff44; }
  .result-card img { width: 100%; aspect-ratio: 1; object-fit: cover; display: block; background: #0f0e1a; }
  .result-info { padding: 10px; }
  .result-code { font-weight: 700; font-size: 0.95rem; color: #e2e0f0; margin-bottom: 4px; }
  .result-folder { font-size: 0.7rem; color: #6b64a0; line-height: 1.3; }
  .result-score { display: inline-block; margin-top: 6px; padding: 2px 8px; border-radius: 20px; font-size: 0.75rem; font-weight: 600; }
  .score-high   { background: #1a3020; color: #6dffaa; }
  .score-medium { background: #2a2415; color: #ffd06d; }
  .score-low    { background: #2a1b1b; color: #ff9a6d; }
  .best-badge { position: absolute; top: 8px; left: 8px; background: #7c6fff; color: #fff; font-size: 0.7rem; font-weight: 700; padding: 2px 8px; border-radius: 20px; }

  /* Selected banner */
  .selected-banner { display: none; margin-top: 20px; padding: 16px 20px; background: #1a3020; border: 1px solid #2d5a3a; border-radius: 12px; align-items: center; gap: 16px; }
  .selected-banner.visible { display: flex; }
  .sel-label { font-size: 0.8rem; color: #4a8a5e; margin-bottom: 4px; }
  .sel-code  { font-size: 1.4rem; font-weight: 800; color: #6dffaa; }
  .copy-btn  { margin-left: auto; padding: 8px 18px; background: #2d5a3a; border: 1px solid #3d7a4e; border-radius: 8px; color: #6dffaa; font-weight: 600; cursor: pointer; font-size: 0.9rem; }
  .copy-btn:hover { background: #3d6a4e; }

  /* Toast */
  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(80px); background: #534AB7; color: #fff; padding: 12px 24px; border-radius: 12px; font-weight: 600; transition: transform 0.3s; z-index: 999; box-shadow: 0 4px 20px rgba(83,74,183,0.5); }
  .toast.show { transform: translateX(-50%) translateY(0); }

  /* Switch to free version link */
  .version-switch { text-align: center; margin-top: 32px; padding-top: 20px; border-top: 1px solid #2d2a5e; font-size: 0.82rem; color: #6b64a0; }
  .version-switch a { color: #7b72c9; text-decoration: none; }
  .version-switch a:hover { color: #a89cff; }
</style>
</head>
<body>

<header>
  <div>
    <h1>Bangle AI Search</h1>
    <p>Claude Vision identifies designs from client photos</p>
  </div>
  <span class="ai-badge">AI Powered</span>
</header>

<div class="container">

  <!-- Upload -->
  <div class="upload-zone" id="uploadZone">
    <input type="file" id="fileInput" accept="image/*" />
    <div class="upload-icon">📸</div>
    <h2>Drop client photo here or tap to select</h2>
    <p>Works with WhatsApp photos — multiple bangles in one photo is fine</p>
  </div>

  <!-- Preview -->
  <div class="preview-section" id="previewSection">
    <div class="preview-header">
      <h3>Uploaded photo</h3>
      <button class="btn btn-danger" onclick="resetAll()">X Clear</button>
    </div>
    <img id="previewImg" class="preview-img" src="" alt="preview" />
    <div class="btn-row">
      <button class="btn btn-primary" onclick="doSearch()">Search with AI</button>
    </div>
  </div>

  <!-- Status -->
  <div class="status" id="statusBox"></div>

  <!-- Claude description -->
  <div class="description-box" id="descBox">
    <h4>What Claude sees in the photo</h4>
    <p id="descText"></p>
  </div>

  <!-- Selected banner -->
  <div class="selected-banner" id="selectedBanner">
    <div>
      <div class="sel-label">Selected Design Code</div>
      <div class="sel-code" id="selectedCode">—</div>
    </div>
    <button class="copy-btn" onclick="copyCode()">Copy Code</button>
  </div>

  <!-- Results -->
  <div id="resultsContainer"></div>

  <div class="version-switch">
    <a href="bangle-search.html">Switch to free version (DINOv2)</a>
  </div>

</div>

<div class="toast" id="toast"></div>

<script>
const WORKER_URL = "https://bangle-search-ai.sayyamranka09.workers.dev";

let currentFile  = null;
let selectedCode = null;

// File handling
document.getElementById("fileInput").addEventListener("change", e => {
  if (e.target.files[0]) loadFile(e.target.files[0]);
});

const zone = document.getElementById("uploadZone");
zone.addEventListener("dragover",  e => { e.preventDefault(); zone.classList.add("drag-over"); });
zone.addEventListener("dragleave", ()  => zone.classList.remove("drag-over"));
zone.addEventListener("drop", e => {
  e.preventDefault(); zone.classList.remove("drag-over");
  const f = e.dataTransfer.files[0];
  if (f && f.type.startsWith("image/")) loadFile(f);
});
document.addEventListener("paste", e => {
  for (const item of e.clipboardData.items)
    if (item.type.startsWith("image/")) { loadFile(item.getAsFile()); break; }
});

function loadFile(file) {
  currentFile = file;
  const url = URL.createObjectURL(file);
  document.getElementById("previewImg").src = url;
  document.getElementById("previewSection").classList.add("visible");
  document.getElementById("statusBox").className = "status";
  document.getElementById("descBox").classList.remove("visible");
  document.getElementById("selectedBanner").classList.remove("visible");
  document.getElementById("resultsContainer").innerHTML = "";
}

async function doSearch() {
  if (!currentFile) return;

  showStatus("Claude is reading the photo...");
  document.getElementById("descBox").classList.remove("visible");
  document.getElementById("resultsContainer").innerHTML = "";
  document.getElementById("selectedBanner").classList.remove("visible");
  selectedCode = null;

  try {
    const form = new FormData();
    form.append("image", currentFile);

    const resp = await fetch(WORKER_URL + "/search", { method: "POST", body: form });

    if (!resp.ok) {
      const err = await resp.json().catch(() => ({ error: "Unknown error" }));
      showError(err.error || "Search failed");
      return;
    }

    const data = await resp.json();
    hideStatus();

    // Show Claude's description
    document.getElementById("descText").textContent = data.raw_description;
    document.getElementById("descBox").classList.add("visible");

    // Show results grouped by bangle
    const container = document.getElementById("resultsContainer");
    container.innerHTML = "";

    for (const group of data.results) {
      const div = document.createElement("div");
      div.className = "bangle-group";

      const title = document.createElement("div");
      title.className = "bangle-group-title";
      title.textContent = data.results.length > 1
        ? `${group.label} — Top Matches`
        : "Top Matches — tap to select";
      div.appendChild(title);

      const grid = document.createElement("div");
      grid.className = "results-grid";

      group.matches.forEach((m, i) => {
        const card = document.createElement("div");
        card.className = "result-card";
        card.onclick = () => selectResult(m.design_code, card);

        const sc = m.pct >= 30 ? "score-high" : m.pct >= 20 ? "score-medium" : "score-low";
        const folder = m.path.split("/").slice(0, -1).join(" / ");
        const encodedUrl = m.url.split('/').map((part, idx) => idx > 2 ? encodeURIComponent(part) : part).join('/');

        card.innerHTML = `
          ${i === 0 ? '<div class="best-badge">Best Match</div>' : ""}
          <img src="${encodedUrl}" alt="${m.design_code}" loading="lazy" onerror="this.style.background='#1a1750'">
          <div class="result-info">
            <div class="result-code">${m.design_code}</div>
            <div class="result-folder">${folder}</div>
            <span class="result-score ${sc}">${m.pct}% match</span>
          </div>`;
        grid.appendChild(card);
      });

      div.appendChild(grid);
      container.appendChild(div);
    }

  } catch (e) {
    showError("Could not connect: " + e.message);
  }
}

function selectResult(code, card) {
  document.querySelectorAll(".result-card").forEach(c => c.classList.remove("selected"));
  card.classList.add("selected");
  selectedCode = code;
  document.getElementById("selectedCode").textContent = code;
  document.getElementById("selectedBanner").classList.add("visible");
  document.getElementById("selectedBanner").scrollIntoView({ behavior: "smooth", block: "nearest" });
}

function copyCode() {
  if (!selectedCode) return;
  navigator.clipboard.writeText(selectedCode)
    .then(() => showToast("Copied: " + selectedCode))
    .catch(() => { showToast("Copied: " + selectedCode); });
}

function resetAll() {
  currentFile = null;
  document.getElementById("previewSection").classList.remove("visible");
  document.getElementById("statusBox").className = "status";
  document.getElementById("descBox").classList.remove("visible");
  document.getElementById("selectedBanner").classList.remove("visible");
  document.getElementById("resultsContainer").innerHTML = "";
  document.getElementById("fileInput").value = "";
  document.getElementById("previewImg").src = "";
}

function showStatus(msg) {
  const b = document.getElementById("statusBox");
  b.className = "status loading visible";
  b.innerHTML = `<div class="spinner"></div><span>${msg}</span>`;
}
function showError(msg) {
  const b = document.getElementById("statusBox");
  b.className = "status error visible";
  b.innerHTML = `<span>Error: ${msg}</span>`;
}
function hideStatus() { document.getElementById("statusBox").className = "status"; }

let toastTimer;
function showToast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 2500);
}
</script>
</body>
</html>
