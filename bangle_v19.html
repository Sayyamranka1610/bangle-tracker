// ── DESIGN VIEW ────────────────────────────────────────────────────────────────
function renderDesignView(){
  const container=document.getElementById('view-design');
  const filtered=S.orders.filter(orderMatchesFilter);
  const f=S.filters;
  const codeMap={};
  filtered.forEach(order=>{
    (order.designs||[]).forEach(d=>{
      const code=d.code||'(no code)';
      // When a specific code or name filter is active, skip designs that don't match exactly
      if(f.dcode && code !== f.dcode) return;
      if(f.dname && (d.name||'') !== f.dname) return;
      if(!codeMap[code])codeMap[code]=[];
      codeMap[code].push({order,design:d,oi:S.orders.indexOf(order)});
    });
  });
  const codes=Object.keys(codeMap).sort();
  if(!codes.length){container.innerHTML='<div class="empty-state"><div>No designs match filters.</div></div>';return;}
  container.innerHTML=codes.map(code=>{
    const items=codeMap[code];
    const dname=items[0].design.name;
    const allVarImgs=items.flatMap(x=>(x.design.varieties||[]).flatMap(v=>v.images||[]));
    const allDesignImgs=items.flatMap(x=>x.design.images||[]);
    const allImgs=[...allDesignImgs,...allVarImgs];

    // Build image gallery using string concat (no nested backticks)
    const imgGalleryHtml = allImgs.length
      ? '<div style="font-size:11px;font-weight:600;color:#534AB7;margin-bottom:6px">All images for '+esc(dname)+'</div>'
        +'<div class="design-imgs-gallery" style="margin-bottom:12px">'
        +allImgs.map((img,ii)=>'<div class="gallery-img-card"><img src="'+(img.data||'')+'" alt="'+esc(dname)+' '+(ii+1)+'" onclick="openLbDirect(\''+(img.data||'')+'\')">'+'<div class="img-footer"><span class="img-num">#'+(ii+1)+'</span></div></div>').join('')
        +'</div>'
      : '';

    // Build each order item card using string concat
    const itemsHtml = items.map(function(x){
      const order=x.order, design=x.design;
      const pillsHtml=design.stages.map(function(st,si){
        const t=getTmpl(st.stageId)||{name:'?'};
        return '<span class="stage-pill '+pillCls(order,design,si)+'">'+dotLbl(design,si)+' '+esc(t.name)+'</span>'+(si<design.stages.length-1?'<span class="stage-arrow">›</span>':'');
      }).join('');
      const varietyHtml=(design.varieties||[]).length
        ? '<div style="font-size:10px;color:#666;margin-top:4px">'
          +(design.varieties.map(function(v){
            return '<span style="background:#f0efff;border-radius:4px;padding:2px 6px;margin-right:4px">'+esc(v.name)+': '+Object.values(v.sizes||{}).reduce(function(a,x){return a+(parseInt(x)||0);},0)+' pcs</span>';
          }).join(''))
          +'</div>'
        : '';
      return '<div class="design-sub-card">'
        +'<div class="design-sub-head">'
          +'<span class="design-order-badge">'+esc(order.orderId)+'</span>'
          +'<span style="font-size:12px;font-weight:600">'+esc(order.client)+'</span>'
          +badgeHtml(designAlert(order,design))
          +'<span style="font-size:11px;color:#888;margin-left:auto">'+designQty(design)+' pcs · Started '+fmtDate(order.startDate)+'</span>'
        +'</div>'
        +'<div class="stage-flow">'+pillsHtml+'</div>'
        +varietyHtml
      +'</div>';
    }).join('');

    return '<div class="design-stage-block">'
      +'<div class="design-stage-header">'
        +'<span>🎨</span>'
        +'<span>'+esc(dname)+' <span style="font-weight:400;color:#AFA9EC">['+esc(code)+']</span></span>'
        +'<span style="margin-left:auto;font-size:11px;font-weight:400;color:#AFA9EC">'+items.length+' order'+(items.length!==1?'s':'')+' · '+allImgs.length+' images</span>'
        +'<button class="sm" style="margin-left:8px;font-size:10px" onclick="exportDesignCSV(\''+esc(code)+'\')">📥 Export</button>'
        +'<button class="sm" style="margin-left:4px;font-size:10px" onclick="printByDesign(\''+esc(code)+'\')">🖨️ Print</button>'
      +'</div>'
      +'<div class="design-stage-body">'
        +imgGalleryHtml
        +itemsHtml
      +'</div>'
    +'</div>';
  }).join('');
}

// ── ANALYTICS ─────────────────────────────────────────────────────────────────
function renderAnalytics(){
  const container=document.getElementById('view-analytics');
  const orders=S.orders;
  if(!orders.length){container.innerHTML='<div class="empty-state">No orders to analyse yet.</div>';return;}
  const totalOrds=orders.length,totalDesigns=orders.reduce((a,o)=>a+o.designs.length,0),totalPcs=orders.reduce((a,o)=>a+totalQty(o),0);
  const lateOrds=orders.filter(o=>orderAlert(o)==='late').length,warnOrds=orders.filter(o=>orderAlert(o)==='warn').length,doneOrds=orders.filter(o=>orderAlert(o)==='done').length,okOrds=totalOrds-lateOrds-warnOrds-doneOrds;
  const byClient={};orders.forEach(o=>{byClient[o.client]=(byClient[o.client]||0)+1;});
  const clientEntries=Object.entries(byClient).sort((a,b)=>b[1]-a[1]).slice(0,8),maxC=Math.max(...clientEntries.map(e=>e[1]),1);
  const byCode={};orders.forEach(o=>o.designs.forEach(d=>{byCode[d.code||'?']=(byCode[d.code||'?']||0)+designQty(d);}));

  const newId=uid();

  const activeSizes=new Set();
  (S.orders[oi].designs||[]).forEach(d=>{

// Rename every design in a group (they all share the same name key)
// Called by the group-name input's onblur. Looks up designs by their IDs
// (stored in data-dids at render time) so name-mismatch bugs are impossible.
function renameDesignGroup(inp){
  const nv = (inp.value||'').trim();
  const orig = inp.dataset.origname||'';
  // Restore original if cleared
  if(!nv){ inp.value=orig; try{_fb.pendingLocal=false;}catch(e){} return; }
  // No-op if unchanged
  if(nv===orig){ try{_fb.pendingLocal=false;}catch(e){} return; }
  const oi = parseInt(inp.dataset.oi,10);
  const dids = (inp.dataset.dids||'').split(',').filter(Boolean);
  const order = S.orders[oi];
  if(!order){ inp.value=orig; return; }
  // Rename every design in this group by ID — immune to name-string mismatches
  let changed=false;
  order.designs.forEach(d=>{ if(dids.includes(d.id)){ d.name=nv; changed=true; } });
  if(!changed){ inp.value=orig; try{_fb.pendingLocal=false;}catch(e){} return; }
  // Update the stored original so subsequent edits without re-render work
  inp.dataset.origname=nv;
  rebuildVocab();
  // Save to localStorage immediately (not debounced)
  _origSave();
  localStorage.setItem('bangle_saved_at', new Date().toISOString());
  // Push to Firebase right now — do NOT wait the 10-second batch window
  try{
    _fb.pendingLocal=true;
    if(_fb.ready){ clearTimeout(_fb.pushTimer); _fb.pushTimer=null; fbPush(false); }
  }catch(e){}
  showToast('✅ Design name saved: '+nv,'green');
}

}

function upDesignStage(oi,di,si,val){
  // If trying to mark as 'done', enforce rules
  if(val==='done'){
    const order=S.orders[oi];
    const design=order.designs[di];
    const st=design.stages[si];
    const groupId=stGroup(st);
    const isRaw=groupId==='raw';
    const unit='pcs'; // all groups now use pcs

    // Rule 1: qty is mandatory before marking done
    if(st.qty==null||st.qty<=0){
      alert(`⚠️ Quantity is mandatory!\n\nPlease enter the quantity (in ${unit}) for this stage before marking it as Done.`);
      // Reset the select back
      render();
      return;
    }

    // Rule 2: if qty differs from first stage in same group, require reason in stageNote
    const groupStages=design.stages.filter(s=>getStageGroup(s.stageId)===groupId&&s.qty!=null&&s.qty>0);
    if(groupStages.length>1){
      const firstQty=groupStages[0].qty;
      const currentQty=st.qty;
      const differ=Math.abs(currentQty-firstQty)>0;
      if(differ&&(!st.stageNote||st.stageNote.trim().length<5)){
        const rejection=firstQty-currentQty;
        const rejectionInfo=rejection>0?`\n\n⚠️ Rejection detected: ${rejection} pcs (${((rejection/firstQty)*100).toFixed(1)}% of first stage qty)`:'';
        const reason=prompt(`⚠️ Quantity Difference Detected!${rejectionInfo}\n\nFirst quantity in ${groupId} group: ${firstQty} pcs\nThis stage quantity: ${currentQty} pcs\n\nA reason is MANDATORY when quantities differ across stages in the same group.\n\nPlease enter the reason for this difference (e.g. "30 pcs rejected - size defect"):`);
        if(!reason||reason.trim().length<3){
          alert('❌ Cannot mark as Done. A reason of at least 3 characters is required when quantities differ within the same group.');
          render();
          return;
        }
        design.stages[si].stageNote=(st.stageNote?st.stageNote+'\n':'')+'Qty diff reason: '+reason.trim();
      }
    }
  }

  const prev=S.orders[oi].designs[di].stages[si].status;
  S.orders[oi].designs[di].stages[si].status=val;
  audit('Stage status',`Order ${S.orders[oi].orderId}, design "${S.orders[oi].designs[di].name}", stage ${si+1}: ${prev}→${val}`);
  autoSyncInventoryFromStages(oi,di);
  render();
}

// ── AUTO-SYNC INVENTORY FROM PRODUCTION STAGES ────────────────────────────────
//
// TRIGGER RULES (all quantities in pcs):
//
// RAW IN  → First stage of RAW group marked 'done' — uses that stage's qty
// RAW OUT → First stage of SEMI group marked 'done' — uses the LAST done raw stage's qty
//           (the transition point: pipes leave raw stock when bangle designing starts)
//
// SEMI IN → First stage of SEMI group marked 'done' — uses that stage's qty
//           (this is the same event that triggers RAW OUT, but with the SEMI stage qty)
// SEMI OUT→ First stage of FINISHED group marked 'done' — uses last done semi stage's qty
//
// FIN IN  → First stage of FINISHED group marked 'done' — uses that stage's qty
// FIN OUT → Last stage of FINISHED group marked 'done' — uses that stage's qty
//
// REJECTIONS: whenever a stage's qty differs from the previous stage's qty within
//             the same group, a rejection entry is auto-calculated and stored in
//             the ledger entry's `rejections` field and as a separate note entry.
//
function autoSyncInventoryFromStages(oi,di){
  const order=S.orders[oi];
  const design=order.designs[di];
  if(!design)return;
  const designName=design.name;
  const designCode=design.code;
  const todayStr=invIsoDate(new Date());
  const orderId=order.id;
  const srcKey='auto_'+orderId+'_'+design.id;

  // Remove all previous auto entries for this order+design combo
  S.invLedger=S.invLedger.filter(e=>e.source!==srcKey);

  // Helper: get all stages in a group with their template and index
  function groupStagesOf(groupId){
    return design.stages
      .map((st,si)=>({st,si,tmpl:getTmpl(st.stageId)}))
      .filter(({st})=>stGroup(st)===groupId);
  }

  // Helper: make a ledger entry
  function mkEntry(type,qty,date,vendor,note,stageRef,rejections){
    return {
      id:uid(),
      date:date||todayStr,
      designName,designCode,
      type,
      qty:qty,           // pieces for ALL groups
      qtyKg:0,           // kept for backward compat but always 0
      qtySets:qty,       // kept for backward compat
      orderId,
      vendor:vendor||'',
      note:note||'',
      source:srcKey,
      autoType:type,
      stageRef:stageRef||null,
      rejections:rejections||0
    };
  }

  // Helper: compute rejection between two consecutive stages in same group
  function calcRejection(prevQty,currQty){
    if(prevQty==null||currQty==null)return 0;
    return Math.max(0,prevQty-currQty);
  }

  const rawStages  = groupStagesOf('raw');
  const semiStages = groupStagesOf('semi');
  const finStages  = groupStagesOf('finished');

  // ── RAW IN ─────────────────────────────────────────────────────────────────
  // Trigger: first raw stage is marked 'done' with a qty
  const firstRawDone = rawStages.find(({st})=>st.status==='done'&&st.qty!=null&&st.qty>0);
  if(firstRawDone){
    const {st,si,tmpl}=firstRawDone;
    const date=st.completionDate||order.startDate||todayStr;
    S.invLedger.push(mkEntry(
      'raw_in', st.qty, date, st.vendor||'',
      `Auto: ${tmpl?tmpl.name:'Raw stage'} done — ${st.qty} pcs raw pipes in (${order.orderId})`,
      {oi,di,si,groupId:'raw'}, 0
    ));

    // Track rejections within raw group across consecutive done stages
    let prevDoneQty=st.qty;
    rawStages.forEach(({st:s,si:sIdx,tmpl:t},arrIdx)=>{
      if(arrIdx===0)return; // skip first
      if(s.status!=='done'||s.qty==null)return;
      const rej=calcRejection(prevDoneQty,s.qty);
      if(rej>0){
        const rejDate=s.completionDate||todayStr;
        S.invLedger.push(mkEntry(
          'raw_rejection', rej, rejDate, s.vendor||'',
          `Auto rejection: ${t?t.name:'Raw stage'} — ${rej} pcs rejected (was ${prevDoneQty}, now ${s.qty}) (${order.orderId})`,
          {oi,di,si:sIdx,groupId:'raw'}, rej
        ));
      }
      prevDoneQty=s.qty;
    });
  }

  // ── RAW OUT + SEMI IN ──────────────────────────────────────────────────────
  // Trigger: first semi stage is marked 'done'
  // RAW OUT qty = last done raw stage qty (what actually came out of raw into semi)
  // SEMI IN qty = first done semi stage qty (what was received at semi)
  const firstSemiDone = semiStages.find(({st})=>st.status==='done'&&st.qty!=null&&st.qty>0);
  if(firstSemiDone){
    const {st:semiSt,si:semiSi,tmpl:semiTmpl}=firstSemiDone;
    const semiDate=semiSt.completionDate||todayStr;

    // RAW OUT — use the qty entered at the last done raw stage
    const lastRawDone=[...rawStages].reverse().find(({st})=>st.status==='done'&&st.qty!=null&&st.qty>0);
    if(lastRawDone){
      const {st:rawSt,si:rawSi,tmpl:rawTmpl}=lastRawDone;
      const rawOutDate=semiDate; // raw leaves when semi begins
      S.invLedger.push(mkEntry(
        'raw_out', rawSt.qty, rawOutDate, rawSt.vendor||'',
        `Auto: ${semiTmpl?semiTmpl.name:'Semi stage'} started — ${rawSt.qty} pcs raw out (${order.orderId})`,
        {oi,di,si:rawSi,groupId:'raw'}, 0
      ));
    }

    // SEMI IN — using first done semi stage qty
    S.invLedger.push(mkEntry(
      'semi_in', semiSt.qty, semiDate, semiSt.vendor||'',
      `Auto: ${semiTmpl?semiTmpl.name:'Semi stage'} done — ${semiSt.qty} pcs semi-finished in (${order.orderId})`,
      {oi,di,si:semiSi,groupId:'semi'}, 0
    ));

    // Track rejections within semi group across consecutive done stages
    let prevSemiQty=semiSt.qty;
    semiStages.forEach(({st:s,si:sIdx,tmpl:t},arrIdx)=>{
      if(arrIdx===0)return;
      if(s.status!=='done'||s.qty==null)return;
      const rej=calcRejection(prevSemiQty,s.qty);
      if(rej>0){
        const rejDate=s.completionDate||todayStr;
        S.invLedger.push(mkEntry(
          'semi_rejection', rej, rejDate, s.vendor||'',
          `Auto rejection: ${t?t.name:'Semi stage'} — ${rej} pcs rejected (was ${prevSemiQty}, now ${s.qty}) (${order.orderId})`,
          {oi,di,si:sIdx,groupId:'semi'}, rej
        ));
      }
      prevSemiQty=s.qty;
    });
  }

  // ── SEMI OUT + FIN IN ──────────────────────────────────────────────────────
  // Trigger: first finished stage is marked 'done'
  const firstFinDone = finStages.find(({st})=>st.status==='done'&&st.qty!=null&&st.qty>0);
  if(firstFinDone){
    const {st:finSt,si:finSi,tmpl:finTmpl}=firstFinDone;
    const finDate=finSt.completionDate||todayStr;

    // SEMI OUT — use qty of last done semi stage
    const lastSemiDone=[...semiStages].reverse().find(({st})=>st.status==='done'&&st.qty!=null&&st.qty>0);
    if(lastSemiDone){
      const {st:sSt,si:sSi,tmpl:sTmpl}=lastSemiDone;
      S.invLedger.push(mkEntry(
        'semi_out', sSt.qty, finDate, sSt.vendor||'',
        `Auto: ${finTmpl?finTmpl.name:'Finished stage'} started — ${sSt.qty} pcs semi-finished out (${order.orderId})`,
        {oi,di,si:sSi,groupId:'semi'}, 0
      ));
    }

    // FIN IN — first done finished stage qty
    S.invLedger.push(mkEntry(
      'fin_in', finSt.qty, finDate, finSt.vendor||'',
      `Auto: ${finTmpl?finTmpl.name:'Finished stage'} done — ${finSt.qty} pcs finished in (${order.orderId})`,
      {oi,di,si:finSi,groupId:'finished'}, 0
    ));

    // Track rejections within finished group
    let prevFinQty=finSt.qty;
    finStages.forEach(({st:s,si:sIdx,tmpl:t},arrIdx)=>{
      if(arrIdx===0)return;
      if(s.status!=='done'||s.qty==null)return;
      const rej=calcRejection(prevFinQty,s.qty);
      if(rej>0){
        const rejDate=s.completionDate||todayStr;
        S.invLedger.push(mkEntry(
          'fin_rejection', rej, rejDate, s.vendor||'',
          `Auto rejection: ${t?t.name:'Finished stage'} — ${rej} pcs rejected (was ${prevFinQty}, now ${s.qty}) (${order.orderId})`,
          {oi,di,si:sIdx,groupId:'finished'}, rej
        ));
      }
      prevFinQty=s.qty;
    });
  }

  // ── FIN OUT ────────────────────────────────────────────────────────────────
  // Trigger: LAST finished stage is marked 'done' (dispatch stage)
  const lastFinStage = finStages[finStages.length-1];
  if(lastFinStage&&lastFinStage.st.status==='done'&&lastFinStage.st.qty!=null&&lastFinStage.st.qty>0){
    const {st:fSt,si:fSi,tmpl:fTmpl}=lastFinStage;
    const fDate=fSt.completionDate||todayStr;
    S.invLedger.push(mkEntry(
      'fin_out', fSt.qty, fDate, fSt.vendor||'',
      `Auto: ${fTmpl?fTmpl.name:'Dispatch stage'} done — ${fSt.qty} pcs dispatched out (${order.orderId})`,
      {oi,di,si:fSi,groupId:'finished'}, 0
    ));
  }

  save();
}

// ── TAB NAVIGATION HELPER FOR VARIETY QTY CELLS ───────────────────────────────
// Handles Tab/Shift+Tab between qty cells without triggering a full render.
// On Tab: saves current cell value, moves focus to next size cell.
// On Enter: saves and moves down to same column in next variety row.
// Tab/Enter navigation for FLAT rows (CNC / no-variety designs)
// Tab from design-code input → jump to first qty cell in the same row
function handleCodeTabKey(e){
  if(e.key!=='Tab'||e.shiftKey)return;
  const row=e.target.closest('tr');
  if(!row)return;
  const firstQty=row.querySelector('input.qty-inp');
  if(firstQty){e.preventDefault();firstQty.focus();firstQty.select();}
}
function handleFlatTabKey(e, oi, di, szI) {
  if (e.key !== 'Tab' && e.key !== 'Enter') return;
  e.preventDefault();
  const d = S.orders[oi].designs[di];
  const szKeys = Object.keys(d.sizes || {});
  // Save current value
  const curVal = parseInt(e.target.value) || 0;
  if (!d.sizes) d.sizes = {};
  d.sizes[szKeys[szI]] = curVal;
  if (_hasOnlyDefault(d)) { if(!d.varieties[0].sizes)d.varieties[0].sizes={}; d.varieties[0].sizes[szKeys[szI]] = curVal; }
  e.target._dirty = false;
  e.target._skipBlur = true;
  scheduleAutosave();
  // Move to next/prev size in same row
  let nextSzI = szI;
  if (e.key === 'Tab') {
    nextSzI = e.shiftKey ? szI - 1 : szI + 1;
    if (nextSzI >= szKeys.length) nextSzI = 0;
    if (nextSzI < 0) nextSzI = szKeys.length - 1;
  }
  const row = e.target.closest('tr');
  if (row) {
    const inputs = row.querySelectorAll('input.qty-inp');
    if (inputs[nextSzI]) {
      inputs[nextSzI].focus();
      inputs[nextSzI].select();
    }
  }
  setTimeout(() => { e.target._skipBlur = false; }, 50);
}
function handleQtyTabKey(e, oi, di, vi, szI) {
  if (e.key !== 'Tab' && e.key !== 'Enter') return;
  e.preventDefault();
  const d = S.orders[oi].designs[di];
  const szKeys = Object.keys(d.sizes || {});
  const varieties = d.varieties || [];
  // Save current value to state
  const curVal = parseInt(e.target.value) || 0;
  if (!d.varieties[vi].sizes) d.varieties[vi].sizes = {};
  d.varieties[vi].sizes[szKeys[szI]] = curVal;
  // Sync aggregate sizes
  szKeys.forEach(s => { d.sizes[s] = varieties.reduce((a,v) => a + (parseInt((v.sizes||{})[s])||0), 0); });
  // Mark input as clean and skip blur handler (focus is moving programmatically)
  e.target._dirty = false;
  e.target._skipBlur = true;
  scheduleAutosave();
  // Update totals in DOM without full render
  const dcard = document.getElementById('dcard-' + d.id);
  if (dcard) {
    const rows = dcard.querySelectorAll('tbody tr');
    // Update current row total
    if (rows[vi]) {
      const rowTotal = szKeys.reduce((a,sz) => a + (parseInt((d.varieties[vi].sizes||{})[sz])||0), 0);
      const totalCell = rows[vi].querySelector('.total-col');
      if (totalCell) totalCell.textContent = rowTotal;
    }
    // Update footer column total for current size
    const footerCells = dcard.querySelectorAll('tfoot tr td');
    if (footerCells.length > szI + 2) {
      const colTotal = varieties.reduce((a,v) => a + (parseInt((v.sizes||{})[szKeys[szI]])||0), 0);
      footerCells[szI + 2].innerHTML = '<strong>' + colTotal + '</strong>';
    }
    // Update grand total
    const grandTotal = szKeys.reduce((a,sz) => a + d.varieties.reduce((b,v) => b + (parseInt((v.sizes||{})[sz])||0), 0), 0);
    const grandCell = dcard.querySelector('tfoot .grand-total');
    if (grandCell) grandCell.innerHTML = '<strong>' + grandTotal + '</strong>';
    const sizeTotal = dcard.querySelector('.size-total');
    if (sizeTotal) sizeTotal.innerHTML = 'Design total: <strong>' + grandTotal + '</strong> pcs';
  }
  // Determine next focus target
  let nextVi = vi, nextSzI = szI;
  if (e.key === 'Tab') {
    if (!e.shiftKey) {
      nextSzI++;
      if (nextSzI >= szKeys.length) { nextSzI = 0; nextVi++; }
      if (nextVi >= varieties.length) { nextVi = 0; }
    } else {
      nextSzI--;
      if (nextSzI < 0) { nextSzI = szKeys.length - 1; nextVi--; }
      if (nextVi < 0) { nextVi = varieties.length - 1; }
    }
  } else { // Enter: move down same column
    nextVi = (vi + 1) % varieties.length;
    nextSzI = szI;
  }
  // Move focus
  if (dcard) {
    const rows = dcard.querySelectorAll('tbody tr');
    const targetRow = rows[nextVi];
    if (targetRow) {
      const inp = targetRow.querySelectorAll('input.qty-inp')[nextSzI];
      if (inp) {
        inp._skipBlur = false; // ready for next blur
        inp.focus();
        inp.select();
      }
    }
  }
}

// ── Vendor qty-input Tab / Enter handler ─────────────────────────────────────
// Tab → move to next qty-inp in row; at end of row, jump to first cell of next row.
// Enter → same as Tab forward.
// Backspace / Delete → native browser handling (no preventDefault = works normally).
function handleVendorQtyTab(e,el){
  if(e.key!=='Tab'&&e.key!=='Enter')return;
  e.preventDefault();
  const tr=el.closest('tr');if(!tr)return;
  const allInRow=Array.from(tr.querySelectorAll('input.qty-inp'));
  const idx=allInRow.indexOf(el);
  if(!e.shiftKey){
    const next=allInRow[idx+1];
    if(next){next.focus();next.select();return;}
    // Move to first qty-inp of next sibling row
    let nextTr=tr.nextElementSibling;
    while(nextTr){
      const inp=nextTr.querySelector('input.qty-inp');
      if(inp){inp.focus();inp.select();return;}
      nextTr=nextTr.nextElementSibling;
    }
    // Fall through to browser default if no next row
  } else {
    const prev=allInRow[idx-1];
    if(prev){prev.focus();prev.select();return;}
    let prevTr=tr.previousElementSibling;
    while(prevTr){
      const qInps=prevTr.querySelectorAll('input.qty-inp');
      if(qInps.length){qInps[qInps.length-1].focus();qInps[qInps.length-1].select();return;}
      prevTr=prevTr.previousElementSibling;
    }
  }
}

// ── IMAGE HANDLING ─────────────────────────────────────────────────────────────
let _lbImages=[],_lbIdx=0;

// Returns the best available image src for an img object.
// hqData (1200px) is preferred but ONLY if it is an actual data URL — never use
// the '__IDB__...' placeholder string as an <img src>, it breaks the image.
// Falls back to data (160px thumb) and applies the same guard.
function _resolveImgSrc(img){
  if(!img)return '';
  // Accepts both base64 data URLs (legacy) and https:// R2 CDN URLs (new)
  const valid=s=>typeof s==='string'&&(s.startsWith('data:')||s.startsWith('https://'));
  if(valid(img.hqData))return img.hqData; // legacy high-quality local copy
  if(valid(img.data))return img.data;     // base64 (old) or R2 URL (new)
  return ''; // placeholder or missing
}

// Open lightbox for ALL images of a design code (d.images + all variety images combined).
// Uses hqData when available so the lightbox shows full print quality.
function openDesignImgsLb(oi,di,startIdx){
  const d=S.orders[oi].designs[di];
  const all=[...(d.images||[]),...(d.varieties||[]).flatMap(v=>v.images||[])];
  if(!all.length)return;
  _lbImages=all.map(i=>i.hqData||i.data);
  _lbIdx=Math.min(startIdx||0,_lbImages.length-1);

}

function openVarietyImgsLb(oi,di,vi,startIdx){
  const v=(S.orders[oi].designs[di].varieties||[])[vi];
  if(!v)return;
  _lbImages=(v.images||[]).map(i=>i.hqData||i.data);

}

// ── FOCUS TRAP HELPERS ─────────────────────────────────────────────────────────
// Disables all focusable elements in the background when a modal is open,
// so Tab can never escape the modal to "Connect Drive" or other page controls.
function _modalDisableBackground(){
  const SELECTOR='a,button,input,select,textarea,[tabindex]';
  const mc=document.getElementById('modal-container');
  document.querySelectorAll(SELECTOR).forEach(el=>{
    // Skip elements inside the modal itself
    if(mc&&mc.contains(el))return;
    // Save existing tabindex so we can restore it later
    el._savedTabIndex=el.getAttribute('tabindex');
    el.setAttribute('tabindex','-1');
  });
}
function _modalRestoreBackground(){
  const SELECTOR='a,button,input,select,textarea,[tabindex]';
  document.querySelectorAll(SELECTOR).forEach(el=>{
    if(el._savedTabIndex===undefined)return; // wasn't touched
    if(el._savedTabIndex===null){
      el.removeAttribute('tabindex');
    } else {
      el.setAttribute('tabindex',el._savedTabIndex);
    }
    delete el._savedTabIndex;
  });
}

// Get all focusable elements inside the modal, in DOM order
function _modalFocusable(){
  const mc=document.getElementById('modal-container');
  if(!mc)return[];
  return Array.from(mc.querySelectorAll(
    'input:not([disabled]):not([tabindex="-1"]),select:not([disabled]):not([tabindex="-1"]),textarea:not([disabled]):not([tabindex="-1"]),button:not([disabled]):not([tabindex="-1"])'
  )).filter(el=>el.offsetParent!==null); // visible only
}

          <div class="ac-list" id="no-ac-dname" style="display:none"></div>
          <div class="err-msg" id="err-no-dname" style="display:none">Design name is required</div>
        </div>
        <div class="field-group ac-wrap">
          <label>Design code <span style="color:#A32D2D">*</span></label>
          <input id="no-dcode" placeholder="e.g. MG-22" autocomplete="off" value="${esc(firstDesign.code||'')}"
            oninput="showACModal(this,'dcodes')" onblur="hideACModal('no-ac-dcode')">
          <div class="ac-list" id="no-ac-dcode" style="display:none"></div>
          <div class="err-msg" id="err-no-dcode" style="display:none">Design code is required</div>
        </div>
      </div>

      <!-- Size headers -->
      <div style="font-size:11px;color:#3C3489;font-weight:600;margin-bottom:6px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:6px">
        <span>📏 Size headers <span style="font-weight:400;color:#888">(edit denominator only — e.g. 2/ → 2/14). Locked after creation.</span></span>
        <button class="icon-btn" id="btn-add-size" onclick="addModalSize()">+ Add size</button>
      </div>
      <div id="no-size-headers" style="display:flex;gap:6px;flex-wrap:wrap;background:#f0efff;padding:8px 10px;border-radius:8px;border:1px solid #AFA9EC;margin-bottom:10px"></div>

      <!-- Varieties / Quantities for Design 1 -->
      <div style="font-size:11px;color:#3C3489;font-weight:600;margin-bottom:6px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:6px">
        <span id="no-variety-label">🧮 Varieties <span style="color:#A32D2D">*</span> <span style="font-weight:400;color:#888">(at least one variety with non-zero total required)</span></span>
        <button class="icon-btn" id="btn-add-variety" onclick="addModalVariety()">+ Add variety</button>
      </div>
      <div id="no-variety-rows" style="display:flex;flex-direction:column;gap:6px"></div>
      <div class="err-msg" id="err-no-varieties" style="display:none;margin-top:4px">At least one variety with non-zero quantity is required</div>

      <div style="font-size:11px;color:#aaa;margin-top:10px">All ${S.stageTemplates.length} stage templates will be applied to every design. Customise after creation.</div>
      <div class="modal-actions">
        <button id="btn-modal-cancel" onclick="closeModal()">Cancel</button>
        <button class="primary" id="btn-modal-create" onclick="createOrder()">Create order${extraDesigns.length>0?' ('+( extraDesigns.length+1)+' designs)':''}</button>
      </div>
    </div>
  </div>`;
  renderModalSizeHeaders();
  renderModalVarieties();
  _modalDisableBackground();
  const overlay=document.getElementById('modal-overlay-main');
  if(overlay){
    overlay.addEventListener('click',e=>{if(e.target===overlay)closeModal();});
    overlay.addEventListener('keydown',_modalFocusTrap);
  }
  // Focus the client name field (Order ID is auto-assigned, no need to focus it)
  setTimeout(()=>{const f=document.getElementById('no-client');if(f)f.focus();},30);
}

// ── MODAL FOCUS TRAP ──────────────────────────────────────────────────────────
// Intercepts Tab/Shift-Tab so focus cycles only within the modal.
// Also closes on Escape.
function _modalFocusTrap(e){
  if(e.key==='Escape'){closeModal();return;}
  // Let handleModalQtyTab handle Tab inside qty cells — it calls e.preventDefault() itself
  // For all other Tab presses, we enforce the cycle inside the modal
  if(e.key!=='Tab')return;
  const focusable=_modalFocusable();
  if(!focusable.length)return;
  const first=focusable[0],last=focusable[focusable.length-1];
  if(e.shiftKey){
    if(document.activeElement===first){e.preventDefault();last.focus();}
  } else {
    if(document.activeElement===last){e.preventDefault();first.focus();}
  }
}

function renderModalSizeHeaders(){
  const wrap=document.getElementById('no-size-headers');if(!wrap)return;
  wrap.innerHTML=window._modalSizes.map((sz,i)=>{
    const parts=sz.split('/');
    return `<div style="display:flex;flex-direction:column;align-items:center;gap:3px">
      <span style="font-size:10px;color:#AFA9EC;font-weight:500">Size ${i+1}</span>
      <div style="display:flex;align-items:center;border:1px solid #AFA9EC;border-radius:6px;overflow:hidden;background:#fff">
        <span style="padding:5px 5px 5px 8px;font-size:11px;font-weight:600;color:#534AB7;background:#f0efff;border-right:1px solid #AFA9EC">2/</span>
        <input type="number" min="1" max="99" value="${parts[1]||''}" data-modal-size-idx="${i}"
          style="width:40px;padding:5px 3px;font-size:11px;font-weight:600;color:#534AB7;text-align:center;border:none;border-radius:0;background:#fff;box-shadow:none"
          onblur="changeModalSizeDenom(${i},this.value)" onkeydown="handleModalSizeHeaderTab(event,${i})">
      </div>
      ${window._modalSizes.length>1?`<button class="icon-btn danger" style="font-size:9px;padding:2px 5px" tabindex="-1" onclick="removeModalSize(${i})">✕</button>`:''}
    </div>`;
  }).join('');
}
function addModalSize(){
  const denoms=window._modalSizes.map(s=>parseInt(s.split('/')[1])).filter(n=>!isNaN(n));
  const next=(denoms.length?Math.max(...denoms):12)+2;
  window._modalSizes.push('2/'+next);
  window._modalVarieties.forEach(v=>{if(!v.sizes)v.sizes={};v.sizes['2/'+next]=0;});
  renderModalSizeHeaders();renderModalVarieties();
}
function removeModalSize(i){
  if(window._modalSizes.length<=1){alert('At least one size is required');return;}
  const sz=window._modalSizes[i];
  window._modalSizes.splice(i,1);
  window._modalVarieties.forEach(v=>{if(v.sizes)delete v.sizes[sz];});
  renderModalSizeHeaders();renderModalVarieties();
}
function changeModalSizeDenom(i,val){
  const n=parseInt(val);if(isNaN(n)||n<1)return;
  const oldSz=window._modalSizes[i],newSz='2/'+n;
  if(newSz===oldSz)return;
  // Prevent duplicate size keys
  if(window._modalSizes.includes(newSz)){alert('Size '+newSz+' already exists. Please choose a different value.');renderModalSizeHeaders();return;}
  window._modalSizes[i]=newSz;
  window._modalVarieties.forEach(v=>{if(!v.sizes)return;const ov=v.sizes[oldSz]||0;delete v.sizes[oldSz];v.sizes[newSz]=ov;});
  renderModalSizeHeaders();renderModalVarieties();
}

// Tab navigation between size header inputs: Tab moves to next size, Shift-Tab to previous.
// After last size header → Tab moves to first variety name input (or "Add variety" button).
function handleModalSizeHeaderTab(e, szI){
  if(e.key==='Tab'&&!e.shiftKey){
    e.preventDefault();
    const nextSzI=szI+1;
    if(nextSzI<window._modalSizes.length){
      // Move to next size header input
      const all=document.querySelectorAll('#no-size-headers input[type="number"]');
      if(all[nextSzI]){all[nextSzI].focus();all[nextSzI].select();}
    } else {
      // Last size — move to first variety name input or "Add variety" button
      const firstVarName=document.querySelector('#no-variety-rows .modal-variety-row input:not([type="number"])');
      const firstVarQty=document.querySelector('#no-variety-rows input[type="number"]');
      const addBtn=document.getElementById('btn-add-variety');
      if(firstVarName){firstVarName.focus();firstVarName.select();}
      else if(firstVarQty){firstVarQty.focus();firstVarQty.select();}
      else if(addBtn){addBtn.focus();}
    }
  } else if(e.key==='Tab'&&e.shiftKey){
    e.preventDefault();
    const prevSzI=szI-1;
    if(prevSzI>=0){
      const all=document.querySelectorAll('#no-size-headers input[type="number"]');
      if(all[prevSzI]){all[prevSzI].focus();all[prevSzI].select();}
    } else {
      // First size — go back to Design code
      const dcode=document.getElementById('no-dcode');
      if(dcode)dcode.focus();
    }
  }
}

// Switch bangle type in the open modal
function setModalBangleType(type){
  window._modalBangleType=type;
  if(type==='cnc'){
    // Ensure at least one variety exists (for quantities)
    if(!window._modalVarieties.length){
      window._modalVarieties=[{id:uid(),name:'Default',sizes:Object.fromEntries(window._modalSizes.map(s=>[s,0])),images:[],unit:'pcs'}];
    }
  }
  // Update section label
  const lbl=document.getElementById('no-variety-label');
  if(lbl){
    if(type==='cnc'){
      lbl.innerHTML='📦 Quantities <span style="color:#A32D2D">*</span> <span style="font-weight:400;color:#888">(enter quantity per size for this CNC design)</span>';
    } else if(type==='both'){
      lbl.innerHTML='🧮 Varieties / Quantities <span style="color:#A32D2D">*</span> <span style="font-weight:400;color:#888">(CNC + Dye Gold — all design types combined)</span>';
    } else {
      lbl.innerHTML='🧮 Varieties <span style="color:#A32D2D">*</span> <span style="font-weight:400;color:#888">(at least one variety with non-zero total required)</span>';
    }
  }
  renderModalVarieties();
}

function renderModalVarieties(){
  const wrap=document.getElementById('no-variety-rows');if(!wrap)return;
  const addVarBtn=document.getElementById('btn-add-variety');

  // ── CNC MODE: simplified single-row quantity input ──────────────────────────
  if(window._modalBangleType==='cnc'){
    if(!window._modalVarieties.length){
      window._modalVarieties=[{id:uid(),name:'Default',sizes:Object.fromEntries(window._modalSizes.map(s=>[s,0])),images:[],unit:'pcs'}];
    }
    if(addVarBtn)addVarBtn.style.display='none';
    const v=window._modalVarieties[0];
    const rowTotal=window._modalSizes.reduce((a,sz)=>a+(parseInt((v.sizes||{})[sz])||0),0);
    const cncUnitOpts=(S.vocabulary.units||['pcs','pairs','jotta']).map(u=>`<option value="${u}"${u===(v.unit||'pcs')?' selected':''}>${u}</option>`).join('');
    wrap.innerHTML=`<div class="modal-variety-row" style="background:#f7f6f2;border:1.5px dashed #AFA9EC">
      <div class="modal-variety-row-head">
        <span style="font-size:11px;font-weight:600;color:#534AB7">📦 CNC — Enter total quantities per size</span>
        <label style="font-size:11px;color:#534AB7;font-weight:600;margin-left:12px">Unit:</label>
        <select style="font-size:11px;padding:3px 6px;border-radius:6px;border:1px solid #AFA9EC;background:#f7f6ff;color:#3C3489"
          onchange="window._modalVarieties[0]=window._modalVarieties[0]||{};window._modalVarieties[0].unit=this.value">${cncUnitOpts}</select>
        <span style="font-size:11px;color:#888;margin-left:auto">Total: <strong>${rowTotal}</strong></span>
      </div>
      <div class="modal-sizes-grid">
        ${window._modalSizes.map((sz,szI)=>`<div class="modal-size-cell">
          <label>${esc(sz)}</label>
          <input type="number" min="0" value="${(v.sizes||{})[sz]||0}"
            oninput="window._modalVarieties[0]=window._modalVarieties[0]||{sizes:{}};window._modalVarieties[0].sizes['${sz}']=parseInt(this.value)||0;updateModalVarietyTotal(0)"
            onkeydown="handleModalQtyTab(event,0,${szI})">
        </div>`).join('')}
      </div>
      <div style="margin-top:10px;font-size:11px;color:#666">
        Need separate variety breakdown?
        <button type="button"
          style="font-size:11px;padding:3px 10px;border:1px solid #AFA9EC;border-radius:6px;cursor:pointer;background:#fff;color:#534AB7;margin-left:4px"
          onclick="document.getElementById('no-btype').value='dye_gold';setModalBangleType('dye_gold')">
          + Add variety breakdown
        </button>
      </div>
    </div>`;
    return;
  }

  // ── DYE GOLD MODE: full variety table ──────────────────────────────────────
  if(addVarBtn)addVarBtn.style.display='';
  if(!window._modalVarieties.length){
    wrap.innerHTML=`<div style="font-size:12px;color:#aaa;padding:8px 0">No varieties yet — click "+ Add variety".</div>`;
    return;
  }
  wrap.innerHTML=window._modalVarieties.map((v,vi)=>{
    const rowTotal=window._modalSizes.reduce((a,sz)=>a+(parseInt((v.sizes||{})[sz])||0),0);
    const unitOpts=(S.vocabulary.units||['pcs','pairs','jotta']).map(u=>`<option value="${u}"${u===(v.unit||'pcs')?' selected':''}>${u}</option>`).join('');
    return `<div class="modal-variety-row">
      <div class="modal-variety-row-head">
        <span style="font-size:11px;font-weight:600;color:#534AB7;min-width:20px">${vi+1}</span>
        <input value="${esc(v.name||'Variety '+(vi+1))}" placeholder="Variety name" style="max-width:200px"
          onblur="if(this.value!==window._modalVarieties[${vi}].name){window._modalVarieties[${vi}].name=this.value;}"
          onkeydown="handleModalVarietyNameTab(event,${vi})">
        <label style="font-size:11px;color:#534AB7;font-weight:600;margin-left:8px">Unit:</label>
        <select style="font-size:11px;padding:3px 6px;border-radius:6px;border:1px solid #AFA9EC;background:#f7f6ff;color:#3C3489"

        <span style="font-size:11px;color:#888;margin-left:auto">Total: <strong>${rowTotal}</strong></span>
        <button class="icon-btn danger" tabindex="-1" onclick="window._modalVarieties.splice(${vi},1);renderModalVarieties()">✕</button>
      </div>
      <div class="modal-sizes-grid">
        ${window._modalSizes.map((sz,szI)=>`<div class="modal-size-cell">

            oninput="window._modalVarieties[${vi}].sizes=window._modalVarieties[${vi}].sizes||{};window._modalVarieties[${vi}].sizes['${sz}']=parseInt(this.value)||0;updateModalVarietyTotal(${vi})"
            onkeydown="handleModalQtyTab(event,${vi},${szI})">

function addModalVariety(){
  const sizes=Object.fromEntries(window._modalSizes.map(s=>[s,0]));
  window._modalVarieties.push({id:uid(),name:'Variety '+(window._modalVarieties.length+1),sizes,images:[],unit:'pcs'});
  renderModalVarieties();
}

// Update just the "Total" span for a variety row without re-rendering everything
function updateModalVarietyTotal(vi){
  const v=window._modalVarieties[vi];
  const total=window._modalSizes.reduce((a,sz)=>a+(parseInt((v.sizes||{})[sz])||0),0);
  const rows=document.querySelectorAll('#no-variety-rows .modal-variety-row');
  if(rows[vi]){
    const span=rows[vi].querySelector('strong');
    if(span)span.textContent=total;
  }
}

// Tab on variety name input: Tab → first qty cell of same variety; Shift-Tab → last size header or prev variety last qty
function handleModalVarietyNameTab(e,vi){
  if(e.key!=='Tab')return;
  e.preventDefault();
  if(!e.shiftKey){
    // Forward: go to first qty cell of this variety
    const rows=document.querySelectorAll('#no-variety-rows .modal-variety-row');
    if(rows[vi]){
      const inp=rows[vi].querySelectorAll('input[type="number"]')[0];
      if(inp){inp.focus();inp.select();}
    }
  } else {
    // Backward: go to last qty cell of previous variety, or last size header
    if(vi>0){
      const rows=document.querySelectorAll('#no-variety-rows .modal-variety-row');
      const prevRow=rows[vi-1];
      if(prevRow){
        const inputs=prevRow.querySelectorAll('input[type="number"]');
        const last=inputs[inputs.length-1];
        if(last){last.focus();last.select();}
      }
    } else {
      // First variety name → back to last size header
      const sizeInputs=document.querySelectorAll('#no-size-headers input[type="number"]');
      if(sizeInputs.length){const last=sizeInputs[sizeInputs.length-1];last.focus();last.select();}
    }
  }
}

// Tab navigation between modal variety qty cells
function handleModalQtyTab(e,vi,szI){
  if(e.key!=='Tab'&&e.key!=='Enter')return;
  e.preventDefault();
  const numSizes=window._modalSizes.length;
  const numVars=window._modalVarieties.length;
  const rows=document.querySelectorAll('#no-variety-rows .modal-variety-row');

  if(e.key==='Enter'){
    // Enter: go down same column to next variety
    const nextVi=(vi+1)%numVars;
    if(rows[nextVi]){
      const inputs=rows[nextVi].querySelectorAll('input[type="number"]');
      if(inputs[szI]){inputs[szI].focus();inputs[szI].select();}
    }
    return;
  }

  if(!e.shiftKey){
    // Forward Tab
    const nextSzI=szI+1;
    if(nextSzI<numSizes){
      // Next size in same variety
      if(rows[vi]){
        const inp=rows[vi].querySelectorAll('input[type="number"]')[nextSzI];
        if(inp){inp.focus();inp.select();}
      }
    } else {
      // End of this variety's sizes — go to next variety's name input
      const nextVi=vi+1;
      if(nextVi<numVars){
        const nameInp=rows[nextVi]?rows[nextVi].querySelector('input:not([type="number"])'):null;
        if(nameInp){nameInp.focus();nameInp.select();}
      } else {
        // Last cell of last variety — move to "Create order" button
        const createBtn=document.getElementById('btn-modal-create');
        if(createBtn)createBtn.focus();
      }
    }
  } else {
    // Backward Shift+Tab
    const prevSzI=szI-1;
    if(prevSzI>=0){
      // Prev size in same variety
      if(rows[vi]){
        const inp=rows[vi].querySelectorAll('input[type="number"]')[prevSzI];
        if(inp){inp.focus();inp.select();}
      }
    } else {
      // Start of this variety's sizes — go to this variety's name input
      if(rows[vi]){
        const nameInp=rows[vi].querySelector('input:not([type="number"])');
        if(nameInp){nameInp.focus();nameInp.select();}
      }
    }
  }
}

// Autocomplete in modal
function showACModal(input,vocab){
  const val=input.value.toLowerCase();const list=S.vocabulary[vocab]||[];
  const filtered=list.filter(v=>v.toLowerCase().includes(val)&&v!==input.value);
  const listId=input.id==='no-client'?'no-ac-client':input.id==='no-dname'?'no-ac-dname':'no-ac-dcode';
  const el=document.getElementById(listId);
  if(!el||!filtered.length){if(el)el.style.display='none';return;}
  el.innerHTML=filtered.map(v=>`<div class="ac-item" onpointerdown="event.preventDefault();document.getElementById('${input.id}').value='${esc(v).replace(/'/g,"\\'")}';document.getElementById('${listId}').style.display='none';clearFieldError('${input.id}')">${esc(v)}</div>`).join('');
  el.style.display='block';
}
function hideACModal(id){setTimeout(()=>{const el=document.getElementById(id);if(el)el.style.display='none';},200);}

// ── Design-name group header autocomplete (shared: client + vendor orders) ────
// gId = 'dng-' + firstDesignId in group — used for both input & dropdown IDs.
function showDNameAC(gId,forceAll){
  const inp=document.getElementById(gId+'-inp');
  const ac=document.getElementById(gId+'-ac');
  if(!inp||!ac)return;
  const val=(inp.value||'').toLowerCase();
  const list=[...(S.vocabulary.dnames||[]),...(S.vocabularyManual&&S.vocabularyManual.dnames||[])].filter((v,i,a)=>v&&a.indexOf(v)===i);
  // On focus (forceAll=true) show ALL names; on typing, filter by what was typed
  const filtered=forceAll
    ? list
    : list.filter(v=>val===''||v.toLowerCase().includes(val));
  if(!filtered.length){ac.style.display='none';return;}
  ac.innerHTML=filtered.slice(0,15).map(v=>
    `<div class="ac-item" style="color:#333;font-weight:500"
      onpointerdown="event.preventDefault();selectDNameAC('${gId}','${esc(v).replace(/'/g,"\\'")}');">${esc(v)}</div>`
  ).join('');
  ac.style.display='block';
}
function hideDNameAC(gId){
  setTimeout(()=>{const ac=document.getElementById(gId+'-ac');if(ac)ac.style.display='none';},200);
}
function selectDNameAC(gId,name){
  const inp=document.getElementById(gId+'-inp');
  if(!inp)return;
  inp.value=name;
  // Store the original so renameDesignGroup can detect a change
  if(inp.dataset.origname===undefined)inp.dataset.origname=name;
  const ac=document.getElementById(gId+'-ac');
  if(ac)ac.style.display='none';
  inp.blur(); // triggers renameDesignGroup / renameVendorDesignGroup
}

// ── STRICT VALIDATION & ORDER CREATION ────────────────────────────────────────
function showFieldError(id,msg){
  const inp=document.getElementById(id);const err=document.getElementById('err-'+id);
  if(inp){inp.classList.add('err');}
  if(err){err.textContent=msg||err.textContent;err.style.display='block';}
}
function clearFieldError(id){
  const inp=document.getElementById(id);const err=document.getElementById('err-'+id);
  if(inp)inp.classList.remove('err');if(err)err.style.display='none';
}
function createOrder(){
  // Clear all errors first
  ['no-client','no-date','no-dname','no-dcode'].forEach(clearFieldError);
  const errV=document.getElementById('err-no-varieties');if(errV)errV.style.display='none';

  // Order ID is auto-assigned by renumberOrders() based on start-date sequence.
  const client=document.getElementById('no-client').value.trim();
  const startDate=document.getElementById('no-date').value;
  const dname=document.getElementById('no-dname').value.trim();
  const dcode=document.getElementById('no-dcode').value.trim();

  const bangleType=(document.getElementById('no-btype')?.value)||'dye_gold';

  let hasErr=false;
  if(!client){showFieldError('no-client','Client name is required');hasErr=true;}
  if(!startDate){showFieldError('no-date','Start date is required');hasErr=true;}
  if(!dname){showFieldError('no-dname','Design name is required');hasErr=true;}
  if(!dcode){showFieldError('no-dcode','Design code is required');hasErr=true;}

  // Validate quantities / varieties
  if(bangleType==='cnc'){
    const cncTotal=window._modalSizes.reduce((a,sz)=>a+(parseInt((window._modalVarieties[0]?.sizes||{})[sz])||0),0);
    if(!cncTotal){
      if(errV){errV.textContent='Please enter at least one quantity for this CNC design.';errV.style.display='block';}
      hasErr=true;
    }
  } else {
    const validVarieties=window._modalVarieties.filter(v=>Object.values(v.sizes||{}).reduce((a,x)=>a+(parseInt(x)||0),0)>0);
    if(!window._modalVarieties.length||!validVarieties.length){
      if(errV){errV.textContent='At least one variety with non-zero quantity is required';errV.style.display='block';}
      hasErr=true;
    }
  }
  if(hasErr)return;

  // ── Build first design ────────────────────────────────────────────────────
  // Snapshot name/loc/group into each stage so later stage-template edits
  // never affect this order — template changes apply to NEW orders only.
  const makeStageFresh=()=>S.stageTemplates.map(s=>({stageId:s.id,name:s.name,loc:s.loc,group:s.group,status:'pending',completionDate:null,vendor:'',stageNote:'',qty:null}));
  const buildDesignFromModal=(dName,dCode,szKeys,vList)=>{
    const szObj=Object.fromEntries(szKeys.map(sz=>[sz,0]));
    vList.forEach(v=>szKeys.forEach(sz=>{szObj[sz]=(szObj[sz]||0)+(parseInt((v.sizes||{})[sz])||0);}));
    return {id:uid(),name:dName,code:dCode,sizesLocked:true,sizes:szObj,images:[],stages:makeStageFresh(),varieties:JSON.parse(JSON.stringify(vList))};
  };

  const firstDesign=buildDesignFromModal(dname,dcode,window._modalSizes,window._modalVarieties);

  // ── Build extra designs from file ─────────────────────────────────────────
  const extraDesignObjects=(window._modalExtraDesigns||[]).map(ed=>{
    const szKeys=ed.sizes&&ed.sizes.length?ed.sizes:window._modalSizes;
    return buildDesignFromModal(ed.name||'Design',ed.code||'',szKeys,ed.varieties||[]);
  });

  const newOrder={
    id:uid(),
    orderId:'',          // placeholder — renumberOrders() will assign
    createdAt:new Date().toISOString(),
    client,startDate,
    priority:document.getElementById('no-prio').value,
    notes:document.getElementById('no-notes').value,
    bangleType,
    designs:[firstDesign,...extraDesignObjects],
    attachedFile:window._uploadedOrderFile||null
  };
  window._uploadedOrderFile=null;
  window._modalExtraDesigns=[];
  S.orders.unshift(newOrder);
  S.openOrders.add(newOrder.id);
  S.openClients.add(client);
  S.activeTabs[newOrder.id]='designs';
  renumberOrders(); // assigns ORD-XXX based on date sequence
  audit('Create order',`New order ${newOrder.orderId} for ${client} (${bangleType==='cnc'?'CNC':bangleType==='both'?'Both':'Dye Gold'}) created with ${window._modalVarieties.length} varieties`);
  rebuildVocab();closeModal();
  save();                       // write to localStorage immediately
  render();
  try{ fbPushNow(); }catch(e){} // push the new order to Firebase right away
}

// ── FILE IMPORT (Mock / hookable) ──────────────────────────────────────────────
function handleOrderDrop(e){
  e.preventDefault();document.getElementById('upload-zone').classList.remove('drag-over');
  const file=e.dataTransfer.files[0];if(file)processOrderFile(file);
}
function handleOrderFileInput(input){const file=input.files[0];if(file)processOrderFile(file);}
function processOrderFile(file){
  const status=document.getElementById('import-status');
  if(!status)return;
  const name=file.name.toLowerCase();

  // Store file for later download under Order details
  const fileReader=new FileReader();
  fileReader.onload=ev=>{
    window._uploadedOrderFile={name:file.name,type:file.type,data:ev.target.result};
  };
  fileReader.readAsDataURL(file);

  if(name.endsWith('.csv')){
    const reader=new FileReader();
    reader.onload=e=>{
      const text=e.target.result;
      const parseCSVRow=line=>{const cells=[];let cur='',inQ=false;for(let i=0;i<line.length;i++){const ch=line[i];if(ch==='"'){inQ=!inQ;}else if(ch===','&&!inQ){cells.push(cur.trim());cur='';}else{cur+=ch;}}cells.push(cur.trim());return cells;};
      const rawRows=text.split('\n').map(parseCSVRow).filter(r=>r.some(c=>c));
      if(rawRows.length<2){status.textContent='CSV appears empty.';status.style.display='block';return;}
      const headers=rawRows[0].map(h=>h.toLowerCase().trim());
      const dataRows=rawRows.slice(1);

      const getFromRow=(row,...keys)=>{for(const k of keys){const i=headers.findIndex(h=>h.includes(k));if(i>=0&&row[i])return String(row[i]).trim();}return '';};
      const parseDateStr=raw=>{if(!raw)return '';const d=new Date(raw);return isNaN(d)?'':d.toISOString().split('T')[0];};

      // Column indices
      const designNameIdx=headers.findIndex(h=>h==='design name'||h==='design');
      const designCodeIdx=headers.findIndex(h=>h==='design code'||h==='code');
      const varietyIdx=headers.findIndex(h=>h==='variety name'||h==='variety');
      const sizeIdxMap={};
      headers.forEach((h,i)=>{if(/^\d+\/\d+$/.test(h))sizeIdxMap[h]=i;});
      const allSizes=Object.keys(sizeIdxMap);

      // Order-level fields from first row
      const orderRow=dataRows[0];
      const orderId=getFromRow(orderRow,'order id','orderid','order no','order number');
      const client=getFromRow(orderRow,'client','customer','party','buyer');
      const startDate=parseDateStr(getFromRow(orderRow,'start date','date','start'))||new Date().toISOString().split('T')[0];
      const notes=getFromRow(orderRow,'notes','remarks','comment');

      // ── Group rows into designs ────────────────────────────────────────────
      const designMap=[];      // [{name,code,varieties:[]}]
      let curDesign=null;
      let lastDName='',lastDCode='';
      dataRows.forEach(row=>{
        // Carry-forward design name/code
        const dn=designNameIdx>=0?String(row[designNameIdx]||'').trim():'';
        const dc=designCodeIdx>=0?String(row[designCodeIdx]||'').trim():'';
        if(dn)lastDName=dn;
        if(dc)lastDCode=dc;
        const effectiveDName=lastDName||getFromRow(row,'design name','design');
        const effectiveDCode=lastDCode||getFromRow(row,'design code','code');

        const vName=varietyIdx>=0?String(row[varietyIdx]||'').trim():'';
        if(!vName)return; // skip rows without variety name

        // Start new design group when name changes
        if(!curDesign||curDesign.name!==effectiveDName){
          curDesign={name:effectiveDName,code:effectiveDCode,sizes:allSizes,varieties:[]};
          designMap.push(curDesign);
        }

        const sizes={};
        allSizes.forEach(sz=>{sizes[sz]=parseInt(row[sizeIdxMap[sz]])||0;});
        curDesign.varieties.push({name:vName,sizes,images:[]});
      });

      const designs=designMap.filter(d=>d.varieties.length>0);
      const dCount=designs.length;
      const vCount=designs.reduce((a,d)=>a+d.varieties.length,0);
      status.textContent=`✅ CSV parsed — ${dCount} design${dCount===1?'':'s'}, ${vCount} variet${vCount===1?'y':'ies'} loaded.`;
      status.style.display='block';
      closeModal();openNewOrderModal({orderId,client,startDate,notes,designs:designs.length>0?designs:undefined,_keepFile:true});
    };reader.readAsText(file);

  } else if(name.endsWith('.xlsx')||name.endsWith('.xls')){
    if(typeof XLSX==='undefined'){
      status.textContent='⚠️ SheetJS library not loaded. Check internet connection.';status.style.display='block';return;
    }
    const reader=new FileReader();
    reader.onload=e=>{
      try{
        const wb=XLSX.read(e.target.result,{type:'binary'});
        const ws=wb.Sheets[wb.SheetNames[0]];
        const rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:''});
        if(!rows||rows.length<1){status.textContent='Excel appears empty.';status.style.display='block';return;}

        // ── Helper: parse a date string or Excel serial number ──────────────
        const parseDate=raw=>{
          if(!raw)return '';
          const num=parseFloat(raw);
          if(!isNaN(num)&&num>10000){
            return new Date(Math.round((num-25569)*86400*1000)).toISOString().split('T')[0];
          }
          const d=new Date(String(raw));
          return isNaN(d)?'':d.toISOString().split('T')[0];
        };

        // ── Detect format: label-in-col-A (new template) vs header-row (old) ─
        // New template: col A contains labels like "Order ID", "Client Name" etc.
        const colA=rows.map(r=>String(r[0]||'').toLowerCase().trim());
        const isLabelFormat=colA.some(l=>l.includes('order id')||l.includes('client name'));

        let orderId='',client='',startDate='',dname='',dcode='',notes='';
        const varieties=[];
        const sizeKeys=[];

        // ── Shared helper: group data rows into designs ──────────────────────
        // vIdx=-1 means no variety column; rows with quantities get 'Default' variety name
        // uIdx=-1 means no unit column; default unit = 'pcs'
        // Each distinct (Design Name + Design Code) pair becomes its own design.
        // CNC rows (no variety column) → one design per row, with a single
        // 'Default' variety holding that code's quantities.
        // Dye Gold rows → rows sharing the same name+code are grouped as
        // multiple varieties under that one design.
        const groupIntoDesigns=(dataRows,dnIdx,dcIdx,vIdx,szIdxMap,allSizes,uIdx)=>{
          const designMap=[];
          const byKey={};
          let lastDN='',lastDC='';
          dataRows.forEach(row=>{
            const dn=String(row[dnIdx]||'').trim();
            const dc=String(row[dcIdx]||'').trim();
            if(dn)lastDN=dn;
            if(dc)lastDC=dc;
            if(!lastDN)return; // no design context yet
            const rawVName=vIdx>=0?String(row[vIdx]||'').trim():'';
            const hasQty=allSizes.some(sz=>(parseInt(row[szIdxMap[sz]])||0)>0);
            if(!rawVName&&!hasQty)return;
            const vName=rawVName||(hasQty?'Default':'');
            if(!vName)return;
            // Group by NAME + CODE (each pair = one design)
            const key=lastDN+'␀'+lastDC;
            let design=byKey[key];
            if(!design){
              design={name:lastDN,code:lastDC,sizes:[...allSizes],varieties:[]};
              byKey[key]=design;
              designMap.push(design);
            }
            const existingNames=design.varieties.map(v=>v.name);
            let finalVName=vName;
            if(existingNames.includes(finalVName)){let n=2;while(existingNames.includes(finalVName+' '+n))n++;finalVName=finalVName+' '+n;}
            const sizes={};
            allSizes.forEach(sz=>{sizes[sz]=parseInt(row[szIdxMap[sz]])||0;});
            const unit=uIdx>=0?String(row[uIdx]||'').trim()||'pcs':'pcs';
            design.varieties.push({name:finalVName,sizes,images:[],unit});
          });
          return designMap.filter(d=>d.name&&d.varieties.length>0);
        };

        if(isLabelFormat){
          // ── NEW TEMPLATE FORMAT (label in col A, value in col B) ──────────
          const labelVal=label=>{
            const idx=rows.findIndex(r=>String(r[0]||'').toLowerCase().includes(label));
            return idx>=0?String(rows[idx][1]||'').trim():'';
          };
          orderId=labelVal('order id');
          client=labelVal('client');
          startDate=parseDate(labelVal('start date')||labelVal('date'));
          notes=labelVal('notes');

          // ── Helper: parse a section between startRow and endRow ─────────────
          const parseSection=(startRowIdx,endRowIdx,forceNoVariety)=>{
            const hdrIdx=rows.findIndex((r,i)=>i>startRowIdx&&i<endRowIdx&&String(r[0]||'').toLowerCase().trim()==='design name');
            if(hdrIdx<0)return[];
            const hdr=rows[hdrIdx].map(h=>String(h).trim());
            const szIdxMap={},allSizes=[];
            hdr.forEach((h,i)=>{if(/^\d+\/\d+$/.test(h)){szIdxMap[h]=i;allSizes.push(h);}});
            const szColSet=new Set(Object.values(szIdxMap));
            const vIdx=forceNoVariety?-1:hdr.findIndex((h,i)=>i>1&&!szColSet.has(i)&&/variety/i.test(h));
            const uIdx=hdr.findIndex((h,i)=>!szColSet.has(i)&&/^unit$/i.test(h));
            return groupIntoDesigns(rows.slice(hdrIdx+1,endRowIdx),0,1,vIdx,szIdxMap,allSizes,uIdx);
          };

          // ── Detect two-section template (CNC + Dye Gold) ───────────────────
          const cncSecIdx=colA.findIndex(l=>l.includes('cnc design'));
          const dyeSecIdx=colA.findIndex(l=>l.includes('dye gold design')||l.includes('dye_gold design'));

          if(cncSecIdx>=0||dyeSecIdx>=0){
            let allDesigns=[],detectedBT='';
            if(cncSecIdx>=0){
              const cncEnd=dyeSecIdx>cncSecIdx?dyeSecIdx:rows.length;
              const cncDesigns=parseSection(cncSecIdx,cncEnd,true);
              cncDesigns.forEach(d=>{d.bangleType='cnc';});
              if(cncDesigns.length){allDesigns.push(...cncDesigns);detectedBT='cnc';}
            }
            if(dyeSecIdx>=0){
              const dyeDesigns=parseSection(dyeSecIdx,rows.length,false);
              dyeDesigns.forEach(d=>{d.bangleType='dye_gold';});
              if(dyeDesigns.length){allDesigns.push(...dyeDesigns);detectedBT=detectedBT==='cnc'?'both':'dye_gold';}
            }
            const dCount=allDesigns.length,vCount=allDesigns.reduce((a,d)=>a+d.varieties.length,0);
            const btLabel=detectedBT==='both'?'CNC + Dye Gold':detectedBT==='cnc'?'CNC':'Dye Gold';
            status.textContent=`✅ Excel parsed — ${dCount} design${dCount===1?'':'s'}, ${vCount} variet${vCount===1?'y':'ies'} loaded (${btLabel}).`;
            status.style.display='block';
            closeModal();openNewOrderModal({orderId,client,startDate:startDate||new Date().toISOString().split('T')[0],notes,designs:allDesigns.length?allDesigns:undefined,bangleType:detectedBT||'dye_gold',_keepFile:true});
            return;
          }

          // ── Single-section format (old template / generic) ─────────────────
          const tblHdrIdx=rows.findIndex(r=>String(r[0]||'').toLowerCase().trim()==='design name');
          if(tblHdrIdx>=0){
            const hdr=rows[tblHdrIdx].map(h=>String(h).trim());
            const dnIdx=0,dcIdx=1;
            const szIdxMap={};const allSizes=[];
            hdr.forEach((h,i)=>{if(/^\d+\/\d+$/.test(h)){szIdxMap[h]=i;allSizes.push(h);}});
            const szColSet=new Set(Object.values(szIdxMap));
            const vIdx=hdr.findIndex((h,i)=>i>dcIdx&&!szColSet.has(i)&&/variety/i.test(h));
            const uIdx=hdr.findIndex((h,i)=>!szColSet.has(i)&&/^unit$/i.test(h));
            const designs=groupIntoDesigns(rows.slice(tblHdrIdx+1),dnIdx,dcIdx,vIdx,szIdxMap,allSizes,uIdx);
            const dCount=designs.length,vCount=designs.reduce((a,d)=>a+d.varieties.length,0);
            status.textContent=`✅ Excel parsed — ${dCount} design${dCount===1?'':'s'}, ${vCount} variet${vCount===1?'y':'ies'} loaded.`;
            status.style.display='block';
            closeModal();openNewOrderModal({orderId,client,startDate:startDate||new Date().toISOString().split('T')[0],notes,designs:designs.length?designs:undefined,_keepFile:true});
            return;
          }

        } else {
          // ── GENERIC HEADER-ROW FORMAT (fallback) ─────────────────────────
          const headers=rows[0].map(h=>String(h).toLowerCase().trim());
          const dataRow=rows[1]||[];
          const getH=(...keys)=>{for(const k of keys){const i=headers.findIndex(h=>h.includes(k));if(i>=0&&dataRow[i]!==undefined&&dataRow[i]!=='')return String(dataRow[i]).trim();}return '';};
          orderId=getH('order id','orderid','order no','order number');
          client=getH('client','customer','party','buyer');
          startDate=parseDate(getH('start date','date','start'));
          notes=getH('notes','remarks','comment');

          const dnIdx=headers.findIndex(h=>h==='design name'||h==='design');
          const dcIdx=headers.findIndex(h=>h==='design code'||h==='code');
          // vIdx=-1 is fine — groupIntoDesigns will auto-name varieties 'Default'
          const vIdx=headers.findIndex(h=>h==='variety name'||h==='variety');
          const szIdxMap={};const allSizes=[];
          headers.forEach((h,i)=>{if(/^\d+\/\d+$/.test(h)){szIdxMap[h]=i;allSizes.push(h);}});
          const szColSetG=new Set(Object.values(szIdxMap));
          const uIdxG=headers.findIndex((h,i)=>!szColSetG.has(i)&&/^unit$/i.test(h));

          if(dnIdx>=0){
            const designs=groupIntoDesigns(rows.slice(1),dnIdx,dcIdx>=0?dcIdx:dnIdx,vIdx,szIdxMap,allSizes,uIdxG);
            const dCount=designs.length,vCount=designs.reduce((a,d)=>a+d.varieties.length,0);
            status.textContent=`✅ Excel parsed — ${dCount} design${dCount===1?'':'s'}, ${vCount} variet${vCount===1?'y':'ies'} loaded.`;
            status.style.display='block';
            closeModal();openNewOrderModal({orderId,client,startDate:startDate||new Date().toISOString().split('T')[0],notes,designs:designs.length?designs:undefined,_keepFile:true});
            return;
          }
        }

        // ── Minimal fallback: no table found, prefill order fields only ─────
        status.textContent='✅ Excel read — fill designs manually below.';
        status.style.display='block';
        closeModal();openNewOrderModal({orderId,client,startDate:startDate||new Date().toISOString().split('T')[0],notes,_keepFile:true});
      } catch(err){
        status.textContent='⚠️ Could not read Excel file: '+err.message;status.style.display='block';
      }
    };
    reader.readAsBinaryString(file);

  } else if(file.type.startsWith('image/')){
    const reader=new FileReader();
    reader.onload=e=>{
      const zone=document.getElementById('upload-zone');
      if(zone)zone.innerHTML=`<img src="${e.target.result}" style="max-height:140px;border-radius:8px;margin:0 auto;display:block"><p style="margin-top:8px;font-size:11px;color:#666">Order image loaded for reference. Fill fields manually below.</p>`;
    };reader.readAsDataURL(file);
    status.textContent='📷 Order image loaded. Fill in the fields below based on the sheet.';status.style.display='block';
  }
}

// VENDOR ORDERS MODULE
// Completely independent of client orders, inventory, and production stages.
// Order IDs: VORD-01, VORD-02, ...
// ══════════════════════════════════════════════════════════════════════════════

function genVendorOrderId(){
  const nums=S.vendorOrders.map(o=>{const m=o.orderId.match(/VORD-?(\d+)/i);return m?parseInt(m[1]):0;});
  const next=nums.length?Math.max(...nums)+1:1;
  return 'VORD-'+String(next).padStart(2,'0');
}

function vendorOrderAlert(vo){
  // Simple two-state: 'done' = delivered, 'pending' = everything else
  return (vo.status==='delivered')?'done':'pending';
}
function vendorTotalQty(vo){
  return (vo.designs||[]).reduce((a,d)=>{
    const vs=d.varieties&&d.varieties.length?d.varieties:[{sizes:d.sizes}];
    return a+vs.reduce((b,v)=>b+Object.values(v.sizes||{}).reduce((c,x)=>c+(parseInt(x)||0),0),0);
  },0);
}
function vendorDesignQty(d){
  const vs=d.varieties&&d.varieties.length?d.varieties:[{sizes:d.sizes}];
  return vs.reduce((a,v)=>a+Object.values(v.sizes||{}).reduce((b,x)=>b+(parseInt(x)||0),0),0);
}
function vendorOrderMatchesFilter(vo){
  const f=S.vendorFilters||{};
  if(f.vendor&&vo.vendor!==f.vendor)return false;
  if(f.design&&!vo.designs.some(d=>d.name===f.design))return false;
  if(f.code&&!vo.designs.some(d=>d.code===f.code))return false;
  return true;
}

// ── VENDOR ORDERS RENDERER ────────────────────────────────────────────────────
let _openVendorSections = new Set();

function renderVendorOrders(){
  const container = document.getElementById('view-vendor');
  if(!container) return;
  const orders = S.vendorOrders || [];
  const f = S.vendorFilters || {};

  // Toolbar
  const vendorOpts = [...new Set(orders.map(o=>o.vendor).filter(Boolean))].sort();
  const designOpts = [...new Set(orders.flatMap(o=>(o.designs||[]).map(d=>d.name)).filter(Boolean))].sort();
  const codeOpts   = [...new Set(orders.flatMap(o=>(o.designs||[]).map(d=>d.code)).filter(Boolean))].sort();

  const toolbar = `<div style="display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:16px;padding:12px 16px;background:#fff;border-radius:10px;border:1px solid #FFD0A0;box-shadow:0 1px 4px rgba(230,81,0,.07)">
    <select style="flex:1;min-width:120px;max-width:200px;font-size:12px" onchange="S.vendorFilters.vendor=this.value;save();renderVendorOrders()">
      <option value="">All vendors</option>
      ${vendorOpts.map(v=>`<option value="${esc(v)}"${f.vendor===v?' selected':''}>${esc(v)}</option>`).join('')}
    </select>
    <select style="flex:1;min-width:120px;max-width:200px;font-size:12px" onchange="S.vendorFilters.design=this.value;save();renderVendorOrders()">
      <option value="">All designs</option>
      ${designOpts.map(v=>`<option value="${esc(v)}"${f.design===v?' selected':''}>${esc(v)}</option>`).join('')}
    </select>
    <select style="flex:1;min-width:100px;max-width:160px;font-size:12px" onchange="S.vendorFilters.code=this.value;save();renderVendorOrders()">
      <option value="">All codes</option>
      ${codeOpts.map(v=>`<option value="${esc(v)}"${f.code===v?' selected':''}>${esc(v)}</option>`).join('')}
    </select>
    <button class="primary no-print" style="background:linear-gradient(135deg,#E65100,#BF360C);border:none;white-space:nowrap" onclick="openNewVendorOrderModal()">+ New vendor order</button>
  </div>`;

  const filtered = orders.filter(vendorOrderMatchesFilter);

  if(!orders.length){
    container.innerHTML = toolbar + '<div class="empty-state"><div>No vendor orders yet.<br><small>Click "+ New vendor order" to create one.</small></div></div>';
    return;
  }
  if(!filtered.length){
    container.innerHTML = toolbar + '<div class="empty-state"><div>No vendor orders match your filters.</div></div>';
    return;
  }

  // Group by vendor
  const vendorMap = {};
  filtered.forEach(vo => {
    const key = vo.vendor || '(unknown)';
    if(!vendorMap[key]) vendorMap[key] = [];
    vendorMap[key].push(vo);
  });
  const vendors = Object.keys(vendorMap).sort();

  const sections = vendors.map(vendor => {
    const vOrders = vendorMap[vendor];
    const isOpen = _openVendorSections.has(vendor);
    const lateCount = vOrders.filter(vo=>vendorOrderAlert(vo)==='late').length;
    return `<div class="client-section" id="vcs-${esc(vendor.replace(/\s+/g,'_'))}">
      <div class="client-header" style="background:linear-gradient(135deg,#E65100,#BF360C)" onclick="toggleVendorClient('${esc(vendor)}')">
        <div><h2>🏭 ${esc(vendor)}</h2><div class="client-meta">${vOrders.length} order${vOrders.length!==1?'s':''} · ${lateCount} overdue</div></div>
        <span class="chevron${isOpen?' open':''}">▶</span>
      </div>
      <div class="client-body${isOpen?'':' closed'}">
        ${vOrders.map(vo=>buildVendorOrderCard(vo, orders.indexOf(vo))).join('')}
      </div>
    </div>`;
  }).join('');

  container.innerHTML = toolbar + sections;
}

function buildVendorOrderCard(vo, voi){
  const al = vendorOrderAlert(vo);
  const qty = vendorTotalQty(vo);
  const openArr = S.openVendorOrders || [];
  const isOpen = openArr.indexOf(vo.id) >= 0;
  const at = (S.vendorActiveTabs || {})[vo.id] || 'details';

  // Progress bar based on status
  const statusPct = {pending:0,processing:25,in_progress:50,qa:75,dispatched:90,delivered:100}[vo.status] || 0;

  return `<div class="order-card al-${al}" id="voc-${vo.id}">
    <div class="order-header" onclick="toggleVendorOrder('${vo.id}')">
      <div class="oh-icon ${ohIconCls(al)}">${ohIconChar(al)}</div>
      <div class="oh-left">
        <div class="oh-title">${esc(vo.orderId)} · ${esc(vo.vendor)}</div>
        <div class="oh-sub">${qty} pcs · ${(vo.designs||[]).length} design${(vo.designs||[]).length!==1?'s':''} · ${esc(vo.status||'pending')} · Start ${fmtDate(vo.startDate)}${vo.deliveryDate?' · Due '+fmtDate(vo.deliveryDate):''}</div>

      <select onchange="upVendorOrder(${voi},'status',this.value)">
