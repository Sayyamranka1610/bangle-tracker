// ── EDIT ACCESS REQUEST / GRANT SYSTEM ────────────────────────────────────────
// Device 2 (read-only) requests access → Device 1 gets a notification banner →
// Device 1 clicks "Grant" → lock is deleted → Device 2 acquires within 2 s.

// Device 2: write an access request to Firebase and switch to fast-poll mode.
async function requestEditAccess(){
  if(_hasLock) return;
  if(_waitingForGrant) return;  // already waiting — don't double-submit
  _waitingForGrant = true;
  _setBannerWaiting();

  // Write the request to /accessRequest.json so Device 1 can see it
  try{
    const lockR = await fetch(FB_LOCK);
    const lock  = lockR.ok ? await lockR.json() : null;
    await fetch(FB_ACCESS_REQUEST,{
      method:'PUT', headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        fromDevice  : FB_DEVICE_ID,
        fromUser    : _currentUser?.username||'?',
        toDevice    : lock?.deviceId||'',
        requestedAt : new Date().toISOString(),
        status      : 'pending'
      })
    });
  }catch(e){}

  // Switch lock-polling to 2-second fast mode so we acquire the moment it's released
  _startLockPolling(true);
  showToast('📨 Access request sent — waiting for approval','amber');
}

// Device 2: cancel a pending request
async function cancelAccessRequest(){
  _waitingForGrant = false;
  if(_lockPollTimer){clearInterval(_lockPollTimer);_lockPollTimer=null;}
  try{ await fetch(FB_ACCESS_REQUEST,{method:'DELETE'}); }catch(e){}
  _setReadOnlyUI(true, _lockHolder);   // restore normal readonly banner
  _startLockPolling(false);            // drop back to normal 10-s poll
  showToast('Request cancelled','amber');
}

// Device 1: verify every 5 s that the lock still belongs to us (detects forced takeover)
function _startLockOwnershipCheck(){
  if(_lockOwnerCheckTimer) clearInterval(_lockOwnerCheckTimer);
  _lockOwnerCheckTimer = setInterval(async()=>{
    if(!_hasLock){ clearInterval(_lockOwnerCheckTimer); _lockOwnerCheckTimer=null; return; }
    try{
      const r = await fetch(FB_LOCK);
      const lock = r.ok ? await r.json() : null;
      // Lock was deleted or overwritten by another device
      if(!lock || lock.deviceId !== FB_DEVICE_ID){
        _hasLock=false;
        clearInterval(_lockOwnerCheckTimer); _lockOwnerCheckTimer=null;
        if(_lockHbTimer){ clearInterval(_lockHbTimer); _lockHbTimer=null; }
        if(_reqWatchTimer){ clearInterval(_reqWatchTimer); _reqWatchTimer=null; }
        _grantBannerUp=false;
        const b=document.getElementById('grant-request-banner');
        if(b) b.remove();
        const takenBy = lock?.user || 'another user';
        _lockHolder = takenBy;
        _setReadOnlyUI(true, takenBy);
        showToast('🔒 Edit access was taken by '+takenBy+' — you are now read-only','amber');
        _startLockPolling(false);
      }
    }catch(e){}
  }, 5000);
}

// Device 1: poll /accessRequest.json every 3 s while holding the lock
function _startRequestWatcher(){
  if(_reqWatchTimer) clearInterval(_reqWatchTimer);
  _reqWatchTimer = setInterval(async()=>{
    if(!_hasLock){ clearInterval(_reqWatchTimer); _reqWatchTimer=null; return; }
    try{
      const r   = await fetch(FB_ACCESS_REQUEST);
      const req = r.ok ? await r.json() : null;
      if(req && req.status==='pending' && req.toDevice===FB_DEVICE_ID){
        if(!_grantBannerUp){ _grantBannerUp=true; _showGrantPrompt(req); }
      } else {
        // Request gone (cancelled, granted, or never existed)
        if(_grantBannerUp){
          _grantBannerUp=false;
          const b=document.getElementById('grant-request-banner');
          if(b) b.remove();
        }
      }
    }catch(e){}
  }, 3000);
}

// Device 1: show a persistent top-of-page notification to approve/deny
function _showGrantPrompt(req){
  let b=document.getElementById('grant-request-banner');
  if(!b){
    b=document.createElement('div');
    b.id='grant-request-banner';
    b.style.cssText='position:fixed;top:0;left:0;right:0;z-index:2000;background:linear-gradient(135deg,#534AB7,#3C3489);color:#fff;text-align:center;padding:12px 20px;font-size:13px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;box-shadow:0 4px 20px rgba(83,74,183,.45)';
    document.body.prepend(b);
  }
  b.innerHTML=`🔔 <strong>${esc(req.fromUser)}</strong> is requesting edit access — do you want to hand over control?
    <button onclick="grantEditAccess()" style="padding:6px 18px;background:#E1F5EE;color:#0F6E56;border:none;border-radius:8px;cursor:pointer;font-weight:700;font-size:13px;white-space:nowrap">✅ Grant access</button>
    <button onclick="denyEditAccess()" style="padding:6px 14px;background:rgba(255,255,255,.15);border:1.5px solid rgba(255,255,255,.4);color:#fff;border-radius:8px;cursor:pointer;font-size:12px;white-space:nowrap">✕ Deny</button>`;
}

// Device 1: grant access — release the lock so Device 2 can acquire it
async function grantEditAccess(){
  // Stop heartbeat and request watcher immediately
  if(_lockHbTimer){ clearInterval(_lockHbTimer); _lockHbTimer=null; }
  if(_reqWatchTimer){ clearInterval(_reqWatchTimer); _reqWatchTimer=null; }
  _grantBannerUp=false;
  const b=document.getElementById('grant-request-banner');
  if(b) b.remove();

  // Delete the lock so Device 2 can acquire it within 2 s
  try{ await fetch(FB_LOCK,{method:'DELETE'}); }catch(e){}
  // Clean up the access request record
  try{ await fetch(FB_ACCESS_REQUEST,{method:'DELETE'}); }catch(e){}

  _hasLock=false;
  _setReadOnlyUI(true,'the user you handed over to');
  fbSetStatus('connected','🔓 Handed over — now read-only');
  showToast('🔓 Edit access handed over — you are now read-only','amber');
  _startLockPolling(false);  // watch for when we can get it back
}

// Device 1: deny the request — delete the access request record and keep lock
async function denyEditAccess(){
  _grantBannerUp=false;
  const b=document.getElementById('grant-request-banner');
  if(b) b.remove();
  try{ await fetch(FB_ACCESS_REQUEST,{method:'DELETE'}); }catch(e){}
  showToast('Access request denied','amber');
}

// Owner only: forcibly acquire the lock (overwrite whoever has it)
async function takeEditAccess(){
  if(_hasLock) return;
  try{
    // Overwrite the existing lock with ours
    await fetch(FB_LOCK,{
      method:'PUT', headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        user:_currentUser?.username||'?', deviceId:FB_DEVICE_ID,
        lockedAt:new Date().toISOString(), heartbeat:new Date().toISOString()
      })
    });
  }catch(e){}
  try{ await fetch(FB_ACCESS_REQUEST,{method:'DELETE'}); }catch(e){}
  const wasReadOnly=_readOnly;
  _hasLock=true; _readOnly=false; _lockHolder=_currentUser?.username||'?';
  _waitingForGrant=false;
  if(_grantPollTimer){clearInterval(_grantPollTimer);_grantPollTimer=null;}
  if(_lockPollTimer){clearInterval(_lockPollTimer);_lockPollTimer=null;}
  if(_lockOwnerCheckTimer){clearInterval(_lockOwnerCheckTimer);_lockOwnerCheckTimer=null;}
  _setReadOnlyUI(false);
  _startHeartbeat();
  _startLockOwnershipCheck();
  showToast('✅ Edit access taken — you are now the editor','green');
}

// ── INIT: LOAD THEN LISTEN ────────────────────────────────────────────────────
async function fbInit(){
  fbSetStatus('syncing', 'Connecting…');
  try{
    const resp = await fetch(FB_DATA);
    if(!resp.ok) throw new Error('HTTP ' + resp.status);
    const envelope = await resp.json();

    // Unwrap envelope: {data: "JSON string", savedAt, device}
    const parsed = (envelope && envelope.data) ? JSON.parse(envelope.data) : null;

    if(parsed && parsed.orders){
      // ── FIREBASE IS THE SOURCE OF TRUTH — but merge any local-only orders ──
      // The old "fresher wins" timestamp guard caused data loss: if Device B had
      // a more-recently-updated localStorage than Firebase it would push its
      // stale local state, overwriting orders created on Device A. Removed.
      //
      // New strategy: always take Firebase as the base, then rescue any orders
      // present in localStorage but absent from Firebase (unless deleted).
      // This ensures no order is ever silently lost due to a sync race.
      const{merged,added,count}=_mergeLocalIntoRemote(parsed);

      histPush();
      const keepDStages = S.openDesignStages;
      Object.assign(S, merged);
      S.filters     = {client:'',dname:'',dcode:'',status:''};  // always reset — never inherit stale filter from Firebase
      S.openOrders  = new Set(merged.openOrders  || []);
      S.openClients = new Set(merged.openClients || []);
      S.openDesignStages = keepDStages || new Set(merged.openDesignStages || []);
      renumberOrders();
      _origSave();
      localStorage.setItem('bangle_saved_at', envelope.savedAt || new Date().toISOString());
      await migrateImagesToThumbs();
      try{ render(); }catch(renderErr){ console.error('render() error in fbInit:', renderErr); }
      _fb.ready = true;
      fbStartListener();
      if(added){
        // Rescued orders were missing from Firebase — push merged state now
        fbSetStatus('connected',`Live · restored ${count} order(s) missing from cloud`);
        showToast(`✅ ${count} order(s) found in local backup & restored to cloud`,'green');
        await fbPush(false);
      } else {
        fbSetStatus('connected', 'Live · loaded latest data');
      }
    } else {
      // Remote is empty — push local up as initial state
      await fbPush(true);
      fbSetStatus('connected', 'Live · uploaded local data');
      _fb.ready = true;
      fbStartListener();
    }
  } catch(e){
    const isNetwork = e instanceof TypeError && e.message.includes('fetch');
    fbSetStatus('error', isNetwork ? 'Network error — check internet connection' : 'Startup error — ' + e.message);
    showToast('⚠ ' + (isNetwork ? 'Could not connect to database' : 'Error: ' + e.message), 'red');
    setTimeout(fbInit, 8000);
  }
}

// ── IMAGE MIGRATION: recompress old large images to syncable thumbs ──────────
// Older versions stored full-size images that couldn't sync via Firebase.
// This walks through state and recompresses any leftover large images so they
// pass the Firebase threshold and reach all devices on next push.
async function migrateImagesToThumbs(){
  let migrated = 0;
  const compressArr = async (arr)=>{
    if(!arr) return;
    for(const img of arr){
      if(img && img.data && typeof img.data === 'string'
         && img.data.startsWith('data:') && img.data.length > IMAGE_FB_THRESHOLD){
        try{
          img.data = await compressImageToThumb(img.data);
          migrated++;
        }catch(e){ /* keep original if compression fails */ }
      }
    }
  };
  for(const o of (S.orders||[])){
    for(const d of (o.designs||[])){
      await compressArr(d.images);
      for(const v of (d.varieties||[])) await compressArr(v.images);
    }
  }
  for(const vo of (S.vendorOrders||[])){
    for(const d of (vo.designs||[])){
      for(const v of (d.varieties||[])) await compressArr(v.images);
    }
  }
  for(const si of (S.stockItems||[])) await compressArr(si.images);
  if(migrated > 0){
    console.log('Migrated', migrated, 'large images to thumbs for cross-device sync');
    showToast('🖼️ Optimised ' + migrated + ' image' + (migrated>1?'s':'') + ' for sync', 'green');
    save(); // triggers fbSchedulePush via hook
  }
}

// ── REAL-TIME LISTENER (Server-Sent Events) ───────────────────────────────────
function fbStartListener(){
  if(_fb.es){ try{ _fb.es.close(); }catch(e){} }
  _fb.es = new EventSource(FB_DATA);

  _fb.es.addEventListener('put', (ev)=>{
    try{
      const msg      = JSON.parse(ev.data);
      const envelope = msg.data;                          // {data, savedAt, device}
      if(!envelope || !envelope.data) return;
      if(envelope.device === FB_DEVICE_ID) return;        // own update — ignore (skip self-echo)
      const parsed   = JSON.parse(envelope.data);
      if(!parsed || !parsed.orders) return;
      // ── PROTECT UNPUSHED LOCAL CHANGES ─────────────────────────────────────
      // If we have local edits that haven't reached Firebase yet, this remote
      // snapshot is OLDER than our state — applying it would wipe the user's
      // edit (the "5mm siver → silver reverts" bug). Skip it; our own queued
      // push will become the source of truth shortly.
      if(_fb.pendingLocal){
        fbSetStatus('connected', 'Your changes take priority — syncing…');
        return;
      }
      // ── DEFER IF THE USER IS EDITING ───────────────────────────────────────
      // Belt-and-braces: even with no pending push flagged, never overwrite an
      // in-progress edit. Queue and apply once the user pauses.
      if(_userIsEditing()){
        _pendingRemote = { parsed, savedAt: envelope.savedAt };
        fbSetStatus('connected', 'Update queued (you\'re editing)…');
        setTimeout(_flushPendingRemote, 1500);
        return;
      }
      _applyRemoteState(parsed, envelope.savedAt);
    } catch(e){ /* ignore malformed events */ }
  });

  _fb.es.onerror = ()=>{
    fbSetStatus('error', 'Connection lost — reconnecting…');
    try{ _fb.es.close(); }catch(e){}
    _fb.es = null;
    setTimeout(fbStartListener, 5000);
  };
}

};

async function installApp(){
  // If running as standalone (PWA window), show "Already installed!"
  if(_isStandalone){
    showAlreadyInstalled();
    return;
  }
  // Fast path: prompt is already ready — fire it immediately
  if(_deferredInstallPrompt){
    await _firePrompt();
    return;
  }

  // Slow path: do the cleanup that the user would otherwise have to do manually.
  // 1. Force-refresh manifests so Chrome picks up the latest scopes
  // 2. Update all service workers (workboard's stale SW with broad scope gets a chance to load the new narrower manifest)
  // 3. Wait up to 10 seconds for beforeinstallprompt to fire
  // 4. If it does, fire it. Otherwise reload the page once and try again.
  const overlay = _showInstallProgress('Preparing install…');
  try{
    overlay.set('Refreshing app config…');
    await Promise.allSettled([
      fetch('manifest.json?ts='+Date.now(),{cache:'reload'}),
      fetch('workboard-manifest.json?ts='+Date.now(),{cache:'reload'}),
      fetch('bangle-sw.js?ts='+Date.now(),{cache:'reload'}),
    ]);

    overlay.set('Updating service workers…');
    if('serviceWorker' in navigator){
      try{
        const regs = await navigator.serviceWorker.getRegistrations();
        await Promise.allSettled(regs.map(r => r.update().catch(()=>{})));
      }catch(e){/* ignore */}
    }

    overlay.set('Waiting for browser to offer install…');
    const ready = await _waitForPrompt(10000);
    if(ready){
      overlay.close();
      await _firePrompt();
      return;
    }

    // Chrome still hasn't offered. Most often: workboard's old broad scope is
    // cached and Chrome thinks bangle is already installed under it. Forcing
    // a page reload usually lets Chrome re-evaluate from the latest manifests.
    // We mark a sessionStorage flag so we don't loop forever.
    if(!sessionStorage.getItem('bt_install_retried')){
      sessionStorage.setItem('bt_install_retried','1');
      overlay.set('Reloading to retry install…');
      await new Promise(r=>setTimeout(r,800));
      location.reload();
      return;
    }
    // Already retried — final fallback: open workboard URL in a new background
    // tab to force Chrome to refresh workboard's manifest, then reload us.
    overlay.set('Refreshing related app…');
    try{
      const w = window.open('workboard.html?refresh=1','_blank');
      setTimeout(()=>{ try{ w && w.close(); }catch(e){} }, 1500);
    }catch(e){}
    await new Promise(r=>setTimeout(r,2000));
    sessionStorage.removeItem('bt_install_retried'); // allow another full cycle
    overlay.set('Reloading…');
    location.reload();
  }catch(e){
    overlay.close();
    showToast('Install couldn\'t complete — please try again in a moment.','red');
  }
}

// Auto-fire prompt on load if we were in the middle of an install attempt
window.addEventListener('beforeinstallprompt',()=>{
  if(sessionStorage.getItem('bt_install_retried')==='1' && !_isStandalone){
    sessionStorage.removeItem('bt_install_retried');
    // Give the page a moment to settle, then fire
    setTimeout(()=>{ if(_deferredInstallPrompt) _firePrompt(); }, 800);
  }
});

async function _firePrompt(){
  if(!_deferredInstallPrompt) return false;
  try{
    _deferredInstallPrompt.prompt();
    const { outcome } = await _deferredInstallPrompt.userChoice;
    _deferredInstallPrompt = null;
    if(outcome === 'accepted'){
      const b = document.getElementById('btn-install-app-desktop');
      if(b) b.style.display='none';
      showToast('🎉 Installed!','green');
    }
    return true;
  }catch(e){
    return false;
  }
}

function _waitForPrompt(maxMs){
  return new Promise(resolve => {
    if(_deferredInstallPrompt){ resolve(true); return; }
    const start = Date.now();
    const tick = setInterval(()=>{
      if(_deferredInstallPrompt){ clearInterval(tick); resolve(true); }
      else if(Date.now()-start > maxMs){ clearInterval(tick); resolve(false); }
    }, 150);
  });
}

// ── LOGIN USERNAME DROPDOWN ───────────────────────────────────────────────────
// Fetches user list from Firebase and populates the select on the login screen.
// Falls back to the hardcoded owner username if Firebase is unreachable.
(async function initLoginDropdown(){
  const sel = document.getElementById('login-user');
  if(!sel) return;
  const populate = (names) => {
    sel.innerHTML = '<option value="" disabled selected>Select your username</option>'
      + names.map(n=>`<option value="${n.replace(/"/g,'&quot;')}">${n}</option>`).join('');
  };
  try{
    const r = await fetch(FB_USERS);
    if(r.ok){
      const users = await r.json();
      if(Array.isArray(users) && users.length){
        populate(users.map(u=>u.username));
        return;
      }
    }
  }catch(e){}
  // Fallback: hardcoded owner only
  populate([_AUTH.u]);
})();

// ── EMOJI FALLBACK FOR OLD DEVICES ───────────────────────────────────────────
// Some older Windows machines / outdated browsers show color emoji as empty
// rectangles.  This script detects that situation via canvas and, ONLY on
// affected devices, replaces known emoji used as button labels with short
// English text equivalents so every function remains identifiable.
(function installEmojiFallback(){
  // Canvas test: draw a color emoji and check if any colored pixels appear.
  // On systems that can't render emoji, all pixels stay transparent → detected.
  function hasColorEmoji(){
    try{
      const c=document.createElement('canvas');
      c.width=c.height=20;
      const ctx=c.getContext('2d');
      ctx.font='16px serif';
      ctx.fillText('🎨',0,16);
      const d=ctx.getImageData(0,0,20,20).data;
      const colors=new Set();
      for(let i=0;i<d.length;i+=4){
        if(d[i+3]>64) colors.add(d[i]+','+d[i+1]+','+d[i+2]);
      }
      return colors.size>3; // colored emoji produces many distinct pixel colors
    }catch(e){ return true; } // assume fine on canvas error
  }
  if(hasColorEmoji()) return; // modern device — nothing to do

  // Old device detected: replace known emoji with short text labels.
  // Map covers every emoji used in button text / labels across this app.
  const map={
    '🎨':'Design','🧲':'CNC','🌀':'CNC','🛟':'DyeGold',
    '⏻':'Sign out','🔑':'Pw','🔒':'Locked','🔓':'Unlock',
    '📨':'Request','✅':'Done','❌':'Error','⚠️':'Warning',
    '📊':'Stats','🏭':'Vendor','🔔':'Alert','📋':'Details',
    '📦':'Stock','👤':'User','⚙️':'Settings','💾':'Save',
    '🖨️':'Print','📥':'Export','📤':'Upload','🔄':'Refresh',
    '🏠':'Home','➕':'+','✕':'X','✓':'OK','×':'X',
    '▶':'›','◀':'‹','▲':'↑','▼':'↓',
  };

  function replaceInNode(node){
    if(node.nodeType===3){
      let t=node.textContent,changed=false;
      for(const[em,tx] of Object.entries(map)){
        if(t.includes(em)){
          t=t.split(em).join(tx);
          changed=true;
        }
      }
      if(changed) node.textContent=t;
    } else if(node.nodeType===1
              && !['SCRIPT','STYLE','INPUT','TEXTAREA','SELECT'].includes(node.tagName)){
      for(const child of [...node.childNodes]) replaceInNode(child);
    }
  }

  // Run once on current DOM, then watch for dynamic content
  function runOnBody(){ replaceInNode(document.body); }
  if(document.readyState==='loading')
    document.addEventListener('DOMContentLoaded', runOnBody);
  else runOnBody();

  // Cover dynamically rendered HTML (modal dialogs, rendered order cards, etc.)
  new MutationObserver(muts=>{
    muts.forEach(m=>m.addedNodes.forEach(n=>replaceInNode(n)));
  }).observe(document.body||document.documentElement,{childList:true,subtree:true});
})();
