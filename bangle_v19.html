<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bangle Production Tracker v19 — Drive Sync</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--indigo:#534AB7;--indigo-light:#EEEDFE;--indigo-mid:#AFA9EC;--indigo-dark:#3C3489;--teal:#0F6E56;--teal-light:#E1F5EE;--teal-mid:#5DCAA5;--amber:#BA7517;--amber-light:#FAEEDA;--amber-mid:#EF9F27;--red:#A32D2D;--red-light:#FCEBEB;--red-mid:#F09595;--green:#3B6D11;--green-light:#EAF3DE;--green-mid:#97C459;--blue:#185FA5;--blue-light:#E6F1FB;--blue-mid:#85B7EB;--bg:#f4f3ef;--card:#fff;--border:#D3D1C7}
body{font-family:system-ui,-apple-system,sans-serif;font-size:13px;background:var(--bg);color:#1a1916}
input,select,textarea{font-family:inherit;font-size:12px;background:#fff;color:#1a1916;border:1px solid #C0BFBA;border-radius:7px;padding:6px 9px;outline:none;transition:border-color .15s;width:100%}
input:focus,select:focus,textarea:focus{border-color:#7F77DD;box-shadow:0 0 0 2px #EEEDFE}
input.err,select.err{border-color:#E24B4A!important;box-shadow:0 0 0 2px #FCEBEB!important}
.err-msg{font-size:10px;color:#A32D2D;margin-top:2px;font-weight:500}
button{font-family:inherit;font-size:12px;cursor:pointer;border-radius:8px;border:1px solid #C0BFBA;background:transparent;color:#1a1916;padding:6px 13px;transition:all .15s;white-space:nowrap}
button:hover{background:#f1efe8}
button.primary{background:#534AB7;color:#fff;border-color:#534AB7;font-weight:500}
button.primary:hover{background:#3C3489}
button.danger{color:#A32D2D;border-color:#F09595;background:#FCEBEB}
button.danger:hover{background:#F7C1C1}
button.sm{padding:4px 10px;font-size:11px}
button.icon-btn{padding:4px 9px;font-size:11px;border-radius:6px}
.badge{font-size:11px;font-weight:500;padding:3px 10px;border-radius:99px;white-space:nowrap}
.b-ok{background:#E1F5EE;color:#085041}.b-warn{background:#FAEEDA;color:#633806}.b-late{background:#FCEBEB;color:#791F1F}.b-done{background:#F1EFE8;color:#444441}
.b-normal{background:#E6F1FB;color:#0C447C}.b-urgent{background:#FAEEDA;color:#633806}.b-critical{background:#FCEBEB;color:#791F1F}
.dash{padding:1rem;max-width:1400px;margin:0 auto}
.header-band{background:linear-gradient(135deg,#534AB7 0%,#3C3489 100%);border-radius:14px;padding:16px 20px;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;box-shadow:0 4px 16px rgba(83,74,183,.25)}
.header-band h1{font-size:17px;font-weight:600;color:#fff;letter-spacing:.01em}
.header-band p{font-size:11px;color:#AFA9EC;margin-top:2px}
.header-actions{display:flex;gap:8px;flex-wrap:wrap}
.header-actions button{background:rgba(255,255,255,.15);color:#fff;border-color:rgba(255,255,255,.3);font-size:12px}
.header-actions button:hover{background:rgba(255,255,255,.25)}
.header-actions button.primary{background:#fff;color:#534AB7;border-color:#fff}
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:12px}
.stat-card{border-radius:12px;padding:12px 14px;border:1.5px solid transparent;cursor:pointer;transition:transform .1s,box-shadow .1s}
.stat-card:hover{transform:translateY(-2px);box-shadow:0 4px 12px rgba(0,0,0,.08)}
.stat-total{background:#EEEDFE;border-color:#AFA9EC}.stat-ontrack{background:#E1F5EE;border-color:#9FE1CB}
.stat-soon{background:#FAEEDA;border-color:#FAC775}.stat-late{background:#FCEBEB;border-color:#F09595}.stat-done{background:#F1EFE8;border-color:#D3D1C7}
.stat-val{font-size:22px;font-weight:700}
.stat-total .stat-val{color:#534AB7}.stat-ontrack .stat-val{color:#0F6E56}.stat-soon .stat-val{color:#854F0B}.stat-late .stat-val{color:#A32D2D}.stat-done .stat-val{color:#5F5E5A}
.stat-lbl{font-size:11px;margin-top:2px;font-weight:500}
.stat-total .stat-lbl{color:#534AB7}.stat-ontrack .stat-lbl{color:#0F6E56}.stat-soon .stat-lbl{color:#854F0B}.stat-late .stat-lbl{color:#A32D2D}.stat-done .stat-lbl{color:#5F5E5A}
.filter-bar{background:#fff;border-radius:12px;padding:10px 16px;margin-bottom:12px;border:1.5px solid var(--border);display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
.filter-bar label{font-size:11px;color:#777;font-weight:500;display:block;margin-bottom:3px}
.filter-bar select,.filter-bar input{max-width:155px;font-size:11px;padding:5px 8px}
.filter-clear{font-size:11px;color:#534AB7;cursor:pointer;text-decoration:underline;background:none;border:none;padding:0;align-self:flex-end;margin-bottom:2px}
.main-tabs{display:flex;gap:4px;margin-bottom:12px;flex-wrap:wrap}
.main-tab{padding:8px 18px;font-size:12px;font-weight:500;border-radius:10px;cursor:pointer;border:1.5px solid transparent;color:#777;transition:all .15s}
.main-tab:hover{background:#EEEDFE;color:#534AB7}
.main-tab.active{background:#534AB7;color:#fff;border-color:#534AB7}
.client-section{margin-bottom:14px;border-radius:14px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.client-header{background:linear-gradient(135deg,#534AB7,#3C3489);color:#fff;padding:11px 16px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;user-select:none}
.client-header h2{font-size:13px;font-weight:600}
.client-meta{font-size:11px;color:#AFA9EC;margin-top:2px}
.client-body{background:#fff;border:1.5px solid #AFA9EC;border-top:none;border-radius:0 0 14px 14px;padding:12px}
.client-body.closed{display:none}
.order-card{border-radius:12px;margin-bottom:8px;overflow:hidden;border:1.5px solid var(--border);background:#fff;transition:box-shadow .15s}
.order-card:hover{box-shadow:0 3px 10px rgba(0,0,0,.07)}
.order-card.al-late{border-color:#F09595}.order-card.al-warn{border-color:#FAC775}.order-card.al-done{border-color:#C0DD97}.order-card.al-ok{border-color:#9FE1CB}
.order-header{display:flex;align-items:center;gap:10px;padding:10px 14px;cursor:pointer;user-select:none;transition:background .12s}
.al-late .order-header{background:#FFF5F5}.al-warn .order-header{background:#FFFBF0}.al-done .order-header{background:#F7FAF2}.al-ok .order-header{background:#F2FBF7}
.order-header:hover{filter:brightness(.97)}
.oh-icon{width:32px;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;font-weight:700;color:#fff}
.oh-icon-late{background:#E24B4A}.oh-icon-warn{background:#EF9F27}.oh-icon-ok{background:#1D9E75}.oh-icon-done{background:#888780}
.oh-left{flex:1;min-width:0}
.oh-title{font-size:13px;font-weight:600}
.oh-sub{font-size:11px;color:#888;margin-top:2px}
.oh-right{display:flex;align-items:center;gap:6px;flex-shrink:0;flex-wrap:wrap}
.pbar-wrap{height:4px;background:#E8E7E0}
.pbar-fill{height:100%;transition:width .4s}
.al-ok .pbar-fill{background:#1D9E75}.al-warn .pbar-fill{background:#EF9F27}.al-late .pbar-fill{background:#E24B4A}.al-done .pbar-fill{background:#888780}
.order-body{display:none;padding:14px}
.order-body.open{display:block}
/* Tabs */
.tabs{display:flex;gap:0;border-bottom:1.5px solid #E8E7E0;margin-bottom:12px;flex-wrap:wrap}
.tab{font-size:12px;padding:7px 16px;cursor:pointer;color:#888;border-bottom:2px solid transparent;margin-bottom:-1.5px;border-radius:6px 6px 0 0;transition:all .12s}
.tab:hover{background:#F1EFE8;color:#1a1916}
.tab.active{color:#534AB7;border-bottom-color:#534AB7;font-weight:500;background:#EEEDFE}
.tab-panel{display:none}.tab-panel.active{display:block}
/* Fields */
.field-row{display:flex;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.field-group{flex:1;min-width:110px}
.field-group label{display:block;font-size:11px;color:#777;margin-bottom:3px;font-weight:500}
.section-head{font-size:12px;font-weight:600;color:#534AB7;margin:12px 0 8px;display:flex;align-items:center;justify-content:space-between;padding-bottom:5px;border-bottom:1px dashed #AFA9EC}
.notes-area{width:100%;resize:vertical;min-height:52px;font-size:12px;border-radius:8px;margin-top:6px}
/* Design card */
.design-card{border-radius:12px;padding:14px;margin-bottom:12px;border:1.5px solid #AFA9EC;background:linear-gradient(135deg,#EEEDFE 0%,#f0effe 100%)}
.design-card-head{display:flex;align-items:flex-start;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.design-num{width:26px;height:26px;border-radius:50%;background:#534AB7;color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:2px}
/* Gallery */
.design-imgs-gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(108px,1fr));gap:10px;margin:10px 0}
.gallery-img-card{background:#fff;border-radius:10px;border:1.5px solid #AFA9EC;overflow:hidden;position:relative;transition:box-shadow .15s}
.gallery-img-card:hover{box-shadow:0 4px 12px rgba(83,74,183,.2)}
.gallery-img-card img{width:100%;height:108px;object-fit:cover;display:block;cursor:zoom-in}
.gallery-img-card .img-footer{padding:4px 8px;background:#fff;border-top:1px solid #E8E7E0;display:flex;align-items:center;justify-content:space-between}
.gallery-img-card .img-num{font-size:10px;font-weight:600;color:#534AB7}
.gallery-img-card .del-img{background:none;border:none;color:#A32D2D;cursor:pointer;font-size:11px;padding:0 2px;width:auto}
.gallery-add-card{background:#f7f6ff;border:2px dashed #AFA9EC;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;color:#534AB7;font-size:11px;font-weight:500;gap:4px;min-height:136px;transition:background .15s}
.gallery-add-card:hover{background:#EEEDFE;border-color:#534AB7}
.gallery-add-icon{font-size:22px}
.gallery-img-label{position:absolute;top:4px;left:4px;background:rgba(83,74,183,.8);color:#fff;font-size:9px;padding:2px 5px;border-radius:4px;font-weight:500}
/* Variety table */
.variety-table-wrap{overflow-x:auto;margin:10px 0;border-radius:10px;border:1.5px solid #AFA9EC}
.variety-table{width:100%;border-collapse:collapse;font-size:11px;min-width:500px}
.variety-table th{background:#534AB7;color:#fff;padding:7px 10px;text-align:center;font-weight:600;white-space:nowrap;border-right:1px solid rgba(255,255,255,.2)}
.variety-table th:first-child{text-align:left}
.variety-table th:last-child{border-right:none}
.variety-table td{padding:6px 8px;border-bottom:1px solid #E8E7E0;border-right:1px solid #E8E7E0;text-align:center;vertical-align:middle}
.variety-table td:first-child{text-align:left;background:#f7f6ff;font-weight:600;border-right:2px solid #AFA9EC}
.variety-table td.total-col{border-right:none;font-weight:700;color:#534AB7;background:#EEEDFE}
.variety-table tfoot td{border-bottom:none;font-weight:700;background:#f0efff;color:#3C3489;border-top:2px solid #534AB7}
.variety-table tfoot td.grand-total{background:#534AB7;color:#fff;font-size:12px}
.variety-table input.qty-inp{width:52px;text-align:center;padding:4px 3px;font-size:11px;border-color:#AFA9EC;border-radius:5px}
.variety-table th.sz-head{min-width:64px}
.variety-name-inp{font-size:11px;padding:4px 6px;border-color:#AFA9EC;min-width:100px}
.variety-thumb{width:36px;height:36px;object-fit:cover;border-radius:5px;border:1px solid #AFA9EC;cursor:zoom-in;vertical-align:middle}
.variety-img-cell{display:flex;align-items:center;gap:4px;flex-wrap:wrap;min-width:80px}
.variety-img-add{width:28px;height:28px;border-radius:5px;border:1.5px dashed #AFA9EC;background:#f7f6ff;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#534AB7;font-size:14px;flex-shrink:0;border:1.5px dashed #AFA9EC}
.variety-img-add:hover{background:#EEEDFE;border-color:#534AB7}
/* Stages */
.design-stages-section{background:#fff;border-radius:12px;padding:14px;margin-bottom:8px;border:1.5px solid #D3D1C7}
.design-stages-head{font-size:12px;font-weight:600;color:#534AB7;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between;padding-bottom:6px;border-bottom:1px dashed #AFA9EC}
.stage-list{margin-bottom:6px}
.stage-item{border-radius:10px;margin-bottom:8px;border:1px solid transparent;overflow:hidden}
.si-done{background:#F2FBF7;border-color:#9FE1CB}.si-active{background:#EEF6FE;border-color:#B5D4F4}
.si-warn{background:#FFFBF0;border-color:#FAC775}.si-late{background:#FFF5F5;border-color:#F7C1C1}
.si-delayed{background:#FFF5F5;border-color:#F7C1C1}.si-idle{background:#f7f6f2;border-color:#D3D1C7}
.stage-item-top{display:flex;align-items:center;gap:6px;padding:8px 10px;flex-wrap:wrap}
.stage-item-bottom{padding:8px 10px;border-top:1px solid rgba(0,0,0,.05);background:rgba(255,255,255,.6);display:flex;gap:10px;flex-wrap:wrap}
.stage-dot{width:20px;height:20px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;border:2px solid transparent}
.sd-done{background:#E1F5EE;border-color:#1D9E75;color:#085041}.sd-active{background:#E6F1FB;border-color:#378ADD;color:#0C447C}
.sd-warn{background:#FAEEDA;border-color:#EF9F27;color:#633806}.sd-late{background:#FCEBEB;border-color:#E24B4A;color:#791F1F}.sd-idle{background:#F1EFE8;border-color:#B4B2A9;color:#5F5E5A}
.stage-name-wrap{flex:1;min-width:120px}
.stage-name-txt{font-size:12px;font-weight:600}
.stage-loc{font-size:10px;color:#888}
.stage-status-sel{font-size:11px;padding:4px 6px;max-width:115px;flex-shrink:0;width:auto!important}
.stage-days-inp{width:40px!important;font-size:11px;padding:3px 4px;text-align:center;flex-shrink:0}
.stage-date-inp{font-size:10px!important;padding:3px 5px;max-width:110px;flex-shrink:0;width:auto!important}
.stage-vendor-inp{font-size:11px;padding:4px 6px;max-width:160px;flex-shrink:0;width:auto!important}
.stage-notes-area{font-size:11px;min-height:38px;resize:vertical;flex:1;min-width:160px;width:auto!important}
/* Stage flow pills */
.stage-flow{display:flex;align-items:center;gap:3px;flex-wrap:wrap;margin:6px 0}
.stage-pill{display:flex;align-items:center;gap:3px;padding:4px 9px;border-radius:20px;font-size:10px;font-weight:500;border:1.5px solid transparent;white-space:nowrap}
.sp-done{background:#E1F5EE;border-color:#1D9E75;color:#085041}.sp-active{background:#E6F1FB;border-color:#378ADD;color:#0C447C}
.sp-warn{background:#FAEEDA;border-color:#EF9F27;color:#633806}.sp-late{background:#FCEBEB;border-color:#E24B4A;color:#791F1F}.sp-idle{background:#F1EFE8;border-color:#B4B2A9;color:#5F5E5A}
.stage-arrow{color:#AFA9EC;font-size:11px}
/* Design view */
.design-stage-block{border-radius:12px;border:1.5px solid #D3D1C7;margin-bottom:12px;overflow:hidden;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.05)}
.design-stage-header{background:linear-gradient(135deg,#f5f4fe,#eeeffe);padding:10px 14px;font-size:12px;font-weight:600;color:#534AB7;border-bottom:1px solid #D3D1F5;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.design-stage-body{padding:12px 14px}
.design-sub-card{background:#f8f7fd;border-radius:8px;border:1px solid #D3D1F5;padding:10px 12px;margin-bottom:8px}
.design-sub-head{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.design-order-badge{font-size:10px;font-weight:600;padding:2px 8px;border-radius:99px;background:#EEEDFE;color:#534AB7;border:1px solid #AFA9EC}
.design-imgs-mini{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.design-imgs-mini img{width:58px;height:58px;border-radius:6px;object-fit:cover;border:1px solid #AFA9EC;cursor:zoom-in;transition:transform .15s}
.design-imgs-mini img:hover{transform:scale(1.06)}
/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(30,28,50,.4);z-index:1000;display:flex;align-items:flex-start;justify-content:center;padding:30px 16px;overflow-y:auto}
.modal{background:#fff;border:1.5px solid #AFA9EC;border-radius:16px;padding:1.4rem;width:680px;max-width:98%;max-height:90vh;overflow-y:auto;position:relative}
.modal-header{display:flex;align-items:center;gap:10px;margin-bottom:1rem;padding-bottom:10px;border-bottom:1.5px solid #D3D1C7}
.modal-icon{width:32px;height:32px;border-radius:9px;background:#EEEDFE;display:flex;align-items:center;justify-content:center;font-size:15px;color:#534AB7;flex-shrink:0}
.modal h3{font-size:15px;font-weight:600;flex:1}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:1rem;border-top:1.5px solid #E8E7E0;padding-top:12px}
.stmpl-item{display:flex;align-items:center;gap:5px;padding:7px 10px;border-radius:8px;margin-bottom:4px;background:#F7F6FF;border:1px solid #D3D1F5;flex-wrap:wrap}
.stmpl-item:hover{background:#EEEDFE}
.inline-edit{background:none;border:none;border-bottom:1px dashed #AFA9EC;border-radius:0;padding:2px 3px;font-size:12px;font-weight:500;color:#1a1916;min-width:40px;width:auto!important}
.inline-edit:focus{border-bottom-color:#534AB7;outline:none}
/* Autocomplete */
.ac-wrap{position:relative}
.ac-list{position:absolute;top:100%;left:0;right:0;background:#fff;border:1.5px solid #AFA9EC;border-radius:0 0 8px 8px;z-index:300;max-height:160px;overflow-y:auto;box-shadow:0 4px 12px rgba(0,0,0,.1)}
.ac-item{padding:7px 10px;cursor:pointer;font-size:12px;transition:background .1s}
.ac-item:hover,.ac-item.ac-sel{background:#EEEDFE;color:#534AB7}
/* Lightbox */
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:2000;display:flex;align-items:center;justify-content:center}
.lightbox-close{position:fixed;top:14px;right:18px;color:#fff;font-size:22px;cursor:pointer;background:rgba(0,0,0,.5);border-radius:50%;width:36px;height:36px;display:flex;align-items:center;justify-content:center;border:none;z-index:2001;width:auto!important}
.lightbox-nav{position:fixed;top:50%;transform:translateY(-50%);background:rgba(0,0,0,.5);color:#fff;border:none;border-radius:50%;width:40px;height:40px;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:2001;width:auto!important}
.lightbox-nav.lb-prev{left:12px}.lightbox-nav.lb-next{right:12px}
.lightbox-counter{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);color:#fff;font-size:12px;background:rgba(0,0,0,.55);padding:4px 12px;border-radius:20px}
.lightbox img{max-width:90vw;max-height:88vh;border-radius:10px;display:block}
/* Audit */
.audit-list{max-height:300px;overflow-y:auto;border:1px solid #E8E7E0;border-radius:8px;padding:6px}
.audit-item{padding:6px 8px;border-bottom:1px solid #f1efe8;font-size:11px;display:flex;gap:8px;align-items:baseline}
.audit-item:last-child{border-bottom:none}
.audit-time{color:#AFA9EC;white-space:nowrap;flex-shrink:0;font-size:10px}
.audit-what{color:#444;flex:1}
/* Analytics */
.analytics-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.chart-card{background:#fff;border-radius:14px;border:1.5px solid var(--border);padding:16px;box-shadow:0 2px 8px rgba(0,0,0,.04)}
.chart-card.full{grid-column:1/-1}
.chart-title{font-size:13px;font-weight:700;margin-bottom:4px;color:#1a1916}
.chart-sub{font-size:11px;color:#888;margin-bottom:14px}
.bar-chart{display:flex;flex-direction:column;gap:7px}
.bar-row{display:flex;align-items:center;gap:8px}
.bar-label{font-size:11px;color:#555;width:130px;flex-shrink:0;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-track{flex:1;height:20px;background:#f1efe8;border-radius:10px;overflow:hidden}
.bar-fill{height:100%;border-radius:10px;display:flex;align-items:center;justify-content:flex-end;padding-right:7px;min-width:24px;transition:width .8s}
.bar-val{font-size:10px;color:#fff;font-weight:700}
.metric-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.metric-box{background:#f7f6f2;border-radius:10px;padding:12px 14px;text-align:center;border:1.5px solid #E8E7E0}
.metric-val{font-size:22px;font-weight:700;color:#534AB7}
.metric-lbl{font-size:11px;color:#888;margin-top:2px}
.pie-svg{display:block;margin:0 auto 10px}
.pie-legend{display:flex;flex-direction:column;gap:5px}
.pie-leg-item{display:flex;align-items:center;gap:7px;font-size:11px;color:#444}
.pie-leg-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
/* Upload zone */

.inv-col-fin{background:#EAF4EC;color:#1B5E20;font-weight:600}
.inv-col-open{color:#555;font-size:10px}
.inv-col-close{font-weight:700}
.inv-flow-arrow{color:#AFA9EC;font-size:10px;padding:0 2px}
.inv-section-head{font-size:11px;font-weight:600;text-align:center;padding:6px;background:#f0efff;color:#534AB7;border-bottom:1px solid #AFA9EC}

.mv-badge{font-size:10px;font-weight:600;padding:3px 9px;border-radius:99px;white-space:nowrap;display:inline-block;margin-bottom:4px}

.mv-raw-out{background:#FFF3E0;color:#BF360C;border:1px solid #FFCC80}
.mv-semi-in{background:#E3F2FD;color:#0D47A1;border:1px solid #90CAF9}
.mv-semi-out{background:#EDE7F6;color:#4527A0;border:1px solid #CE93D8}
.mv-fin-in{background:#E8F5E9;color:#1B5E20;border:1px solid #A5D6A7}
.mv-fin-out{background:#FFEBEE;color:#B71C1C;border:1px solid #EF9A9A}
.mv-detail{font-size:11px;color:#555}
.mv-qty{font-size:12px;font-weight:700;text-align:right;white-space:nowrap}
.mv-qty.pos{color:#1D9E75}.mv-qty.neg{color:#E24B4A}
.inv-add-form{background:#f7f6ff;border-radius:10px;border:1.5px solid #AFA9EC;padding:14px;margin-bottom:14px}
.inv-bal-row{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;padding:8px 12px;background:#EEEDFE;border-radius:8px;margin-bottom:10px}
.inv-bal-item{display:flex;flex-direction:column;gap:2px;min-width:100px}
.inv-bal-item label{font-size:10px;color:#888;font-weight:500}

@media(max-width:700px){.inv-summary-grid{grid-template-columns:repeat(2,1fr)}}

.stage-group-raw{border-color:#FFD54F!important;}.stage-group-semi{border-color:#90CAF9!important;}.stage-group-finished{border-color:#A5D6A7!important;}

/* ── AUTOSAVE / UNDO BAR ── */
.save-bar{position:sticky;top:0;z-index:500;background:linear-gradient(90deg,#1a1750,#2d2680);border-bottom:1px solid rgba(255,255,255,.1);padding:6px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.save-bar-status{font-size:11px;color:#AFA9EC;flex:1;min-width:120px;display:flex;align-items:center;gap:6px}

.save-dot.saved{background:#5DCAA5;box-shadow:0 0 6px #5DCAA5}

@keyframes blink{from{opacity:.4}to{opacity:1}}
.save-bar button{font-size:11px;padding:4px 11px;border-radius:6px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.1);color:#fff;transition:all .15s}
.save-bar button:hover{background:rgba(255,255,255,.22)}
.save-bar button:disabled{opacity:.35;cursor:not-allowed}

.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1a1750;color:#fff;padding:9px 20px;border-radius:30px;font-size:12px;font-weight:500;box-shadow:0 4px 18px rgba(0,0,0,.3);z-index:9999;pointer-events:none;border:1px solid rgba(255,255,255,.15);transition:opacity .4s}

/* ══════════════════════════════════════════════════════════════════
   MOBILE RESPONSIVE — tablet (≤768px) and phone (≤480px)
   ══════════════════════════════════════════════════════════════════ */
@media (max-width:768px){
  /* Prevent iOS auto-zoom on input focus */
  input,select,textarea{font-size:16px!important}

  /* Tighter dashboard padding */
  .dash{padding:.5rem}

  /* ── Drive bar & Save bar: horizontal scroll instead of wrapping ── */
  .fb-bar,.save-bar{
    overflow-x:auto;
    flex-wrap:nowrap;
    -webkit-overflow-scrolling:touch;
    padding:6px 12px;
    scrollbar-width:none;
  }
  .fb-bar::-webkit-scrollbar,.save-bar::-webkit-scrollbar{display:none}
  #fb-status-txt{white-space:nowrap;font-size:10px}
  .save-bar-status{min-width:auto;white-space:nowrap}
  .save-bar-sep{flex-shrink:0}

  /* ── Header ── */
  .header-band{padding:12px 14px;border-radius:10px;gap:8px}
  .header-band h1{font-size:15px}
  .header-band p{font-size:10px}
  .header-actions{width:100%;overflow-x:auto;flex-wrap:nowrap;-webkit-overflow-scrolling:touch;gap:6px;scrollbar-width:none}
  .header-actions::-webkit-scrollbar{display:none}
  .header-actions button{flex-shrink:0;font-size:11px;padding:6px 10px;min-height:36px}

  /* ── Stats: 3 columns ── */
  .stats{grid-template-columns:repeat(3,1fr);gap:6px}
  .stat-card{padding:10px 10px}
  .stat-val{font-size:18px}
  .stat-lbl{font-size:10px}

  /* ── Main tabs: horizontal scroll ── */
  .main-tabs{overflow-x:auto;flex-wrap:nowrap;-webkit-overflow-scrolling:touch;gap:4px;padding-bottom:4px;scrollbar-width:none}
  .main-tabs::-webkit-scrollbar{display:none}
  .main-tab{white-space:nowrap;flex-shrink:0;padding:8px 14px;font-size:12px}

  /* ── Filter bar ── */
  .filter-bar{padding:8px 12px;gap:8px}
  .filter-bar select,.filter-bar input{max-width:100%}

  /* ── Order cards ── */
  .order-header{padding:10px 12px;gap:8px}
  .oh-title{font-size:12px}
  .oh-sub{font-size:10px}
  .oh-right{flex-wrap:wrap;gap:4px;max-width:100%}
  .oh-icon{width:28px;height:28px;font-size:12px;border-radius:7px}
  .order-body{padding:10px}
  .client-body{padding:8px}

  /* ── Tabs inside order detail: horizontal scroll ── */
  .tabs{overflow-x:auto;flex-wrap:nowrap;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tab{white-space:nowrap;flex-shrink:0;padding:7px 12px}

  /* ── Field rows: 2-column grid ── */
  .field-row{flex-wrap:wrap}
  .field-group{min-width:calc(50% - 5px)}

  /* ── Stage items ── */
  .stage-item-top{flex-wrap:wrap;gap:6px}
  .stage-status-sel{max-width:100%!important;width:100%!important}
  .stage-name-wrap{min-width:100px}

  /* ── Analytics: single column ── */
  .analytics-grid{grid-template-columns:1fr}
  .bar-label{width:90px;font-size:10px}

  /* ── Inventory summary: 2 columns ── */
  .inv-summary-grid{grid-template-columns:repeat(2,1fr);gap:8px}
  .inv-sum-val{font-size:16px}

  /* ── Metrics: 2 columns ── */
  .metric-grid{grid-template-columns:repeat(2,1fr);gap:8px}
  .metric-val{font-size:18px}

  /* ── Inventory table: scrollable ── */
  .inv-table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}

  /* ── Modal: bottom sheet ── */
  .modal-overlay{padding:0;align-items:flex-end}
  .modal{
    width:100%!important;
    max-width:100%!important;
    border-radius:18px 18px 0 0;
    max-height:92vh;
    padding:1.2rem 1rem;
  }
  .modal-actions{flex-wrap:wrap}
  .modal-actions button{flex:1;min-width:120px}

  /* ── Toast: full width at bottom ── */
  .toast{
    left:12px!important;
    right:12px!important;
    bottom:14px!important;
    transform:none!important;
    text-align:center;
  }

  /* ── Design gallery ── */
  .design-imgs-gallery{grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:8px}
  .gallery-img-card img{height:90px}

  /* ── Design card ── */
  .design-card{padding:10px}
  .design-stages-section{padding:10px}

  /* ── Variety table: add touch scroll indicator ── */
  .variety-table-wrap{-webkit-overflow-scrolling:touch}

  /* ── Inventory toolbar ── */
  .inv-toolbar{padding:8px 12px;gap:8px}
  .inv-period-tabs{overflow-x:auto;flex-wrap:nowrap;scrollbar-width:none}
  .inv-period-tab{white-space:nowrap;flex-shrink:0}
}

/* ── Small phones (≤480px) ── */
@media (max-width:480px){
  /* Stats: 2 columns */
  .stats{grid-template-columns:repeat(2,1fr)}
  .stat-val{font-size:16px}

  /* Tighter header */
  .header-band h1{font-size:13px}
  .header-actions button{font-size:10px;padding:5px 8px}

  /* Fields: full width */
  .field-group{min-width:100%}

  /* Stage bottom row: stack vertically */
  .stage-item-bottom{flex-direction:column;gap:6px}
  .stage-vendor-inp,.stage-date-inp,.stage-notes-area,.stage-days-inp{
    max-width:100%!important;width:100%!important
  }

  /* Modal padding */
  .modal{padding:1rem .75rem}

  /* Inventory: compact */
  .inv-sum-card{padding:10px 12px}
  .inv-sum-val{font-size:15px}

  /* Design gallery: smaller thumbnails */
  .design-imgs-gallery{grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:6px}
  .gallery-img-card img{height:76px}
  .gallery-add-card{min-height:106px}

  /* Badges smaller */
  .badge{font-size:10px;padding:2px 7px}
  .oh-right .badge{font-size:9px}
  .stat-lbl{font-size:9px}

  /* Analytics */
  .metric-val{font-size:16px}
  .inv-sum-val{font-size:15px}
  .bar-label{width:70px}
}

// ── UNDO / REDO HISTORY STACK ─────────────────────────────────────────────────
const HIST_MAX = 50;
let _hist = [];   // array of JSON snapshots (oldest first)
let _histIdx = -1; // pointer to current position
let _histLock = false; // prevent recording during undo/redo

function snapState(){
  return JSON.stringify({...S,openOrders:[...S.openOrders],openClients:[...S.openClients]});
}
function histPush(){
  if(_histLock) return;
  // Drop any redo entries ahead of current pointer
  if(_histIdx < _hist.length-1) _hist = _hist.slice(0,_histIdx+1);
  _hist.push(snapState());
  if(_hist.length > HIST_MAX) _hist.shift();
  _histIdx = _hist.length-1;
  updateUndoRedoBtns();
}
function histUndo(){
  if(_histIdx <= 0){ showToast('Nothing to undo','amber'); return; }
  _histIdx--;
  _histLock = true;
  loadSnap(_hist[_histIdx]);
  _histLock = false;
  updateUndoRedoBtns();
  setSaveStatus('saving');
  save();
  showToast('↩ Undone','amber');
}
function histRedo(){
  if(_histIdx >= _hist.length-1){ showToast('Nothing to redo','amber'); return; }
  _histIdx++;
  _histLock = true;
  loadSnap(_hist[_histIdx]);
  _histLock = false;
  updateUndoRedoBtns();
  setSaveStatus('saving');
  save();
  showToast('↪ Redone','amber');
}
function loadSnap(snap){
  const parsed = JSON.parse(snap);
  Object.assign(S, parsed);
  S.openOrders = new Set(parsed.openOrders||[]);
  S.openClients = new Set(parsed.openClients||[]);
  render();
}
function updateUndoRedoBtns(){
  const u=document.getElementById('btn-undo'), r=document.getElementById('btn-redo');
  if(u) u.disabled = _histIdx<=0;
  if(r) r.disabled = _histIdx>=_hist.length-1;
  if(u) u.title = `Undo (${_histIdx} step${_histIdx!==1?'s':''} available) Ctrl+Z`;
  if(r) r.title = `Redo (${_hist.length-1-_histIdx} step${_hist.length-1-_histIdx!==1?'s':''} available) Ctrl+Y`;
}

// ── INDEXEDDB FOR IMAGES (quota-safe image storage) ──────────────────────────
// localStorage is limited to ~5MB. Images stored as base64 can easily exceed this.
// We strip images out of the JSON saved to localStorage and store them separately in IndexedDB.
// This gives effectively unlimited image storage while keeping all order data in localStorage.

const IDB_NAME = 'bangle_images_v1';
const IDB_STORE = 'images';
let _idb = null;

function idbOpen(){
  return new Promise((resolve,reject)=>{
    if(_idb){resolve(_idb);return;}
    const req=indexedDB.open(IDB_NAME,1);
    req.onupgradeneeded=e=>{e.target.result.createObjectStore(IDB_STORE,{keyPath:'key'});};
    req.onsuccess=e=>{_idb=e.target.result;resolve(_idb);};
    req.onerror=e=>reject(e.target.error);
  });
}
async function idbPut(key,value){
  const db=await idbOpen();
  return new Promise((resolve,reject)=>{
    const tx=db.transaction(IDB_STORE,'readwrite');
    tx.objectStore(IDB_STORE).put({key,value});
    tx.oncomplete=()=>resolve();
    tx.onerror=e=>reject(e.target.error);
  });
}
async function idbGet(key){
  const db=await idbOpen();
  return new Promise((resolve,reject)=>{
    const tx=db.transaction(IDB_STORE,'readonly');
    const req=tx.objectStore(IDB_STORE).get(key);
    req.onsuccess=e=>resolve(e.target.result?e.target.result.value:null);
    req.onerror=e=>reject(e.target.error);
  });
}
async function idbGetAll(){
  const db=await idbOpen();
  return new Promise((resolve,reject)=>{
    const tx=db.transaction(IDB_STORE,'readonly');
    const req=tx.objectStore(IDB_STORE).getAll();
    req.onsuccess=e=>resolve(e.target.result||[]);
    req.onerror=e=>reject(e.target.error);
  });
}

// Extract all images from state, return {stateNoImages, imageMap}
function extractImages(state){
  const imageMap={};
  const cloned=JSON.parse(JSON.stringify(state)); // deep clone
  (cloned.orders||[]).forEach(o=>{
    (o.designs||[]).forEach(d=>{
      // Design-level images
      (d.images||[]).forEach((img,ii)=>{
        if(img.data&&img.data.startsWith('data:')){
          const imgKey=`img_d_${d.id}_${ii}`;
          imageMap[imgKey]=img.data;
          img.data='__IDB__'+imgKey; // replace with reference
        }
      });
      // Variety-level images
      (d.varieties||[]).forEach(v=>{
        (v.images||[]).forEach((img,ii)=>{
          if(img.data&&img.data.startsWith('data:')){
            const imgKey=`img_v_${v.id}_${ii}`;
            imageMap[imgKey]=img.data;
            img.data='__IDB__'+imgKey;
          }
        });
      });
    });
  });
  return{stateNoImages:cloned,imageMap};
}

// Re-inject images from imageMap back into state
function reinjectImages(state,imageMap){
  (state.orders||[]).forEach(o=>{
    (o.designs||[]).forEach(d=>{
      (d.images||[]).forEach(img=>{
        if(typeof img.data==='string'&&img.data.startsWith('__IDB__')){
          const key=img.data.slice(7);
          if(imageMap[key])img.data=imageMap[key];
        }
      });
      (d.varieties||[]).forEach(v=>{
        (v.images||[]).forEach(img=>{
          if(typeof img.data==='string'&&img.data.startsWith('__IDB__')){
            const key=img.data.slice(7);
            if(imageMap[key])img.data=imageMap[key];
          }
        });
      });
    });
  });
}

// Load images from IDB and inject into state (called on startup)
async function loadImagesFromIDB(){
  try{
    const all=await idbGetAll();
    const imageMap={};
    all.forEach(entry=>{imageMap[entry.key]=entry.value;});
    if(Object.keys(imageMap).length>0){
      reinjectImages(S,imageMap);
    }
  }catch(e){
    console.warn('Could not load images from IndexedDB:',e.message);
  }
}

// ── CORE SAVE (quota-safe) ─────────────────────────────────────────────────────
function save(){
  try{
    // Extract images to save separately in IndexedDB
    const{stateNoImages,imageMap}=extractImages({...S,openOrders:[...S.openOrders],openClients:[...S.openClients]});
    // Save text data (no images) to localStorage — stays well under 5MB
    const data=JSON.stringify(stateNoImages);
    localStorage.setItem('bangle_prod_tracker',data);
    localStorage.setItem('bangle_v10',data); // legacy key
    localStorage.setItem('bangle_saved_at', new Date().toISOString());
    // Save images to IndexedDB (no size limit)
    Object.entries(imageMap).forEach(([key,val])=>{idbPut(key,val).catch(e=>console.warn('IDB write fail:',e));});
    setSaveStatus('saved');
  }catch(e){
    // If localStorage still fails (e.g. private mode), try sessionStorage as fallback
    try{
      const data=JSON.stringify({...S,openOrders:[...S.openOrders],openClients:[...S.openClients]});
      sessionStorage.setItem('bangle_session_fallback',data);
      setSaveStatus('saved','⚠ Saved (session only — localStorage blocked)');
    }catch(e2){
      setSaveStatus('error','⚠ Save failed — storage blocked');
      showToast('⚠ Save failed: '+e.message+'. Try a different browser.','red');
    }
  }
  updateUndoRedoBtns();
}

// ── BACKUP TO FILE ────────────────────────────────────────────────────────────
function backupToFile(){
  const data = {
    _meta:{ version:'v12', exportedAt:new Date().toISOString(), orders:S.orders.length },
    state: {...S, openOrders:[...S.openOrders], openClients:[...S.openClients]}
  };
  const blob = new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url;
  a.download = `bangle_backup_${new Date().toISOString().split('T')[0]}.json`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast('📤 Backup downloaded','green');
  audit('Backup','Full data backup downloaded to file');
}

// ── RESTORE FROM FILE ─────────────────────────────────────────────────────────
function restoreFromFile(){
  document.getElementById('restore-file-inp').click();
}
function doRestoreFromFile(input){
  const file = input.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = e=>{
    try{
      const parsed = JSON.parse(e.target.result);
      const state = parsed.state || parsed; // support both wrapped and raw
      if(!state.orders){ showToast('⚠ Invalid backup file','red'); return; }
      if(!confirm(`Restore backup from ${parsed._meta?.exportedAt||'unknown date'}?\nThis will REPLACE all current data.\n${state.orders.length} orders will be loaded.`)) return;
      histPush(); // save current state before overwrite so user can undo
      Object.assign(S, state);
      S.openOrders = new Set(state.openOrders||[]);
      S.openClients = new Set(state.openClients||[]);
      save(); render();
      audit('Restore','Data restored from backup file');
      showToast('📥 Restore successful — '+state.orders.length+' orders loaded','green');
    }catch(err){ showToast('⚠ Could not parse backup: '+err.message,'red'); }
  };
  reader.readAsText(file);
  input.value='';
}

let _toastTimer=null;
function showToast(msg, type='green'){
  const el=document.getElementById('toast-el'); if(!el) return;
  el.textContent=msg; el.className='toast '+(type||'green'); el.style.display='block'; el.style.opacity='1';
  clearTimeout(_toastTimer);
  _toastTimer=setTimeout(()=>{el.style.opacity='0';setTimeout(()=>{el.style.display='none';},400);},2800);
}
function audit(action,detail){
  histPush(); // snapshot state before this change for undo
  S.auditLog.unshift({id:uid(),ts:new Date().toISOString(),action,detail});
  if(S.auditLog.length>500)S.auditLog=S.auditLog.slice(0,500);
}
function rebuildVocab(){
  const clients=new Set(),dnames=new Set(),dcodes=new Set();
  S.orders.forEach(o=>{
    if(o.client)clients.add(o.client);
    (o.designs||[]).forEach(d=>{if(d.name)dnames.add(d.name);if(d.code)dcodes.add(d.code);});
  });
  S.vocabulary={clients:[...clients].sort(),dnames:[...dnames].sort(),dcodes:[...dcodes].sort()};
}

// ── STAGE/DESIGN LOGIC ────────────────────────────────────────────────────────
function getEffDays(order,design,si){
  const st=design.stages[si];
  if(st.days!=null)return parseInt(st.days);
  const t=getTmpl(st.stageId);if(!t)return 1;
  return order.priority!=='normal'?t.urgDays:t.days;
}
function designDeadline(order,design,si){
  const base=new Date(order.startDate+'T00:00:00');let days=0;
  for(let i=0;i<=si;i++)days+=getEffDays(order,design,i);
  const d=new Date(base);d.setDate(d.getDate()+days);return d;
}
function designStageAlert(order,design,i){
  const st=design.stages[i].status;
  if(st==='done')return'done';
  if(design.stages[i].completionDate){
    const cd=new Date(design.stages[i].completionDate+'T00:00:00');
    if(cd<today()&&st!=='done')return'late';
  }
  const diff=Math.ceil((designDeadline(order,design,i)-today())/864e5);
  if(diff<0)return'late';if(diff<=1)return'warn';return'ok';
}
function designAlert(order,design){
  const a=design.stages.map((_,i)=>designStageAlert(order,design,i));
  if(a.includes('late'))return'late';if(a.includes('warn'))return'warn';
  if(design.stages.every(s=>s.status==='done'))return'done';return'ok';
}
function orderAlert(order){
  const a=order.designs.map(d=>designAlert(order,d));
  if(a.includes('late'))return'late';if(a.includes('warn'))return'warn';
  if(a.every(x=>x==='done'))return'done';return'ok';
}
function orderPct(order){
  let total=0,done=0;
  order.designs.forEach(d=>{total+=d.stages.length;done+=d.stages.filter(s=>s.status==='done').length;});
  return total?Math.round(done/total*100):0;
}
function designQty(d){
  if(d.varieties&&d.varieties.length>0)
    return d.varieties.reduce((a,v)=>a+Object.values(v.sizes||{}).reduce((x,q)=>x+(parseInt(q)||0),0),0);
  return Object.values(d.sizes||{}).reduce((a,v)=>a+(parseInt(v)||0),0);
}
function totalQty(order){return order.designs.reduce((a,d)=>a+designQty(d),0)}

// Badge/class helpers
function dotCls(order,design,i){
  const st=design.stages[i].status;
  if(st==='done')return'sd-done';
  if(st==='delayed'||designStageAlert(order,design,i)==='late')return'sd-late';
  if(designStageAlert(order,design,i)==='warn')return'sd-warn';
  if(st==='in progress')return'sd-active';return'sd-idle';
}
function dotLbl(design,i){const st=design.stages[i].status;if(st==='done')return'✓';if(st==='delayed')return'!';return(i+1)+'';}
function siCls(order,design,i){
  const st=design.stages[i].status;
  if(st==='done')return'si-done';
  if(st==='delayed'||designStageAlert(order,design,i)==='late')return'si-late';
  if(designStageAlert(order,design,i)==='warn')return'si-warn';
  if(st==='in progress')return'si-active';return'si-idle';
}
function pillCls(order,design,i){
  const st=design.stages[i].status,a=designStageAlert(order,design,i);
  if(st==='done')return'sp-done';if(a==='late'||st==='delayed')return'sp-late';
  if(a==='warn')return'sp-warn';if(st==='in progress')return'sp-active';return'sp-idle';
}
function badgeHtml(al){const m={done:['b-done','Done'],late:['b-late','Overdue'],warn:['b-warn','Due soon'],ok:['b-ok','On track']};const[c,l]=m[al]||['b-ok','On track'];return`<span class="badge ${c}">${l}</span>`}
function prioBadge(p){const m={normal:['b-normal','Normal'],urgent:['b-urgent','Urgent'],critical:['b-critical','Critical']};const[c,l]=m[p]||['b-normal','Normal'];return`<span class="badge ${c}">${l}</span>`}
function ohIconCls(al){return{late:'oh-icon-late',warn:'oh-icon-warn',ok:'oh-icon-ok',done:'oh-icon-done'}[al]}
function ohIconChar(al){if(al==='late')return'!';if(al==='warn')return'~';if(al==='done')return'✓';return'●'}

// ── FILTERS ────────────────────────────────────────────────────────────────────
function updateFilterOptions(){
  rebuildVocab();
  ['client','dname','dcode'].forEach(k=>{
    const el=document.getElementById('f-'+k);if(!el)return;
    const cur=el.value;
    const arr=k==='client'?S.vocabulary.clients:k==='dname'?S.vocabulary.dnames:S.vocabulary.dcodes;
    const lbl=k==='client'?'All clients':k==='dname'?'All designs':'All codes';
    el.innerHTML=`<option value="">${lbl}</option>`+arr.map(v=>`<option value="${esc(v)}"${cur===v?' selected':''}>${esc(v)}</option>`).join('');
  });
}
function applyFilters(){
  S.filters={client:document.getElementById('f-client')?.value||'',dname:document.getElementById('f-dname')?.value||'',dcode:document.getElementById('f-dcode')?.value||'',status:document.getElementById('f-status')?.value||''};
  render();
}
function clearFilters(){
  S.filters={client:'',dname:'',dcode:'',status:''};
  ['f-client','f-dname','f-dcode','f-status'].forEach(id=>{const e=document.getElementById(id);if(e)e.value='';});
  render();
}
function orderMatchesFilter(order){
  const f=S.filters;
  if(f.client&&order.client!==f.client)return false;
  if(f.dname&&!order.designs.some(d=>d.name===f.dname))return false;
  if(f.dcode&&!order.designs.some(d=>d.code===f.dcode))return false;
  if(f.status){const al=orderAlert(order);if(f.status==='on track'&&al!=='ok')return false;if(f.status==='due soon'&&al!=='warn')return false;if(f.status==='overdue'&&al!=='late')return false;if(f.status==='done'&&al!=='done')return false;}
  return true;
}

function switchMain(view){
  S.mainView=view;
  const views=['orders','design','analytics','inventory'];
  document.querySelectorAll('.main-tab').forEach((t,i)=>{t.classList.toggle('active',views[i]===view);});
  document.getElementById('view-orders').style.display=view==='orders'?'':'none';
  document.getElementById('view-design').style.display=view==='design'?'':'none';
  document.getElementById('view-analytics').style.display=view==='analytics'?'':'none';
  document.getElementById('view-inventory').style.display=view==='inventory'?'':'none';
  document.getElementById('filter-bar').style.display=(view==='analytics'||view==='inventory')?'none':'';
  if(view==='analytics')renderAnalytics();
  if(view==='inventory')renderInventory();
  scheduleAutosave();
}
function render(){updateFilterOptions();renderStats();
  if(S.mainView==='orders')renderOrdersView();
  else if(S.mainView==='design')renderDesignView();
  else if(S.mainView==='inventory')renderInventory();
  else renderAnalytics();
  scheduleAutosave();
}
function renderStats(){
  const o=S.orders,lc=o.filter(x=>orderAlert(x)==='late').length,wc=o.filter(x=>orderAlert(x)==='warn').length,dc=o.filter(x=>orderAlert(x)==='done').length,oc=o.length-lc-wc-dc;
  document.getElementById('stats-bar').innerHTML=`
    <div class="stat-card stat-total"><div class="stat-val">${o.length}</div><div class="stat-lbl">Total orders</div></div>
    <div class="stat-card stat-ontrack"><div class="stat-val">${oc}</div><div class="stat-lbl">On track</div></div>
    <div class="stat-card stat-soon"><div class="stat-val">${wc}</div><div class="stat-lbl">Due soon</div></div>
    <div class="stat-card stat-late"><div class="stat-val">${lc}</div><div class="stat-lbl">Overdue</div></div>
    <div class="stat-card stat-done"><div class="stat-val">${dc}</div><div class="stat-lbl">Completed</div></div>`;
  const sub=document.getElementById('header-sub');
  if(sub)sub.textContent=`${o.length} orders · ${lc} overdue · ${wc} due soon`;
}

function renderOrdersView(){
  const container=document.getElementById('view-orders');
  const empty=document.getElementById('empty-msg');
  const filtered=S.orders.filter(orderMatchesFilter);
  if(!S.orders.length){container.innerHTML='';empty.style.display='block';return;}
  empty.style.display='none';
  const clientMap={};
  filtered.forEach(order=>{if(!clientMap[order.client])clientMap[order.client]=[];clientMap[order.client].push(order);});
  Object.keys(clientMap).forEach(c=>clientMap[c].sort((a,b)=>new Date(a.startDate)-new Date(b.startDate)));
  const clients=Object.keys(clientMap).sort();
  if(!clients.length){container.innerHTML='<div class="empty-state"><div>No orders match your filters.</div></div>';return;}
  container.innerHTML=clients.map(client=>{
    const orders=clientMap[client];
    const isOpen=S.openClients.has(client);
    const lateOrds=orders.filter(o=>orderAlert(o)==='late').length;
    return `<div class="client-section" id="cs-${esc(client.replace(/\s+/g,'_'))}">
      <div class="client-header" onclick="toggleClient('${esc(client)}')">
        <div><h2>👤 ${esc(client)}</h2><div class="client-meta">${orders.length} order${orders.length!==1?'s':''} · ${lateOrds} overdue</div></div>

      +'</div>'

        +'<input class="stage-vendor-inp" value="'+esc(st.vendor||'')+'" placeholder="e.g. Ram Cutting Works, Ali Karigar..." onblur="upDesignStageVendor('+oi+','+di+','+si+',this.value)" tabindex="0">'
      +'</div>'

        +'<label style="font-size:10px;color:#777;font-weight:500">Stage notes</label>'

      +'</div>'
    +'</div>'
  +'</div>';
}

function buildStageGroup(order,oi,d,di,groupId,grouped){
  const gDef=STAGE_GROUPS.find(function(g){return g.id===groupId;})||{id:groupId,label:groupId,color:'#888',light:'#f7f6f2',border:'#D3D1C7',icon:'📋'};
  const items=grouped[groupId]||[];
  const isRaw=groupId==='raw';
  const rowsHtml=items.map(function(x){return buildStageRow(order,oi,d,di,x.st,x.si,gDef,isRaw);}).join('');
  const emptyHtml=items.length===0?'<div style="text-align:center;padding:10px;font-size:11px;color:#aaa">No stages in this group. Click &quot;+ Add Stage&quot; to add one.</div>':'';
  return '<div style="border-radius:12px;border:2px solid '+gDef.border+';overflow:hidden;margin-bottom:14px">'
    +'<div style="background:'+gDef.light+';padding:8px 14px;display:flex;align-items:center;justify-content:space-between;border-bottom:1.5px solid '+gDef.border+'">'
      +'<div style="display:flex;align-items:center;gap:8px">'
        +'<span style="font-size:16px">'+gDef.icon+'</span>'
        +'<div>'
          +'<span style="font-size:12px;font-weight:700;color:'+gDef.color+'">'+gDef.label+'</span>'
          +'<span style="font-size:10px;color:#888;margin-left:8px">'+items.length+' stage'+(items.length!==1?'s':'')+' · quantity in <strong>pcs</strong></span>'
        +'</div>'
      +'</div>'
      +'<div style="display:flex;gap:5px;align-items:center">'
        +'<button class="icon-btn sm" style="font-size:10px;border-color:'+gDef.border+';color:'+gDef.color+'" onclick="openAddDesignStageToGroup('+oi+','+di+',\''+groupId+'\')">+ Add Stage</button>'
      +'</div>'
    +'</div>'
    +emptyHtml
    +'<div style="padding:6px 8px">'+rowsHtml+'</div>'
  +'</div>';
}

function buildStagesPanel(order,oi){
  const allDesigns=order.designs;
  if(!allDesigns.length)return '<div style="font-size:12px;color:#aaa;text-align:center;padding:1rem">No designs — add a design first.</div>';
  return allDesigns.map(function(d,di){
    const grouped={raw:[],semi:[],finished:[]};
    d.stages.forEach(function(st,si){
      const g=getStageGroup(st.stageId);
      if(!grouped[g])grouped[g]=[];
      grouped[g].push({st:st,si:si});
    });
    const pillsHtml=d.stages.map(function(st,si){
      const t=getTmpl(st.stageId)||{name:'?'};
      return '<span class="stage-pill '+pillCls(order,d,si)+'">'+dotLbl(d,si)+' '+esc(t.name)+'</span>'+(si<d.stages.length-1?'<span class="stage-arrow">›</span>':'');
    }).join('');
    return '<div class="design-stages-section">'
      +'<div class="design-stages-head">'
        +'<span>🎨 '+esc(d.name)+' <span style="color:#AFA9EC;font-weight:400">['+esc(d.code)+']</span> — '+d.stages.length+' stages</span>'
        +'<div style="display:flex;gap:5px">'
          +'<button class="icon-btn no-print" onclick="exportOrderCSV(\''+order.id+'\')" title="Export this order">📥</button>'
          +'<button class="icon-btn no-print" onclick="printDesignWise(\''+order.id+'\',\''+d.id+'\')">🖨️</button>'
        +'</div>'
      +'</div>'
      +'<div class="stage-flow">'+pillsHtml+'</div>'
      +buildStageGroup(order,oi,d,di,'raw',grouped)
      +buildStageGroup(order,oi,d,di,'semi',grouped)
      +buildStageGroup(order,oi,d,di,'finished',grouped)
    +'</div>';
  }).join('');
}

            oninput="showAC(this,'dcodes',${oi},'dcode',${di})" onblur="hideAC('dcodes',${oi},${di});if(this.value!==S.orders[${oi}].designs[${di}].code)upDesignAC(${oi},${di},'code',this.value)">
          <div class="ac-list" id="ac-dcodes-${oi}-${di}" style="display:none"></div>
        </div>
      </div>
      <div style="display:flex;align-items:center;gap:6px;flex-shrink:0;flex-wrap:wrap">
        ${badgeHtml(al)}
        <span style="font-size:11px;color:#888">${designQty(d)} pcs</span>

    <!-- Design-level images -->
    <div style="font-size:11px;color:#534AB7;font-weight:600;margin-bottom:6px">📷 Design reference images</div>
    <div class="design-imgs-gallery">
      ${imgs.map((img,ii)=>`<div class="gallery-img-card">

      <span>🧮 Varieties &amp; quantities by size</span>
      <span class="no-print" style="display:flex;gap:6px;flex-wrap:wrap">
        <button class="icon-btn" onclick="addVariety(${oi},${di})">+ Add variety</button>

          ${varieties.length===0?('<tr><td colspan="'+(3+szKeys.length)+'" style="text-align:center;color:#aaa;padding:10px;font-size:11px">No varieties yet — click &quot;+ Add variety&quot;</td></tr>'):''}
        </tbody>
        ${varieties.length>0?('<tfoot><tr>'
            +'<td colspan="2" style="text-align:right;color:#534AB7">Design total →</td>'
            +szKeys.map(sz=>'<td><strong>'+(colTotals[sz]||0)+'</strong></td>').join('')

// ── DESIGN VIEW ────────────────────────────────────────────────────────────────
function renderDesignView(){
  const container=document.getElementById('view-design');
  const filtered=S.orders.filter(orderMatchesFilter);
  const codeMap={};
  filtered.forEach(order=>{
    (order.designs||[]).forEach(d=>{
      const code=d.code||'(no code)';
      if(!codeMap[code])codeMap[code]=[];
      codeMap[code].push({order,design:d,oi:S.orders.indexOf(order)});
    });
  });
  const codes=Object.keys(codeMap).sort();
  if(!codes.length){container.innerHTML='<div class="empty-state"><div>No designs match filters.</div></div>';return;}
  container.innerHTML=codes.map(code=>{
    const items=codeMap[code];
    const dname=items[0].design.name;
    const allVarImgs=items.flatMap(x=>(x.design.varieties||[]).flatMap(v=>v.images||[]));
    const allDesignImgs=items.flatMap(x=>x.design.images||[]);
    const allImgs=[...allDesignImgs,...allVarImgs];

    // Build image gallery using string concat (no nested backticks)
    const imgGalleryHtml = allImgs.length
      ? '<div style="font-size:11px;font-weight:600;color:#534AB7;margin-bottom:6px">All images for '+esc(dname)+'</div>'
        +'<div class="design-imgs-gallery" style="margin-bottom:12px">'
        +allImgs.map((img,ii)=>'<div class="gallery-img-card"><img src="'+img.data+'" alt="'+esc(dname)+' '+(ii+1)+'" onclick="openLbDirect(\''+img.data+'\')"><div class="img-footer"><span class="img-num">#'+(ii+1)+'</span></div></div>').join('')
        +'</div>'
      : '';

    // Build each order item card using string concat
    const itemsHtml = items.map(function(x){
      const order=x.order, design=x.design;
      const pillsHtml=design.stages.map(function(st,si){
        const t=getTmpl(st.stageId)||{name:'?'};
        return '<span class="stage-pill '+pillCls(order,design,si)+'">'+dotLbl(design,si)+' '+esc(t.name)+'</span>'+(si<design.stages.length-1?'<span class="stage-arrow">›</span>':'');
      }).join('');
      const varietyHtml=(design.varieties||[]).length
        ? '<div style="font-size:10px;color:#666;margin-top:4px">'
          +(design.varieties.map(function(v){
            return '<span style="background:#f0efff;border-radius:4px;padding:2px 6px;margin-right:4px">'+esc(v.name)+': '+Object.values(v.sizes||{}).reduce(function(a,x){return a+(parseInt(x)||0);},0)+' pcs</span>';
          }).join(''))
          +'</div>'
        : '';
      return '<div class="design-sub-card">'
        +'<div class="design-sub-head">'
          +'<span class="design-order-badge">'+esc(order.orderId)+'</span>'
          +'<span style="font-size:12px;font-weight:600">'+esc(order.client)+'</span>'
          +badgeHtml(designAlert(order,design))
          +'<span style="font-size:11px;color:#888;margin-left:auto">'+designQty(design)+' pcs · Started '+fmtDate(order.startDate)+'</span>'
        +'</div>'
        +'<div class="stage-flow">'+pillsHtml+'</div>'
        +varietyHtml
      +'</div>';
    }).join('');

    return '<div class="design-stage-block">'
      +'<div class="design-stage-header">'
        +'<span>🎨</span>'
        +'<span>'+esc(dname)+' <span style="font-weight:400;color:#AFA9EC">['+esc(code)+']</span></span>'
        +'<span style="margin-left:auto;font-size:11px;font-weight:400;color:#AFA9EC">'+items.length+' order'+(items.length!==1?'s':'')+' · '+allImgs.length+' images</span>'
        +'<button class="sm" style="margin-left:8px;font-size:10px" onclick="exportDesignCSV(\''+esc(code)+'\')">📥 Export</button>'
        +'<button class="sm" style="margin-left:4px;font-size:10px" onclick="printByDesign(\''+esc(code)+'\')">🖨️ Print</button>'
      +'</div>'
      +'<div class="design-stage-body">'
        +imgGalleryHtml
        +itemsHtml
      +'</div>'
    +'</div>';
  }).join('');
}

// ── ANALYTICS ─────────────────────────────────────────────────────────────────
function renderAnalytics(){
  const container=document.getElementById('view-analytics');
  const orders=S.orders;
  if(!orders.length){container.innerHTML='<div class="empty-state">No orders to analyse yet.</div>';return;}
  const totalOrds=orders.length,totalDesigns=orders.reduce((a,o)=>a+o.designs.length,0),totalPcs=orders.reduce((a,o)=>a+totalQty(o),0);
  const lateOrds=orders.filter(o=>orderAlert(o)==='late').length,warnOrds=orders.filter(o=>orderAlert(o)==='warn').length,doneOrds=orders.filter(o=>orderAlert(o)==='done').length,okOrds=totalOrds-lateOrds-warnOrds-doneOrds;
  const byClient={};orders.forEach(o=>{byClient[o.client]=(byClient[o.client]||0)+1;});
  const clientEntries=Object.entries(byClient).sort((a,b)=>b[1]-a[1]).slice(0,8),maxC=Math.max(...clientEntries.map(e=>e[1]),1);
  const byCode={};orders.forEach(o=>o.designs.forEach(d=>{byCode[d.code||'?']=(byCode[d.code||'?']||0)+designQty(d);}));
  const codeEntries=Object.entries(byCode).sort((a,b)=>b[1]-a[1]).slice(0,8),maxCode=Math.max(...codeEntries.map(e=>e[1]),1);
  const stageStats={};orders.forEach(o=>o.designs.forEach(d=>d.stages.forEach(st=>{const t=getTmpl(st.stageId);if(!t)return;if(!stageStats[t.name])stageStats[t.name]={done:0,total:0};stageStats[t.name].total++;if(st.status==='done')stageStats[t.name].done++;})));
  const stageEntries=Object.entries(stageStats).map(([name,v])=>([name,v.total?Math.round(v.done/v.total*100):0]));
  const bySz={};orders.forEach(o=>o.designs.forEach(d=>{const szKeys=Object.keys(d.sizes||{});szKeys.forEach(sz=>{const v=d.varieties&&d.varieties.length?d.varieties.reduce((a,vr)=>a+(parseInt((vr.sizes||{})[sz])||0),0):(parseInt((d.sizes||{})[sz])||0);bySz[sz]=(bySz[sz]||0)+v;});}));
  const szEntries=Object.entries(bySz).sort((a,b)=>b[1]-a[1]),maxSz=Math.max(...szEntries.map(e=>e[1]),1);
  const byPrio={normal:0,urgent:0,critical:0};orders.forEach(o=>{byPrio[o.priority]=(byPrio[o.priority]||0)+1;});
  const avgPct=Math.round(orders.reduce((a,o)=>a+orderPct(o),0)/totalOrds);
  function pieSvg(data,colors,r=54){
    let total=data.reduce((a,d)=>a+d,0);if(!total)return'';
    let cum=0,out='';
    data.forEach((v,i)=>{if(!v)return;const pct=v/total;const a1=cum*2*Math.PI-Math.PI/2,a2=(cum+pct)*2*Math.PI-Math.PI/2;const x1=60+r*Math.cos(a1),y1=60+r*Math.sin(a1),x2=60+r*Math.cos(a2),y2=60+r*Math.sin(a2);const lg=pct>0.5?1:0;out+=`<path d="M60,60 L${x1.toFixed(1)},${y1.toFixed(1)} A${r},${r} 0 ${lg},1 ${x2.toFixed(1)},${y2.toFixed(1)} Z" fill="${colors[i]}"/>`;cum+=pct;});
    return `<svg class="pie-svg" width="120" height="120" viewBox="0 0 120 120">${out}<circle cx="60" cy="60" r="28" fill="#fff"/></svg>`;
  }
  const statusColors=['#1D9E75','#EF9F27','#E24B4A','#888780'],prioColors=['#378ADD','#EF9F27','#E24B4A'];
  container.innerHTML=`<div style="display:flex;justify-content:flex-end;margin-bottom:10px"><button onclick="exportAnalyticsCSV()" style="font-size:12px">📥 Export Analytics CSV</button></div><div class="analytics-grid">
    <div class="chart-card full"><div class="chart-title">Key metrics</div>
      <div class="metric-grid">
        <div class="metric-box"><div class="metric-val">${totalOrds}</div><div class="metric-lbl">Total orders</div></div>
        <div class="metric-box"><div class="metric-val">${totalDesigns}</div><div class="metric-lbl">Designs in production</div></div>
        <div class="metric-box"><div class="metric-val">${totalPcs.toLocaleString()}</div><div class="metric-lbl">Total pieces ordered</div></div>
        <div class="metric-box"><div class="metric-val">${avgPct}%</div><div class="metric-lbl">Avg. completion</div></div>
        <div class="metric-box"><div class="metric-val" style="color:#A32D2D">${lateOrds}</div><div class="metric-lbl">Overdue orders</div></div>
        <div class="metric-box"><div class="metric-val" style="color:#0F6E56">${doneOrds}</div><div class="metric-lbl">Completed orders</div></div>
      </div>
    </div>
    <div class="chart-card"><div class="chart-title">Order status</div><div class="chart-sub">Distribution by health</div>
      <div style="display:flex;gap:20px;align-items:center">
        ${pieSvg([okOrds,warnOrds,lateOrds,doneOrds],statusColors)}
        <div class="pie-legend">${[['On track',okOrds,'#1D9E75'],['Due soon',warnOrds,'#EF9F27'],['Overdue',lateOrds,'#E24B4A'],['Completed',doneOrds,'#888780']].map(([lbl,v,c])=>`<div class="pie-leg-item"><div class="pie-leg-dot" style="background:${c}"></div>${lbl} <strong style="margin-left:auto">${v}</strong></div>`).join('')}</div>
      </div>
    </div>
    <div class="chart-card"><div class="chart-title">Priority split</div><div class="chart-sub">Orders by priority</div>
      <div style="display:flex;gap:20px;align-items:center">
        ${pieSvg([byPrio.normal,byPrio.urgent,byPrio.critical],prioColors)}
        <div class="pie-legend">${[['Normal',byPrio.normal,'#378ADD'],['Urgent',byPrio.urgent,'#EF9F27'],['Critical',byPrio.critical,'#E24B4A']].map(([lbl,v,c])=>`<div class="pie-leg-item"><div class="pie-leg-dot" style="background:${c}"></div>${lbl} <strong style="margin-left:auto">${v}</strong></div>`).join('')}</div>
      </div>
    </div>
    <div class="chart-card"><div class="chart-title">Orders by client</div><div class="chart-sub">Top 8 clients</div>
      <div class="bar-chart">${clientEntries.map(([c,v])=>`<div class="bar-row"><span class="bar-label" title="${esc(c)}">${esc(c)}</span><div class="bar-track"><div class="bar-fill" style="width:${Math.round(v/maxC*100)}%;background:#534AB7"><span class="bar-val">${v}</span></div></div></div>`).join('')}</div>
    </div>
    <div class="chart-card"><div class="chart-title">Pieces by design code</div><div class="chart-sub">Total quantity</div>
      <div class="bar-chart">${codeEntries.map(([c,v])=>`<div class="bar-row"><span class="bar-label" title="${esc(c)}">${esc(c)}</span><div class="bar-track"><div class="bar-fill" style="width:${Math.round(v/maxCode*100)}%;background:#0F6E56"><span class="bar-val">${v}</span></div></div></div>`).join('')}</div>
    </div>

function upDesignStage(oi,di,si,val){
  // If trying to mark as 'done', enforce rules
  if(val==='done'){
    const order=S.orders[oi];
    const design=order.designs[di];
    const st=design.stages[si];
    const groupId=getStageGroup(st.stageId);
    const isRaw=groupId==='raw';
    const unit='pcs'; // all groups now use pcs

    // Rule 1: qty is mandatory before marking done
    if(st.qty==null||st.qty<=0){
      alert(`⚠️ Quantity is mandatory!\n\nPlease enter the quantity (in ${unit}) for this stage before marking it as Done.`);
      // Reset the select back
      render();
      return;
    }

    // Rule 2: if qty differs from first stage in same group, require reason in stageNote
    const groupStages=design.stages.filter(s=>getStageGroup(s.stageId)===groupId&&s.qty!=null&&s.qty>0);
    if(groupStages.length>1){
      const firstQty=groupStages[0].qty;
      const currentQty=st.qty;
      const differ=Math.abs(currentQty-firstQty)>0;
      if(differ&&(!st.stageNote||st.stageNote.trim().length<5)){
        const rejection=firstQty-currentQty;
        const rejectionInfo=rejection>0?`\n\n⚠️ Rejection detected: ${rejection} pcs (${((rejection/firstQty)*100).toFixed(1)}% of first stage qty)`:'';
        const reason=prompt(`⚠️ Quantity Difference Detected!${rejectionInfo}\n\nFirst quantity in ${groupId} group: ${firstQty} pcs\nThis stage quantity: ${currentQty} pcs\n\nA reason is MANDATORY when quantities differ across stages in the same group.\n\nPlease enter the reason for this difference (e.g. "30 pcs rejected - size defect"):`);
        if(!reason||reason.trim().length<3){
          alert('❌ Cannot mark as Done. A reason of at least 3 characters is required when quantities differ within the same group.');
          render();
          return;
        }
        design.stages[si].stageNote=(st.stageNote?st.stageNote+'\n':'')+'Qty diff reason: '+reason.trim();
      }
    }
  }

  const prev=S.orders[oi].designs[di].stages[si].status;
  S.orders[oi].designs[di].stages[si].status=val;
  audit('Stage status',`Order ${S.orders[oi].orderId}, design "${S.orders[oi].designs[di].name}", stage ${si+1}: ${prev}→${val}`);
  autoSyncInventoryFromStages(oi,di);
  render();
}

// ── AUTO-SYNC INVENTORY FROM PRODUCTION STAGES ────────────────────────────────
//
// TRIGGER RULES (all quantities in pcs):
//
// RAW IN  → First stage of RAW group marked 'done' — uses that stage's qty
// RAW OUT → First stage of SEMI group marked 'done' — uses the LAST done raw stage's qty
//           (the transition point: pipes leave raw stock when bangle designing starts)
//
// SEMI IN → First stage of SEMI group marked 'done' — uses that stage's qty
//           (this is the same event that triggers RAW OUT, but with the SEMI stage qty)
// SEMI OUT→ First stage of FINISHED group marked 'done' — uses last done semi stage's qty
//
// FIN IN  → First stage of FINISHED group marked 'done' — uses that stage's qty
// FIN OUT → Last stage of FINISHED group marked 'done' — uses that stage's qty
//
// REJECTIONS: whenever a stage's qty differs from the previous stage's qty within
//             the same group, a rejection entry is auto-calculated and stored in
//             the ledger entry's `rejections` field and as a separate note entry.
//
function autoSyncInventoryFromStages(oi,di){
  const order=S.orders[oi];
  const design=order.designs[di];
  if(!design)return;
  const designName=design.name;
  const designCode=design.code;
  const todayStr=invIsoDate(new Date());
  const orderId=order.id;
  const srcKey='auto_'+orderId+'_'+design.id;

  // Remove all previous auto entries for this order+design combo
  S.invLedger=S.invLedger.filter(e=>e.source!==srcKey);

  // Helper: get all stages in a group with their template and index
  function groupStagesOf(groupId){
    return design.stages
      .map((st,si)=>({st,si,tmpl:getTmpl(st.stageId)}))
      .filter(({st})=>getStageGroup(st.stageId)===groupId);
  }

  // Helper: make a ledger entry
  function mkEntry(type,qty,date,vendor,note,stageRef,rejections){
    return {
      id:uid(),
      date:date||todayStr,
      designName,designCode,
      type,
      qty:qty,           // pieces for ALL groups
      qtyKg:0,           // kept for backward compat but always 0
      qtySets:qty,       // kept for backward compat
      orderId,
      vendor:vendor||'',
      note:note||'',
      source:srcKey,
      autoType:type,
      stageRef:stageRef||null,
      rejections:rejections||0
    };
  }

  // Helper: compute rejection between two consecutive stages in same group
  function calcRejection(prevQty,currQty){
    if(prevQty==null||currQty==null)return 0;
    return Math.max(0,prevQty-currQty);
  }

  const rawStages  = groupStagesOf('raw');
  const semiStages = groupStagesOf('semi');
  const finStages  = groupStagesOf('finished');

  // ── RAW IN ─────────────────────────────────────────────────────────────────
  // Trigger: first raw stage is marked 'done' with a qty
  const firstRawDone = rawStages.find(({st})=>st.status==='done'&&st.qty!=null&&st.qty>0);
  if(firstRawDone){
    const {st,si,tmpl}=firstRawDone;
    const date=st.completionDate||order.startDate||todayStr;
    S.invLedger.push(mkEntry(
      'raw_in', st.qty, date, st.vendor||'',
      `Auto: ${tmpl?tmpl.name:'Raw stage'} done — ${st.qty} pcs raw pipes in (${order.orderId})`,
      {oi,di,si,groupId:'raw'}, 0
    ));

    // Track rejections within raw group across consecutive done stages
    let prevDoneQty=st.qty;
    rawStages.forEach(({st:s,si:sIdx,tmpl:t},arrIdx)=>{
      if(arrIdx===0)return; // skip first
      if(s.status!=='done'||s.qty==null)return;
      const rej=calcRejection(prevDoneQty,s.qty);
      if(rej>0){
        const rejDate=s.completionDate||todayStr;
        S.invLedger.push(mkEntry(
          'raw_rejection', rej, rejDate, s.vendor||'',
          `Auto rejection: ${t?t.name:'Raw stage'} — ${rej} pcs rejected (was ${prevDoneQty}, now ${s.qty}) (${order.orderId})`,
          {oi,di,si:sIdx,groupId:'raw'}, rej
        ));
      }
      prevDoneQty=s.qty;
    });
  }

  // ── RAW OUT + SEMI IN ──────────────────────────────────────────────────────
  // Trigger: first semi stage is marked 'done'
  // RAW OUT qty = last done raw stage qty (what actually came out of raw into semi)
  // SEMI IN qty = first done semi stage qty (what was received at semi)
  const firstSemiDone = semiStages.find(({st})=>st.status==='done'&&st.qty!=null&&st.qty>0);
  if(firstSemiDone){
    const {st:semiSt,si:semiSi,tmpl:semiTmpl}=firstSemiDone;
    const semiDate=semiSt.completionDate||todayStr;

    // RAW OUT — use the qty entered at the last done raw stage
    const lastRawDone=[...rawStages].reverse().find(({st})=>st.status==='done'&&st.qty!=null&&st.qty>0);
    if(lastRawDone){
      const {st:rawSt,si:rawSi,tmpl:rawTmpl}=lastRawDone;
      const rawOutDate=semiDate; // raw leaves when semi begins
      S.invLedger.push(mkEntry(
        'raw_out', rawSt.qty, rawOutDate, rawSt.vendor||'',
        `Auto: ${semiTmpl?semiTmpl.name:'Semi stage'} started — ${rawSt.qty} pcs raw out (${order.orderId})`,
        {oi,di,si:rawSi,groupId:'raw'}, 0
      ));
    }

    // SEMI IN — using first done semi stage qty
    S.invLedger.push(mkEntry(
      'semi_in', semiSt.qty, semiDate, semiSt.vendor||'',
      `Auto: ${semiTmpl?semiTmpl.name:'Semi stage'} done — ${semiSt.qty} pcs semi-finished in (${order.orderId})`,
      {oi,di,si:semiSi,groupId:'semi'}, 0
    ));

    // Track rejections within semi group across consecutive done stages
    let prevSemiQty=semiSt.qty;
    semiStages.forEach(({st:s,si:sIdx,tmpl:t},arrIdx)=>{
      if(arrIdx===0)return;
      if(s.status!=='done'||s.qty==null)return;
      const rej=calcRejection(prevSemiQty,s.qty);
      if(rej>0){
        const rejDate=s.completionDate||todayStr;
        S.invLedger.push(mkEntry(
          'semi_rejection', rej, rejDate, s.vendor||'',
          `Auto rejection: ${t?t.name:'Semi stage'} — ${rej} pcs rejected (was ${prevSemiQty}, now ${s.qty}) (${order.orderId})`,
          {oi,di,si:sIdx,groupId:'semi'}, rej
        ));
      }
      prevSemiQty=s.qty;
    });
  }

  // ── SEMI OUT + FIN IN ──────────────────────────────────────────────────────
  // Trigger: first finished stage is marked 'done'
  const firstFinDone = finStages.find(({st})=>st.status==='done'&&st.qty!=null&&st.qty>0);
  if(firstFinDone){
    const {st:finSt,si:finSi,tmpl:finTmpl}=firstFinDone;
    const finDate=finSt.completionDate||todayStr;

    // SEMI OUT — use qty of last done semi stage
    const lastSemiDone=[...semiStages].reverse().find(({st})=>st.status==='done'&&st.qty!=null&&st.qty>0);
    if(lastSemiDone){
      const {st:sSt,si:sSi,tmpl:sTmpl}=lastSemiDone;
      S.invLedger.push(mkEntry(
        'semi_out', sSt.qty, finDate, sSt.vendor||'',
        `Auto: ${finTmpl?finTmpl.name:'Finished stage'} started — ${sSt.qty} pcs semi-finished out (${order.orderId})`,
        {oi,di,si:sSi,groupId:'semi'}, 0
      ));
    }

    // FIN IN — first done finished stage qty
    S.invLedger.push(mkEntry(
      'fin_in', finSt.qty, finDate, finSt.vendor||'',
      `Auto: ${finTmpl?finTmpl.name:'Finished stage'} done — ${finSt.qty} pcs finished in (${order.orderId})`,
      {oi,di,si:finSi,groupId:'finished'}, 0
    ));

    // Track rejections within finished group
    let prevFinQty=finSt.qty;
    finStages.forEach(({st:s,si:sIdx,tmpl:t},arrIdx)=>{
      if(arrIdx===0)return;
      if(s.status!=='done'||s.qty==null)return;
      const rej=calcRejection(prevFinQty,s.qty);
      if(rej>0){
        const rejDate=s.completionDate||todayStr;
        S.invLedger.push(mkEntry(
          'fin_rejection', rej, rejDate, s.vendor||'',
          `Auto rejection: ${t?t.name:'Finished stage'} — ${rej} pcs rejected (was ${prevFinQty}, now ${s.qty}) (${order.orderId})`,
          {oi,di,si:sIdx,groupId:'finished'}, rej
        ));
      }
      prevFinQty=s.qty;
    });
  }

  // ── FIN OUT ────────────────────────────────────────────────────────────────
  // Trigger: LAST finished stage is marked 'done' (dispatch stage)
  const lastFinStage = finStages[finStages.length-1];
  if(lastFinStage&&lastFinStage.st.status==='done'&&lastFinStage.st.qty!=null&&lastFinStage.st.qty>0){
    const {st:fSt,si:fSi,tmpl:fTmpl}=lastFinStage;
    const fDate=fSt.completionDate||todayStr;
    S.invLedger.push(mkEntry(
      'fin_out', fSt.qty, fDate, fSt.vendor||'',
      `Auto: ${fTmpl?fTmpl.name:'Dispatch stage'} done — ${fSt.qty} pcs dispatched out (${order.orderId})`,
      {oi,di,si:fSi,groupId:'finished'}, 0
    ));
  }

  save();
}

// ── TAB NAVIGATION HELPER FOR VARIETY QTY CELLS ───────────────────────────────
// Handles Tab/Shift+Tab between qty cells without triggering a full render.
// On Tab: saves current cell value, moves focus to next size cell.
// On Enter: saves and moves down to same column in next variety row.
function handleQtyTabKey(e, oi, di, vi, szI) {
  if (e.key !== 'Tab' && e.key !== 'Enter') return;
  e.preventDefault();
  const d = S.orders[oi].designs[di];
  const szKeys = Object.keys(d.sizes || {});
  const varieties = d.varieties || [];
  // Save current value to state
  const curVal = parseInt(e.target.value) || 0;
  if (!d.varieties[vi].sizes) d.varieties[vi].sizes = {};
  d.varieties[vi].sizes[szKeys[szI]] = curVal;
  // Sync aggregate sizes
  szKeys.forEach(s => { d.sizes[s] = varieties.reduce((a,v) => a + (parseInt((v.sizes||{})[s])||0), 0); });
  // Mark input as clean and skip blur handler (focus is moving programmatically)
  e.target._dirty = false;
  e.target._skipBlur = true;
  scheduleAutosave();
  // Update totals in DOM without full render
  const dcard = document.getElementById('dcard-' + d.id);
  if (dcard) {
    const rows = dcard.querySelectorAll('tbody tr');
    // Update current row total
    if (rows[vi]) {
      const rowTotal = szKeys.reduce((a,sz) => a + (parseInt((d.varieties[vi].sizes||{})[sz])||0), 0);
      const totalCell = rows[vi].querySelector('.total-col');
      if (totalCell) totalCell.textContent = rowTotal;
    }
    // Update footer column total for current size
    const footerCells = dcard.querySelectorAll('tfoot tr td');
    if (footerCells.length > szI + 2) {
      const colTotal = varieties.reduce((a,v) => a + (parseInt((v.sizes||{})[szKeys[szI]])||0), 0);
      footerCells[szI + 2].innerHTML = '<strong>' + colTotal + '</strong>';
    }
    // Update grand total
    const grandTotal = szKeys.reduce((a,sz) => a + d.varieties.reduce((b,v) => b + (parseInt((v.sizes||{})[sz])||0), 0), 0);
    const grandCell = dcard.querySelector('tfoot .grand-total');
    if (grandCell) grandCell.innerHTML = '<strong>' + grandTotal + '</strong>';
    const sizeTotal = dcard.querySelector('.size-total');
    if (sizeTotal) sizeTotal.innerHTML = 'Design total: <strong>' + grandTotal + '</strong> pcs';
  }
  // Determine next focus target
  let nextVi = vi, nextSzI = szI;
  if (e.key === 'Tab') {
    if (!e.shiftKey) {
      nextSzI++;
      if (nextSzI >= szKeys.length) { nextSzI = 0; nextVi++; }
      if (nextVi >= varieties.length) { nextVi = 0; }
    } else {
      nextSzI--;
      if (nextSzI < 0) { nextSzI = szKeys.length - 1; nextVi--; }
      if (nextVi < 0) { nextVi = varieties.length - 1; }
    }
  } else { // Enter: move down same column
    nextVi = (vi + 1) % varieties.length;
    nextSzI = szI;
  }
  // Move focus
  if (dcard) {
    const rows = dcard.querySelectorAll('tbody tr');
    const targetRow = rows[nextVi];
    if (targetRow) {
      const inp = targetRow.querySelectorAll('input.qty-inp')[nextSzI];
      if (inp) {
        inp._skipBlur = false; // ready for next blur
        inp.focus();
        inp.select();
      }
    }
  }
}

// ── FOCUS TRAP HELPERS ─────────────────────────────────────────────────────────
// Disables all focusable elements in the background when a modal is open,
// so Tab can never escape the modal to "Connect Drive" or other page controls.
function _modalDisableBackground(){
  const SELECTOR='a,button,input,select,textarea,[tabindex]';
  const mc=document.getElementById('modal-container');
  document.querySelectorAll(SELECTOR).forEach(el=>{
    // Skip elements inside the modal itself
    if(mc&&mc.contains(el))return;
    // Save existing tabindex so we can restore it later
    el._savedTabIndex=el.getAttribute('tabindex');
    el.setAttribute('tabindex','-1');
  });
}
function _modalRestoreBackground(){
  const SELECTOR='a,button,input,select,textarea,[tabindex]';
  document.querySelectorAll(SELECTOR).forEach(el=>{
    if(el._savedTabIndex===undefined)return; // wasn't touched
    if(el._savedTabIndex===null){
      el.removeAttribute('tabindex');
    } else {
      el.setAttribute('tabindex',el._savedTabIndex);
    }
    delete el._savedTabIndex;
  });
}

// Get all focusable elements inside the modal, in DOM order
function _modalFocusable(){
  const mc=document.getElementById('modal-container');
  if(!mc)return[];
  return Array.from(mc.querySelectorAll(
    'input:not([disabled]):not([tabindex="-1"]),select:not([disabled]):not([tabindex="-1"]),textarea:not([disabled]):not([tabindex="-1"]),button:not([disabled]):not([tabindex="-1"])'
  )).filter(el=>el.offsetParent!==null); // visible only
}

      <!-- Varieties -->
      <div style="font-size:11px;color:#3C3489;font-weight:600;margin-bottom:6px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:6px">
        <span>🧮 Varieties <span style="color:#A32D2D">*</span> <span style="font-weight:400;color:#888">(at least one variety with non-zero total required)</span></span>
        <button class="icon-btn" id="btn-add-variety" onclick="addModalVariety()">+ Add variety</button>
      </div>

      <div class="err-msg" id="err-no-varieties" style="display:none;margin-top:4px">At least one variety with non-zero quantity is required</div>
