<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--indigo:#534AB7;--indigo-light:#EEEDFE;--indigo-mid:#AFA9EC;--indigo-dark:#3C3489;--teal:#0F6E56;--teal-light:#E1F5EE;--teal-mid:#5DCAA5;--amber:#BA7517;--amber-light:#FAEEDA;--amber-mid:#EF9F27;--red:#A32D2D;--red-light:#FCEBEB;--red-mid:#F09595;--green:#3B6D11;--green-light:#EAF3DE;--green-mid:#97C459;--blue:#185FA5;--blue-light:#E6F1FB;--blue-mid:#85B7EB;--bg:#f4f3ef;--card:#fff;--border:#D3D1C7}
body{font-family:'Inter',system-ui,-apple-system,sans-serif;font-size:13px;background:var(--bg);color:#1a1916}
input,select,textarea{font-family:inherit;font-size:12px;background:#fff;color:#1a1916;border:1px solid #C0BFBA;border-radius:7px;padding:6px 9px;outline:none;transition:border-color .15s;width:100%}
input:focus,select:focus,textarea:focus{border-color:#7F77DD;box-shadow:0 0 0 2px #EEEDFE}
input.err,select.err{border-color:#E24B4A!important;box-shadow:0 0 0 2px #FCEBEB!important}
.err-msg{font-size:10px;color:#A32D2D;margin-top:2px;font-weight:500}
button{font-family:inherit;font-size:12px;cursor:pointer;border-radius:8px;border:1px solid #C0BFBA;background:transparent;color:#1a1916;padding:6px 13px;transition:all .15s;white-space:nowrap}
button:hover{background:#f1efe8}
button.primary{background:#534AB7;color:#fff;border-color:#534AB7;font-weight:500}
button.primary:hover{background:#3C3489}
button.danger{color:#A32D2D;border-color:#F09595;background:#FCEBEB}
button.danger:hover{background:#F7C1C1}
button.sm{padding:4px 11px;font-size:11px;border-radius:7px;font-weight:500}
button.icon-btn{padding:5px 11px;font-size:11px;border-radius:7px;font-weight:500;background:#F7F6FF;border-color:#D0CCF5;color:#534AB7}
button.icon-btn:hover{background:#EEEDFE;border-color:#AFA9EC}
.badge{font-size:11px;font-weight:500;padding:3px 10px;border-radius:99px;white-space:nowrap}
.b-ok{background:#E1F5EE;color:#085041}.b-warn{background:#FAEEDA;color:#633806}.b-late{background:#FCEBEB;color:#791F1F}.b-done{background:#F1EFE8;color:#444441}
.b-normal{background:#E6F1FB;color:#0C447C}.b-urgent{background:#FAEEDA;color:#633806}.b-critical{background:#FCEBEB;color:#791F1F}
.dash{padding:1rem;max-width:1400px;margin:0 auto}
.header-band{background:linear-gradient(135deg,#4A42A8 0%,#312C7A 100%);border-radius:16px;padding:18px 24px;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;box-shadow:0 8px 32px rgba(83,74,183,.32),0 2px 8px rgba(0,0,0,.12)}
.header-band h1{font-size:18px;font-weight:700;color:#fff;letter-spacing:-.01em}
.header-band p{font-size:11px;color:#C4BFEE;margin-top:3px;font-weight:400}
.header-actions{display:flex;gap:7px;flex-wrap:wrap}
.header-actions button{background:rgba(255,255,255,.12);color:#fff;border-color:rgba(255,255,255,.2);font-size:12px;border-radius:9px;padding:7px 14px;font-weight:500;backdrop-filter:blur(4px)}
.header-actions button:hover{background:rgba(255,255,255,.22);border-color:rgba(255,255,255,.35)}
.header-actions button.primary{background:#fff;color:#4A42A8;border-color:#fff;font-weight:700;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:14px}
.stat-card{border-radius:14px;padding:14px 16px;border:none;cursor:pointer;transition:transform .15s,box-shadow .15s;position:relative;overflow:hidden}
.stat-card::before{content:'';position:absolute;top:0;right:0;width:60px;height:60px;border-radius:50%;opacity:.08;transform:translate(20px,-20px)}
.stat-card:hover{transform:translateY(-3px);box-shadow:0 8px 24px rgba(0,0,0,.12)}
.stat-total{background:linear-gradient(135deg,#EEEDFE,#E0DDFF);box-shadow:0 2px 8px rgba(83,74,183,.12)}
.stat-total::before{background:#534AB7}
.stat-ontrack{background:linear-gradient(135deg,#E1F5EE,#CCF0E4);box-shadow:0 2px 8px rgba(15,110,86,.10)}
.stat-ontrack::before{background:#0F6E56}
.stat-soon{background:linear-gradient(135deg,#FAEEDA,#F5DDB8);box-shadow:0 2px 8px rgba(186,117,23,.10)}
.stat-soon::before{background:#BA7517}
.stat-late{background:linear-gradient(135deg,#FCEBEB,#FAD4D4);box-shadow:0 2px 8px rgba(163,45,45,.10)}
.stat-late::before{background:#A32D2D}
.stat-done{background:linear-gradient(135deg,#F1EFE8,#E4E1D6);box-shadow:0 2px 8px rgba(0,0,0,.06)}
.stat-done::before{background:#5F5E5A}
.stat-val{font-size:28px;font-weight:800;letter-spacing:-.03em;line-height:1}
.stat-total .stat-val{color:#3C3489}.stat-ontrack .stat-val{color:#0A5A45}.stat-soon .stat-val{color:#7A4110}.stat-late .stat-val{color:#8B2020}.stat-done .stat-val{color:#4A4946}
.stat-lbl{font-size:11px;margin-top:5px;font-weight:600;letter-spacing:.02em;text-transform:uppercase}
.stat-total .stat-lbl{color:#6C64CC}.stat-ontrack .stat-lbl{color:#178A68}.stat-soon .stat-lbl{color:#9A5520}.stat-late .stat-lbl{color:#A32D2D}.stat-done .stat-lbl{color:#888}
.filter-bar{background:linear-gradient(135deg,#FAFAFD,#fff);border-radius:14px;padding:12px 18px;margin-bottom:12px;border:1.5px solid #E4E2F8;display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;box-shadow:0 2px 8px rgba(83,74,183,.06)}
.filter-bar label{font-size:11px;color:#6C64CC;font-weight:600;display:block;margin-bottom:3px;letter-spacing:.02em;text-transform:uppercase}
.filter-bar select,.filter-bar input{max-width:155px;font-size:11px;padding:5px 8px;border-color:#D0CCF5}
.filter-clear{font-size:11px;color:#534AB7;cursor:pointer;text-decoration:none;background:linear-gradient(135deg,#EEEDFE,#E4E2F8);border:1.5px solid #D0CCF5;padding:4px 11px;border-radius:7px;align-self:flex-end;margin-bottom:0;font-weight:600;transition:all .15s}
.filter-clear:hover{background:#E0DDFF;border-color:#AFA9EC}
.main-tabs{display:flex;gap:4px;margin-bottom:12px;flex-wrap:wrap}
.main-tab{padding:9px 20px;font-size:12px;font-weight:600;border-radius:10px;cursor:pointer;border:1.5px solid transparent;color:#888;transition:all .18s;letter-spacing:.01em}
.main-tab:hover{background:#EEEDFE;color:#534AB7;border-color:#D0CCF5}
.main-tab.active{background:linear-gradient(135deg,#534AB7,#3C3489);color:#fff;border-color:transparent;box-shadow:0 4px 12px rgba(83,74,183,.3)}
.client-section{margin-bottom:14px;border-radius:14px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.client-header{background:linear-gradient(135deg,#534AB7,#3C3489);color:#fff;padding:11px 16px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;user-select:none}
.client-header h2{font-size:13px;font-weight:600}
.client-meta{font-size:11px;color:#AFA9EC;margin-top:2px}
.client-body{background:#fff;border:1.5px solid #AFA9EC;border-top:none;border-radius:0 0 14px 14px;padding:12px}
.client-body.closed{display:none}
/* ── ORDERS / VENDOR SPLIT-PANEL LAYOUT ─────────────────────────────────── */
.orders-split{display:flex;gap:0;align-items:flex-start;margin-top:4px}
.orders-sidebar{width:196px;min-width:196px;flex-shrink:0;position:sticky;top:46px;max-height:calc(100vh - 54px);overflow-y:auto;border-radius:14px;border:1.5px solid var(--border);background:#fafaf8;margin-right:10px;box-shadow:0 2px 8px rgba(0,0,0,.04)}
.orders-sidebar-hd{padding:9px 13px 7px;font-size:10px;font-weight:700;color:#888;letter-spacing:.07em;text-transform:uppercase;border-bottom:1px solid var(--border);flex-shrink:0}
.orders-sb-item{padding:9px 12px;cursor:pointer;border-left:3px solid transparent;display:flex;justify-content:space-between;align-items:center;gap:6px;transition:background .1s}
.orders-sb-item:hover{background:var(--indigo-light)}
.orders-sb-item.active{background:#EEEDFE;border-left-color:var(--indigo)}
.orders-sb-name{font-size:12px;font-weight:600;color:#1a1916;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.orders-sb-item.active .orders-sb-name{color:var(--indigo)}
.orders-sb-badge{background:#f0efee;color:#534AB7;border-radius:10px;padding:2px 7px;font-size:10px;font-weight:700;white-space:nowrap;flex-shrink:0}
.orders-sb-item.active .orders-sb-badge{background:var(--indigo);color:#fff}
.orders-sb-badge.sb-late{background:var(--red-light);color:var(--red)}
.orders-sb-item.active .orders-sb-badge.sb-late{background:var(--red);color:#fff}
.orders-main-wrap{flex:1;min-width:0;display:flex;flex-direction:column}
.orders-top-bar{background:#fff;border-radius:12px 12px 0 0;border:1.5px solid var(--border);padding:8px 12px;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.orders-search{flex:1;min-width:140px;padding:6px 10px;border-radius:8px;border:1.5px solid var(--border);font-size:12px;background:#fafaf8}
.orders-search:focus{outline:none;border-color:var(--indigo)}
.orders-chip{padding:4px 11px;border-radius:14px;border:1.5px solid var(--border);font-size:11px;cursor:pointer;background:#fff;color:#555;font-weight:500;transition:.1s}
.orders-chip.active{background:var(--indigo);color:#fff;border-color:var(--indigo)}
.orders-section-hd{position:sticky;top:46px;z-index:15;background:linear-gradient(135deg,var(--indigo),var(--indigo-dark));color:#fff;padding:10px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px;border:1.5px solid var(--indigo);border-top:none}
.orders-section-name{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.orders-section-meta{font-size:10px;opacity:.82;margin-top:1px}
.orders-section-acts{display:flex;gap:5px;flex-shrink:0}
.orders-cards-list{padding:12px;display:flex;flex-direction:column;gap:10px;border:1.5px solid var(--border);border-top:none;border-radius:0 0 12px 12px;background:var(--bg)}
@media(max-width:600px){
  .orders-split{flex-direction:column}
  .orders-sidebar{position:static;max-height:none;width:100%;min-width:unset;margin-right:0;margin-bottom:8px;border-radius:12px;display:flex;flex-direction:row;overflow-x:auto;overflow-y:hidden}
  .orders-sidebar-hd{display:none}
  .orders-sb-item{padding:8px 10px;border-left:none;border-bottom:3px solid transparent;flex-shrink:0;min-width:80px;flex-direction:column;align-items:center;gap:2px;text-align:center}
  .orders-sb-item.active{border-bottom-color:var(--indigo);background:var(--indigo-light);border-left:none}
  .orders-sb-name{font-size:10px;white-space:normal;max-width:80px}
  .orders-section-hd{position:relative;top:0}
}
.order-card{border-radius:14px;margin-bottom:10px;overflow:hidden;border:1.5px solid var(--border);background:#fff;transition:box-shadow .18s,transform .18s;box-shadow:0 1px 4px rgba(0,0,0,.05)}
.order-card:hover{box-shadow:0 6px 20px rgba(0,0,0,.09);transform:translateY(-1px)}
.order-card.al-late{border-color:#F09595;box-shadow:0 2px 8px rgba(163,45,45,.08)}.order-card.al-warn{border-color:#FAC775;box-shadow:0 2px 8px rgba(186,117,23,.08)}.order-card.al-done{border-color:#C0DD97;box-shadow:0 2px 8px rgba(59,109,17,.06)}.order-card.al-ok{border-color:#9FE1CB;box-shadow:0 2px 8px rgba(15,110,86,.06)}
.order-card.al-pending{border-color:#F09595;box-shadow:0 2px 8px rgba(163,45,45,.08)}
.order-header{display:flex;align-items:center;gap:10px;padding:10px 14px;cursor:pointer;user-select:none;transition:background .12s}
.al-late .order-header{background:#FFF5F5}.al-warn .order-header{background:#FFFBF0}.al-done .order-header{background:#F7FAF2}.al-ok .order-header{background:#F2FBF7}
.al-pending .order-header{background:#FFF5F5}
.order-header:hover{filter:brightness(.97)}
.oh-icon{width:32px;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;font-weight:700;color:#fff}
.oh-icon-late{background:#E24B4A}.oh-icon-warn{background:#EF9F27}.oh-icon-ok{background:#1D9E75}.oh-icon-done{background:#888780}
.oh-left{flex:1;min-width:0}
.oh-title{font-size:13px;font-weight:600}
.oh-sub{font-size:11px;color:#888;margin-top:2px}
.oh-right{display:flex;align-items:center;gap:6px;flex-shrink:0;flex-wrap:wrap}
.pbar-wrap{height:6px;background:#E8E7E0;border-radius:3px;overflow:hidden}
.pbar-fill{height:100%;transition:width .5s cubic-bezier(.4,0,.2,1);border-radius:3px}
.al-ok .pbar-fill{background:linear-gradient(90deg,#1D9E75,#5DCAA5)}.al-warn .pbar-fill{background:linear-gradient(90deg,#EF9F27,#F5C15A)}.al-late .pbar-fill{background:linear-gradient(90deg,#E24B4A,#F09595)}.al-done .pbar-fill{background:linear-gradient(90deg,#888780,#B4B2A9)}
.al-pending .pbar-fill{background:linear-gradient(90deg,#E24B4A,#F09595)}
.order-body{display:none;padding:14px}
.order-body.open{display:block}
/* Tabs */
.tabs{display:flex;gap:0;border-bottom:2px solid #EEEDFE;margin-bottom:12px;flex-wrap:wrap}
.tab{font-size:12px;padding:8px 18px;cursor:pointer;color:#888;border-bottom:2.5px solid transparent;margin-bottom:-2px;border-radius:8px 8px 0 0;transition:all .15s;font-weight:500;letter-spacing:.01em}
.tab:hover{background:#F7F6FF;color:#534AB7}
.tab.active{color:#534AB7;border-bottom-color:#534AB7;font-weight:700;background:linear-gradient(180deg,#EEEDFE 0%,#F4F3FF 100%)}
.tab-panel{display:none}.tab-panel.active{display:block}
/* Fields */
.field-row{display:flex;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.field-group{flex:1;min-width:110px}
.field-group label{display:block;font-size:11px;color:#777;margin-bottom:3px;font-weight:500}
.section-head{font-size:12px;font-weight:700;color:#534AB7;margin:12px 0 8px;display:flex;align-items:center;justify-content:space-between;padding-bottom:6px;border-bottom:2px solid #EEEDFE;letter-spacing:.01em}
.notes-area{width:100%;resize:vertical;min-height:52px;font-size:12px;border-radius:8px;margin-top:6px}
/* Design card */
.design-card{border-radius:12px;padding:14px;margin-bottom:12px;border:1.5px solid #AFA9EC;background:linear-gradient(135deg,#EEEDFE 0%,#f0effe 100%)}
.design-card-head{display:flex;align-items:flex-start;gap:8px;margin-bottom:8px;flex-wrap:wrap}
/* Design-name grouping — all codes of one design name shown together */
.design-name-group{margin-bottom:16px;border:1.5px solid #C7C2F0;border-radius:14px;overflow:hidden;background:#fbfaff}
.design-name-group-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;
  padding:11px 16px;background:linear-gradient(135deg,#534AB7,#3C3489);color:#fff}
.design-name-group-head .dng-title{font-size:14px;font-weight:700;letter-spacing:.01em}
.design-name-group-head .dng-meta{font-size:11px;font-weight:600;opacity:.9;background:rgba(255,255,255,.16);padding:3px 10px;border-radius:20px}
.design-name-group-body{padding:12px 12px 4px}
.design-name-group-body .design-card{margin-bottom:10px}
.design-num{width:26px;height:26px;border-radius:50%;background:#534AB7;color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:2px}
/* Gallery */
.design-imgs-gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(108px,1fr));gap:10px;margin:10px 0}
.gallery-img-card{background:#fff;border-radius:10px;border:1.5px solid #AFA9EC;overflow:hidden;position:relative;transition:box-shadow .15s}
.gallery-img-card:hover{box-shadow:0 4px 12px rgba(83,74,183,.2)}
.gallery-img-card img{width:100%;height:108px;object-fit:cover;display:block;cursor:zoom-in}
.gallery-img-card .img-footer{padding:4px 8px;background:#fff;border-top:1px solid #E8E7E0;display:flex;align-items:center;justify-content:space-between}
.gallery-img-card .img-num{font-size:10px;font-weight:600;color:#534AB7}
.gallery-img-card .del-img{background:none;border:none;color:#A32D2D;cursor:pointer;font-size:11px;padding:0 2px;width:auto}
.gallery-add-card{background:#f7f6ff;border:2px dashed #AFA9EC;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;color:#534AB7;font-size:11px;font-weight:500;gap:4px;min-height:136px;transition:background .15s}
.gallery-add-card:hover{background:#EEEDFE;border-color:#534AB7}
.gallery-add-icon{font-size:22px}
.gallery-img-label{position:absolute;top:4px;left:4px;background:rgba(83,74,183,.8);color:#fff;font-size:9px;padding:2px 5px;border-radius:4px;font-weight:500}
/* Variety table */
.variety-table-wrap{overflow-x:auto;margin:10px 0;border-radius:10px;border:1.5px solid #AFA9EC}
.variety-table{width:100%;border-collapse:collapse;font-size:11px;min-width:500px}
.variety-table th{background:#534AB7;color:#fff;padding:7px 10px;text-align:center;font-weight:600;white-space:nowrap;border-right:1px solid rgba(255,255,255,.2)}
.variety-table th:first-child{text-align:left}
.variety-table th:last-child{border-right:none}
.variety-table td{padding:6px 8px;border-bottom:1px solid #E8E7E0;border-right:1px solid #E8E7E0;text-align:center;vertical-align:middle}
.variety-table td:first-child{text-align:left;background:#f7f6ff;font-weight:600;border-right:2px solid #AFA9EC}
.variety-table td.total-col{border-right:none;font-weight:700;color:#534AB7;background:#EEEDFE}
.variety-table tfoot td{border-bottom:none;font-weight:700;background:#f0efff;color:#3C3489;border-top:2px solid #534AB7}
.variety-table tfoot td.grand-total{background:#534AB7;color:#fff;font-size:12px}
.variety-table input.qty-inp{width:52px;text-align:center;padding:4px 3px;font-size:11px;border-color:#AFA9EC;border-radius:5px}
.variety-table th.sz-head{min-width:64px}
.variety-name-inp{font-size:11px;padding:4px 6px;border-color:#AFA9EC;min-width:100px}
.variety-thumb{width:36px;height:36px;object-fit:cover;border-radius:5px;border:1px solid #AFA9EC;cursor:zoom-in;vertical-align:middle}
.variety-img-cell{display:flex;align-items:center;gap:4px;flex-wrap:wrap;min-width:80px}
.variety-img-add{width:28px;height:28px;border-radius:5px;border:1.5px dashed #AFA9EC;background:#f7f6ff;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#534AB7;font-size:14px;flex-shrink:0;border:1.5px dashed #AFA9EC}
.variety-img-add:hover{background:#EEEDFE;border-color:#534AB7}
/* Stages */
.design-stages-section{background:#fff;border-radius:14px;padding:14px;margin-bottom:8px;border:1.5px solid #D0CCF5;box-shadow:0 2px 8px rgba(83,74,183,.05)}
.design-stages-head{font-size:12px;font-weight:600;color:#534AB7;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between;padding-bottom:6px;border-bottom:1px dashed #AFA9EC}
.stage-list{margin-bottom:6px}
.stage-item{border-radius:10px;margin-bottom:8px;border:1px solid transparent;overflow:hidden}
.si-done{background:#F2FBF7;border-color:#9FE1CB}.si-active{background:#EEF6FE;border-color:#B5D4F4}
.si-warn{background:#FFFBF0;border-color:#FAC775}.si-late{background:#FFF5F5;border-color:#F7C1C1}
.si-delayed{background:#FFF5F5;border-color:#F7C1C1}.si-idle{background:#f7f6f2;border-color:#D3D1C7}
.stage-item-top{display:flex;align-items:center;gap:6px;padding:8px 10px;flex-wrap:wrap}
.stage-item-bottom{padding:8px 10px;border-top:1px solid rgba(0,0,0,.05);background:rgba(255,255,255,.6);display:flex;gap:10px;flex-wrap:wrap}
.stage-dot{width:20px;height:20px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;border:2px solid transparent}
.sd-done{background:#E1F5EE;border-color:#1D9E75;color:#085041}.sd-active{background:#E6F1FB;border-color:#378ADD;color:#0C447C}
.sd-warn{background:#FAEEDA;border-color:#EF9F27;color:#633806}.sd-late{background:#FCEBEB;border-color:#E24B4A;color:#791F1F}.sd-idle{background:#F1EFE8;border-color:#B4B2A9;color:#5F5E5A}
.stage-name-wrap{flex:1;min-width:120px}
.stage-name-txt{font-size:12px;font-weight:600}
.stage-loc{font-size:10px;color:#888}
.stage-status-sel{font-size:11px;padding:4px 6px;max-width:115px;flex-shrink:0;width:auto!important}
.stage-days-inp{width:40px!important;font-size:11px;padding:3px 4px;text-align:center;flex-shrink:0}
.stage-date-inp{font-size:10px!important;padding:3px 5px;max-width:110px;flex-shrink:0;width:auto!important}
.stage-vendor-inp{font-size:11px;padding:4px 6px;max-width:160px;flex-shrink:0;width:auto!important}
.stage-notes-area{font-size:11px;min-height:38px;resize:vertical;flex:1;min-width:160px;width:auto!important}
/* Stage flow pills */
.stage-flow{display:flex;align-items:center;gap:3px;flex-wrap:wrap;margin:6px 0}
/* Always-visible stage-flow strip under a collapsed design header */
.stage-flow-peek{padding:8px 14px 10px;margin:0;cursor:pointer;border-top:1px dashed #E0DEF3}
.stage-pill{display:flex;align-items:center;gap:3px;padding:4px 9px;border-radius:20px;font-size:10px;font-weight:500;border:1.5px solid transparent;white-space:nowrap}
.sp-done{background:#E1F5EE;border-color:#1D9E75;color:#085041}.sp-active{background:#E6F1FB;border-color:#378ADD;color:#0C447C}
.sp-warn{background:#FAEEDA;border-color:#EF9F27;color:#633806}.sp-late{background:#FCEBEB;border-color:#E24B4A;color:#791F1F}.sp-idle{background:#F1EFE8;border-color:#B4B2A9;color:#5F5E5A}
.stage-arrow{color:#AFA9EC;font-size:11px}
/* Design view */
.design-stage-block{border-radius:12px;border:1.5px solid #D3D1C7;margin-bottom:12px;overflow:hidden;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.05)}
.design-stage-header{background:linear-gradient(135deg,#f5f4fe,#eeeffe);padding:10px 14px;font-size:12px;font-weight:600;color:#534AB7;border-bottom:1px solid #D3D1F5;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.design-stage-body{padding:12px 14px}
.design-sub-card{background:#f8f7fd;border-radius:8px;border:1px solid #D3D1F5;padding:10px 12px;margin-bottom:8px}
.design-sub-head{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.design-order-badge{font-size:10px;font-weight:600;padding:2px 8px;border-radius:99px;background:#EEEDFE;color:#534AB7;border:1px solid #AFA9EC}
.design-imgs-mini{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.design-imgs-mini img{width:58px;height:58px;border-radius:6px;object-fit:cover;border:1px solid #AFA9EC;cursor:zoom-in;transition:transform .15s}
.design-imgs-mini img:hover{transform:scale(1.06)}
/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(20,18,42,.5);z-index:1000;display:flex;align-items:flex-start;justify-content:center;padding:30px 16px;overflow-y:auto;backdrop-filter:blur(2px)}
.modal{background:#fff;border:1.5px solid #D0CCF5;border-radius:20px;padding:1.4rem;width:680px;max-width:98%;max-height:90vh;overflow-y:auto;position:relative;box-shadow:0 24px 64px rgba(0,0,0,.22),0 4px 16px rgba(83,74,183,.12)}
.modal-header{display:flex;align-items:center;gap:10px;margin:-1.4rem -1.4rem 1rem;padding:1.1rem 1.4rem 1rem;border-bottom:1.5px solid #EEEDFE;background:linear-gradient(135deg,#F9F8FF,#fff);border-radius:20px 20px 0 0}
.modal-icon{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,#EEEDFE,#E4E2F8);display:flex;align-items:center;justify-content:center;font-size:16px;color:#534AB7;flex-shrink:0;box-shadow:0 2px 6px rgba(83,74,183,.15)}
.modal h3{font-size:15px;font-weight:700;flex:1;color:#1a1916}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin:1rem -1.4rem -1.4rem;border-top:1.5px solid #EEEDFE;padding:12px 1.4rem 1.2rem;background:#FAFAFD;border-radius:0 0 20px 20px}
.stmpl-item{display:flex;align-items:center;gap:5px;padding:7px 10px;border-radius:8px;margin-bottom:4px;background:#F7F6FF;border:1px solid #D3D1F5;flex-wrap:wrap}
.stmpl-item:hover{background:#EEEDFE}
.inline-edit{background:none;border:none;border-bottom:1px dashed #AFA9EC;border-radius:0;padding:2px 3px;font-size:12px;font-weight:500;color:#1a1916;min-width:40px;width:auto!important}
.inline-edit:focus{border-bottom-color:#534AB7;outline:none}
/* Autocomplete */
.ac-wrap{position:relative}
.ac-list{position:absolute;top:100%;left:0;right:0;background:#fff;border:1.5px solid #AFA9EC;border-radius:0 0 8px 8px;z-index:300;max-height:160px;overflow-y:auto;box-shadow:0 4px 12px rgba(0,0,0,.1)}
.ac-item{padding:7px 10px;cursor:pointer;font-size:12px;transition:background .1s}
.ac-item:hover,.ac-item.ac-sel{background:#EEEDFE;color:#534AB7}
/* Lightbox */
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:2000;display:flex;align-items:center;justify-content:center}
.lightbox-close{position:fixed;top:14px;right:18px;color:#fff;font-size:22px;cursor:pointer;background:rgba(0,0,0,.5);border-radius:50%;width:36px;height:36px;display:flex;align-items:center;justify-content:center;border:none;z-index:2001;width:auto!important}
.lightbox-nav{position:fixed;top:50%;transform:translateY(-50%);background:rgba(0,0,0,.5);color:#fff;border:none;border-radius:50%;width:40px;height:40px;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:2001;width:auto!important}
.lightbox-nav.lb-prev{left:12px}.lightbox-nav.lb-next{right:12px}
.lightbox-counter{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);color:#fff;font-size:12px;background:rgba(0,0,0,.55);padding:4px 12px;border-radius:20px}
.lightbox img{max-width:90vw;max-height:88vh;border-radius:10px;display:block}
/* Audit */
.audit-list{max-height:300px;overflow-y:auto;border:1px solid #E8E7E0;border-radius:8px;padding:6px}
.audit-item{padding:6px 8px;border-bottom:1px solid #f1efe8;font-size:11px;display:flex;gap:8px;align-items:baseline}

.audit-time{color:#AFA9EC;white-space:nowrap;flex-shrink:0;font-size:10px}

/* Analytics */
.analytics-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}

.bar-chart{display:flex;flex-direction:column;gap:7px}
.bar-row{display:flex;align-items:center;gap:8px}
.bar-label{font-size:11px;color:#555;width:130px;flex-shrink:0;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.metric-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.metric-box{background:linear-gradient(135deg,#F9F8FF,#EEEDFE);border-radius:12px;padding:14px 16px;text-align:center;border:1.5px solid #D0CCF5;transition:transform .15s}
.metric-box:hover{transform:translateY(-2px)}
.metric-val{font-size:24px;font-weight:800;color:#3C3489;letter-spacing:-.02em}
.metric-lbl{font-size:10px;font-weight:700;color:#6C64CC;margin-top:3px;text-transform:uppercase;letter-spacing:.04em}
.pie-svg{display:block;margin:0 auto 10px}
.pie-legend{display:flex;flex-direction:column;gap:5px}
.pie-leg-item{display:flex;align-items:center;gap:7px;font-size:11px;color:#444}
.pie-leg-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
/* Upload zone */
.upload-order-zone{border:2.5px dashed #AFA9EC;border-radius:12px;padding:24px 20px;text-align:center;background:#f7f6ff;cursor:pointer;transition:all .15s}

.upload-order-zone p{font-size:12px;color:#888;margin-top:4px}
/* Size total */
.size-total{font-size:11px;color:#3C3489;margin-top:8px;font-weight:600;text-align:right}
/* Misc */
.chevron{font-size:10px;color:#888;transition:transform .2s;display:inline-block;margin-left:4px}
.chevron.open{transform:rotate(90deg)}
.empty-state{text-align:center;padding:3rem 1rem;color:#888}

/* Modal variety rows */

.modal-sizes-grid{display:flex;gap:6px;flex-wrap:wrap}
.modal-size-cell{display:flex;flex-direction:column;align-items:center;gap:3px}

.modal-size-cell input{width:56px;text-align:center;padding:4px 3px;font-size:11px}
.modal-add-size-row{display:flex;gap:6px;align-items:center;margin-top:6px;flex-wrap:wrap}

/* ── INVENTORY MODULE ── */
.inv-toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px;background:#fff;border-radius:12px;padding:10px 16px;border:1.5px solid var(--border)}

.inv-summary-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}

.inv-sum-fin .inv-sum-lbl{color:#2E7D32}.inv-sum-moves .inv-sum-lbl{color:#534AB7}
.inv-table-wrap{background:#fff;border-radius:16px;border:1.5px solid #D0CCF5;overflow:hidden;margin-bottom:14px;box-shadow:0 2px 12px rgba(83,74,183,.07)}
.inv-table-head{background:linear-gradient(135deg,#534AB7,#3C3489);padding:13px 16px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}

.inv-col-raw{background:#FFFBF0;color:#854F0B;font-weight:600}

.mv-badge{font-size:10px;font-weight:600;padding:3px 9px;border-radius:99px;white-space:nowrap;display:inline-block;margin-bottom:4px}
.mv-raw-in{background:#FFF8E1;color:#E65100;border:1px solid #FFD54F}

.mv-semi-in{background:#E3F2FD;color:#0D47A1;border:1px solid #90CAF9}

.mv-fin-in{background:#E8F5E9;color:#1B5E20;border:1px solid #A5D6A7}
.mv-fin-out{background:#FFEBEE;color:#B71C1C;border:1px solid #EF9A9A}
.mv-detail{font-size:11px;color:#555}
.mv-qty{font-size:12px;font-weight:700;text-align:right;white-space:nowrap}

.inv-add-form{background:#f7f6ff;border-radius:10px;border:1.5px solid #AFA9EC;padding:14px;margin-bottom:14px}

/* ── Physical Stock ─────────────────────────────────────────────────────── */

.stock-card-title{font-size:13px;font-weight:700;color:#1a1916;margin-bottom:2px}

.stock-card-total{font-size:12px;font-weight:700;color:#0F6E56;background:#E1F5EE;border-radius:6px;padding:3px 10px;display:inline-block}
.stock-card-actions{display:flex;gap:5px;margin-top:8px;padding-top:8px;border-top:1px solid #F1EFE8}
.stock-table{width:100%;border-collapse:collapse;font-size:11px;background:#fff;border-radius:12px;overflow:hidden}

.stage-group-raw{border-color:#FFD54F!important;}.stage-group-semi{border-color:#90CAF9!important;}.stage-group-finished{border-color:#A5D6A7!important;}

/* ───────────────────────────────────────────────────────────────────────────
   CRITICAL: prevent horizontal page scroll at every viewport width
   ─────────────────────────────────────────────────────────────────────────── */

.dash,.header-band,.stats,.main-tabs,.filter-bar,#view-orders,#view-vendor,#view-design,#view-analytics,#view-inventory,#view-masters{max-width:100%}

/* ── TOUCH DEVICE ROBUSTNESS ───────────────────────────────────────────────
   Targets touchscreens specifically (phones + tablets). Makes interactive
   elements obviously tappable, removes iOS 300ms tap delay, and improves
   visual feedback. */
@media(hover:none) and (pointer:coarse){
  button, .icon-btn, .main-tab, .tab, select, input, textarea, a, [onclick]{
    touch-action: manipulation;
    -webkit-tap-highlight-color: rgba(83, 74, 183, .18);
  }
  /* Custom dropdown arrow so iOS users see selects are tappable */
  select{
    -webkit-appearance: none;
    appearance: none;
    background-image: linear-gradient(45deg, transparent 50%, #534AB7 50%),
                      linear-gradient(135deg, #534AB7 50%, transparent 50%);
    background-position: calc(100% - 16px) 55%, calc(100% - 11px) 55%;
    background-size: 5px 5px, 5px 5px;
    background-repeat: no-repeat;
    padding-right: 28px !important;
  }
  /* Minimum touch target — 44px is Apple HIG recommendation */
  button, .icon-btn, .main-tab, .tab, select, input[type=text], input[type=number],
  input[type=date], input[type=email], input[type=password]{
    min-height: 40px;
  }
  /* Visible tap state */
  button:active, .icon-btn:active, .main-tab:active, .tab:active, .order-header:active{
    opacity: .75;
    transform: scale(.98);
  }
  /* Filter dropdowns get extra padding/visibility on mobile */
  .filter-bar select{
    font-size: 14px !important;
    padding: 10px 32px 10px 12px !important;
    background-color: #fff !important;
    border: 1.5px solid #AFA9EC !important;
  }
  /* Autocomplete suggestion items: bigger tap zones */
  .ac-item{padding: 12px 14px !important; font-size: 14px !important}
}

@media print{
  .header-actions,.filter-bar,.main-tabs,.no-print{display:none!important}
  .client-body{display:block!important}
  .order-body{display:block!important}
  .dash{padding:0!important}
  .order-card{break-inside:avoid;margin-bottom:8px;box-shadow:none!important;border:1px solid #ccc!important}
  .modal-overlay,.lightbox{display:none!important}
  /* Tab-aware print: when designs tab, hide stages section */
  .print-hide-stages .design-stages-section{display:none!important}
  .print-hide-designs .design-card{display:none!important}
  /* Always show active tab panel */
  .tab-panel{display:none!important}
  .tab-panel.print-show{display:block!important}
  .tabs{display:none!important}
  /* Design view blocks for print */
  .design-stage-block{break-inside:avoid}
}
/* ── AUTOSAVE / UNDO BAR ── */
.save-bar{position:sticky;top:0;z-index:500;background:linear-gradient(90deg,#1a1750,#2d2680);border-bottom:1px solid rgba(255,255,255,.1);padding:6px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.save-bar-status{font-size:11px;color:#AFA9EC;flex:1;min-width:120px;display:flex;align-items:center;gap:6px}
.save-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;transition:background .3s}
.save-dot.saved{background:#5DCAA5;box-shadow:0 0 6px #5DCAA5}
.save-dot.saving{background:#EF9F27;animation:blink .6s infinite alternate}
.save-dot.error{background:#F09595}
@keyframes blink{from{opacity:.4}to{opacity:1}}
.save-bar button{font-size:11px;padding:4px 11px;border-radius:6px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.1);color:#fff;transition:all .15s}
.save-bar button:hover{background:rgba(255,255,255,.22)}
.save-bar button:disabled{opacity:.35;cursor:not-allowed}
.save-bar button.sb-danger{border-color:#F09595;background:rgba(240,149,149,.15);color:#F09595}
.save-bar button.sb-danger:hover{background:rgba(240,149,149,.28)}
.save-bar-sep{width:1px;height:18px;background:rgba(255,255,255,.15);flex-shrink:0}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1a1750;color:#fff;padding:9px 20px;border-radius:30px;font-size:12px;font-weight:500;box-shadow:0 4px 18px rgba(0,0,0,.3);z-index:9999;pointer-events:none;border:1px solid rgba(255,255,255,.15);transition:opacity .4s}
.toast.green{border-color:#5DCAA5;background:#0d4035}
.toast.amber{border-color:#EF9F27;background:#5a3900}
.toast.red{border-color:#F09595;background:#5a1a1a}

/* ══════════════════════════════════════════════════════════════════
   MOBILE RESPONSIVE — clean, hierarchical, bird's-eye-view first
   ══════════════════════════════════════════════════════════════════ */
@media (max-width:768px){
  /* === GLOBAL TYPOGRAPHY === */
  body{font-size:14px;line-height:1.45;-webkit-text-size-adjust:100%}
  input,select,textarea{font-size:16px!important}  /* prevent iOS zoom-on-focus */
  .dash{padding:8px}

  /* === SAVE BAR + FB BAR (top status strips) === */
  .save-bar,.fb-bar{padding:6px 12px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
  .save-bar::-webkit-scrollbar,.fb-bar::-webkit-scrollbar{display:none}
  .save-bar-status,#fb-status-txt{font-size:11px;min-width:auto;white-space:nowrap}
  .save-bar button,.fb-bar button{font-size:11px;padding:5px 10px;flex-shrink:0;white-space:nowrap;min-height:32px}
  .save-bar-sep{flex-shrink:0}

  /* === MAIN HEADER (logo + title + actions) === */
  .header-band{padding:14px 16px;flex-direction:column;align-items:stretch;gap:10px;border-radius:14px;margin-bottom:12px}
  .header-band h1{font-size:18px;font-weight:700}
  .header-band p{font-size:11px;opacity:.85}
  .app-logo-img{width:36px!important;height:36px!important;margin-right:8px!important}
  .header-actions{width:100%;display:flex;gap:6px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
  .header-actions::-webkit-scrollbar{display:none}
  .header-actions button{flex-shrink:0;font-size:12px;padding:8px 14px;min-height:38px;font-weight:600}

  /* === STATS CARDS — 2-col grid with proper hierarchy === */
  .stats{grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:14px}
  .stat-card{padding:14px 16px;border-radius:14px}
  .stat-val{font-size:26px;font-weight:800;line-height:1}
  .stat-lbl{font-size:10px;text-transform:uppercase;letter-spacing:.05em;font-weight:700;opacity:.7;margin-top:6px}

  /* === MAIN NAVIGATION TABS === */
  .main-tabs{overflow-x:auto;flex-wrap:nowrap;gap:6px;padding-bottom:6px;scrollbar-width:none;margin-bottom:12px;-webkit-overflow-scrolling:touch}
  .main-tabs::-webkit-scrollbar{display:none}
  .main-tab{white-space:nowrap;flex-shrink:0;padding:10px 18px;font-size:13px;border-radius:10px;font-weight:600}

  /* === FILTER BAR === */
  .filter-bar{padding:12px 14px;gap:10px;border-radius:14px;display:grid;grid-template-columns:1fr 1fr;align-items:end}
  .filter-bar > label{grid-column:1/-1;font-size:11px;color:#6C64CC;font-weight:700;margin-bottom:-4px}
  .filter-bar > div{width:100%;min-width:0}
  .filter-bar label{font-size:10px;margin-bottom:4px}
  .filter-bar select{font-size:14px;padding:9px 28px 9px 10px;width:100%}
  .filter-clear{grid-column:1/-1;padding:8px 12px;font-size:12px;width:auto;justify-self:start}

  /* === CLIENT GROUP (e.g. "Selva Gold · 1 order") === */
  .client-wrap{margin-bottom:10px;border-radius:14px;overflow:hidden}
  .client-header{padding:14px 16px}
  .client-name,.client-header h2{font-size:15px;font-weight:700}
  .client-stats{font-size:11px;opacity:.85}
  .client-actions button{font-size:11px;padding:6px 12px;min-height:32px}
  .client-body{padding:10px 8px 8px}

  /* === ORDER CARD — single-row bird's-eye when collapsed === */
  .order-card{margin-bottom:8px;border-radius:12px;overflow:hidden;background:#fff;border:1px solid #eae8f8}
  .order-header{
    display:flex !important;
    align-items:center !important;
    gap:10px !important;
    padding:14px 14px !important;
    flex-wrap:nowrap !important;       /* critical: no wrapping */
    cursor:pointer;
  }
  .oh-icon{
    width:36px;height:36px;
    font-size:14px;
    border-radius:9px;
    flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
  }
  .oh-left{
    flex:1 1 0 !important;
    min-width:0 !important;            /* critical: allows ellipsis */
    overflow:hidden;
  }
  .oh-title{
    font-size:14px !important;
    font-weight:700 !important;
    color:#1a1916;
    white-space:nowrap !important;
    overflow:hidden !important;
    text-overflow:ellipsis !important;
    line-height:1.3;
  }
  .oh-sub{
    font-size:11px !important;
    color:#666;
    white-space:nowrap !important;
    overflow:hidden !important;
    text-overflow:ellipsis !important;
    margin-top:3px !important;
    line-height:1.3;
  }
  .oh-right{
    flex-shrink:0 !important;
    display:flex !important;
    align-items:center !important;
    gap:6px !important;
    flex-wrap:nowrap !important;
    max-width:none !important;
  }
  /* In the bird's-eye view, hide everything except status badge + chevron.
     Action buttons live inside the expanded body's bottom action bar. */
  .oh-right .icon-btn{display:none !important}
  .oh-right .badge{font-size:9px !important;padding:2px 7px !important;line-height:1.5}
  /* Hide "Normal" priority badge on mobile — only show urgent priorities */
  .oh-right .b-prio{display:none !important}
  .chevron{font-size:12px;width:16px;text-align:center;color:#888}

  /* Progress bar under header */
  .pbar-wrap{height:3px}

  /* === EXPANDED ORDER BODY === */
  .order-body{padding:0 !important}
  .order-body.open{padding:14px !important}

  /* === IN-ORDER TABS === */
  .tabs{overflow-x:auto;flex-wrap:nowrap;gap:4px;scrollbar-width:none;margin-bottom:12px;padding-bottom:4px}
  .tabs::-webkit-scrollbar{display:none}
  .tab{white-space:nowrap;flex-shrink:0;padding:8px 14px;font-size:12px;border-radius:8px;font-weight:600}

  /* === MOBILE ACTION BAR — shows inside expanded order body === */
  .mobile-action-bar{
    display:flex !important;gap:6px;margin-top:14px;padding-top:12px;
    border-top:1px solid #eae8f8;flex-wrap:wrap;
  }
  .mobile-action-bar button{
    flex:1;min-width:90px;font-size:12px;padding:9px 12px;
    border-radius:9px;font-weight:600;min-height:38px;
  }

  /* === FIELD ROWS — stack vertically with consistent spacing === */
  .field-row{flex-direction:column;gap:10px;margin-bottom:10px}
  .field-group{min-width:100%;max-width:100%}
  .field-group label{font-size:11px;font-weight:700;color:#6C64CC;letter-spacing:.02em;margin-bottom:4px;display:block}
  .field-group input,.field-group select,.field-group textarea{
    font-size:14px !important;
    padding:9px 11px !important;
    border-radius:9px;
    height:auto;
    min-height:40px;
    box-sizing:border-box;
    width:100%;
  }
  /* iOS renders type="date" with extra chrome — keep it the same height as text inputs */
  .field-group input[type="date"],.field-group input[type="time"],.field-group input[type="datetime-local"]{
    min-height:40px !important;
    max-height:40px !important;
    line-height:1.2;
    padding:8px 11px !important;
    -webkit-appearance:none;
    appearance:none;
    background-color:#fff;
  }
  /* Compact long helper text shown under auto-id field */
  .field-group .field-hint{font-size:10px;color:#888;margin-top:3px;line-height:1.35}
  /* Optional fields like Notes get a shorter textarea on mobile */
  .field-group textarea{min-height:56px;max-height:120px;resize:vertical}

  /* === DESIGN CARD === */
  .design-card{padding:14px;border-radius:12px;margin-bottom:12px}
  .design-card-head{display:flex;flex-direction:column;gap:10px;align-items:stretch !important}
  .design-card-head > div{width:100%}
  .design-num{width:30px;height:30px;font-size:13px;border-radius:8px;flex-shrink:0}

  /* === VARIETY TABLE — horizontally scrollable with visual hint === */
  .variety-table-wrap{
    overflow-x:auto;margin:0 -8px;padding:0 8px;
    -webkit-overflow-scrolling:touch;
    scroll-snap-type:x proximity;
    position:relative;
  }
  .variety-table{font-size:11px;min-width:max-content}
  .variety-table th{font-size:10px;padding:7px 6px;font-weight:700;white-space:nowrap}
  .variety-table td{font-size:11px;padding:5px 6px}
  .variety-table .sz-head{font-size:10px;padding:7px 4px}
  .qty-inp{width:42px !important;font-size:13px !important;padding:5px 4px !important;text-align:center}
  .variety-name-inp{font-size:13px;padding:6px 8px;min-width:120px}

  /* === STAGE FLOW (pill row) === */
  .stage-flow{overflow-x:auto;flex-wrap:nowrap;scrollbar-width:none;padding:0 0 8px;-webkit-overflow-scrolling:touch}
  .stage-flow::-webkit-scrollbar{display:none}
  .stage-pill{white-space:nowrap;flex-shrink:0;font-size:10px;padding:5px 10px}
  .stage-arrow{flex-shrink:0}

  /* === STAGE GROUPS === */
  .stage-group{padding:12px;margin-bottom:10px;border-radius:12px}
  .stage-group-head{flex-wrap:wrap;gap:6px;font-size:13px}
  .stage-item{padding:12px;border-radius:10px;margin-bottom:8px}
  .stage-item-top{flex-direction:column;align-items:stretch !important;gap:8px !important}
  .stage-item-bottom{flex-direction:column !important;gap:8px !important}
  .stage-name-wrap{width:100%;min-width:0}
  .stage-status-sel,.stage-vendor-inp,.stage-date-inp,.stage-notes-area,.stage-days-inp{
    width:100% !important;max-width:100% !important
  }

  /* === DESIGN STAGES (collapsible per-design) === */
  .design-stages-section{padding:0;margin-bottom:10px;border-radius:12px;overflow:hidden;border:1px solid #eae8f8}
  .design-stages-head{padding:14px;flex-wrap:wrap;gap:8px !important;font-size:13px}

  /* === MODALS as bottom sheets === */
  .modal-overlay{padding:0;align-items:flex-end}
  .modal{
    width:100% !important;max-width:100% !important;
    border-radius:18px 18px 0 0;
    max-height:92vh;padding:18px 16px;
  }
  .modal-header h3{font-size:16px}
  .modal-actions{flex-wrap:wrap;gap:8px;margin-top:14px}
  .modal-actions button{flex:1;min-width:100px;padding:11px;font-size:13px;min-height:42px}

  /* === DESIGN VIEW === */
  .design-imgs-gallery{grid-template-columns:repeat(2,1fr);gap:10px}
  .gallery-img-card img{height:140px}

  /* === ANALYTICS === */
  .analytics-grid{grid-template-columns:1fr}
  .bar-label{width:90px;font-size:10px}

  /* === INVENTORY === */
  .inv-summary-grid{grid-template-columns:repeat(2,1fr);gap:8px}
  .inv-sum-val{font-size:18px}
  .metric-grid{grid-template-columns:repeat(2,1fr);gap:8px}
  .metric-val{font-size:18px}
  .inv-table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
  .inv-toolbar{padding:10px 12px;gap:8px;flex-wrap:wrap}
  .inv-period-tabs{overflow-x:auto;flex-wrap:nowrap;scrollbar-width:none}
  .inv-period-tab{white-space:nowrap;flex-shrink:0;font-size:12px;padding:8px 14px}

  /* === TOAST === */
  .toast{
    left:12px !important;right:12px !important;bottom:18px !important;
    transform:none !important;text-align:center;border-radius:12px;font-size:13px;padding:12px 16px;
  }
}

// continue working exactly as before — nothing is deleted or moved.

const R2_WORKER_URL = 'https://bt-image-upload.sayyamranka09.workers.dev';

// Try to upload a compressed base64 image to R2.
// Returns the public https:// URL on success, or null on failure/not-configured.
// Callers fall back to storing base64 when null is returned.
async function uploadToR2(base64DataUrl){
  if(!R2_WORKER_URL||!R2_UPLOAD_KEY)return null;
  try{
    const type=(base64DataUrl.split(';')[0]||'').replace('data:','')||'image/jpeg';
    const resp=await fetch(R2_WORKER_URL,{
      method:'POST',
      headers:{'Content-Type':'application/json','X-Upload-Key':R2_UPLOAD_KEY},
      body:JSON.stringify({data:base64DataUrl,type})
    });
    if(!resp.ok)return null;
    const j=await resp.json();
    return j.url||null;
  }catch(e){
    console.warn('R2 upload failed, keeping base64:',e.message);
    return null;
  }
}

// Helper: get group for a stage template

// ── UTILS ──────────────────────────────────────────────────────────────────────
function uid(){return 'u'+Math.random().toString(36).slice(2,8)}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function today(){return new Date(new Date().toDateString())}
function fmtDate(d){
  if(!d)return'';const dt=typeof d==='string'?new Date(d+'T00:00:00'):d;
  if(isNaN(dt.getTime()))return String(d);
  return String(dt.getDate()).padStart(2,'0')+'/'+String(dt.getMonth()+1).padStart(2,'0')+'/'+dt.getFullYear();

function fmtShort(d){
  if(!d)return'';const dt=typeof d==='string'?new Date(d+'T00:00:00'):d;

// Returns a stage's own name/loc/group. Stages snapshot these at order
// creation, so editing/deleting global stage templates later never affects
// (or "Unknown"-s) the stages of orders already created.
function stageInfo(st){

  return {
    name : st.name || (t&&t.name) || 'Stage',
    loc  : (st.loc!=null&&st.loc!=='') ? st.loc : ((t&&t.loc)||''),

function stGroup(st){ return st.group || getStageGroup(st.stageId); }
// ── STORAGE KEY (single canonical key – never changes) ────────────────────────
const STORAGE_KEY = 'bangle_prod_tracker';

// ── UNDO / REDO HISTORY STACK ─────────────────────────────────────────────────
const HIST_MAX = 50;
let _hist = [];   // array of JSON snapshots (oldest first)
let _histIdx = -1; // pointer to current position
let _histLock = false; // prevent recording during undo/redo

function snapState(){
  return JSON.stringify({...S,openOrders:[...S.openOrders],openClients:[...S.openClients],openDesignStages:[...(S.openDesignStages||[])]});
}
function histPush(){
  if(_histLock) return;
  // Drop any redo entries ahead of current pointer
  if(_histIdx < _hist.length-1) _hist = _hist.slice(0,_histIdx+1);
  _hist.push(snapState());
  if(_hist.length > HIST_MAX) _hist.shift();
  _histIdx = _hist.length-1;
  updateUndoRedoBtns();
}
function histUndo(){
  if(_histIdx <= 0){ showToast('Nothing to undo','amber'); return; }
  _histIdx--;
  _histLock = true;
  loadSnap(_hist[_histIdx]);
  _histLock = false;
  updateUndoRedoBtns();
  setSaveStatus('saving');
  save();
  showToast('↩ Undone','amber');
}
function histRedo(){
  if(_histIdx >= _hist.length-1){ showToast('Nothing to redo','amber'); return; }
  _histIdx++;
  _histLock = true;
  loadSnap(_hist[_histIdx]);
  _histLock = false;
  updateUndoRedoBtns();
  setSaveStatus('saving');
  save();
  showToast('↪ Redone','amber');
}
function loadSnap(snap){
  const parsed = JSON.parse(snap);
  Object.assign(S, parsed);
  S.openOrders = new Set(parsed.openOrders||[]);
  S.openClients = new Set(parsed.openClients||[]);
  S.openDesignStages = new Set(parsed.openDesignStages||[]);
  render();
}
function updateUndoRedoBtns(){
  const u=document.getElementById('btn-undo'), r=document.getElementById('btn-redo');
  if(u) u.disabled = _histIdx<=0;
  if(r) r.disabled = _histIdx>=_hist.length-1;
  if(u) u.title = `Undo (${_histIdx} step${_histIdx!==1?'s':''} available) Ctrl+Z`;
  if(r) r.title = `Redo (${_hist.length-1-_histIdx} step${_hist.length-1-_histIdx!==1?'s':''} available) Ctrl+Y`;
}

// ── SAVE STATUS INDICATOR ─────────────────────────────────────────────────────
let _saveTimer = null;
function setSaveStatus(state, msg){

// ── AUTOSAVE (debounced 800ms) ─────────────────────────────────────────────────
let _autosaveTimer = null;
function scheduleAutosave(){
  setSaveStatus('saving');
  // Mark local changes as pending IMMEDIATELY (not after the 800ms debounce),
  // so a remote sync arriving in the gap can't wipe a just-made change such
  // as a freshly created order.
  try{ if(_fb) _fb.pendingLocal = true; }catch(e){}
  clearTimeout(_autosaveTimer);
  _autosaveTimer = setTimeout(()=>{ save(); }, 800);
}

// ── INDEXEDDB FOR IMAGES (quota-safe image storage) ──────────────────────────
// localStorage is limited to ~5MB. Images stored as base64 can easily exceed this.
// We strip images out of the JSON saved to localStorage and store them separately in IndexedDB.
// This gives effectively unlimited image storage while keeping all order data in localStorage.

const IDB_NAME = 'bangle_images_v1';
const IDB_STORE = 'images';
let _idb = null;

function idbOpen(){
  return new Promise((resolve,reject)=>{
    if(_idb){resolve(_idb);return;}
    const req=indexedDB.open(IDB_NAME,1);
    req.onupgradeneeded=e=>{e.target.result.createObjectStore(IDB_STORE,{keyPath:'key'});};
    req.onsuccess=e=>{_idb=e.target.result;resolve(_idb);};
    req.onerror=e=>reject(e.target.error);
  });
}
async function idbPut(key,value){
  const db=await idbOpen();
  return new Promise((resolve,reject)=>{
    const tx=db.transaction(IDB_STORE,'readwrite');
    tx.objectStore(IDB_STORE).put({key,value});
    tx.oncomplete=()=>resolve();
    tx.onerror=e=>reject(e.target.error);
  });
}
async function idbGet(key){
  const db=await idbOpen();
  return new Promise((resolve,reject)=>{
    const tx=db.transaction(IDB_STORE,'readonly');
    const req=tx.objectStore(IDB_STORE).get(key);
    req.onsuccess=e=>resolve(e.target.result?e.target.result.value:null);
    req.onerror=e=>reject(e.target.error);
  });
}
async function idbGetAll(){
  const db=await idbOpen();
  return new Promise((resolve,reject)=>{
    const tx=db.transaction(IDB_STORE,'readonly');
    const req=tx.objectStore(IDB_STORE).getAll();
    req.onsuccess=e=>resolve(e.target.result||[]);
    req.onerror=e=>reject(e.target.error);
  });
}

// Compress image to print-ready quality: 1200px max @ 0.92 JPEG.
// This single version is used for BOTH display AND print — stored in img.data
// and synced to Firebase inline so every device receives full quality.
function compressImageToThumb(dataUrl,maxDim=1200){
  return new Promise(resolve=>{
    const img=new Image();
    img.onload=()=>{
      let w=img.width,h=img.height;
      if(w>maxDim||h>maxDim){
        if(w>h){h=Math.round(h*maxDim/w);w=maxDim;}
        else{w=Math.round(w*maxDim/h);h=maxDim;}
      }
      const c=document.createElement('canvas');
      c.width=w;c.height=h;
      c.getContext('2d').drawImage(img,0,0,w,h);
      resolve(c.toDataURL('image/jpeg',0.92));
    };
    img.onerror=()=>resolve(dataUrl); // fallback: use original
    img.src=dataUrl;
  });
}

// High-quality version stored locally (IndexedDB) for print output.
// 1200px max dimension @ 0.92 quality — sharp at 65mm×90mm on A4 @ 300dpi.
// Never sent to Firebase (always stripped by extractImages).
function compressImageForPrint(dataUrl,maxDim=1200){
  return new Promise(resolve=>{
    const img=new Image();
    img.onload=()=>{
      let w=img.width,h=img.height;
      if(w>maxDim||h>maxDim){
        if(w>h){h=Math.round(h*maxDim/w);w=maxDim;}
        else{w=Math.round(w*maxDim/h);h=maxDim;}
      }
      const c=document.createElement('canvas');
      c.width=w;c.height=h;
      c.getContext('2d').drawImage(img,0,0,w,h);
      resolve(c.toDataURL('image/jpeg',0.92));
    };
    img.onerror=()=>resolve(dataUrl);
    img.src=dataUrl;
  });
}

// Images above this size are always stripped to IDB regardless of mode.
// At 1200px/0.92 JPEG most images are 200–500 KB base64 — well under 1.5 MB.
// Only exceptionally large/detailed photos would exceed this.
const IMAGE_FB_THRESHOLD=1500000; // ~1.1 MB base64

// Extract images from state.
//
// forFirebase=false  (default, used by save→localStorage):
//   ALL img.data are stripped to IDB regardless of size. localStorage only
//   holds __IDB__ placeholders, staying well under the 5 MB quota.
//
// forFirebase=true  (used by fbPush→Firebase):
//   Images under IMAGE_FB_THRESHOLD stay INLINE in the state payload —
//   this is what lets every other device receive full-quality images without
//   needing access to the uploading device's IndexedDB.
//   Images over the threshold still go to IDB-only (placeholder in Firebase).
//
// hqData (legacy print copies) is always stripped to IDB in both modes.
function extractImages(state,forFirebase=false){
  const imageMap={};
  const cloned=JSON.parse(JSON.stringify(state));

  const maybeStrip=(img,key)=>{
    if(img&&img.data&&typeof img.data==='string'&&img.data.startsWith('data:')){
      const tooBig=img.data.length>IMAGE_FB_THRESHOLD;
      if(!forFirebase||tooBig){
        // localStorage mode: always strip. Firebase mode: only strip if too big.
        imageMap[key]=img.data;
        img.data='__IDB__'+key;
      }
      // forFirebase + small image: leave inline so all devices receive it
    }
    // hqData (legacy): always IDB-only — never sent to Firebase or localStorage
    if(img&&img.hqData&&typeof img.hqData==='string'&&img.hqData.startsWith('data:')){
      imageMap[key+'_hq']=img.hqData;
      img.hqData='__IDB__'+key+'_hq';
    }
  };

  // Stock item images
  (cloned.stockItems||[]).forEach(it=>{
    (it.images||[]).forEach((img,ii)=>{maybeStrip(img,`stkimg_${it.id}_${ii}`);});
  });

  // Attached files — threshold-only strip in both modes (files are large)
  const maybeStripFile=(o,fKey)=>{
    if(o.attachedFile&&o.attachedFile.data&&typeof o.attachedFile.data==='string'&&o.attachedFile.data.startsWith('data:')){
      if(o.attachedFile.data.length>IMAGE_FB_THRESHOLD){
        imageMap[fKey]=o.attachedFile.data;
        o.attachedFile={name:o.attachedFile.name,type:o.attachedFile.type,data:'__IDB__'+fKey};
      }
    }
  };

  // Vendor orders
  (cloned.vendorOrders||[]).forEach(o=>{
    maybeStripFile(o,`file_vo_${o.id}`);
    (o.designs||[]).forEach(d=>{
      (d.images||[]).forEach((img,ii)=>{maybeStrip(img,`img_vord_d_${d.id}_${ii}`);});
      (d.varieties||[]).forEach(v=>{
        (v.images||[]).forEach((img,ii)=>{maybeStrip(img,`img_vord_${d.id}_${v.name||ii}_${ii}`);});
      });
    });
  });

  // Client orders
  (cloned.orders||[]).forEach(o=>{
    maybeStripFile(o,`file_o_${o.id}`);
    (o.designs||[]).forEach(d=>{
      (d.images||[]).forEach((img,ii)=>{maybeStrip(img,`img_d_${d.id}_${ii}`);});
      (d.varieties||[]).forEach(v=>{
        (v.images||[]).forEach((img,ii)=>{maybeStrip(img,`img_v_${v.id}_${ii}`);});
      });
    });
  });
  return{stateNoImages:cloned,imageMap};
}

// Re-inject images from imageMap back into state
function reinjectImages(state,imageMap){
  // Helper: reinject both data and hqData fields
  const reImg=(img)=>{
    if(typeof img.data==='string'&&img.data.startsWith('__IDB__')){
      const key=img.data.slice(7);if(imageMap[key])img.data=imageMap[key];
    }
    if(typeof img.hqData==='string'&&img.hqData.startsWith('__IDB__')){
      const key=img.hqData.slice(7);if(imageMap[key])img.hqData=imageMap[key];
    }
  };
  (state.orders||[]).forEach(o=>{
    // ── Client order attached file (was missing — caused dead download link!) ──
    if(o.attachedFile&&typeof o.attachedFile.data==='string'&&o.attachedFile.data.startsWith('__IDB__')){
      const key=o.attachedFile.data.slice(7);
      if(imageMap[key])o.attachedFile.data=imageMap[key];
    }
    (o.designs||[]).forEach(d=>{
      (d.images||[]).forEach(img=>reImg(img));
      (d.varieties||[]).forEach(v=>{(v.images||[]).forEach(img=>reImg(img));});
    });
  });
  // Reinject vendor order attached files + design-level + variety images
  (state.vendorOrders||[]).forEach(o=>{
    if(o.attachedFile&&typeof o.attachedFile.data==='string'&&o.attachedFile.data.startsWith('__IDB__')){
      const key=o.attachedFile.data.slice(7);
      if(imageMap[key])o.attachedFile.data=imageMap[key];
    }
    (o.designs||[]).forEach(d=>{
      (d.images||[]).forEach(img=>reImg(img));
      (d.varieties||[]).forEach(v=>{(v.images||[]).forEach(img=>reImg(img));});
    });
  });
  // Stock item images
  (state.stockItems||[]).forEach(it=>{(it.images||[]).forEach(img=>reImg(img));});
}

// Download an order's attached file — works whether data is inline (base64
// data URL) or stripped to an "__IDB__" placeholder (fetches from IndexedDB)
async function downloadOrderAttachment(orderId){
  const order = S.orders.find(o => o.id === orderId);
  if(!order || !order.attachedFile){ alert('No attached file found.'); return; }
  let data = order.attachedFile.data;
  // Resolve __IDB__ placeholders (data was stripped to keep state small)
  let attempts = 0;
  while(typeof data === 'string' && data.startsWith('__IDB__') && attempts < 3){
    const key = data.slice(7);
    try{
      const value = await idbGet(key);
      if(!value) break;
      data = value;          // may itself be __IDB__ (if it was previously double-stripped by the old bug)
    }catch(e){ break; }
    attempts++;
  }
  if(typeof data !== 'string' || !data.startsWith('data:')){
    alert('This file was attached on a different device (or before the latest sync fix) so its data isn\'t available on this device.\n\nFix: click "Remove" next to the filename, then re-attach the file by editing the order.');
    return;
  }
  // Trigger a download
  const a = document.createElement('a');
  a.href = data;
  a.download = order.attachedFile.name || 'attachment';
  document.body.appendChild(a);
  a.click();
  setTimeout(()=>document.body.removeChild(a),100);
}

// Re-inject IDB images into S without triggering migration.
// Called on startup AND after every Firebase sync so IDB images
// are never lost when the remote state is applied.
// Returns true if IDB had any data.
async function _injectIDBImages(){
  try{
    const all=await idbGetAll();
    const imageMap={};
    all.forEach(entry=>{imageMap[entry.key]=entry.value;});
    if(Object.keys(imageMap).length>0){
      reinjectImages(S,imageMap);
      return true;
    }
  }catch(e){
    console.warn('IDB inject failed:',e.message);
  }
  return false;
}

// Load images from IDB and inject into state (called on startup).
// If IDB had any image data, automatically migrate it to R2 in the background.
async function loadImagesFromIDB(){
  const hadData = await _injectIDBImages();
  if(hadData){
    setTimeout(_autoMigrateToR2, 2500);
  }
}

// Silently uploads any base64 images in state to Cloudflare R2 and replaces
// them with permanent cloud URLs. Runs automatically after loadImagesFromIDB
// injects IDB data — no user action needed. Safe to call multiple times.
async function _autoMigrateToR2(){
  if(!R2_WORKER_URL||!R2_UPLOAD_KEY) return;
  // Block Firebase FIRST — prevents _applyRemoteState from overwriting
  // IDB-injected data:... images back to __IDB__ refs before we collect them
  try{ _fb.pendingLocal=true; }catch(e){}
  // Re-inject IDB images now that Firebase is blocked
  await _injectIDBImages();
  const toUpload=[];
  const collect=img=>{if(img&&typeof img.data==='string'&&img.data.startsWith('data:'))toUpload.push(img);};
  (S.orders||[]).forEach(o=>(o.designs||[]).forEach(d=>{
    (d.images||[]).forEach(collect);
    (d.varieties||[]).forEach(v=>(v.images||[]).forEach(collect));
  }));
  (S.vendorOrders||[]).forEach(o=>(o.designs||[]).forEach(d=>{
    (d.images||[]).forEach(collect);
    (d.varieties||[]).forEach(v=>(v.images||[]).forEach(collect));
  }));
  (S.stockItems||[]).forEach(it=>(it.images||[]).forEach(collect));
  if(!toUpload.length){
    try{ _fb.pendingLocal=false; }catch(e){} // nothing to migrate, release block
    return;
  }
  let done=0;
  for(let i=0;i<toUpload.length;i+=3){
    await Promise.all(toUpload.slice(i,i+3).map(async img=>{
      try{
        const compressed=await compressImageToThumb(img.data,1200);
        const r2url=await uploadToR2(compressed);
        if(r2url){img.data=r2url;done++;}
      }catch(e){}
    }));
  }
  if(done>0){
    render(); // Show images immediately from in-memory state
    save();   // Persist to localStorage + IDB
    try{ await fbPush(true); }catch(e){} // Push directly — fbPush clears pendingLocal on success
    console.log('[AutoMigrate] Uploaded '+done+' image(s) to R2');
  } else {
    try{ _fb.pendingLocal=false; }catch(e){} // Nothing changed — release the block
  }
}

// ── CORE SAVE (quota-safe) ─────────────────────────────────────────────────────
// Quick check for demo mode (avoids TDZ issue with IS_DEMO_MODE const)
function _isDemoMode(){
  try{ return new URLSearchParams(location.search).get('demo')==='1'; }catch(e){return false;}
}
function save(){
  // Demo mode: never persist anything (preserves real user data on shared devices)
  if(_isDemoMode()){
    setSaveStatus('saved','🎬 Demo mode — changes not saved');
    return;
  }
  try{
    // Extract images to save separately in IndexedDB
    const{stateNoImages,imageMap}=extractImages({...S,openOrders:[...S.openOrders],openClients:[...S.openClients],openDesignStages:[...(S.openDesignStages||[])]});
    // Save text data (no images) to localStorage — stays well under 5MB
    const data=JSON.stringify(stateNoImages);
    localStorage.setItem('bangle_prod_tracker',data);
    localStorage.setItem('bangle_v10',data); // legacy key
    localStorage.setItem('bangle_saved_at', new Date().toISOString());
    // Save images to IndexedDB (no size limit)
    Object.entries(imageMap).forEach(([key,val])=>{idbPut(key,val).catch(e=>console.warn('IDB write fail:',e));});
    setSaveStatus('saved');
  }catch(e){
    // If localStorage still fails (e.g. private mode), try sessionStorage as fallback
    try{
      const data=JSON.stringify({...S,openOrders:[...S.openOrders],openClients:[...S.openClients],openDesignStages:[...(S.openDesignStages||[])]});
      sessionStorage.setItem('bangle_session_fallback',data);
      setSaveStatus('saved','⚠ Saved (session only — localStorage blocked)');
    }catch(e2){
      setSaveStatus('error','⚠ Save failed — storage blocked');
      showToast('⚠ Save failed: '+e.message+'. Try a different browser.','red');
    }
  }
  updateUndoRedoBtns();
}

// ── IMAGE MANIFEST BACKUP ─────────────────────────────────────────────────────
// Exports a CSV listing every image URL with its exact position in the data:
// order ID, client/vendor, design name, design code, variety, photo number.
// This is the safest backup for images — keep this CSV file somewhere safe.
// R2 images are permanent in the cloud; this CSV tells you WHERE each one belongs.
function exportImageManifest(){
  const rows=[['Type','Order ID','Client / Vendor','Design Name','Design Code','Variety','Photo #','Image URL','Status']];

  function addImgRows(type,orderId,partyName,dname,dcode,varName,imgArr){
    (imgArr||[]).forEach((img,i)=>{
      if(!img)return;
      const d=img.data||'';
      let url='',status='';
      if(d.startsWith('https://')){url=d;status='✅ Cloud (R2)';}
      else if(d.startsWith('data:')){url='(base64 — not yet in cloud)';status='⚠️ Local only — run Migrate Images';}
      else if(d.startsWith('__IDB__')){url='(stored in this device only)';status='⚠️ Device-local — run Migrate Images';}
      else return; // empty / unknown — skip
      rows.push([type,orderId,partyName,dname,dcode,varName,i+1,url,status]);
    });
  }

  // Customer orders
  (S.orders||[]).forEach(o=>{
    (o.designs||[]).forEach(d=>{
      addImgRows('Customer Order',o.orderId||'',o.client||'',d.name||'',d.code||'','(design)',d.images||[]);
      (d.varieties||[]).forEach(v=>addImgRows('Customer Order',o.orderId||'',o.client||'',d.name||'',d.code||'',v.name||'',v.images||[]));
    });
  });

  // Vendor orders
  (S.vendorOrders||[]).forEach(vo=>{
    (vo.designs||[]).forEach(d=>{
      addImgRows('Vendor Order',vo.orderId||'',vo.vendor||'',d.name||'',d.code||'','(design)',d.images||[]);
      (d.varieties||[]).forEach(v=>addImgRows('Vendor Order',vo.orderId||'',vo.vendor||'',d.name||'',d.code||'',v.name||'',v.images||[]));
    });
  });

  // Image Library (central photo database)
  (_imageLibrary||[]).forEach((e,i)=>{
    if(e.url)rows.push(['Library','—','—',e.designName||'',e.designCode||'',e.folder||'',i+1,e.url,'✅ Cloud (R2)']);
  });

  if(rows.length<=1){showToast('No images found — upload photos first','orange',4000);return;}

  const localCount=rows.slice(1).filter(r=>r[8]&&r[8].startsWith('⚠️')).length;
  const cloudCount=rows.slice(1).filter(r=>r[8]&&r[8].startsWith('✅')).length;

  const csv=rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\r\n');
  const blob=new Blob([csv],{type:'text/csv;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;
  a.download=`image_manifest_${new Date().toISOString().split('T')[0]}.csv`;
  document.body.appendChild(a);a.click();document.body.removeChild(a);
  URL.revokeObjectURL(url);

  let msg=`🗂️ Image manifest saved — ${cloudCount} cloud photos mapped`;
  if(localCount>0)msg+=` · ⚠️ ${localCount} device-local (click "☁️ Migrate Images" to secure them)`;
  showToast(msg,'green',8000);
  audit('Image Backup','Image manifest downloaded — '+cloudCount+' cloud, '+localCount+' local-only');
}

// ── MIGRATE IMAGES TO CLOUD ───────────────────────────────────────────────────
// Reads every image stored locally on THIS device (IndexedDB), uploads each
// one to Cloudflare R2, and updates Firebase with permanent cloud URLs.
// Must be run on the device/browser where images were originally uploaded.
async function migrateImagesToCloud(){
  const btn = document.getElementById('btn-migrate-imgs');
  if(btn){ btn.disabled=true; btn.textContent='☁️ Migrating…'; }

  try{
    // Step 1 — block Firebase FIRST so it cannot overwrite IDB-injected images
    // before we get a chance to collect and upload them (race condition fix)
    try{ _fb.pendingLocal=true; }catch(e){}

    // Step 2 — inject IDB images into S now that Firebase is blocked
    await _injectIDBImages();

    // Step 3 — collect every image that is currently a base64 data URL
    const toUpload = [];
    const collect = img => {
      if(img && typeof img.data === 'string' && img.data.startsWith('data:'))
        toUpload.push(img);
    };
    (S.orders||[]).forEach(o=>(o.designs||[]).forEach(d=>{
      (d.images||[]).forEach(collect);
      (d.varieties||[]).forEach(v=>(v.images||[]).forEach(collect));
    }));
    (S.vendorOrders||[]).forEach(o=>(o.designs||[]).forEach(d=>{
      (d.images||[]).forEach(collect);
      (d.varieties||[]).forEach(v=>(v.images||[]).forEach(collect));
    }));
    (S.stockItems||[]).forEach(it=>(it.images||[]).forEach(collect));

    if(!toUpload.length){
      try{ _fb.pendingLocal=false; }catch(e){} // nothing found, release block
      showToast('No images found on this device. If you have not yet opened the app on the original upload device/browser, please do so and try again.','orange',9000);
      return;
    }

    const total = toUpload.length;
    showToast(`Found ${total} image(s) — uploading to cloud…`,'blue',120000);

    // Step 4 — upload in batches of 3 (Firebase still blocked)
    let done=0, failed=0;
    for(let i=0; i<toUpload.length; i+=3){
      await Promise.all(toUpload.slice(i,i+3).map(async img=>{
        try{
          const compressed = await compressImageToThumb(img.data, 1200);
          const r2url = await uploadToR2(compressed);
          if(r2url){ img.data=r2url; done++; }
          else failed++;
        }catch(e){ failed++; }
      }));
      if(btn) btn.textContent=`☁️ ${done}/${total}…`;
      showToast(`Uploading… ${done}/${total} done`,'blue',120000);
    }

    // Step 4 — render immediately, then push to Firebase
    if(done>0){
      render(); // Show images on screen right away
      save();   // Persist to localStorage + IDB
      try{ await fbPush(true); }catch(e){} // Direct push — fbPush clears pendingLocal on success
      audit('Migrate images',`Migrated ${done} image(s) to Cloudflare R2`);
      showToast('✅ Migration complete! '+done+' image(s) are now in the cloud and will appear on every device.'+(failed?' ('+failed+' failed — try again)':''),'green',10000);
    } else {
      try{ _fb.pendingLocal=false; }catch(e){}
      showToast(`Upload failed for all ${failed} image(s). Check your internet connection and try again.`,'red',8000);
    }
  }catch(e){
    showToast('Migration error: '+e.message,'red',8000);
  }finally{
    if(btn){ btn.disabled=false; btn.textContent='☁️ Migrate Images'; }
  }
}

  const btn=document.getElementById('btn-recover-imgs');
  if(btn){btn.disabled=true;btn.textContent='Loading…';}
  try{
    // Fetch existing cloud images (best-effort — panel still opens if this fails)
    let urls=[];
    try{
      const resp=await fetch(R2_WORKER_URL+'?action=list',{signal:AbortSignal.timeout(12000)});
      if(resp.ok){const j=await resp.json();urls=j.urls||[];}
    }catch(e){console.warn('R2 list failed (panel still works):',e.message);}

    _recoverUrls=urls;_recoverSlots=[];_recoverSelected=null;_recoverAssigned={};

    // Collect design slots that have broken or missing images
    const pushSlot=(img,label,code)=>{
      if(img&&(typeof img.data!=='string'||img.data===''||img.data.startsWith('__IDB__')))
        _recoverSlots.push({img,label,code:code||''});

    (S.orders||[]).forEach(o=>(o.designs||[]).forEach(d=>{

      // Designs with NO photos at all — add a virtual slot so auto-match can fill them
      const allImgs=[...(d.images||[]),...(d.varieties||[]).flatMap(v=>v.images||[])];
      const hasBroken=allImgs.some(img=>img&&(typeof img.data!=='string'||img.data===''||img.data.startsWith('__IDB__')));
      const hasValid=allImgs.some(img=>typeof img.data==='string'&&(img.data.startsWith('https://')||img.data.startsWith('data:')));
      if(!hasBroken&&!hasValid){
        _recoverSlots.push({img:null,label:`${base} — add first photo`,code,_design:d});
      }
    }));

    _renderPhotoManagerModal();
  }catch(e){
    showToast('Error opening Photo Manager: '+e.message,'red',8000);
  }finally{
    if(btn){btn.disabled=false;btn.textContent='📸 Upload Photos';}
  }
}

// Handles file selection — uploads all to R2, auto-matches by filename = design code
async function _pmHandleFiles(input){
  const files=Array.from(input.files);
  if(!files.length)return;
  _pmUploadTotal=files.length;_pmUploadDone=0;
  const bar=document.getElementById('pm-upload-bar');
  const fill=document.getElementById('pm-progress-fill');
  const wrap=document.getElementById('pm-progress-wrap');
  const _upd=()=>{
    const pct=Math.round((_pmUploadDone/_pmUploadTotal)*100);
    if(bar)bar.textContent='Uploading '+_pmUploadDone+' / '+_pmUploadTotal+' photos…';
    if(fill)fill.style.width=pct+'%';
  };
  if(bar){bar.style.display='block';bar.textContent='Starting upload…';}
  if(wrap)wrap.style.display='block';
  _upd();

  // Upload in batches of 4 (fast but not overwhelming)
  const BATCH=4;
  const uploaded=[];
  for(let i=0;i<files.length;i+=BATCH){
    const batch=files.slice(i,i+BATCH);
    const results=await Promise.all(batch.map(async f=>{
      try{
        const dataUrl=await new Promise((res,rej)=>{const r=new FileReader();r.onload=e=>res(e.target.result);r.onerror=rej;r.readAsDataURL(f);});
        const compressed=await compressImageToThumb(dataUrl,1200);
        const r2url=await uploadToR2(compressed);
        _pmUploadDone++;_upd();
        return r2url?{r2url,fileName:f.name}:null;
      }catch(e){_pmUploadDone++;_upd();console.warn('Upload failed:',f.name,e);return null;}
    }));
    uploaded.push(...results.filter(Boolean));
  }

  // Add all uploaded photos to the left grid + auto-match by filename
  const grid=document.getElementById('r2-grid');
  let autoCount=0;
  for(const {r2url,fileName} of uploaded){
    const idx=_recoverUrls.length;
    _recoverUrls.push(r2url);
    if(grid){
      const div=document.createElement('div');
      div.id='r2img-'+idx;div.onclick=()=>selectR2Img(idx);
      div.title='Click to select';
      div.style.cssText='cursor:pointer;border-radius:8px;border:2.5px solid #22C55E;overflow:hidden;transition:all .15s;position:relative';
      div.innerHTML='<img src="'+r2url+'" style="width:100%;height:76px;object-fit:cover;display:block">'
        +'<div style="position:absolute;top:2px;right:2px;background:#22C55E;color:#fff;font-size:8px;font-weight:700;border-radius:3px;padding:1px 3px">NEW</div>';
      grid.appendChild(div);
    }
    // Auto-match: filename (minus extension) → design code
    const rawName=fileName.replace(/\.[^.]+$/,'').trim().toLowerCase();
    const matchIdx=_recoverSlots.findIndex((slot,si)=>
      !_recoverAssigned.hasOwnProperty(si)&&
      slot.code&&slot.code.toLowerCase()===rawName
    );
    if(matchIdx>=0){
      _recoverSelected=idx;
      assignToSlot(matchIdx);
      autoCount++;
    }
  }

  // Update cloud count label
  const cc=document.getElementById('pm-cloud-count');
  if(cc)cc.textContent=_recoverUrls.length;

  const failCount=files.length-uploaded.length;
  let msg='✅ '+uploaded.length+' photo'+(uploaded.length!==1?'s':'')+' uploaded to cloud';
  if(autoCount)msg+=' — '+autoCount+' auto-matched by name!';
  if(failCount)msg+=' ('+failCount+' failed — check internet connection)';
  if(bar)bar.textContent=msg;
  if(fill)fill.style.background=failCount?'#F59E0B':'#22C55E';
  if(autoCount)showToast('✅ Auto-matched '+autoCount+' photo'+(autoCount!==1?'s':'')+' by design code!','green',5000);
  input.value='';
}

function selectR2Img(idx){
  if(_recoverSelected!==null){
    const prev=document.getElementById('r2img-'+_recoverSelected);
    if(prev)prev.style.borderColor='#E8E7E0';
  }
  _recoverSelected=idx;
  const el=document.getElementById('r2img-'+idx);
  if(el)el.style.borderColor='#22C55E';
  showToast('Photo selected ✓ — now click the design slot on the right','blue',3000);
}

function assignToSlot(slotIdx){
  if(_recoverSelected===null){showToast('First click a photo on the LEFT to select it','orange',3000);return;}
  const url=_recoverUrls[_recoverSelected];
  const slot=_recoverSlots[slotIdx];
  if(!url||!slot)return;
  // Virtual slot: design has no images array yet — create one
  if(slot._design){
    if(!slot._design.images)slot._design.images=[];
    const newImg={data:url,name:''};
    slot._design.images.push(newImg);
    slot.img=newImg;  // now slot.img points to the real object
    delete slot._design;
  } else {
    slot.img.data=url;
  }
  _recoverAssigned[slotIdx]=_recoverSelected;
  // Update slot UI
  const prev=document.getElementById('rslot-prev-'+slotIdx);
  if(prev)prev.innerHTML='<img src="'+url+'" style="width:100%;height:100%;object-fit:cover;display:block">';
  const status=document.getElementById('rslot-status-'+slotIdx);
  if(status){status.textContent='✓ Assigned';status.style.color='#22C55E';}
  const slotEl=document.getElementById('rslot-'+slotIdx);
  if(slotEl){slotEl.style.borderColor='#22C55E';slotEl.style.background='#F0FFF4';}
  // Dim the used photo in the left grid
  const imgEl=document.getElementById('r2img-'+_recoverSelected);
  if(imgEl){imgEl.style.opacity='0.38';imgEl.style.borderColor='#22C55E';}
  _recoverSelected=null;
  // Update progress counter
  const prog=document.getElementById('recov-progress');
  if(prog)prog.textContent=Object.keys(_recoverAssigned).length+' / '+_recoverSlots.length+' assigned';
}

async function saveRecovery(){
  const n=Object.keys(_recoverAssigned).length;
  if(!n){showToast('No assignments yet — upload photos first, then assign them','orange',4000);return;}
  if(!confirm(n+' photo'+(n!==1?'s':'')+' will be permanently saved to cloud storage.\n\nAfter this, they will appear on ALL devices and at ALL URLs (including bangle-tracker.pages.dev) forever.\n\nYou will NOT need to upload these again.\n\nContinue?'))return;
  try{_fb.pendingLocal=true;}catch(e){}
  render();save();
  try{
    await fbPush(true);
    showToast('☁️ '+n+' photo'+(n!==1?'s':'')+' permanently saved! Open on any device — all visible now.','green',12000);
    audit('Photo Manager','Bulk assigned '+n+' photo(s) to designs — now permanent cloud URLs');
    closeRecovery();
  }catch(e){
    showToast('Save failed: '+e.message,'red',8000);
    try{_fb.pendingLocal=false;}catch(_){}
  }
}

function closeRecovery(){
  const m=document.getElementById('img-recovery-modal');
  if(m)m.remove();
  _recoverUrls=[];_recoverSlots=[];_recoverSelected=null;_recoverAssigned={};
  _pmUploadDone=0;_pmUploadTotal=0;
}

// Central catalog stored in Firebase /imageLibrary/ — never in localStorage.
// Each entry: { designCode, folder, r2url, fileName, uploadedAt, _id }
// Photos are permanent in R2. The library is just a searchable index of URLs.

let _libSegment='';  // '' = root | 'CNC' | 'Dye Gold'
