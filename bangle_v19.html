function buildVendorDesignsPanel(vo, voi){
  const designs = vo.designs || [];
  if(!designs.length) return '<div style="padding:20px;text-align:center;color:#aaa;font-size:13px">No designs in this vendor order.</div>';

  return designs.map((d, di) => {
    const varieties = d.varieties || [];
    const szSet = new Set();
    if(varieties.length){
      varieties.forEach(v=>Object.keys(v.sizes||{}).forEach(s=>szSet.add(s)));
    } else {
      Object.keys(d.sizes||{}).forEach(s=>szSet.add(s));
    }
    const szKeys = [...szSet];
    const total = vendorDesignQty(d);

    const imgHtml = varieties.map((v,vi)=>{
      const vImgs = v.images||[];
      return `<div style="margin-top:8px">
        <div style="font-size:11px;font-weight:600;color:#E65100;margin-bottom:4px">${esc(v.name||'Variety '+(vi+1))}</div>
        <div style="display:flex;flex-wrap:wrap;gap:6px;align-items:center">
          ${vImgs.map((img,ii)=>{
            const src=_resolveImgSrc(img);
            return src?`<div style="position:relative;display:inline-block">
              <img src="${src}" onclick="openLbDirect('${src}')" style="width:60px;height:60px;object-fit:cover;border-radius:6px;border:1.5px solid #FFB74D;cursor:pointer">
            </div>`:'';
          }).filter(Boolean).join('')}
          <label style="cursor:pointer;font-size:11px;color:#E65100;padding:4px 8px;border:1px dashed #FFB74D;border-radius:6px">
            + Photo<input type="file" accept="image/*" multiple style="display:none" onchange="handleVendorImgUpload(${voi},${di},${vi},this)">
          </label>
        </div>
      </div>`;
    }).join('');

    let tableRows = '';
    if(varieties.length){
      varieties.forEach((v,vi)=>{
        const vt = szKeys.reduce((a,sz)=>a+(parseInt((v.sizes||{})[sz])||0),0);
        tableRows += `<tr style="border-bottom:1px solid #FFE0B2">
          <td style="padding:5px 8px;color:#555">└ ${esc(v.name||'Variety '+(vi+1))}</td>
          ${szKeys.map(sz=>'<td style="padding:5px 7px;text-align:center">'+(parseInt((v.sizes||{})[sz])||0)+'</td>').join('')}
          <td style="padding:5px 7px;text-align:center;font-weight:700;color:#E65100">${vt}</td>
        </tr>`;
      });
    } else {
      const rt = szKeys.reduce((a,sz)=>a+(parseInt((d.sizes||{})[sz])||0),0);
      tableRows = `<tr><td style="padding:5px 8px">—</td>${szKeys.map(sz=>'<td style="padding:5px 7px;text-align:center">'+(parseInt((d.sizes||{})[sz])||0)+'</td>').join('')}<td style="padding:5px 7px;text-align:center;font-weight:700;color:#E65100">${rt}</td></tr>`;
    }

    return `<div style="margin-bottom:16px;border:1px solid #FFD0A0;border-radius:8px;overflow:hidden">
      <div style="background:linear-gradient(135deg,#FF8F00,#E65100);color:#fff;padding:8px 14px;display:flex;justify-content:space-between;align-items:center">
        <span style="font-size:13px;font-weight:700">🎨 ${esc(d.name||'(unnamed)')} <span style="font-weight:400;font-size:11px;opacity:.85">[${esc(d.code||'—')}]</span></span>
        <span style="font-size:11px;background:rgba(255,255,255,.2);padding:2px 10px;border-radius:20px">${total} pcs</span>
      </div>
      ${szKeys.length?`<table style="width:100%;border-collapse:collapse;font-size:12px">
        <thead><tr style="background:#FFF3E0">
          <th style="padding:5px 8px;text-align:left;color:#E65100">Variety</th>
          ${szKeys.map(sz=>'<th style="padding:5px 7px;text-align:center;color:#E65100">'+esc(sz)+'</th>').join('')}
          <th style="padding:5px 7px;text-align:center;color:#E65100">Total</th>
        </tr></thead>
        <tbody>${tableRows}</tbody>
      </table>`:'<div style="padding:10px 14px;font-size:12px;color:#aaa">No size data.</div>'}
      ${imgHtml?`<div style="padding:10px 14px;background:#FFFDE7;border-top:1px solid #FFE082">${imgHtml}</div>`:''}
    </div>`;
  }).join('');
}

function toggleVendorClient(vendor){
  if(_openVendorSections.has(vendor)) _openVendorSections.delete(vendor);
  else _openVendorSections.add(vendor);
  renderVendorOrders();
}

function toggleVendorOrder(oid){
  const arr = S.openVendorOrders || [];
  const idx = arr.indexOf(oid);
  if(idx>=0) arr.splice(idx,1); else arr.push(oid);
  S.openVendorOrders = arr;
  save();
  renderVendorOrders();
}

function setVendorTab(oid, tab){
  if(!S.vendorActiveTabs) S.vendorActiveTabs = {};
  S.vendorActiveTabs[oid] = tab;
  save();
  renderVendorOrders();
}

function upVendorOrder(voi, field, val){
  S.vendorOrders[voi][field] = val;
  save();
}

function delVendorOrder(voi){
  if(!confirm('Delete this vendor order?')) return;
  const vo=S.vendorOrders[voi];
  // Record ID so cross-device merge never resurrects this vendor order
  if(!S.deletedVendorOrderIds)S.deletedVendorOrderIds=[];
  if(vo&&vo.id&&!S.deletedVendorOrderIds.includes(vo.id))S.deletedVendorOrderIds.push(vo.id);
  S.vendorOrders.splice(voi,1);
  save();
  renderVendorOrders();
  try{fbPushNow();}catch(e){}
}

function handleVendorImgUpload(voi, di, vi, input){
  const files = Array.from(input.files);
  let loaded = 0;
  files.forEach(file=>{
    const reader = new FileReader();
    reader.onload = async e=>{
      const compressed=await compressImageToThumb(e.target.result);
      const r2url=await uploadToR2(compressed);
      if(!S.vendorOrders[voi].designs[di].varieties[vi].images)
        S.vendorOrders[voi].designs[di].varieties[vi].images=[];
      S.vendorOrders[voi].designs[di].varieties[vi].images.push({data:r2url||compressed,name:file.name});
      loaded++;
      if(loaded===files.length){save();renderVendorOrders();}
    };
    reader.readAsDataURL(file);
  });
  input.value='';
}

function openNewVendorOrderModal(){
  const today = new Date().toISOString().split('T')[0];
  document.getElementById('modal-container').innerHTML=`<div class="modal-backdrop" onclick="if(event.target===this)closeModal()">
    <div class="modal" style="max-width:520px">
      <div class="modal-header"><h3>New Vendor Order</h3><button onclick="closeModal()" style="background:none;border:none;font-size:18px;cursor:pointer;color:#888">✕</button></div>
      <div class="modal-body">
        <div class="field-row">
          <div class="field-group"><label>Vendor name</label><input id="nvo-vendor" placeholder="Vendor name" autocomplete="off"></div>
        </div>
        <div class="field-row">
          <div class="field-group" style="max-width:150px"><label>Start date</label><input id="nvo-start" type="date" value="${today}"></div>
          <div class="field-group" style="max-width:150px"><label>Delivery date</label><input id="nvo-delivery" type="date"></div>
          <div class="field-group" style="max-width:120px"><label>Priority</label>
            <select id="nvo-priority">${PRIO_OPTS.map(p=>`<option value="${p}">${p}</option>`).join('')}</select>
          </div>
        </div>
        <div class="field-group"><label>Status</label>
          <select id="nvo-status">
            ${['pending','processing','in_progress','qa','dispatched','delivered'].map(s=>`<option value="${s}">${s}</option>`).join('')}
          </select>
        </div>
        <label style="font-size:11px;color:#777;font-weight:500">Notes</label>
        <textarea id="nvo-notes" class="notes-area" placeholder="Notes..."></textarea>
      </div>
      <div class="modal-actions">
        <button onclick="closeModal()">Cancel</button>
        <button class="primary" style="background:linear-gradient(135deg,#E65100,#BF360C);border:none" onclick="saveNewVendorOrder()">Create vendor order</button>
      </div>
    </div>
  </div>`;
  document.getElementById('modal-container').style.display='block';

function saveNewVendorOrder(){
  const vendor = (document.getElementById('nvo-vendor').value||'').trim();
  if(!vendor){alert('Please enter a vendor name');return;}
  const vo = {
    id: 'vo_'+Date.now(),
    orderId: genVendorOrderId(),
    vendor,
    startDate: document.getElementById('nvo-start').value||'',
    deliveryDate: document.getElementById('nvo-delivery').value||'',
    priority: document.getElementById('nvo-priority').value||'normal',
    status: document.getElementById('nvo-status').value||'pending',
    notes: document.getElementById('nvo-notes').value||'',
    designs: []
  };
  if(!S.vendorOrders) S.vendorOrders=[];
  S.vendorOrders.push(vo);
  // Auto-open this new vendor's section
  _openVendorSections.add(vendor);
  // Auto-open the order card
  if(!S.openVendorOrders) S.openVendorOrders=[];
  S.openVendorOrders.push(vo.id);
  save();
  try{fbPushNow();}catch(e){}
  closeModal();
  renderVendorOrders();
}

// ── MASTERS PANEL ─────────────────────────────────────────────────────────────
// ── Masters: per-section open state ──────────────────────────────────────────
const _mastOpen={clients:true,vendors:true,dnames:true,units:true,users:false};
let _mastTab='clients';
function toggleMastSection(k){_mastOpen[k]=!_mastOpen[k];renderMasters();}
function switchMastTab(tab){_mastTab=tab;renderMasters();}
function filterMastList(k,q){
  const list=document.getElementById('mast-list-'+k);if(!list)return;
  const rows=list.querySelectorAll('.mast-row');
  rows.forEach(r=>{r.style.display=r.dataset.val&&r.dataset.val.toLowerCase().includes(q.toLowerCase())?'':'none';});
  const empty=document.getElementById('mast-empty-'+k);
  if(empty)empty.style.display=[...rows].every(r=>r.style.display==='none')?'':'none';
}

function renderMasters(){
  const container=document.getElementById('view-masters');
  if(!container)return;
  const v=S.vocabulary;

  // Build one accordion section
  const makeSection=(key,icon,label,items,addPlaceholder,extra)=>{
    const open=_mastOpen[key]!==false;
    const rows=items.map((item,i)=>
      `<div class="mast-row" data-val="${esc(item)}" style="display:flex;align-items:center;justify-content:space-between;padding:8px 16px;border-bottom:1px solid #F3F2FF;font-size:12px;color:#222">
        <span style="flex:1">${esc(item)}</span>
        <button onclick="masterDelete('${key}',${i})" style="background:none;border:none;cursor:pointer;color:#ccc;font-size:16px;padding:0 4px;line-height:1;transition:color .15s" onmouseover="this.style.color='#A32D2D'" onmouseout="this.style.color='#ccc'" title="Remove">✕</button>
      </div>`
    ).join('');
    const emptyMsg=`<div id="mast-empty-${key}" style="display:none;padding:10px 16px;font-size:11px;color:#aaa">No match found.</div>`;
    return`<div style="background:#fff;border-radius:12px;border:1px solid #E0DFFF;margin-bottom:10px;box-shadow:0 2px 8px rgba(83,74,183,.05);overflow:hidden">
      <div onclick="toggleMastSection('${key}')" style="display:flex;align-items:center;justify-content:space-between;padding:13px 18px;cursor:pointer;user-select:none;background:${open?'#faf9ff':'#fff'};transition:background .15s">
        <div style="display:flex;align-items:center;gap:10px">
          <span style="font-size:16px">${icon}</span>
          <span style="font-size:13px;font-weight:700;color:#3C3489">${label}</span>
          <span style="font-size:11px;font-weight:600;background:#EEEDFE;color:#534AB7;border-radius:20px;padding:2px 10px">${items.length}</span>
        </div>
        <span style="color:#AFA9EC;font-size:13px;transition:transform .2s;transform:rotate(${open?90:0}deg)">▶</span>
      </div>
      ${open?`<div style="border-top:1px solid #E0DFFF">
        ${items.length>5?`<input placeholder="Search ${label}…" oninput="filterMastList('${key}',this.value)" style="width:100%;box-sizing:border-box;padding:9px 16px;border:none;border-bottom:1px solid #E0DFFF;font-size:12px;outline:none;background:#fafaff" autocomplete="off">`:''}
        <div id="mast-list-${key}" style="max-height:240px;overflow-y:auto">${rows||`<div style="padding:10px 16px;font-size:11px;color:#aaa">No entries yet — auto-populated from orders.</div>`}${emptyMsg}</div>
        ${extra||''}
        <div style="display:flex;gap:8px;padding:10px 16px;border-top:1px solid #E0DFFF;background:#fafaff">
          <input id="master-inp-${key}" placeholder="${addPlaceholder}" autocomplete="off"
            style="flex:1;padding:7px 10px;border:1px solid #AFA9EC;border-radius:8px;font-size:12px"
            onkeydown="if(event.key==='Enter')masterAdd('${key}')">
          <button onclick="masterAdd('${key}')" style="padding:7px 16px;background:#534AB7;color:#fff;border:none;border-radius:8px;font-size:12px;cursor:pointer;font-weight:600;white-space:nowrap">+ Add</button>
        </div>
      </div>`:''}
    </div>`;
  };

  // Design names + codes combined in two columns
  const dnOpen=_mastOpen['dnames']!==false;
  const dnames=v.dnames||[],dcodes=v.dcodes||[];
  const makeColList=(items,key,placeholder)=>{
    const rows=items.map((item,i)=>
      `<div class="mast-row" data-val="${esc(item)}" style="display:flex;align-items:center;justify-content:space-between;padding:7px 12px;border-bottom:1px solid #F3F2FF;font-size:12px;color:#222">
        <span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(item)}</span>
        <button onclick="masterDelete('${key}',${i})" style="background:none;border:none;cursor:pointer;color:#ccc;font-size:14px;padding:0 2px;line-height:1;flex-shrink:0" onmouseover="this.style.color='#A32D2D'" onmouseout="this.style.color='#ccc'" title="Remove">✕</button>
      </div>`
    ).join('');
    return`<div style="border:1px solid #E0DFFF;border-radius:8px;overflow:hidden">
      <div style="background:#EEEDFE;padding:7px 12px;font-size:11px;font-weight:700;color:#534AB7;display:flex;align-items:center;justify-content:space-between">
        <span>${key==='dnames'?'Design Names':'Design Codes'}</span>
        <span style="font-size:11px;font-weight:600;background:#fff;color:#534AB7;border-radius:20px;padding:1px 8px">${items.length}</span>
      </div>
      ${items.length>5?`<input placeholder="Search…" oninput="filterMastList('${key}',this.value)" style="width:100%;box-sizing:border-box;padding:7px 12px;border:none;border-bottom:1px solid #E0DFFF;font-size:12px;outline:none" autocomplete="off">`:''}
      <div id="mast-list-${key}" style="max-height:220px;overflow-y:auto">${rows||`<div style="padding:8px 12px;font-size:11px;color:#aaa">None yet.</div>`}
        <div id="mast-empty-${key}" style="display:none;padding:8px 12px;font-size:11px;color:#aaa">No match.</div>
      </div>
      <div style="display:flex;gap:6px;padding:8px 12px;border-top:1px solid #E0DFFF;background:#fafaff">
        <input id="master-inp-${key}" placeholder="${placeholder}" autocomplete="off"
          style="flex:1;padding:6px 8px;border:1px solid #AFA9EC;border-radius:7px;font-size:12px"
          onkeydown="if(event.key==='Enter')masterAdd('${key}')">
        <button onclick="masterAdd('${key}')" style="padding:6px 12px;background:#534AB7;color:#fff;border:none;border-radius:7px;font-size:11px;cursor:pointer;font-weight:600">+ Add</button>

    </div>`;
  };
  const designSection=`<div style="background:#fff;border-radius:12px;border:1px solid #E0DFFF;margin-bottom:10px;box-shadow:0 2px 8px rgba(83,74,183,.05);overflow:hidden">
    <div onclick="toggleMastSection('dnames')" style="display:flex;align-items:center;justify-content:space-between;padding:13px 18px;cursor:pointer;user-select:none;background:${dnOpen?'#faf9ff':'#fff'}">

        <span style="font-size:16px">🎨</span>

    </div>
    ${dnOpen?`<div style="border-top:1px solid #E0DFFF;padding:14px 18px">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px">

        ${makeColList(dcodes,'dcodes','e.g. MG-22')}

  const unitChips=(v.units||[]).map((u,i)=>
    `<span style="display:inline-flex;align-items:center;gap:5px;background:#f0efff;border:1px solid #AFA9EC;border-radius:20px;padding:4px 10px 4px 12px;font-size:12px;color:#3C3489;font-weight:500">

  const unitSection=makeSection('units','📏','Unit Master',v.units||[],'e.g. dozen',

  ).replace(`<div id="mast-list-units" style="max-height:240px;overflow-y:auto">`,`<div id="mast-list-units" style="display:none">`);

  // Build tab panels — only render the active one
  const tabDefs=[
    {key:'clients',icon:'👤',label:'Clients',count:(v.clients||[]).length},
    {key:'vendors',icon:'🏭',label:'Vendors',count:(v.vendors||[]).length},
    {key:'designs',icon:'🎨',label:'Designs',count:(v.dnames||[]).length+(v.dcodes||[]).length},
    {key:'units',  icon:'📏',label:'Units',  count:(v.units||[]).length},
    {key:'users',  icon:'👥',label:'Users',  count:''},
  ];
  const tabBar=tabDefs.map(t=>`
    <button onclick="switchMastTab('${t.key}')"
      style="display:flex;align-items:center;gap:5px;padding:9px 14px;border:none;border-bottom:2.5px solid ${_mastTab===t.key?'#534AB7':'transparent'};background:transparent;color:${_mastTab===t.key?'#534AB7':'#666'};font-size:12px;font-weight:${_mastTab===t.key?'700':'500'};cursor:pointer;white-space:nowrap;transition:all .15s">

  let tabContent='';

  else if(_mastTab==='vendors') tabContent=makeSection('vendors','🏭','Vendors',v.vendors||[],'e.g. Rathi Metals');

  else if(_mastTab==='units')   tabContent=unitSection;

function masterAdd(listKey){
  const inp=document.getElementById('master-inp-'+listKey);
  if(!inp)return;
  const val=inp.value.trim();
  if(!val)return;
  if(listKey==='units'){
    if(!S.vocabulary.units)S.vocabulary.units=[];
    if(!S.vocabulary.units.includes(val))S.vocabulary.units.push(val);
  } else {
    // Store in the persistent manual list so it survives rebuildVocab()
    if(!S.vocabularyManual)S.vocabularyManual={clients:[],vendors:[],dnames:[],dcodes:[]};
    if(!S.vocabularyManual[listKey])S.vocabularyManual[listKey]=[];
    if(!S.vocabularyManual[listKey].includes(val))S.vocabularyManual[listKey].push(val);
    rebuildVocab(); // merge the new manual entry into S.vocabulary
  }
  inp.value='';
  save();renderMasters();
}

function masterDelete(listKey,idx){
  if(listKey==='units'){
    if(!S.vocabulary.units)return;
    S.vocabulary.units.splice(idx,1);
  } else {
    // Remove from both the live vocab and the persistent manual list
    const val=(S.vocabulary[listKey]||[])[idx];
    if(val==null)return;
    S.vocabulary[listKey].splice(idx,1);
    if(S.vocabularyManual&&S.vocabularyManual[listKey]){
      const mi=S.vocabularyManual[listKey].indexOf(val);
      if(mi>=0)S.vocabularyManual[listKey].splice(mi,1);
    }
  }
  save();renderMasters();
}

  const el=document.getElementById('pw-display-'+idx);

async function addUser(){
  const name=(document.getElementById('new-user-name')?.value||'').trim();
  const pass=(document.getElementById('new-user-pass')?.value||'').trim();
  const role=document.getElementById('new-user-role')?.value||'member';
  if(!name){showToast('Enter a username','amber');return;}
  if(!pass||pass.length<4){showToast('Password must be at least 4 characters','amber');return;}
  const users=window._fbUsers||[];
  if(users.find(u=>u.username===name)){showToast('Username already exists','amber');return;}
  users.push({id:'u_'+Date.now(),username:name,password:pass,role,createdAt:new Date().toISOString()});
  window._fbUsers=users;
  try{
    await fetch(FB_USERS,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(users)});
    showToast(`✅ User "${name}" created`,'green');
    if(document.getElementById('new-user-name'))document.getElementById('new-user-name').value='';
    if(document.getElementById('new-user-pass'))document.getElementById('new-user-pass').value='';
    renderUsersSection();
  }catch(e){showToast('Failed to save: '+e.message,'red');}
}

async function deleteUser(idx){
  const users=window._fbUsers||[];
  const u=users[idx];if(!u)return;
  if(!confirm(`Remove user "${u.username}"?`))return;
  users.splice(idx,1);
  window._fbUsers=users;
  try{
    await fetch(FB_USERS,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(users)});
    showToast(`User "${u.username}" removed`,'green');
    renderUsersSection();
  }catch(e){showToast('Failed: '+e.message,'red');}
}

// ── Render ──────────────────────────────────────────────────────────────────
function renderVendorOrders(){
  const _vf=document.activeElement;
  const _vfWas=_vf&&_vf.id==='vord-search-inp';
  const _vfSel=[_vf&&_vf.selectionStart,_vf&&_vf.selectionEnd];
  const container=document.getElementById('view-vendor');

  if(!S.vendorOrders.length){
    container.innerHTML=`${buildVendorStatsBar()}<div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:14px"><div style="font-size:13px;font-weight:700;color:var(--indigo)">🏭 Vendor Orders</div><button class="primary" onclick="openNewVendorOrderModal()">+ New Vendor Order</button></div><div class="empty-state"><div style="font-size:32px;margin-bottom:8px">🏭</div><div style="font-size:14px;font-weight:600;color:#888">No vendor orders yet</div><div style="font-size:12px;color:#aaa;margin-top:4px">Click "+ New Vendor Order" to get started</div></div>`;
    return;
  }

  // Build full vendor map from ALL vendor orders
  const allVendorMap={};
  S.vendorOrders.forEach(vo=>{
    const v=vo.vendor||'(No vendor)';
    if(!allVendorMap[v])allVendorMap[v]={orders:[],done:0,pending:0};
    allVendorMap[v].orders.push(vo);
    if(vendorOrderAlert(vo)==='done')allVendorMap[v].done++;
    else allVendorMap[v].pending++;
  });
  const allVendors=Object.keys(allVendorMap).sort();

  // Auto-select first vendor if none chosen or chosen vendor no longer exists
  if(!S.selectedVendor||!allVendorMap[S.selectedVendor])S.selectedVendor=allVendors[0]||'';

  const q=(S.vendorSearchQ||'').toLowerCase().trim();
  const sf=S.vendorStatusFilter||'';
  const chipA=v=>(S.vendorStatusFilter||'')===v?' active':'';

  // Global search across all vendors when query is typed
  let vendOrders,isVGlobal=false,vSecIcon='🏭',vSecName='',vSecMeta='';
  if(q){
    isVGlobal=true;
    vendOrders=S.vendorOrders.filter(vo=>
      (vo.orderId||'').toLowerCase().includes(q)||
      (vo.vendor||'').toLowerCase().includes(q)||
      (vo.notes||'').toLowerCase().includes(q)||
      (vo.designs||[]).some(d=>(d.code||'').toLowerCase().includes(q)||(d.name||'').toLowerCase().includes(q))
    );
    if(sf)vendOrders=vendOrders.filter(vo=>vendorOrderAlert(vo)===sf);
    vendOrders.sort((a,b)=>new Date(a.startDate)-new Date(b.startDate));
    vSecIcon='🔍';vSecName=`Results for "${S.vendorSearchQ}"`;
    vSecMeta=`${vendOrders.length} order${vendOrders.length!==1?'s':''} across all vendors`;
  } else {
    const vi=allVendorMap[S.selectedVendor]||{orders:[],done:0,pending:0};
    vendOrders=[...vi.orders];
    if(sf)vendOrders=vendOrders.filter(vo=>vendorOrderAlert(vo)===sf);
    vendOrders.sort((a,b)=>new Date(a.startDate)-new Date(b.startDate));
    vSecIcon='🏭';vSecName=S.selectedVendor;
    vSecMeta=`${vi.orders.length} order${vi.orders.length!==1?'s':''} · ${vi.pending} pending · ${vi.done} completed`;
  }

  const sidebarHTML=allVendors.map(v=>{
    const vd=allVendorMap[v];
    return`<div class="orders-sb-item${!isVGlobal&&v===S.selectedVendor?' active':''}" onclick="selectVendorSection('${esc(v)}')">
      <span class="orders-sb-name">🏭 ${esc(v)}</span>
      ${_sbStatusDots(vd.done,vd.pending)}
    </div>`;
  }).join('');

  const cardsHTML=vendOrders.length
    ?vendOrders.map(vo=>buildVendorOrderCard(vo,S.vendorOrders.indexOf(vo))).join('')
    :`<div class="empty-state" style="margin:0">${q?`No vendor orders found for "${esc(q)}"`:isVGlobal?'No matching orders':'No orders for this vendor'}</div>`;

  container.innerHTML=`
  ${buildVendorStatsBar()}
  <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:10px">
    <div style="font-size:13px;font-weight:700;color:var(--indigo)">🏭 Vendor Orders</div>
    <button class="primary" onclick="openNewVendorOrderModal()">+ New Vendor Order</button>
  </div>
  <div class="orders-split">
    <div class="orders-sidebar">
      <div class="orders-sidebar-hd">Vendors (${allVendors.length})</div>
      ${sidebarHTML}
    </div>
    <div class="orders-main-wrap">
      <div class="orders-top-bar">
        <input id="vord-search-inp" class="orders-search" placeholder="Search vendor, order ID, design code…"
          value="${esc(S.vendorSearchQ||'')}"
          oninput="S.vendorSearchQ=this.value;renderVendorOrders()">
        <button class="orders-chip${chipA('')}" onclick="S.vendorStatusFilter='';renderVendorOrders()">All</button>
        <button class="orders-chip${chipA('pending')}" onclick="S.vendorStatusFilter='pending';renderVendorOrders()">🔴 Pending</button>
        <button class="orders-chip${chipA('done')}" onclick="S.vendorStatusFilter='done';renderVendorOrders()">✅ Completed</button>
      </div>
      <div class="orders-section-hd">
        <div style="display:flex;align-items:center;gap:9px;flex:1;min-width:0">
          <span style="font-size:18px">${vSecIcon}</span>
          <div style="min-width:0">
            <div class="orders-section-name">${esc(vSecName)}</div>
            <div class="orders-section-meta">${vSecMeta}</div>
          </div>
        </div>
        ${!isVGlobal?`<div class="orders-section-acts">
          <button class="sm no-print" style="background:rgba(255,255,255,.15);color:#fff;border-color:rgba(255,255,255,.3)" onclick="exportVendorSectionCSV('${esc(S.selectedVendor)}')">📥 Export</button>
          <button class="sm no-print" style="background:rgba(255,255,255,.15);color:#fff;border-color:rgba(255,255,255,.3)" onclick="printVendorSection('${esc(S.selectedVendor)}')">🖨️ Print</button>
        </div>`:''}
      </div>
      <div class="orders-cards-list">${cardsHTML}</div>
    </div>
  </div>`;
  if(_vfWas){const el=document.getElementById('vord-search-inp');if(el){el.focus({preventScroll:true});try{el.setSelectionRange(_vfSel[0],_vfSel[1]);}catch(e){}}}
}
function selectVendorSection(name){
  S.selectedVendor=name;S.vendorSearchQ='';S.vendorStatusFilter='';

function buildVendorOrderCard(vo,vi){
  const qtyStr=formatQtyByUnit(vendorOrderQtyByUnit(vo));

  const at=S.vendorActiveTabs[vo.id]||'designs';

  const statusMap={pending:'#888',processing:'#1976D2',in_progress:'#7B3F00',qa:'#6A0DAD',dispatched:'#E65100',delivered:'#2E7D32'};
  const statusLabel={pending:'Pending',processing:'Processing',in_progress:'In Progress',qa:'QA',dispatched:'Dispatched',delivered:'Delivered'};
  const st=vo.status||'pending';
  const stColor=statusMap[st]||'#888';
  const stLabel=statusLabel[st]||st;
  const designTotal=vo.designs.reduce((a,d)=>a+Object.values(d.sizes||{}).reduce((b,v)=>b+(parseInt(v)||0),0),0);

  // Progress bar: map status to a % so the tile gives a visual sense of how far along this order is
  const statusProgress={pending:0,processing:20,in_progress:40,qa:65,dispatched:85,delivered:100};
  const progressPct=statusProgress[st]||0;
  // Overdue highlight: delivery date passed and not delivered
  const isOverdue=vo.deliveryDate&&new Date(vo.deliveryDate)<new Date()&&st!=='delivered';

  return`<div class="order-card ${cardAlert}" id="voc-${vo.id}">

        <div class="oh-sub">
          ${qtyStr} · ${vo.designs.length} design${vo.designs.length!==1?'s':''}

        <button class="icon-btn no-print" onclick="event.stopPropagation();askVendorPrint('${vo.id}')" title="Print">🖨️</button>

}

function buildVendorDesignsPanel(vo,vi){
  // ── Group designs by design name (mirrors client order grouping) ─────────
  const groups=[];const byName={};
  vo.designs.forEach((d,di)=>{
    const key=d.name||'(unnamed)';
    let g=byName[key];
    if(!g){g={name:key,items:[]};byName[key]=g;groups.push(g);}
    g.items.push({d,di});
  });

  let html='<div class="section-head" style="margin-top:0;justify-content:space-between"><span style="text-align:left">Designs &amp; Varieties ('+vo.designs.length+') — Order total: <strong>'+formatQtyByUnit(vendorOrderQtyByUnit(vo))+'</strong></span>'
    +'<button class="icon-btn primary no-print" onclick="addVendorDesign('+vi+')">+ Add design</button></div>';

  if(!vo.designs.length) return html+'<div style="font-size:12px;color:#aaa;text-align:center;padding:1rem">No designs yet.</div>';

  html+=groups.map(g=>{
    // Aggregate group quantity for badge
    const groupQty={};
    g.items.forEach(({d})=>{
      const dq=designQtyByUnit(d);
      Object.keys(dq).forEach(u=>{groupQty[u]=(groupQty[u]||0)+dq[u];});
    });

    // Aggregate all images across every design in the group
    const allGroupImgs=[];
    g.items.forEach(({d})=>{
      const varieties=d.varieties||[];
      const hod=varieties.length===1&&!(varieties[0].name&&varieties[0].name.trim()&&varieties[0].name.trim().toLowerCase()!=='default');
      const flat=varieties.length===0||hod;
      if(flat){(hod?varieties[0].images||[]:d.images||[]).forEach(img=>allGroupImgs.push({img,label:d.code||d.name}));}
      else{(d.images||[]).forEach(img=>allGroupImgs.push({img,label:d.code||d.name}));varieties.forEach(v=>(v.images||[]).forEach(img=>allGroupImgs.push({img,label:v.name||d.code})));}
    });
    const imgGallery=allGroupImgs.length
      ?'<div style="display:flex;flex-wrap:wrap;gap:12px;padding:10px 12px 4px">'+allGroupImgs.map(({img,label})=>{
          const src=_resolveImgSrc(img)||'';return src
            ?'<div style="display:flex;flex-direction:column;align-items:center;gap:4px">'
              +'<img src="'+src+'" onclick="openLbDirect(\''+src.replace(/'/g,"\\'")+'\') " style="width:100px;height:100px;object-fit:cover;border-radius:8px;border:1.5px solid #AFA9EC;cursor:zoom-in;box-shadow:0 2px 6px rgba(83,74,183,.12)">'
              +'<span style="font-size:10px;font-weight:600;color:#3C3489;max-width:100px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(label)+'</span>'
            +'</div>':'';
        }).filter(Boolean).join('')+'</div>'
      :'';

    // Union of size keys across all designs in this group
    const szSet=new Set();
    g.items.forEach(({d})=>{
      Object.keys(d.sizes||{}).forEach(s=>szSet.add(s));
      (d.varieties||[]).forEach(v=>Object.keys(v.sizes||{}).forEach(s=>szSet.add(s)));
    });
    const szKeys=[...szSet];

    // Build combined tbody for all design codes in this group
    const grpTotals={};szKeys.forEach(sz=>grpTotals[sz]=0);
    let tbody='';

    g.items.forEach(({d,di})=>{
      const varieties=d.varieties||[];
      const hasOnlyDefault=varieties.length===1&&!(varieties[0].name&&varieties[0].name.trim()&&varieties[0].name.trim().toLowerCase()!=='default');
      const isFlat=varieties.length===0||hasOnlyDefault;

      if(isFlat){

        const rowSizes=hasOnlyDefault?(varieties[0].sizes||{}):(d.sizes||{});

        tbody+='<tr style="background:#EEEDFE">'

          +'<td><div class="variety-img-cell">'+dImgCells+addDImgBtn+'</div></td>'
          +'<td colspan="'+szKeys.length+'" style="text-align:center;font-size:10px;color:#6C64CC;font-style:italic;padding:6px">'+varieties.length+' variet'+(varieties.length===1?'y':'ies')+' — see rows below</td>'
          +'<td class="total-col" style="font-weight:800;font-size:12px;color:#3C3489">'+dTotal+'</td>'
          +'<td></td><td></td>'
          +'<td class="no-print"><div style="display:flex;gap:3px;flex-wrap:wrap">'
            +'<button class="icon-btn sm" onclick="addVendorVariety('+vi+','+di+')" title="Add variety">+Var</button>'
            +'<button class="icon-btn danger sm" onclick="removeVendorDesign('+vi+','+di+')" title="Remove">✕</button>'
          +'</div></td></tr>';
        varieties.forEach((v,vri)=>{

          const varImgs=(v.images||[]).map((img,ii)=>{const src=_resolveImgSrc(img);return src
            ?'<img class="variety-thumb" src="'+src+'" style="cursor:zoom-in"><button class="del-img no-print" style="width:auto" onclick="delVVImg('+vi+','+di+','+vri+','+ii+')">✕</button>':''}).filter(Boolean).join('');

          const unitOpts=(S.vocabulary.units||['pcs','pairs','jotta']).map(u=>'<option value="'+u+'"'+(u===(v.unit||'pcs')?' selected':'')+'>'+u+'</option>').join('');
          const szCells=szKeys.map(sz=>'<td><input type="number" class="qty-inp" min="0" value="'+(parseInt((v.sizes||{})[sz])||0)+'" oninput="upVendorVarietySize('+vi+','+di+','+vri+',\''+sz+'\',this.value)" onfocus="this.select()" onkeydown="handleVendorQtyTab(event,this)" tabindex="0"></td>').join('');
          tbody+='<tr style="background:#FAFAFF">'

            +'<td><input type="number" min="0" step="0.01" placeholder="₹" style="font-size:11px;padding:3px 5px;border:1px solid #AFA9EC;border-radius:5px;width:72px;text-align:right" value="'+(v.rate||'')+'" onchange="upVendorVarietyRate('+vi+','+di+','+vri+',this.value)"></td>'

    const footerTotal=Object.values(grpTotals).reduce((a,v)=>a+v,0);
    const footerHtml=footerTotal>0
      ?'<tfoot><tr><td colspan="2" style="text-align:right;color:#534AB7;font-weight:600;font-size:11px">Group total →</td>'
        +szKeys.map(sz=>'<td><strong>'+(grpTotals[sz]||0)+'</strong></td>').join('')
        +'<td class="grand-total"><strong>'+footerTotal+'</strong></td>'

    const refDi=g.items[0].di; // used by addVendorDesignToGroup to inherit name+sizes
    const dids=g.items.map(({d})=>d.id).join(',');

          +szKeys.map(sz=>'<th class="sz-head">'
            +esc(sz)
            +'<button class="no-print" onclick="event.stopPropagation();deleteVendorSizeCol('+vi+',this.dataset.sz,this.dataset.dids)" data-sz="'+esc(sz)+'" data-dids="'+dids+'"'
              +' style="display:block;margin:2px auto 0;background:none;border:none;cursor:pointer;color:rgba(255,255,255,.7);font-size:10px;line-height:1;padding:2px 4px;border-radius:3px" '

}

// ── Vendor design group helpers ───────────────────────────────────────────────
function renameVendorDesignGroup(inp){
  const nv=(inp.value||'').trim();
  const orig=inp.dataset.origname||'';
  if(!nv){inp.value=orig||'(unnamed)';try{_fb.pendingLocal=false;}catch(e){}return;}
  if(nv===orig){try{_fb.pendingLocal=false;}catch(e){}return;}
  const vi=parseInt(inp.dataset.vi,10);
  const dids=(inp.dataset.dids||'').split(',').filter(Boolean);
  const vo=S.vendorOrders[vi];if(!vo){inp.value=orig;return;}
  let changed=false;
  vo.designs.forEach(d=>{if(dids.includes(d.id)){d.name=nv;changed=true;}});
  if(!changed){inp.value=orig;try{_fb.pendingLocal=false;}catch(e){}return;}
  inp.dataset.origname=nv;
  rebuildVocab();
  _origSave();localStorage.setItem('bangle_saved_at',new Date().toISOString());
  try{_fb.pendingLocal=true;if(_fb.ready){clearTimeout(_fb.pushTimer);_fb.pushTimer=null;fbPush(false);}}catch(e){}
  showToast('✅ Design name saved: '+nv,'green');
}
function addVendorDesignToGroup(vi,refDi){
  // Add a new design code to an existing name-group; inherit name + size keys from refDi
  const vo=S.vendorOrders[vi];if(!vo)return;
  const ref=vo.designs[refDi];
  const groupName=ref?ref.name:'';
  const szKeys=ref?Object.keys(ref.sizes||{}):DEFAULT_SIZES;
  histPush();
  vo.designs.push({id:uid(),name:groupName,code:'',sizesLocked:true,sizes:Object.fromEntries(szKeys.map(s=>[s,0])),images:[],varieties:[]});
  save();renderVendorOrders();
}
function addVendorGroupSize(vi,dids){
  const sz=prompt('Enter size label (e.g. 2/16):');if(!sz||!sz.trim())return;
  const s=sz.trim();
  const vo=S.vendorOrders[vi];if(!vo)return;
  const ids=dids.split(',').filter(Boolean);
  histPush();
  vo.designs.forEach(d=>{
    if(!ids.includes(d.id))return;
    if((d.sizes||{})[s]!==undefined)return;
    d.sizes=d.sizes||{};d.sizes[s]=0;
    (d.varieties||[]).forEach(v=>{v.sizes=v.sizes||{};v.sizes[s]=0;});
  });
  save();renderVendorOrders();
}

// ── CRUD ─────────────────────────────────────────────────────────────────────
function toggleVendorOrder(id){
  S.openVendorOrders=S.openVendorOrders||[];
  const key='open_'+id;
  const idx=S.openVendorOrders.indexOf(key);
  if(idx>=0)S.openVendorOrders.splice(idx,1);
  else S.openVendorOrders.push(key);
  renderVendorOrders();
}
function setVendorTab(id,tab){S.vendorActiveTabs[id]=tab;renderVendorOrders();}
function upVendorOrder(vi,key,val){histPush();S.vendorOrders[vi][key]=val;save();renderVendorOrders();}
function delVendorOrder(vi){
  if(!confirm(`Delete ${S.vendorOrders[vi].orderId}? This cannot be undone.`))return;
  histPush();
  const id=S.vendorOrders[vi].id;
  S.vendorOrders.splice(vi,1);
  S.openVendorOrders=(S.openVendorOrders||[]).filter(k=>!k.includes(id));
  delete S.vendorActiveTabs[id];
  audit('VendorOrder','Deleted vendor order '+id);
  save();renderVendorOrders();try{fbPushNow();}catch(e){}
}
function upVendorDesign(vi,di,key,val){histPush();S.vendorOrders[vi].designs[di][key]=val;save();renderVendorOrders();}
function removeVendorDesign(vi,di){histPush();S.vendorOrders[vi].designs.splice(di,1);save();renderVendorOrders();}
function addVendorDesign(vi){
  histPush();
  const newId=uid();
  // Use only sizes that have real quantities in this vendor order — same logic as customer orders
  const activeSizes=new Set();
  (S.vendorOrders[vi].designs||[]).forEach(d=>{
    Object.entries(d.sizes||{}).forEach(([sz,v])=>{if((parseInt(v)||0)>0)activeSizes.add(sz);});
    (d.varieties||[]).forEach(v=>Object.entries(v.sizes||{}).forEach(([sz,qty])=>{if((parseInt(qty)||0)>0)activeSizes.add(sz);}));
  });
  const useSizes=activeSizes.size>0?[...activeSizes]:DEFAULT_SIZES;
  S.vendorOrders[vi].designs.push({id:newId,name:'',code:'',sizes:Object.fromEntries(useSizes.map(s=>[s,0])),varieties:[],images:[]});
  save();renderVendorOrders();
  requestAnimationFrame(()=>{
    const vo=S.vendorOrders[vi];
    const orderEl=document.getElementById('voc-'+vo.id);
    if(orderEl){
      const emptyInps=[...orderEl.querySelectorAll('.variety-name-inp')].filter(el=>!el.value.trim());
      const target=emptyInps[emptyInps.length-1];
      if(target){target.scrollIntoView({behavior:'smooth',block:'nearest'});target.focus();}
    }
  });
}
function addVendorVariety(vi,di){
  histPush();
  const d=S.vendorOrders[vi].designs[di];
  const szKeys=Object.keys(d.sizes||{});
  d.varieties.push({name:'',sizes:Object.fromEntries(szKeys.map(s=>[s,0])),images:[],unit:'pcs'});
  save();renderVendorOrders();
}
function removeVendorVariety(vi,di,vri){histPush();S.vendorOrders[vi].designs[di].varieties.splice(vri,1);save();renderVendorOrders();}
function upVendorVarietyRate(vi,di,vri,val){
  const v=S.vendorOrders[vi].designs[di].varieties[vri];
  if(!v)return;
  v.rate=parseFloat(val)||0;
  scheduleAutosave();
}
function upVendorVariety(vi,di,vri,key,val){S.vendorOrders[vi].designs[di].varieties[vri][key]=val;save();renderVendorOrders();}
function upVendorVarietySize(vi,di,vri,sz,val){
  S.vendorOrders[vi].designs[di].varieties[vri].sizes[sz]=parseInt(val)||0;
  // Recalculate design-level size total
  const d=S.vendorOrders[vi].designs[di];
  Object.keys(d.sizes||{}).forEach(s=>{d.sizes[s]=d.varieties.reduce((a,v)=>a+(parseInt((v.sizes||{})[s])||0),0);});
  save();renderVendorOrders();
}
function addVendorSizeColumn(vi,di){
  const sz=prompt('Enter size label (e.g. 2/16):');
  if(!sz||!sz.trim())return;
  const s=sz.trim();
  histPush();
  const d=S.vendorOrders[vi].designs[di];
  if(d.sizes[s]!==undefined){alert('Size already exists.');return;}
  d.sizes[s]=0;
  (d.varieties||[]).forEach(v=>{v.sizes[s]=0;});
  save();renderVendorOrders();
}
function addVVImg(vi,di,vri,inp){
  const file=inp.files[0];if(!file)return;
  inp.value='';
  const reader=new FileReader();
  reader.onload=async ev=>{
    const compressed=await compressImageToThumb(ev.target.result);
    const r2url=await uploadToR2(compressed);
    S.vendorOrders[vi].designs[di].varieties[vri].images.push({data:r2url||compressed,name:file.name});
    save();renderVendorOrders();
  };
  reader.readAsDataURL(file);
}
function delVVImg(vi,di,vri,ii){S.vendorOrders[vi].designs[di].varieties[vri].images.splice(ii,1);save();renderVendorOrders();}

// ── Flat-row image / unit / rate / size helpers ───────────────────────────────
// Used when vendor design has 0 varieties (isVar=false) or 1 unnamed/Default variety (isVar=true)
function upVendorFlatSize(vi,di,sz,val,isVar){
  const d=S.vendorOrders[vi].designs[di];
  if(isVar&&d.varieties&&d.varieties[0]){
    d.varieties[0].sizes[sz]=parseInt(val)||0;
    // Keep design-level aggregate in sync
    Object.keys(d.sizes||{}).forEach(s=>{d.sizes[s]=d.varieties.reduce((a,v)=>a+(parseInt((v.sizes||{})[s])||0),0);});
  } else {
    d.sizes[sz]=parseInt(val)||0;
  }
  save();renderVendorOrders();
}
function upVendorFlatUnit(vi,di,val,isVar){
  const d=S.vendorOrders[vi].designs[di];
  if(isVar&&d.varieties&&d.varieties[0])d.varieties[0].unit=val;
  else d.unit=val;
  save();renderVendorOrders();
}
function upVendorFlatRate(vi,di,val,isVar){
  const d=S.vendorOrders[vi].designs[di];
  if(isVar&&d.varieties&&d.varieties[0])d.varieties[0].rate=parseFloat(val)||0;
  else d.rate=parseFloat(val)||0;
  scheduleAutosave();
}
function delVendorFlatImg(vi,di,ii,isVar){
  const d=S.vendorOrders[vi].designs[di];
  if(isVar&&d.varieties&&d.varieties[0])(d.varieties[0].images=d.varieties[0].images||[]).splice(ii,1);
  else(d.images=d.images||[]).splice(ii,1);
  save();renderVendorOrders();
}
function addVendorFlatImg(vi,di,isVar,inp){
  const file=inp.files[0];if(!file)return;inp.value='';
  const reader=new FileReader();
  reader.onload=async ev=>{
    const compressed=await compressImageToThumb(ev.target.result);
    const r2url=await uploadToR2(compressed);
    const imgObj={data:r2url||compressed,name:file.name};
    const d=S.vendorOrders[vi].designs[di];
    if(isVar&&d.varieties&&d.varieties[0]){d.varieties[0].images=d.varieties[0].images||[];d.varieties[0].images.push(imgObj);}
    else{d.images=d.images||[];d.images.push(imgObj);}
    save();renderVendorOrders();
  };
  reader.readAsDataURL(file);
}

function voAC(inp,listId,options){
  const q=inp.value.trim().toLowerCase();
  const el=document.getElementById(listId);if(!el)return;
  const matches=options.filter((x,i,a)=>a.indexOf(x)===i&&x.toLowerCase().includes(q)&&x.toLowerCase()!==q);
  if(!q||!matches.length){el.style.display='none';return;}
  el.innerHTML=matches.slice(0,8).map(x=>`<div class="ac-item" onpointerdown="event.preventDefault();document.getElementById('${inp.id}').value='${esc(x).replace(/'/g,"\\'")}';document.getElementById('${listId}').style.display='none'">${esc(x)}</div>`).join('');
  el.style.display='block';
}

function createVendorOrder(){
  ['no-client','no-date','no-dname'].forEach(clearFieldError);
  const errV=document.getElementById('err-no-varieties');if(errV)errV.style.display='none';

  const vendor=(document.getElementById('no-client').value||'').trim();
  const orderId=(document.getElementById('no-id').value||'').trim()||genVendorOrderId();
  const startDate=document.getElementById('no-date').value;
  const deliveryDate=(document.getElementById('no-delivery')||{}).value||'';
  const priority=document.getElementById('no-prio').value;
  const notes=(document.getElementById('no-notes').value||'').trim();
  const dname=(document.getElementById('no-dname').value||'').trim();
  const dcode=(document.getElementById('no-dcode').value||'').trim();

  const bangleType=(document.getElementById('no-btype')?.value)||'dye_gold';

  let hasErr=false;
  if(!vendor){showFieldError('no-client','Vendor name is required');hasErr=true;}
  if(!startDate){showFieldError('no-date','Order date is required');hasErr=true;}
  if(!dname){showFieldError('no-dname','Design name is required');hasErr=true;}

  if(bangleType==='cnc'){
    const cncTotal=window._modalSizes.reduce((a,sz)=>a+(parseInt(((window._modalVarieties||[])[0]?.sizes||{})[sz])||0),0);
    if(!cncTotal){
      if(errV){errV.textContent='Please enter at least one quantity for this CNC design.';errV.style.display='block';}
      hasErr=true;
    }
  } else {
    const validVarieties=(window._modalVarieties||[]).filter(v=>Object.values(v.sizes||{}).reduce((a,x)=>a+(parseInt(x)||0),0)>0);
    if(!(window._modalVarieties||[]).length||!validVarieties.length){
      if(errV){errV.textContent='At least one variety with non-zero quantity is required';errV.style.display='block';}
      hasErr=true;
    }
  }
  if(hasErr)return;

  // Build vendor design objects (no stages)
  const buildVDesign=(dName,dCode,szKeys,vList)=>{
    const szObj=Object.fromEntries(szKeys.map(sz=>[sz,0]));
    vList.forEach(v=>szKeys.forEach(sz=>{szObj[sz]=(szObj[sz]||0)+(parseInt((v.sizes||{})[sz])||0);}));
    return{id:uid(),name:dName,code:dCode,sizesLocked:true,sizes:szObj,images:[],varieties:JSON.parse(JSON.stringify(vList))};
  };

  const firstDesign=buildVDesign(dname,dcode,window._modalSizes,window._modalVarieties);
  const extraDesignObjects=(window._modalExtraDesigns||[]).map(ed=>{
    const szKeys=ed.sizes&&ed.sizes.length?ed.sizes:window._modalSizes;
    return buildVDesign(ed.name||'Design',ed.code||'',szKeys,ed.varieties||[]);
  });

  histPush();
  const newVO={id:uid(),orderId,vendor,startDate,deliveryDate,priority,notes,bangleType,
    designs:[firstDesign,...extraDesignObjects],attachedFile:window._uploadedOrderFile||null};
  window._uploadedOrderFile=null;
  window._modalExtraDesigns=[];
  S.vendorOrders.push(newVO);
  S.openVendorOrders=(S.openVendorOrders||[]);
  S.openVendorOrders.push('open_'+newVO.id);
  S.vendorActiveTabs[newVO.id]='designs';
  audit('VendorOrder',`Created ${orderId} for ${vendor}`);
  rebuildVocab();save();closeModal();renderVendorOrders();try{fbPushNow();}catch(e){}
}

// ── Vendor Order Excel Template & File Import ─────────────────────────────────
function downloadVendorOrderTemplate(){
  if(typeof XLSX==='undefined'){alert('Excel library not loaded. Please check your internet connection.');return;}
  // Build AOA matching Vendor_Order_Template.xlsx structure exactly
  const B=(n)=>Array(n).fill(''); // blank cells
  const data=[
    // Row 1 — Q1 holds unit dropdown source values
    [...B(16),'pcs'],
    // Row 2 — Q2
    [...B(16),'pairs'],
    // Row 3 — Vendor Name label (Q3)
    ['Vendor Name','',...B(14),'jotta'],
    // Row 4 — Start Date label
    ['Start Date','',...B(15)],
    // Row 5 — Notes label
    ['Notes (Optional)','',...B(15)],
    // Row 6 — blank separator
    B(17),
    // Row 7 — CNC section header
    ['CNC DESIGNS & QUANTITIES',...B(16)],
    // Row 8 — CNC column headers
    ['Design Name','Design Code','2/2','2/4','2/6','2/8','2/10','Total','Unit',...B(8)],
    // Rows 9-21 — 13 blank CNC data rows
    ...Array(13).fill(null).map(()=>B(17)),
    // Row 22 — Dye Gold section header
    ['DYE GOLD DESIGNS & VARIETIES',...B(16)],
    // Row 23 — Dye Gold column headers
    ['Design Name','Design Code','Variety','2/2','2/4','2/6','2/8','2/10','2/12','Row Total','Unit',...B(6)],
    // Rows 24-53 — 30 blank Dye Gold data rows
    ...Array(30).fill(null).map(()=>B(17)),
  ];
  const wb=XLSX.utils.book_new();
  const ws=XLSX.utils.aoa_to_sheet(data);
  // Column widths
  ws['!cols']=[
    {wch:22},{wch:16},{wch:10},{wch:8},{wch:8},{wch:8},{wch:8},{wch:8},
    {wch:8},{wch:10},{wch:8},{wch:8},{wch:8},{wch:8},{wch:8},{wch:8},{wch:8}
  ];
  XLSX.utils.book_append_sheet(wb,ws,'Vendor Order');
  const wbout=XLSX.write(wb,{bookType:'xlsx',type:'binary'});
  const buf=new ArrayBuffer(wbout.length);
  const view=new Uint8Array(buf);
  for(let i=0;i<wbout.length;i++)view[i]=wbout.charCodeAt(i)&0xFF;
  const blob=new Blob([buf],{type:'application/octet-stream'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;a.download='Vendor_Order_Template.xlsx';
  document.body.appendChild(a);a.click();document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}

function handleVendorOrderDrop(e){
  e.preventDefault();document.getElementById('upload-zone').classList.remove('drag-over');
  const file=e.dataTransfer.files[0];if(file)processVendorOrderFile(file);
}
function handleVendorOrderFileInput(input){const file=input.files[0];if(file)processVendorOrderFile(file);}
function processVendorOrderFile(file){
  const status=document.getElementById('import-status');
  if(!status)return;
  const name=file.name.toLowerCase();

  // Store file for download in order details
  const fileReader=new FileReader();
  fileReader.onload=ev=>{window._uploadedOrderFile={name:file.name,type:file.type,data:ev.target.result};};
  fileReader.readAsDataURL(file);

  const openPrefilled=(fields)=>{closeModal();openNewVendorOrderModal({...fields,_keepFile:true});};

  if(name.endsWith('.csv')){
    const reader=new FileReader();
    reader.onload=e=>{
      const text=e.target.result;
      const parseCSVRow=line=>{const cells=[];let cur='',inQ=false;for(let i=0;i<line.length;i++){const ch=line[i];if(ch==='"'){inQ=!inQ;}else if(ch===','&&!inQ){cells.push(cur.trim());cur='';}else{cur+=ch;}}cells.push(cur.trim());return cells;};
      const rawRows=text.split('\n').map(parseCSVRow).filter(r=>r.some(c=>c));
      if(rawRows.length<2){status.textContent='CSV appears empty.';status.style.display='block';return;}
      const headers=rawRows[0].map(h=>h.toLowerCase().trim());
      const dataRows=rawRows.slice(1);
      const getFromRow=(row,...keys)=>{for(const k of keys){const i=headers.findIndex(h=>h.includes(k));if(i>=0&&row[i])return String(row[i]).trim();}return '';};
      const parseDateStr=raw=>{if(!raw)return '';const d=new Date(raw);return isNaN(d)?'':d.toISOString().split('T')[0];};
      const designNameIdx=headers.findIndex(h=>h==='design name'||h==='design');
      const designCodeIdx=headers.findIndex(h=>h==='design code'||h==='code');
      const varietyIdx=headers.findIndex(h=>h==='variety name'||h==='variety');
      const sizeIdxMap={};headers.forEach((h,i)=>{if(/^\d+\/\d+$/.test(h))sizeIdxMap[h]=i;});
      const allSizes=Object.keys(sizeIdxMap);
      const orderRow=dataRows[0];
      const orderId=getFromRow(orderRow,'order id','orderid','order no','order number');
      const client=getFromRow(orderRow,'vendor','supplier','party');
      const startDate=parseDateStr(getFromRow(orderRow,'order date','start date','date','start'))||new Date().toISOString().split('T')[0];
      const deliveryDate=parseDateStr(getFromRow(orderRow,'delivery','expected delivery'))||'';
      const notes=getFromRow(orderRow,'notes','remarks','comment');
      const designMap=[];let curDesign=null,lastDName='',lastDCode='';
      dataRows.forEach(row=>{
        const dn=designNameIdx>=0?String(row[designNameIdx]||'').trim():'';
        const dc=designCodeIdx>=0?String(row[designCodeIdx]||'').trim():'';
        if(dn)lastDName=dn;if(dc)lastDCode=dc;
        const vName=varietyIdx>=0?String(row[varietyIdx]||'').trim():'';
        if(!vName)return;
        if(!curDesign||curDesign.name!==lastDName){curDesign={name:lastDName,code:lastDCode,sizes:allSizes,varieties:[]};designMap.push(curDesign);}
        const sizes={};allSizes.forEach(sz=>{sizes[sz]=parseInt(row[sizeIdxMap[sz]])||0;});
        curDesign.varieties.push({name:vName,sizes,images:[]});
      });
      const designs=designMap.filter(d=>d.varieties.length>0);
      status.textContent=`✅ CSV parsed — ${designs.length} design${designs.length===1?'':'s'}, ${designs.reduce((a,d)=>a+d.varieties.length,0)} varieties loaded.`;
      status.style.display='block';
      openPrefilled({orderId,client,startDate,deliveryDate,notes,designs:designs.length>0?designs:undefined});
    };reader.readAsText(file);

  } else if(name.endsWith('.xlsx')||name.endsWith('.xls')){
    if(typeof XLSX==='undefined'){status.textContent='⚠️ SheetJS library not loaded.';status.style.display='block';return;}
    const reader=new FileReader();
    reader.onload=e=>{
      try{
        const wb=XLSX.read(e.target.result,{type:'binary'});
        const ws=wb.Sheets[wb.SheetNames[0]];
        const rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:''});
        if(!rows||rows.length<1){status.textContent='Excel appears empty.';status.style.display='block';return;}
        const parseDate=raw=>{
          if(!raw)return '';
          const num=parseFloat(raw);
          if(!isNaN(num)&&num>10000)return new Date(Math.round((num-25569)*86400*1000)).toISOString().split('T')[0];
          const d=new Date(String(raw));return isNaN(d)?'':d.toISOString().split('T')[0];
        };
        const colA=rows.map(r=>String(r[0]||'').toLowerCase().trim());
        // isLabelFormat: column-A label+value format (vendor template or client template)
        const isLabelFormat=colA.some(l=>l.includes('order id')||l.includes('vendor name')||l.includes('client name'));
        // safe string from potentially object-typed cell (e.g. rich-text XML cell)
        const cellStr=v=>{ if(v===null||v===undefined)return ''; if(typeof v==='object'&&v.t!==undefined)return String(v.v||v.w||''); return String(v); };
        // vIdx=-1 = no variety column; rows with quantities get 'Default' variety name
        // uIdx=-1 = no unit column; default = 'pcs'
        const groupIntoDesigns=(dataRows,dnIdx,dcIdx,vIdx,szIdxMap,allSizes,uIdx)=>{
          const dm=[];const byKey={};let ldn='',ldc='';
          dataRows.forEach(row=>{
            const dn=cellStr(row[dnIdx]).trim(),dc=cellStr(row[dcIdx]).trim();
            if(dn)ldn=dn;if(dc)ldc=dc;
            if(!ldn)return;
            const rawVn=vIdx>=0?cellStr(row[vIdx]).trim():'';
            const hasQty=allSizes.some(sz=>(parseInt(row[szIdxMap[sz]])||0)>0);
            if(!rawVn&&!hasQty)return;
            const vn=rawVn||(hasQty?'Default':'');if(!vn)return;
            const key=ldn+' '+ldc;
            let cur=byKey[key];
            if(!cur){cur={name:ldn,code:ldc,sizes:[...allSizes],varieties:[]};byKey[key]=cur;dm.push(cur);}
            const existNames=cur.varieties.map(v=>v.name);
            let fvn=vn;if(existNames.includes(fvn)){let n=2;while(existNames.includes(fvn+' '+n))n++;fvn=fvn+' '+n;}
            const sizes={};allSizes.forEach(sz=>{sizes[sz]=parseInt(row[szIdxMap[sz]])||0;});
            const unit=uIdx>=0?cellStr(row[uIdx]).trim()||'pcs':'pcs';
            cur.varieties.push({name:fvn,sizes,images:[],unit});
          });
          return dm.filter(d=>d.name&&d.varieties.length>0);
        };
        let orderId='',client='',startDate='',deliveryDate='',notes='';
        if(isLabelFormat){
          const labelVal=label=>{const idx=rows.findIndex(r=>cellStr(r[0]).toLowerCase().includes(label));return idx>=0?cellStr(rows[idx][1]).trim():'';};
          orderId=labelVal('order id');
          // accept both 'vendor name' and 'client name' (in case client template used)
          client=labelVal('vendor name')||labelVal('client name')||labelVal('vendor')||labelVal('supplier');
          startDate=parseDate(labelVal('order date')||labelVal('start date')||labelVal('date'));
          deliveryDate=parseDate(labelVal('expected delivery')||labelVal('delivery'));
          notes=labelVal('notes');

          // ── Helper: parse a section between startRow and endRow ─────────────
          const parseVSection=(startRowIdx,endRowIdx,forceNoVariety)=>{
            const hdrIdx=rows.findIndex((r,i)=>i>startRowIdx&&i<endRowIdx&&cellStr(r[0]).toLowerCase().trim()==='design name');
            if(hdrIdx<0)return[];
            const hdr=rows[hdrIdx].map(h=>cellStr(h).trim());
            const szIdxMap={},allSizes=[];
            hdr.forEach((h,i)=>{if(/^\d+\/\d+$/.test(h)){szIdxMap[h]=i;allSizes.push(h);}});
            const szColSet=new Set(Object.values(szIdxMap));
            // Variety column: look for 'variety' in header; fallback to col-index 2 if it's not a size or total column
            let vIdx=-1;
            if(!forceNoVariety){
              vIdx=hdr.findIndex((h,i)=>i>1&&!szColSet.has(i)&&/variety/i.test(h));
              if(vIdx<0){
                // Fallback: column 2 (C) if it's not a size column and not empty in the header
                if(hdr[2]&&!/^\d+\/\d+$/.test(hdr[2])&&!/total/i.test(hdr[2])&&!/unit/i.test(hdr[2]))vIdx=2;
              }
            }
            const uIdx=hdr.findIndex((h,i)=>!szColSet.has(i)&&/^unit$/i.test(h));
            const sectionDesigns=groupIntoDesigns(rows.slice(hdrIdx+1,endRowIdx),0,1,vIdx,szIdxMap,allSizes,uIdx);
            return sectionDesigns;
          };

          // ── Detect two-section template (CNC + Dye Gold) ───────────────────
          const vcncSecIdx=colA.findIndex(l=>l.includes('cnc design')||l==='cnc');
          const vdyeSecIdx=colA.findIndex(l=>l.includes('dye gold design')||l.includes('dye_gold design')||l.includes('dye gold'));

          if(vcncSecIdx>=0||vdyeSecIdx>=0){
            let allDesigns=[],detectedBT='';
            if(vcncSecIdx>=0){
              const cncEnd=vdyeSecIdx>vcncSecIdx?vdyeSecIdx:rows.length;
              const cncDesigns=parseVSection(vcncSecIdx,cncEnd,true);
              cncDesigns.forEach(d=>{d.bangleType='cnc';});
              if(cncDesigns.length){allDesigns.push(...cncDesigns);detectedBT='cnc';}
            }
            if(vdyeSecIdx>=0){
              const dyeDesigns=parseVSection(vdyeSecIdx,rows.length,false);
              dyeDesigns.forEach(d=>{d.bangleType='dye_gold';});
              if(dyeDesigns.length){allDesigns.push(...dyeDesigns);detectedBT=detectedBT==='cnc'?'both':'dye_gold';}
            }
            const dCount=allDesigns.length,vCount=allDesigns.reduce((a,d)=>a+d.varieties.length,0);
            if(dCount===0){
              status.textContent='⚠️ Sections found but no filled rows detected. Please fill in design names and quantities in the template, then re-upload.';
              status.style.color='#B45309';status.style.display='block';
              openPrefilled({orderId,client,startDate:startDate||new Date().toISOString().split('T')[0],deliveryDate,notes,bangleType:'dye_gold'});
              return;
            }
            const btLabel=detectedBT==='both'?'CNC + Dye Gold':detectedBT==='cnc'?'CNC':'Dye Gold';
            status.textContent=`✅ Excel parsed — ${dCount} design${dCount===1?'':'s'}, ${vCount} variet${vCount===1?'y':'ies'} loaded (${btLabel}).`;
            status.style.color='#0F6E56';status.style.display='block';
            openPrefilled({orderId,client,startDate:startDate||new Date().toISOString().split('T')[0],deliveryDate,notes,designs:allDesigns,bangleType:detectedBT||'dye_gold'});
            return;
          }

          // ── Single-section format (old template / generic) ─────────────────
          const tblHdrIdx=rows.findIndex(r=>cellStr(r[0]).toLowerCase().trim()==='design name');
          if(tblHdrIdx>=0){
            const hdr=rows[tblHdrIdx].map(h=>cellStr(h).trim());
            const szIdxMap={},allSizes=[];
            hdr.forEach((h,i)=>{if(/^\d+\/\d+$/.test(h)){szIdxMap[h]=i;allSizes.push(h);}});
            const szColSet=new Set(Object.values(szIdxMap));
            let vIdx=hdr.findIndex((h,i)=>i>1&&!szColSet.has(i)&&/variety/i.test(h));
            if(vIdx<0&&hdr[2]&&!/^\d+\/\d+$/.test(hdr[2])&&!/total/i.test(hdr[2])&&!/unit/i.test(hdr[2]))vIdx=2;
            const uIdx=hdr.findIndex((h,i)=>!szColSet.has(i)&&/^unit$/i.test(h));
            const designs=groupIntoDesigns(rows.slice(tblHdrIdx+1),0,1,vIdx,szIdxMap,allSizes,uIdx);
            status.textContent=`✅ Excel parsed — ${designs.length} design${designs.length===1?'':'s'}, ${designs.reduce((a,d)=>a+d.varieties.length,0)} varieties loaded.`;
            status.style.color='#0F6E56';status.style.display='block';
            openPrefilled({orderId,client,startDate:startDate||new Date().toISOString().split('T')[0],deliveryDate,notes,designs:designs.length?designs:undefined});
            return;
          }
        } else {
          const headers=rows[0].map(h=>String(h).toLowerCase().trim());
          const dataRow=rows[1]||[];
          const getH=(...keys)=>{for(const k of keys){const i=headers.findIndex(h=>h.includes(k));if(i>=0&&dataRow[i]!==undefined&&dataRow[i]!=='')return String(dataRow[i]).trim();}return '';};
          orderId=getH('order id','orderid','order no');
          client=getH('vendor','supplier','party');
          startDate=parseDate(getH('order date','start date','date'));
          deliveryDate=parseDate(getH('expected delivery','delivery'));
          notes=getH('notes','remarks','comment');
          const dnIdx=headers.findIndex(h=>h==='design name'||h==='design');
          const dcIdx=headers.findIndex(h=>h==='design code'||h==='code');
          const vIdx=headers.findIndex(h=>h==='variety name'||h==='variety');
          const szIdxMap={},allSizes=[];
          headers.forEach((h,i)=>{if(/^\d+\/\d+$/.test(h)){szIdxMap[h]=i;allSizes.push(h);}});
          const szColSetV=new Set(Object.values(szIdxMap));
          const uIdxV=headers.findIndex((h,i)=>!szColSetV.has(i)&&/^unit$/i.test(h));
          if(dnIdx>=0){
            const designs=groupIntoDesigns(rows.slice(1),dnIdx,dcIdx>=0?dcIdx:dnIdx,vIdx,szIdxMap,allSizes,uIdxV);
            status.textContent=`✅ Excel parsed — ${designs.length} design${designs.length===1?'':'s'}, ${designs.reduce((a,d)=>a+d.varieties.length,0)} varieties loaded.`;
            status.style.display='block';
            openPrefilled({orderId,client,startDate:startDate||new Date().toISOString().split('T')[0],deliveryDate,notes,designs:designs.length?designs:undefined});
            return;
          }
        }
        status.textContent='⚠️ Template format not recognised — please use the "Download Excel Template" button to get the correct vendor template, fill it in and re-upload.';
        status.style.color='#B45309';status.style.display='block';
        openPrefilled({orderId,client,startDate:startDate||new Date().toISOString().split('T')[0],deliveryDate,notes});
      }catch(err){status.textContent='⚠️ Could not read Excel file: '+err.message;status.style.color='#A32D2D';status.style.display='block';}
    };reader.readAsBinaryString(file);

  } else if(file.type.startsWith('image/')){
    const reader=new FileReader();
    reader.onload=e=>{
      const zone=document.getElementById('upload-zone');
      if(zone)zone.innerHTML=`<img src="${e.target.result}" style="max-height:140px;border-radius:8px;margin:0 auto;display:block"><p style="margin-top:8px;font-size:11px;color:#666">Order image loaded for reference. Fill fields manually below.</p>`;
    };reader.readAsDataURL(file);
    status.textContent='📷 Order image loaded. Fill in the fields below based on the sheet.';status.style.display='block';
  }
}

// ── Export / Print for Vendor Orders ─────────────────────────────────────────
function exportVendorOrderCSV(oid){
  const vo=S.vendorOrders.find(o=>o.id===oid);if(!vo)return;
  const allSizes=[...new Set(vo.designs.flatMap(d=>Object.keys(d.sizes||{})))];
  const al=vendorOrderAlert(vo);
  const rows=[
    ['=== VENDOR ORDER EXPORT ===','Order ID:',vo.orderId],
    ['Vendor',vo.vendor,'Order Date',fmtDate(vo.startDate),'Delivery Date',fmtDate(vo.deliveryDate),'Priority',vo.priority],
    vo.notes?['Notes',vo.notes]:[],
    [],['--- Designs & Varieties ---'],
    ['Design Name','Design Code','Variety Name',...allSizes,'Total Qty']
  ];
  vo.designs.forEach(d=>{
    const hod=_hasOnlyDefault(d);
    const effSizes=hod?(d.varieties[0].sizes||d.sizes||{}):(d.sizes||{});
    if(hod){
      const sizeVals=allSizes.map(sz=>(effSizes[sz])||0);
      rows.push([d.name,d.code,'—',...sizeVals,sizeVals.reduce((a,x)=>a+x,0)]);
    } else {
      const varieties=d.varieties&&d.varieties.length?d.varieties:[{name:'—',sizes:d.sizes}];
      varieties.forEach(v=>{
        const sizeVals=allSizes.map(sz=>(v.sizes||{})[sz]||0);
        rows.push([d.name,d.code,v.name,...sizeVals,sizeVals.reduce((a,x)=>a+x,0)]);
      });
    }
    const colTotals=allSizes.map(sz=>(parseInt(effSizes[sz])||0));
    rows.push(['','',`[${d.name} TOTAL]`,...colTotals,colTotals.reduce((a,v)=>a+v,0)]);
    rows.push([]);
  });
  downloadCSV(csvEncode(rows.filter(r=>r.length>0)),`vendor_${vo.orderId}_${new Date().toISOString().split('T')[0]}.csv`);
}

// imgMode: 'top' = grouped images below design name (default)
//          'inline' = image column in table beside quantities
//          'none' = no images
function openVendorPrintWindow(title,orders,imgMode){
  imgMode=imgMode||'top';
  const w=window.open('','_blank','width=980,height=780');if(!w)return alert('Pop-up blocked — please allow pop-ups for this page.');

  const body=orders.map(vo=>{
    const qtyStr=formatQtyByUnit(vendorOrderQtyByUnit(vo));

    // Group designs by name (same as screen display)
    const groups=[];const byName={};
    vo.designs.forEach(d=>{
      const key=d.name||'(unnamed)';
      let g=byName[key];if(!g){g={name:key,items:[]};byName[key]=g;groups.push(g);}
      g.items.push(d);
    });

    const groupsHtml=groups.map(g=>{
      // Union size keys
      const szSet=new Set();
      g.items.forEach(d=>{Object.keys(d.sizes||{}).forEach(s=>szSet.add(s));(d.varieties||[]).forEach(v=>Object.keys(v.sizes||{}).forEach(s=>szSet.add(s)));});
      const szKeys=[...szSet];
      const grpTotals={};szKeys.forEach(s=>grpTotals[s]=0);

      // Gather all images for the group (for 'top' mode)
      const groupImgs=[];
      g.items.forEach(d=>{
        const varieties=d.varieties||[];
        const hod=varieties.length===1&&!(varieties[0].name&&varieties[0].name.trim()&&varieties[0].name.trim().toLowerCase()!=='default');
        const flat=varieties.length===0||hod;
        if(flat){const imgs=hod?varieties[0].images||[]:d.images||[];imgs.forEach(img=>{const src=_resolveImgSrc(img);if(src)groupImgs.push({src,label:d.code||d.name});});}
        else{(d.images||[]).forEach(img=>{const src=_resolveImgSrc(img);if(src)groupImgs.push({src,label:d.code||d.name});});varieties.forEach(v=>(v.images||[]).forEach(img=>{const src=_resolveImgSrc(img);if(src)groupImgs.push({src,label:v.name||d.code});}));}
      });

      const imgTopHtml=(imgMode==='top'&&groupImgs.length)
        ?`<div style="display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 10px">`
          +groupImgs.map(({src,label})=>`<div style="display:flex;flex-direction:column;align-items:center;gap:3px">

            <span style="font-size:9px;font-weight:600;color:#3C3489;max-width:80px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:center">${esc(label)}</span>
          </div>`).join('')
          +`</div>`
        :'';

      // Build table rows for all design codes in the group
      let trows='';
      g.items.forEach(d=>{
        const varieties=d.varieties||[];
        const hod=varieties.length===1&&!(varieties[0].name&&varieties[0].name.trim()&&varieties[0].name.trim().toLowerCase()!=='default');
        const flat=varieties.length===0||hod;
        if(flat){
          const rs=hod?(varieties[0].sizes||{}):(d.sizes||{});
          const rt=szKeys.reduce((a,s)=>a+(parseInt(rs[s])||0),0);
          szKeys.forEach(s=>{grpTotals[s]+=(parseInt(rs[s])||0);});
          const unit=hod?(varieties[0].unit||d.unit||'pcs'):(d.unit||'pcs');
          let inlineImg='';
          if(imgMode==='inline'){const imgs=hod?varieties[0].images||[]:d.images||[];const src=imgs.length?_resolveImgSrc(imgs[0]):'';inlineImg=src?`<td style="padding:4px;text-align:center"><img src="${src}" style="width:36px;height:36px;object-fit:cover;border-radius:4px"></td>`:`<td></td>`;}
          trows+=`<tr style="background:#fff;border-bottom:1px solid #E8E7E0">
            <td style="padding:5px 8px;font-weight:600;color:#333;border-right:2px solid #AFA9EC">${esc(d.code||'—')}</td>
            ${imgMode==='inline'?inlineImg:''}

            <td style="padding:5px 6px;text-align:center;font-weight:700;color:#534AB7;background:#EEEDFE">${rt}</td>
            <td style="padding:5px 6px;text-align:center;color:#555;font-size:10px">${esc(unit)}</td>
          </tr>`;
        } else {
          const colT={};szKeys.forEach(s=>{colT[s]=varieties.reduce((a,v)=>a+(parseInt((v.sizes||{})[s])||0),0);grpTotals[s]+=colT[s];});
          const dTotal=Object.values(colT).reduce((a,v)=>a+v,0);
          let inlineImg='';
          if(imgMode==='inline'){const src=d.images&&d.images.length?_resolveImgSrc(d.images[0]):'';inlineImg=src?`<td rowspan="${varieties.length+1}" style="padding:4px;text-align:center;vertical-align:top"><img src="${src}" style="width:36px;height:36px;object-fit:cover;border-radius:4px"></td>`:`<td rowspan="${varieties.length+1}"></td>`;}
          trows+=`<tr style="background:#EEEDFE;border-bottom:1px solid #D0CCF5">

            ${imgMode==='inline'?inlineImg:''}
            <td colspan="${szKeys.length}" style="padding:5px 8px;font-size:10px;color:#6C64CC;font-style:italic">${varieties.length} variet${varieties.length===1?'y':'ies'}</td>
            <td style="padding:5px 6px;text-align:center;font-weight:800;color:#3C3489;background:#D8D3F7">${dTotal}</td>
            <td></td>
          </tr>`;
          varieties.forEach(v=>{
            const rt=szKeys.reduce((a,s)=>a+(parseInt((v.sizes||{})[s])||0),0);
            trows+=`<tr style="background:#FAFAFF;border-bottom:1px solid #E8E7FF">
              <td style="padding:4px 8px 4px 20px;color:#6C64CC;font-size:11px;border-right:2px solid #AFA9EC">└ ${esc(v.name||'Variety')}</td>
              ${szKeys.map(s=>`<td style="padding:4px 6px;text-align:center;font-size:11px">${parseInt((v.sizes||{})[s])||0}</td>`).join('')}
              <td style="padding:4px 6px;text-align:center;font-weight:600;color:#534AB7">${rt}</td>
              <td style="padding:4px 6px;text-align:center;font-size:10px;color:#555">${esc(v.unit||'pcs')}</td>
            </tr>`;
          });
        }
      });

function copyShareUrl(){
  const url = (_shareMode === 'owner') ? SHARE_BASE_URL : SHARE_DEMO_URL;
  const onDone = ()=>{
    const btn=document.getElementById('share-copy-btn');
    if(btn){btn.textContent='✅ Copied!';btn.style.background='#0F6E56';setTimeout(()=>{btn.textContent='📋 Copy';btn.style.background='#534AB7';},2000);}
  };
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(url).then(onDone).catch(()=>{});
  } else {
    const ta=document.createElement('textarea');ta.value=url;ta.style.position='fixed';ta.style.opacity='0';
    document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);
    onDone();
  }
}

// Build printable HTML for an order — mirrors the dashboard table layout exactly.
// imgMode: 'inline' = image col at right of each row | 'top' = gallery above table | 'none' = no images
function buildPrintableOrder(order,tabOverride,includeStages,imgMode){
  if(includeStages===undefined)includeStages=true;
  if(!imgMode)imgMode='top';
  const tab=tabOverride||(S.activeTabs[order.id]||'designs');
  const qtyStr=formatQtyByUnit(orderQtyByUnit(order));
  let content='';

  if(tab==='details'||tab==='all'){
    if(order.notes) content+=`<div style="font-size:12px;color:#444;margin-bottom:8px"><strong>Notes:</strong> ${esc(order.notes)}</div>`;
  }

  if(tab==='designs'||tab==='all'){
    // Group designs by name — same logic as the dashboard
    const groups=[];const byName={};
    order.designs.forEach(d=>{
      const key=d.name||'(unnamed)';
      let g=byName[key];
      if(!g){g={name:key,items:[]};byName[key]=g;groups.push(g);}
      g.items.push(d);
    });

    content+=groups.map(g=>{
      // Collect all size keys for this group
      const szSet=new Set();
      g.items.forEach(d=>{
        const src=(_hasOnlyDefault(d)&&d.varieties[0])?(d.varieties[0].sizes||d.sizes||{}):(d.sizes||{});
        Object.keys(src).forEach(s=>szSet.add(s));
      });
      const szKeys=[...szSet];

      // Accumulate group totals
      const grpTotals={};szKeys.forEach(sz=>grpTotals[sz]=0);
      g.items.forEach(d=>{
        if(!d.varieties)d.varieties=[];
        const isCnc=(order.bangleType==='cnc'||d.bangleType==='cnc');
        const hod=_hasOnlyDefault(d);
        if(isCnc||d.varieties.length===0||hod){
          const rs=hod?(d.varieties[0].sizes||{}):(d.sizes||{});
          szKeys.forEach(sz=>{grpTotals[sz]+=(parseInt(rs[sz])||0);});
        } else {
          d.varieties.forEach(v=>szKeys.forEach(sz=>{grpTotals[sz]+=(parseInt((v.sizes||{})[sz])||0);}));
        }
      });
      const grpTotal=Object.values(grpTotals).reduce((a,v)=>a+v,0);
      const grpUnit=esc((g.items[0]&&(g.items[0].unit||(g.items[0].varieties&&g.items[0].varieties[0]&&g.items[0].varieties[0].unit)))||'pcs');

      // Design name header (shared by all modes)
      const grpHeader='<div style="background:linear-gradient(135deg,#534AB7,#3C3489);color:#fff;padding:9px 14px;border-radius:6px 6px 0 0;display:flex;justify-content:space-between;align-items:center">'
        +'<span style="font-size:14px;font-weight:700">🎨 '+esc(g.name)+'</span>'
        +'<span style="font-size:11px;background:rgba(255,255,255,.2);padding:3px 11px;border-radius:20px">'+g.items.length+' code'+(g.items.length!==1?'s':'')+' · '+grpTotal+' '+grpUnit+'</span>'
      +'</div>';

      // ── MODE: images grouped at top ─────────────────────────────────────────
      if(imgMode==='top'){
        const allImgs=g.items.flatMap(d=>[
          ...(d.images||[]).map(img=>({src:_resolveImgSrc(img),label:d.code||d.name})),
          ...((d.varieties||[])).flatMap(v=>(v.images||[]).map(img=>({src:_resolveImgSrc(img),label:v.name||d.code})))
        ]).filter(({src})=>src);
        const gallery=allImgs.length
          // 3-column CSS grid: exactly 9 images (3 rows × 3 cols) fit on one A4 page.
          // Each image: ~62mm wide, ~82mm tall → 3×62=186mm + 2×4mm gaps = 194mm (fits A4 ~200mm usable width).
          // Quantities table appears below on the same page or overflows to next page.
          ?'<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:4mm;padding:4mm 6mm;background:#fafafe;border-left:1px solid #D0CCF5;border-right:1px solid #D0CCF5">'
            +allImgs.map(({src,label})=>'<div style="text-align:center;break-inside:avoid">'
              +'<img src="'+src+'" style="width:100%;height:82mm;object-fit:cover;border-radius:6px;border:1.5px solid #AFA9EC;display:block">'

      @page{margin:5mm;size:A4 portrait}

function csvEncode(rows){
  return rows.map(r=>r.map(c=>`"${String(c==null?'':c).replace(/"/g,'""')}"`).join(',')).join('\n');
}
function downloadCSV(csv,filename){
  const blob=new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8;'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(url);
}
function getOrderSizes(order){
  const szSet=new Set();
  order.designs.forEach(d=>Object.keys(d.sizes||{}).forEach(s=>szSet.add(s)));
  return [...szSet];
}
function getAllSizes(){
  const szSet=new Set(DEFAULT_SIZES);
  S.orders.forEach(o=>getOrderSizes(o).forEach(s=>szSet.add(s)));
  return [...szSet];
}

// ── EXCEL EXPORT (SheetJS multi-sheet) ────────────────────────────────────────
function exportExcelFull(includeStages){
  if(typeof XLSX==='undefined'){alert('Excel library not loaded. Please use CSV export.');return;}
  if(includeStages===undefined)includeStages=true;
  const filtered=S.orders.filter(orderMatchesFilter);
  const allSizes=getAllSizes();
  const wb=XLSX.utils.book_new();

  // ── Sheet 1: Summary ──────────────────────────────────────────────────────
  const sumRows=[
    ['Order ID','Client','Start Date','Priority','Status','% Done','Total Qty','Designs','Notes']
  ];
  filtered.forEach(o=>{
    const al=orderAlert(o);
    sumRows.push([o.orderId,o.client,fmtDate(o.startDate),o.priority,
      {ok:'On track',warn:'Due soon',late:'Overdue',done:'Completed'}[al],
      orderPct(o)+'%',totalQty(o),o.designs.length,o.notes||'']);
  });
  const ws1=XLSX.utils.aoa_to_sheet(sumRows);
  ws1['!cols']=[{wch:12},{wch:20},{wch:12},{wch:10},{wch:12},{wch:8},{wch:10},{wch:8},{wch:30}];
  XLSX.utils.book_append_sheet(wb,ws1,'Summary');

  // ── Sheet 2: Design & Variety Breakdown ───────────────────────────────────
  const dvRows=[['Order ID','Client','Priority','Status','Design Name','Design Code','Variety',...allSizes,'Total Qty','Stages Done','Total Stages','Stage %']];
  filtered.forEach(o=>{
    const al=orderAlert(o);
    const stLabel={ok:'On track',warn:'Due soon',late:'Overdue',done:'Completed'}[al];
    o.designs.forEach(d=>{
      const hod=_hasOnlyDefault(d);
      const varieties=hod?[]:( d.varieties&&d.varieties.length?d.varieties:[{name:'—',sizes:d.sizes,images:[]}]);
      const flatSizes=hod?(d.varieties[0].sizes||d.sizes||{}):null;
      const stgDone=d.stages.filter(s=>s.status==='done').length;
      if(hod){
        // flat design — no variety row, sizes come from the Default variety
        const sizeVals=allSizes.map(sz=>(flatSizes)[sz]||0);
        dvRows.push([o.orderId,o.client,o.priority,stLabel,d.name,d.code,'—',
          ...sizeVals,sizeVals.reduce((a,x)=>a+x,0),stgDone,d.stages.length,
          d.stages.length?Math.round(stgDone/d.stages.length*100)+'%':'0%']);
      } else {
        varieties.forEach(v=>{
          const sizeVals=allSizes.map(sz=>(v.sizes||{})[sz]||0);
          dvRows.push([o.orderId,o.client,o.priority,stLabel,d.name,d.code,v.name,
            ...sizeVals,sizeVals.reduce((a,x)=>a+x,0),stgDone,d.stages.length,
            d.stages.length?Math.round(stgDone/d.stages.length*100)+'%':'0%']);
        });
      }
    });
  });
  const ws2=XLSX.utils.aoa_to_sheet(dvRows);
  ws2['!cols']=[{wch:12},{wch:20},{wch:10},{wch:12},{wch:20},{wch:12},{wch:18},
    ...allSizes.map(()=>({wch:7})),{wch:10},{wch:10},{wch:10},{wch:8}];
  XLSX.utils.book_append_sheet(wb,ws2,'Design & Variety Breakdown');

  // ── Sheet 3: Production Stages (conditional) ──────────────────────────────
  if(includeStages){
    const stRows=[['Order ID','Client','Design Name','Design Code','Stage #','Stage Name','Location','Vendor','Status','Days Budget','Target Date','Stage Notes']];
    filtered.forEach(o=>{
      o.designs.forEach(d=>{
        d.stages.forEach((st,si)=>{
          const t=getTmpl(st.stageId)||{name:'Custom',loc:''};
          const dl=designDeadline(o,d,si);
          stRows.push([o.orderId,o.client,d.name,d.code,si+1,t.name,t.loc||'',
            st.vendor||'',st.status,getEffDays(o,d,si),fmtDate(dl),st.stageNote||'']);
        });
      });
    });
    const ws3=XLSX.utils.aoa_to_sheet(stRows);
    ws3['!cols']=[{wch:12},{wch:20},{wch:20},{wch:12},{wch:7},{wch:20},{wch:16},{wch:18},{wch:10},{wch:10},{wch:12},{wch:30}];
    XLSX.utils.book_append_sheet(wb,ws3,'Production Stages');
  }

  XLSX.writeFile(wb,`bangle_dashboard_${new Date().toISOString().split('T')[0]}.xlsx`);
}
