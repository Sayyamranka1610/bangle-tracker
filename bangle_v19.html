// ── EXPORT FOR A SINGLE ORDER ──────────────────────────────────────────────────
function exportOrderCSV(oid,includeStages){
  if(includeStages===undefined)includeStages=true;
  const order=S.orders.find(o=>o.id===oid);if(!order)return;
  const allSizes=getOrderSizes(order);
  const al=orderAlert(order);
  const statusLabel={ok:'On track',warn:'Due soon',late:'Overdue',done:'Completed'}[al];
  const rows=[
    ['=== ORDER EXPORT ===','Order ID:',order.orderId],
    ['Client',order.client,'Start Date',fmtDate(order.startDate),'Priority',order.priority,'Status',statusLabel,'% Done',orderPct(order)+'%','Total Qty',totalQty(order)],
    order.notes?['Notes',order.notes]:[],
    [],
    ['--- Designs & Varieties ---'],
    ['Design Name','Design Code','Variety Name',...allSizes,'Total Qty','Stages Done','Total Stages']
  ];
  order.designs.forEach(d=>{
    const hod=_hasOnlyDefault(d);
    const stgDone=d.stages.filter(s=>s.status==='done').length;
    const effectiveSizes=hod?(d.varieties[0].sizes||d.sizes||{}):(d.sizes||{});
    if(hod){
      const sizeVals=allSizes.map(sz=>(effectiveSizes[sz])||0);
      rows.push([d.name,d.code,'—',...sizeVals,sizeVals.reduce((a,x)=>a+x,0),stgDone,d.stages.length]);
    } else {
      const varieties=d.varieties&&d.varieties.length?d.varieties:[{name:'—',sizes:d.sizes}];
      varieties.forEach(v=>{
        const sizeVals=allSizes.map(sz=>(v.sizes||{})[sz]||0);
        rows.push([d.name,d.code,v.name,...sizeVals,sizeVals.reduce((a,x)=>a+x,0),stgDone,d.stages.length]);
      });
    }
    const colTotals=allSizes.map(sz=>(parseInt(effectiveSizes[sz])||0));
    rows.push(['','',`[${d.name} TOTAL]`,...colTotals,colTotals.reduce((a,v)=>a+v,0),'','']);
    rows.push([]);
  });
  if(includeStages){
    rows.push(['--- Production Stages ---']);
    rows.push(['Design Name','Design Code','Stage #','Stage Name','Location','Vendor','Status','Days Budget','Target Date','Notes']);
    order.designs.forEach(d=>{
      d.stages.forEach((st,si)=>{

        rows.push([d.name,d.code,si+1,t.name,t.loc||'',st.vendor||'',st.status,getEffDays(order,d,si),fmtDate(designDeadline(order,d,si)),st.stageNote||'']);

    });
  }
  downloadCSV(csvEncode(rows.filter(r=>r.length>0)),`order_${order.orderId}_${new Date().toISOString().split('T')[0]}.csv`);
}

// ── EXPORT FOR ANALYTICS VIEW ──────────────────────────────────────────────────
function exportAnalyticsCSV(){
  const orders=S.orders;
  const rows=[['=== ANALYTICS EXPORT ==='],['Exported',new Date().toLocaleString()],[]];
  rows.push(['--- Key Metrics ---']);
  rows.push(['Total Orders',orders.length]);
  rows.push(['Total Designs',orders.reduce((a,o)=>a+o.designs.length,0)]);
  rows.push(['Total Pieces',orders.reduce((a,o)=>a+totalQty(o),0)]);
  rows.push(['Avg Completion %',Math.round(orders.reduce((a,o)=>a+orderPct(o),0)/(orders.length||1))+'%']);
  rows.push(['Overdue',orders.filter(o=>orderAlert(o)==='late').length]);
  rows.push(['Due Soon',orders.filter(o=>orderAlert(o)==='warn').length]);
  rows.push(['On Track',orders.filter(o=>orderAlert(o)==='ok').length]);
  rows.push(['Completed',orders.filter(o=>orderAlert(o)==='done').length]);
  rows.push([]);
  rows.push(['--- Orders by Client ---']);
  rows.push(['Client','Order Count','Total Qty']);
  const byClient={};
  orders.forEach(o=>{if(!byClient[o.client])byClient[o.client]={count:0,qty:0};byClient[o.client].count++;byClient[o.client].qty+=totalQty(o);});
  Object.entries(byClient).sort((a,b)=>b[1].count-a[1].count).forEach(([c,v])=>rows.push([c,v.count,v.qty]));
  rows.push([]);
  rows.push(['--- Quantity by Design Code ---']);
  rows.push(['Design Code','Design Name','Total Qty']);
  const byCode={};
  orders.forEach(o=>o.designs.forEach(d=>{const k=d.code||'?';if(!byCode[k])byCode[k]={name:d.name,qty:0};byCode[k].qty+=designQty(d);}));
  Object.entries(byCode).sort((a,b)=>b[1].qty-a[1].qty).forEach(([c,v])=>rows.push([c,v.name,v.qty]));
  rows.push([]);
  rows.push(['--- Stage Completion Rates ---']);
  rows.push(['Stage Name','Done Count','Total Count','Completion %']);
  const stageStats={};
  orders.forEach(o=>o.designs.forEach(d=>d.stages.forEach(st=>{const t=getTmpl(st.stageId);if(!t)return;if(!stageStats[t.name])stageStats[t.name]={done:0,total:0};stageStats[t.name].total++;if(st.status==='done')stageStats[t.name].done++;})));
  Object.entries(stageStats).forEach(([name,v])=>rows.push([name,v.done,v.total,v.total?Math.round(v.done/v.total*100)+'%':'0%']));
  downloadCSV(csvEncode(rows),`analytics_${new Date().toISOString().split('T')[0]}.csv`);
}

function invIsoDate(d){
  // returns YYYY-MM-DD string from Date or string
  if(!d)return new Date().toISOString().split('T')[0];
  if(typeof d==='string')return d.split('T')[0];
  return d.toISOString().split('T')[0];
}

function invWeekKey(dateStr){
  const d=new Date(dateStr+'T00:00:00');
  const jan1=new Date(d.getFullYear(),0,1);
  const wk=Math.ceil(((d-jan1)/864e5+jan1.getDay()+1)/7);
  return `${d.getFullYear()}-W${String(wk).padStart(2,'0')}`;
}
function invWeekLabel(key){
  const [yr,wp]=key.split('-W');
  return `Week ${wp}, ${yr}`;
}
function invMonthKey(dateStr){return dateStr.slice(0,7);}
function invMonthLabel(key){
  const [y,m]=key.split('-');
  const mNames=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return `${mNames[parseInt(m)-1]} ${y}`;
}
function invYearKey(dateStr){return dateStr.slice(0,4);}
function invPeriodKey(dateStr){
  if(S.invPeriod==='weekly')return invWeekKey(dateStr);
  if(S.invPeriod==='yearly')return invYearKey(dateStr);
  return invMonthKey(dateStr);
}
function invPeriodLabel(key){
  if(S.invPeriod==='weekly')return invWeekLabel(key);
  if(S.invPeriod==='yearly')return key;
  return invMonthLabel(key);
}

// Compute running balance for a design key (name or code) up to a given date
// All quantities now in pcs (raw pipes also tracked in pcs)
function invBalance(designKey,byField,upToDate){
  const entries=S.invLedger.filter(e=>e[byField]===designKey&&e.date<=upToDate)
    .sort((a,b)=>a.date.localeCompare(b.date));
  let raw=0,semi=0,fin=0;
  entries.forEach(e=>{
    const m=INV_TYPE_META[e.type];if(!m)return;
    // Support both old qtyKg/qtySets format and new unified qty field
    const v=parseInt(e.qty!=null?e.qty:(m.col==='raw'?(e.qtyKg||0):(e.qtySets||0)))||0;
    if(m.col==='raw')raw+=m.sign*v;
    else if(m.col==='semi')semi+=m.sign*v;
    else fin+=m.sign*v;
  });
  return{raw:Math.max(0,raw),semi:Math.max(0,semi),fin:Math.max(0,fin)};
}

// Build period summary rows for a design key
function invBuildPeriodRows(designKey,byField){
  const field=byField||'designName';
  const relevant=S.invLedger.filter(e=>e[field]===designKey).sort((a,b)=>a.date.localeCompare(b.date));
  if(!relevant.length)return[];
  const periods={};
  relevant.forEach(e=>{
    const pk=invPeriodKey(e.date);
    if(!periods[pk])periods[pk]={key:pk,moves:[]};
    periods[pk].moves.push(e);
  });
  const sortedPeriods=Object.keys(periods).sort();
  const rows=[];

  sortedPeriods.forEach((pk)=>{
    const periodEntries=periods[pk].moves.sort((a,b)=>a.date.localeCompare(b.date));
    // Opening: balance using all entries strictly before this period
    const prevEntries=S.invLedger.filter(e=>e[field]===designKey&&invPeriodKey(e.date)<pk);
    let openRaw=0,openSemi=0,openFin=0;
    prevEntries.forEach(e=>{
      const m=INV_TYPE_META[e.type];if(!m)return;
      const v=parseInt(e.qty!=null?e.qty:(m.col==='raw'?(e.qtyKg||0):(e.qtySets||0)))||0;
      if(m.col==='raw')openRaw+=m.sign*v;
      else if(m.col==='semi')openSemi+=m.sign*v;
      else openFin+=m.sign*v;
    });
    openRaw=Math.max(0,openRaw);openSemi=Math.max(0,openSemi);openFin=Math.max(0,openFin);
    // Movements in period (rejections included under Out)
    let rawIn=0,rawOut=0,rawRej=0,semiIn=0,semiOut=0,semiRej=0,finIn=0,finOut=0,finRej=0;
    periodEntries.forEach(e=>{
      const v=parseInt(e.qty!=null?e.qty:(e.qtyKg||e.qtySets||0))||0;
      if(e.type==='raw_in')rawIn+=v;
      else if(e.type==='raw_out')rawOut+=v;
      else if(e.type==='raw_rejection')rawRej+=v;
      else if(e.type==='semi_in')semiIn+=v;
      else if(e.type==='semi_out')semiOut+=v;
      else if(e.type==='semi_rejection')semiRej+=v;
      else if(e.type==='fin_in')finIn+=v;
      else if(e.type==='fin_out')finOut+=v;
      else if(e.type==='fin_rejection')finRej+=v;
    });
    const closeRaw=Math.max(0,openRaw+rawIn-rawOut-rawRej);
    const closeSemi=Math.max(0,openSemi+semiIn-semiOut-semiRej);
    const closeFin=Math.max(0,openFin+finIn-finOut-finRej);
    rows.push({pk,label:invPeriodLabel(pk),
      openRaw,openSemi,openFin,
      rawIn,rawOut,rawRej,
      semiIn,semiOut,semiRej,
      finIn,finOut,finRej,
      closeRaw,closeSemi,closeFin,
      moves:periodEntries});
  });
  return rows;
}

// Gather all unique design keys
function invGetDesignKeys(byField){
  const set=new Set();
  S.invLedger.forEach(e=>set.add(e[byField]));
  // Also add from orders (so designs appear even with no manual entries yet)
  S.orders.forEach(o=>o.designs.forEach(d=>{
    if(byField==='designName')set.add(d.name);
    else set.add(d.code);
  }));
  return[...set].filter(Boolean).sort();
}

// Get current totals for all designs (for summary cards)
function invGetCurrentTotals(){
  const today=invIsoDate(new Date());
  let totalRaw=0,totalSemi=0,totalFin=0;
  const designKeys=invGetDesignKeys('designName');
  designKeys.forEach(k=>{
    const b=invBalance(k,'designName',today);
    totalRaw+=b.raw;totalSemi+=b.semi;totalFin+=b.fin;
  });
  return{totalRaw,totalSemi,totalFin,totalMoves:S.invLedger.length};
}

function renderInvPeriodTable(designKeys,byField){
  if(!designKeys.length)return'';
  const allPeriods=new Set();

// ── Perceptual image hash (8×8 aHash) ────────────────────────────────────────
function imgHash(dataUrl){
  return new Promise(resolve=>{
    const img=new Image();
    img.onload=()=>{
      try{
        const c=document.createElement('canvas');c.width=8;c.height=8;
        const ctx=c.getContext('2d');ctx.drawImage(img,0,0,8,8);
        const px=ctx.getImageData(0,0,8,8).data;
        const gray=[];
        for(let i=0;i<64;i++)gray.push(0.299*px[i*4]+0.587*px[i*4+1]+0.114*px[i*4+2]);
        const avg=gray.reduce((a,v)=>a+v,0)/64;
        resolve(gray.map(v=>v>=avg?'1':'0').join(''));
      }catch(e){resolve('');}
    };
    img.onerror=()=>resolve('');
    img.src=dataUrl;
  });
}
function hashDist(h1,h2){
  if(!h1||!h2||h1.length!==h2.length)return 64;
  let d=0;for(let i=0;i<h1.length;i++)if(h1[i]!==h2[i])d++;return d;
}
function hashSimilarity(h1,h2){return Math.round((1-hashDist(h1,h2)/64)*100);}

// ── Render Physical Stock view ────────────────────────────────────────────────
function renderStockView(container){
  const todayStr=invIsoDate(new Date());
  const searchActive=window._stockSearchHash||null;

  // ── 1. Build design map from orders ──────────────────────────────────────
  // designName → {name, code, varieties: Map(varName→{name,images[],sizes{}})}
  const designMap=new Map();
  S.orders.forEach(o=>{
    (o.designs||[]).forEach(d=>{
      if(!d.name)return;
      if(!designMap.has(d.name))designMap.set(d.name,{name:d.name,code:d.code||'',varieties:new Map()});
      const dm=designMap.get(d.name);
      if(!dm.code&&d.code)dm.code=d.code;
      (d.varieties||[]).forEach(v=>{
        if(!v.name)return;
        if(!dm.varieties.has(v.name))dm.varieties.set(v.name,{name:v.name,images:[],sizes:{}});
        const ve=dm.varieties.get(v.name);
        // Merge images (unique by data string)
        (v.images||[]).forEach(img=>{if(img.data&&!ve.images.some(x=>x.data===img.data))ve.images.push(img);});
        // Accumulate sizes across all orders
        Object.entries(v.sizes||{}).forEach(([sz,qty])=>{ve.sizes[sz]=(ve.sizes[sz]||0)+(parseInt(qty)||0);});
      });
    });
  });

  // ── 2. Also add ledger-only designs (not yet in orders) ──────────────────
  S.invLedger.forEach(e=>{
    if(e.designName&&!designMap.has(e.designName))
      designMap.set(e.designName,{name:e.designName,code:e.designCode||'',varieties:new Map()});
  });

  // ledger balances not shown in Physical Stock view

  // ── 4. Attach manual opening-balance entries (S.stockItems) ──────────────
  const manualByDesign={};
  (S.stockItems||[]).forEach(item=>{
    if(!item.designName)return;
    (manualByDesign[item.designName]||(manualByDesign[item.designName]=[])).push(item);
    if(!designMap.has(item.designName)){
      const bal=invBalance(item.designName,'designName',todayStr);
      designMap.set(item.designName,{name:item.designName,code:item.designCode||'',varieties:new Map(),
        ledgerFin:bal.fin,ledgerRaw:bal.raw,ledgerSemi:bal.semi});
    }
  });

  // ── 5. Sort / filter ─────────────────────────────────────────────────────
  const textQ=(window._stockTextSearch||'').trim().toLowerCase();
  let designs=[...designMap.values()];
  if(searchActive){
    designs=designs.map(dm=>{
      let bestSim=0;
      dm.varieties.forEach(v=>(v.images||[]).forEach(img=>{
        const s=hashSimilarity(searchActive,img.hash||'');if(s>bestSim)bestSim=s;
      }));
      (manualByDesign[dm.name]||[]).forEach(item=>(item.images||[]).forEach(img=>{
        const s=hashSimilarity(searchActive,img.hash||'');if(s>bestSim)bestSim=s;
      }));
      return{...dm,_sim:bestSim};
    }).sort((a,b)=>b._sim-a._sim);
  } else {
    if(textQ) designs=designs.filter(dm=>dm.name.toLowerCase().includes(textQ)||(dm.code||'').toLowerCase().includes(textQ));
    designs.sort((a,b)=>a.name.localeCompare(b.name));
  }

  // ── 7. Render design cards ────────────────────────────────────────────────
  const galleryHtml=designs.length?designs.map(dm=>{
    const varieties=[...dm.varieties.values()];
    const manual=manualByDesign[dm.name]||[];
    const simBadge=searchActive&&dm._sim!=null?`<div class="match-badge">${dm._sim}% match</div>`:'';

    // First available image (from any variety or manual entry)
    const firstImg=(varieties.find(v=>v.images&&v.images.length)||{images:[]}).images[0]?.data
      ||(manual[0]?.images||[])[0]?.data||'';

    // Variety rows with image + sizes
    const varRowsHtml=varieties.map(v=>{
      const sizes=v.sizes||{};
      const totalVarPcs=Object.values(sizes).reduce((a,b)=>a+(parseInt(b)||0),0);
      const sizeChips=Object.entries(sizes).filter(([,val])=>parseInt(val)>0)
        .map(([sz,val])=>`<span class="stock-size-chip">${sz}: ${val}</span>`).join('');
      const imgSrc=(v.images&&v.images.length)?v.images[0].data:'';
      return`<div style="display:flex;align-items:flex-start;gap:10px;padding:8px 10px;border-bottom:1px solid #EEEDFE;background:#fafafd">
        <div style="width:48px;height:48px;border-radius:8px;overflow:hidden;flex-shrink:0;border:1.5px solid #D0CCF5;background:#f4f3ef;display:flex;align-items:center;justify-content:center">
          ${imgSrc?`<img src="${imgSrc}" style="width:100%;height:100%;object-fit:cover;cursor:zoom-in" onclick="openLbDirect('${imgSrc}')">`:`<span style="font-size:16px;color:#ccc">🖼️</span>`}
        </div>
        <div style="flex:1;min-width:0">
          <div style="font-size:12px;font-weight:600;color:#3C3489;margin-bottom:3px">🧵 ${esc(v.name)}</div>
          <div class="stock-size-chips" style="margin-bottom:2px">${sizeChips||'<span style="font-size:10px;color:#aaa">No size data</span>'}</div>
          <span style="font-size:10px;color:#0F6E56;font-weight:600">Order qty: ${totalVarPcs} pcs</span>
        </div>
      </div>`;
    }).join('');

    // Manual opening balance rows
    const manualHtml=manual.map(item=>{
      const tot=Object.values(item.sizes||{}).reduce((a,v)=>a+(parseInt(v)||0),0);
      const sizeChips=Object.entries(item.sizes||{}).filter(([,v])=>parseInt(v)>0)
        .map(([sz,v])=>`<span class="stock-size-chip" style="background:#FFF3CD;color:#7a4800">${sz}:${v}</span>`).join('');
      return`<div style="padding:7px 10px;background:linear-gradient(135deg,#FFF8E1,#FFF3CD);border-bottom:1px solid #FFD54F;font-size:11px">
        <div style="font-weight:600;color:#854F0B;margin-bottom:3px">📋 Opening Balance · ${esc(item.variety||'All Varieties')} · ${item.date||''}</div>
        <div style="display:flex;gap:4px;flex-wrap:wrap;margin-bottom:3px">${sizeChips}</div>
        <div style="color:#0F6E56;font-weight:700">Total: ${tot} pcs</div>
        ${item.notes?`<div style="color:#aaa;font-size:10px;margin-top:2px">${esc(item.notes)}</div>`:''}
        <div style="margin-top:5px;display:flex;gap:5px">
          <button class="icon-btn sm" onclick="openEditStockModal('${item.id}')">✏️ Edit</button>
          <button class="icon-btn sm danger" onclick="deleteStockItem('${item.id}')">✕ Delete</button>
        </div>
      </div>`;
    }).join('');


    return`<div class="stock-card" style="position:relative">
      ${simBadge?`<div style="position:absolute;top:8px;right:8px;z-index:2">${simBadge}</div>`:''}
      <div class="stock-card-img" style="${firstImg?'cursor:zoom-in':''}" ${firstImg?`onclick="openLbDirect('${firstImg}')"`:''}>
        ${firstImg?`<img src="${firstImg}" alt="${esc(dm.name)}">`:`<span style="font-size:32px;color:#D3D1C7">🖼️</span>`}
      </div>
      <div class="stock-card-body">
        <div class="stock-card-title">${esc(dm.code||dm.name)}</div>
        ${dm.code?`<div style="font-size:11px;color:#888;font-weight:400;margin-bottom:6px">${esc(dm.name)}</div>`:''}
        <!-- Variety breakdown from orders -->
        ${varieties.length?`<div style="border:1.5px solid #D0CCF5;border-radius:10px;overflow:hidden;margin-bottom:8px">
          <div style="background:linear-gradient(135deg,#534AB7,#3C3489);color:#fff;font-size:10px;font-weight:700;padding:5px 10px;text-transform:uppercase;letter-spacing:.04em">📋 Variety Breakdown — from Orders</div>
          ${varRowsHtml}
        </div>`:''}
        ${manualHtml?`<div style="border:1.5px solid #FFD54F;border-radius:10px;overflow:hidden;margin-bottom:8px">${manualHtml}</div>`:''}
        <div class="stock-card-actions" style="margin-top:4px">
          <button class="icon-btn" onclick="openAddStockModal(true)" style="font-size:11px">📋 Add Opening Balance</button>
        </div>
      </div>
    </div>`;
  }).join(''):`<div class="stock-empty">No designs found yet.<br>Create orders with design varieties, or add opening balances to get started.</div>`;

  const searchResultLabel=searchActive?`<div style="font-size:12px;color:#0F6E56;font-weight:600;margin-bottom:8px">🔍 Showing results sorted by image similarity — <button class="icon-btn" onclick="clearStockSearch()">✕ Clear search</button></div>`:'';

  container.innerHTML+=`
  <div class="stock-toolbar">
    <div>
      <strong style="color:#534AB7;font-size:13px">📦 Physical Stock</strong>
    </div>
    <div style="margin-left:auto;display:flex;gap:8px;flex-wrap:wrap">
      <button onclick="openAddStockModal(true)" style="background:#534AB7;color:#fff;border:none;border-radius:8px;padding:7px 13px;font-size:12px;font-weight:600;cursor:pointer">📋 Add Opening Balance</button>
      <button class="icon-btn" onclick="exportStockExcel()">📥 Export Excel</button>
    </div>
  </div>

  <!-- Designs count -->
  <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px">
    <div style="background:linear-gradient(135deg,#EEEDFE,#E4E2F8);border:1.5px solid #AFA9EC;border-radius:12px;padding:11px 18px;text-align:center;min-width:100px">
      <div style="font-size:22px;font-weight:800;color:#3C3489">${designs.length}</div>
      <div style="font-size:10px;font-weight:700;color:#534AB7;text-transform:uppercase;letter-spacing:.04em">🎨 Designs</div>
    </div>
  </div>

  <!-- Text search by code or name -->
  <div style="display:flex;gap:8px;align-items:center;margin-bottom:10px">
    <input type="text" id="stock-text-search"
      placeholder="🔎 Search by design code or name..."
      value="${esc(window._stockTextSearch||'')}"
      oninput="window._stockTextSearch=this.value;renderInventory()"
      style="flex:1;padding:9px 14px;border:1.5px solid #AFA9EC;border-radius:10px;font-size:13px;outline:none;color:#1a1916;background:#fff">
    ${(window._stockTextSearch||'').trim()?`<button class="icon-btn" onclick="window._stockTextSearch='';renderInventory()">✕ Clear</button>`:''}
  </div>

  <div class="stock-img-search" id="stock-search-zone"
    ondragover="event.preventDefault();this.classList.add('drag-over')"
    ondragleave="this.classList.remove('drag-over')"
    ondrop="handleStockImgDrop(event)"
    onclick="document.getElementById('stock-search-inp').click()">
    <div style="font-size:24px;margin-bottom:6px">🔍</div>
    <strong style="font-size:12px">Search by image — upload a photo of the design variety</strong>
    <p style="font-size:11px;color:#888;margin-top:4px">Drop image here or click · Cards sorted by visual similarity</p>
  </div>
  <input type="file" id="stock-search-inp" accept="image/*" style="display:none" onchange="handleStockSearchFile(this)">

  ${searchResultLabel}
  <div class="stock-gallery">${galleryHtml}</div>`;
  if((window._stockTextSearch||'').trim()){
    setTimeout(()=>{const el=document.getElementById('stock-text-search');if(el){const v=el.value.length;el.focus();el.setSelectionRange(v,v);}},0);
  }
}

function clearStockSearch(){window._stockSearchHash=null;renderInventory();}

function handleStockImgDrop(e){
  e.preventDefault();document.getElementById('stock-search-zone').classList.remove('drag-over');
  const file=e.dataTransfer.files[0];if(file&&file.type.startsWith('image/'))runStockImageSearch(file);
}
function handleStockSearchFile(inp){const file=inp.files[0];if(file)runStockImageSearch(file);inp.value='';}
function runStockImageSearch(file){
  const zone=document.getElementById('stock-search-zone');
  if(zone)zone.innerHTML='<div style="font-size:12px;color:#534AB7;font-weight:600">⏳ Analysing image…</div>';
  const reader=new FileReader();
  reader.onload=async ev=>{
    const hash=await imgHash(ev.target.result);
    window._stockSearchHash=hash;
    renderInventory();
  };
  reader.readAsDataURL(file);
}

function addStockSize(){

function removeStockSize(i){window._stockModalSizes.splice(i,1);refreshStockSizeRows();}
function refreshStockSizeRows(){

async function handleStockImgUpload(inp){
  const files=Array.from(inp.files);
  for(const file of files){
    await new Promise(resolve=>{
      const reader=new FileReader();
      reader.onload=async ev=>{
        const compressed=await compressImageToThumb(ev.target.result);
        const r2url=await uploadToR2(compressed);
        window._stockModalImages.push({data:r2url||compressed,name:file.name});
        resolve();
      };reader.readAsDataURL(file);
    });
  }
  inp.value='';
  // refresh preview
  const prev=document.getElementById('stk-img-preview');
  if(prev)prev.innerHTML=window._stockModalImages.map((im,i)=>`<div style="position:relative">
    <img src="${im.data}" style="width:72px;height:72px;object-fit:cover;border-radius:8px;border:1.5px solid #AFA9EC;cursor:pointer" onclick="openLbDirect('${im.data}')">
    <button style="position:absolute;top:-5px;right:-5px;width:18px;height:18px;border-radius:50%;border:none;background:#E24B4A;color:#fff;font-size:10px;cursor:pointer;padding:0;line-height:1" onclick="removeStockImg(${i})">✕</button>
  </div>`).join('')+`<label style="width:72px;height:72px;border:2px dashed #AFA9EC;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;font-size:10px;color:#888;gap:4px" for="stk-img-inp">
    <span style="font-size:22px">📷</span>Add
  </label><input type="file" id="stk-img-inp" accept="image/*" multiple style="display:none" onchange="handleStockImgUpload(this)">`;
}
function removeStockImg(i){window._stockModalImages.splice(i,1);const prev=document.getElementById('stk-img-preview');if(prev){const fakeInp=document.createElement('input');fakeInp.style.display='none';handleStockImgUpload(fakeInp);}}

async function saveStockItem(editId,isOb){
  const dname=document.getElementById('stk-dname').value.trim();
  const dcode=document.getElementById('stk-dcode').value.trim();
  const variety=document.getElementById('stk-variety').value.trim();
  const date=document.getElementById('stk-date').value;
  const notes=document.getElementById('stk-notes').value.trim();
  if(!dname||!variety){alert('Design name and Variety name are required.');return;}
  const sizes={};
  window._stockModalSizes.forEach((sz,i)=>{
    const inp=document.getElementById('stock-sz-'+i);
    sizes[sz]=parseInt(inp?inp.value:0)||0;
  });
  if(!S.stockItems)S.stockItems=[];
  if(editId){
    const idx=S.stockItems.findIndex(x=>x.id===editId);
    if(idx>=0)S.stockItems[idx]={...S.stockItems[idx],designName:dname,designCode:dcode,variety,sizes,date,isOpeningBalance:!!isOb,notes,images:window._stockModalImages};
  } else {
    S.stockItems.push({id:uid(),designName:dname,designCode:dcode,variety,sizes,date,isOpeningBalance:!!isOb,notes,images:window._stockModalImages});
  }
  save();closeModal();renderInventory();
}
function openEditStockModal(id){openAddStockModal(false,id);}
function deleteStockItem(id){
  if(!confirm('Delete this stock entry? This cannot be undone.'))return;
  S.stockItems=(S.stockItems||[]).filter(x=>x.id!==id);
  save();renderInventory();
}

// ── Excel Export ──────────────────────────────────────────────────────────────
function exportStockExcel(){
  if(typeof XLSX==='undefined'){alert('SheetJS not loaded.');return;}
  const items=S.stockItems||[];
  if(!items.length){alert('No stock entries to export.');return;}

  // Collect all sizes across all items
  const allSizes=[...new Set(items.flatMap(it=>Object.keys(it.sizes||{})))].sort((a,b)=>{
    const pa=parseInt(a.split('/')[1]||0),pb=parseInt(b.split('/')[1]||0);return pa-pb;
  });

  const today=new Date().toISOString().split('T')[0];
  const sheetData=[
    [`🪬 Bangle Production Tracker — Physical Stock Report as of ${today}`],
    [`Generated: ${new Date().toLocaleString()}`],
    [],
    ['Design Name','Design Code','Variety','Type','Date','Notes',...allSizes,'Total Pcs'],
    ...items.map(it=>{
      const total=Object.values(it.sizes||{}).reduce((a,v)=>a+(parseInt(v)||0),0);
      return[
        it.designName||'',it.designCode||'',it.variety||'',
        it.isOpeningBalance?'Opening Balance':'Stock Entry',
        it.date||'',it.notes||'',
        ...allSizes.map(sz=>parseInt((it.sizes||{})[sz])||0),
        total
      ];
    }),
    [],
    // Summary row — totals per size
    ['','','','TOTAL','','', ...allSizes.map(sz=>items.reduce((a,it)=>a+(parseInt((it.sizes||{})[sz])||0),0)),
      items.reduce((a,it)=>a+Object.values(it.sizes||{}).reduce((b,v)=>b+(parseInt(v)||0),0),0)
    ]
  ];

  const wb=XLSX.utils.book_new();
  const ws=XLSX.utils.aoa_to_sheet(sheetData);
  ws['!cols']=[{wch:20},{wch:14},{wch:18},{wch:16},{wch:12},{wch:22},...allSizes.map(()=>({wch:8})),{wch:10}];
  const lc=5+allSizes.length+1;
  ws['!merges']=[{s:{r:0,c:0},e:{r:0,c:lc}},{s:{r:1,c:0},e:{r:1,c:lc}}];
  XLSX.utils.book_append_sheet(wb,ws,'Physical Stock');
  XLSX.writeFile(wb,`Physical_Stock_${today}.xlsx`);
}

function invUpdateDesignFields(){
  const sel=document.getElementById('inv-design');
  const val=sel.value;

  const[name,code]=val.split('|');
  document.getElementById('inv-dname').value=name||'';
  document.getElementById('inv-dcode').value=code||'';
}

function invToggleQtyFields(){
  const t=document.getElementById('inv-type').value;
  const isRaw=t==='raw_in'||t==='raw_out';
  document.getElementById('inv-qty-raw').style.display=isRaw?'':'none';
  document.getElementById('inv-qty-sets').style.display=(!t||isRaw)?'none':'';
}

function saveInvEntry(){
  const date=document.getElementById('inv-date').value;
  const designVal=document.getElementById('inv-design').value;
  const type=document.getElementById('inv-type').value;
  const errEl=document.getElementById('inv-err');
  errEl.style.display='none';

  if(!date||!designVal||!type){errEl.textContent='Please fill in Date, Design, and Movement Type.';errEl.style.display='block';return;}
  const[designName,designCode]=designVal.split('|');
  // All types now use integer pieces
  const isRaw=type==='raw_in'||type==='raw_out';
  const qtyEl=isRaw?document.getElementById('inv-qty-kg'):document.getElementById('inv-qty-pcs');
  const vendorEl=isRaw?document.getElementById('inv-vendor'):document.getElementById('inv-vendor2');
  const qty=parseInt(qtyEl.value)||0;
  const vendor=vendorEl.value.trim();
  if(qty<=0){errEl.textContent='Please enter a valid quantity in pcs.';errEl.style.display='block';return;}
  const orderId=document.getElementById('inv-order').value;
  const note=document.getElementById('inv-note').value.trim();
  const entry={id:uid(),date,designName,designCode,type,qty,qtyKg:0,qtySets:qty,vendor,orderId,note,source:'manual'};
  S.invLedger.push(entry);
  S.invLedger.sort((a,b)=>a.date.localeCompare(b.date));
  audit('Inventory',`${INV_TYPE_META[type].label}: ${designName} [${designCode}] — ${qty} pcs`);
  save();closeModal();renderInventory();
}

      <table style="width:100%;border-collapse:collapse;font-size:11px;min-width:740px">
        <thead><tr style="background:#534AB7;color:#fff">
          <th style="padding:7px 10px;text-align:left">Period</th>
          <th style="padding:7px 6px">R.Open</th><th style="padding:7px 6px;color:#90EE90">R.In</th><th style="padding:7px 6px;color:#FFB3B3">R.Out</th><th style="padding:7px 6px;color:#FFAAAA">R.Rej⚠</th><th style="padding:7px 6px;font-weight:700">R.Close</th>
          <th style="padding:7px 6px">S.Open</th><th style="padding:7px 6px;color:#90EE90">S.In</th><th style="padding:7px 6px;color:#FFB3B3">S.Out</th><th style="padding:7px 6px;color:#FFAAAA">S.Rej⚠</th><th style="padding:7px 6px;font-weight:700">S.Close</th>
          <th style="padding:7px 6px">F.Open</th><th style="padding:7px 6px;color:#90EE90">F.In</th><th style="padding:7px 6px;color:#FFB3B3">F.Out</th><th style="padding:7px 6px;color:#FFAAAA">F.Rej⚠</th><th style="padding:7px 6px;font-weight:700">F.Close</th>
        </tr></thead>
        <tbody>
          ${pRows.map((pr,pi)=>`<tr style="border-bottom:1px solid #E8E7E0;background:${pi%2?'#fafaf8':'#fff'}">
            <td style="padding:6px 10px;font-weight:600;color:#534AB7;white-space:nowrap">${esc(pr.label)}</td>
            <td style="padding:5px 6px;text-align:center;color:#888">${pr.openRaw||0}</td>
            <td style="padding:5px 6px;text-align:center;color:#1D9E75;font-weight:600">${pr.rawIn>0?'+'+pr.rawIn:'—'}</td>
            <td style="padding:5px 6px;text-align:center;color:#E24B4A;font-weight:600">${pr.rawOut>0?'−'+pr.rawOut:'—'}</td>
            <td style="padding:5px 6px;text-align:center;color:#A32D2D;font-weight:700">${pr.rawRej>0?'⚠ '+pr.rawRej:'—'}</td>
            <td style="padding:5px 6px;text-align:center;font-weight:700;color:#F57F17">${pr.closeRaw} pcs</td>
            <td style="padding:5px 6px;text-align:center;color:#888">${pr.openSemi||0}</td>
            <td style="padding:5px 6px;text-align:center;color:#1D9E75;font-weight:600">${pr.semiIn>0?'+'+pr.semiIn:'—'}</td>
            <td style="padding:5px 6px;text-align:center;color:#E24B4A;font-weight:600">${pr.semiOut>0?'−'+pr.semiOut:'—'}</td>
            <td style="padding:5px 6px;text-align:center;color:#A32D2D;font-weight:700">${pr.semiRej>0?'⚠ '+pr.semiRej:'—'}</td>
            <td style="padding:5px 6px;text-align:center;font-weight:700;color:#0D47A1">${pr.closeSemi} pcs</td>
            <td style="padding:5px 6px;text-align:center;color:#888">${pr.openFin||0}</td>
            <td style="padding:5px 6px;text-align:center;color:#1D9E75;font-weight:600">${pr.finIn>0?'+'+pr.finIn:'—'}</td>
            <td style="padding:5px 6px;text-align:center;color:#E24B4A;font-weight:600">${pr.finOut>0?'−'+pr.finOut:'—'}</td>
            <td style="padding:5px 6px;text-align:center;color:#A32D2D;font-weight:700">${pr.finRej>0?'⚠ '+pr.finRej:'—'}</td>
            <td style="padding:5px 6px;text-align:center;font-weight:700;color:#1B5E20">${pr.closeFin} pcs</td>
          </tr>`).join('')}
        </tbody>
      </table>
      </div>`:''}

      <!-- Movement timeline -->
      <div style="font-size:12px;font-weight:600;color:#534AB7;margin-bottom:6px">🕒 Full Movement Timeline (oldest → newest)</div>
      <div style="font-size:10px;color:#888;margin-bottom:8px;background:#f7f6f2;padding:6px 10px;border-radius:6px">
        ⚡ <em>Auto entries synced from Production Stages. ⚠ Rejection entries auto-detected from quantity drops between stages.</em>
      </div>
      <div class="mv-timeline">
        ${timeline.length?timeline.map(({e,m,val,runRaw,runSemi,runFin,linkedOrder})=>{
          const isRej=m.isRejection;
          const rowBg=isRej?'background:#FFF5F5;border-left:3px solid #E24B4A;padding-left:6px;':'';
          return`<div class="mv-item" style="${rowBg}">
            <div class="mv-date">${fmtDate(e.date)}</div>
            <div>
              <span class="mv-badge ${m.badge}">${m.icon} ${m.label}</span>
              ${isRej?'<span style="font-size:9px;background:#FCEBEB;color:#A32D2D;padding:1px 7px;border-radius:4px;margin-left:4px;font-weight:700">⚠ REJECTION</span>':''}
              ${!isRej&&e.source&&e.source.startsWith('auto_')?'<span style="font-size:9px;background:#E3F2FD;color:#1565C0;padding:1px 6px;border-radius:4px;margin-left:4px;font-weight:600">⚡ Auto</span>':''}
              ${e.source==='manual'?'<span style="font-size:9px;background:#E8F5E9;color:#2E7D32;padding:1px 6px;border-radius:4px;margin-left:4px;font-weight:600">✎ Manual</span>':''}
              <div class="mv-detail">
                <strong>${val.toLocaleString()} pcs</strong>
                ${m.col==='raw'?` — Raw balance: <strong>${runRaw.toLocaleString()} pcs</strong>`:''}
                ${m.col==='semi'?` — Semi balance: <strong>${runSemi.toLocaleString()} pcs</strong>`:''}
                ${m.col==='fin'?` — Fin balance: <strong>${runFin.toLocaleString()} pcs</strong>`:''}
                ${e.vendor?` · <span style="color:#888">Party: ${esc(e.vendor)}</span>`:''}
                ${linkedOrder?` · <span style="color:#534AB7">Order: ${esc(linkedOrder.orderId)}</span>`:''}
                ${e.note?`<div style="color:#aaa;font-size:10px;margin-top:2px">${esc(e.note)}</div>`:''}
              </div>
            </div>
            <div>
              <div class="mv-qty ${m.sign>0?'pos':'neg'}">${m.sign>0?'+':'−'}${val.toLocaleString()} pcs</div>
              ${e.source&&e.source.startsWith('auto_')?
                `<span style="font-size:9px;color:#aaa;display:block;text-align:right;margin-top:3px">auto-sync</span>`:
                `<button class="icon-btn danger" style="font-size:10px;margin-top:4px" onclick="deleteInvEntry('${e.id}','${esc(designKey)}','${byField}')">✕</button>`}
            </div>
          </div>`;
        }).join(''):`<div style="text-align:center;padding:2rem;color:#aaa">No movements recorded yet.</div>`}
      </div>
      <div class="modal-actions">
        <button onclick="exportDesignInvCSV('${esc(designKey)}','${byField}')">📥 Export CSV</button>
        <button class="primary" onclick="closeModal()">Close</button>
      </div>
    </div>
  </div>`;
}

// ── INVENTORY CATEGORY DETAIL MODAL (vendor-wise, all periods, stages-enriched) ──
function openInvCategoryDetail(category,byField){
  const mc=document.getElementById('modal-container');
  const field=byField||'designName';

  const groupId=category==='finished'?'finished':category;
  const inType=category==='raw'?'raw_in':category==='semi'?'semi_in':'fin_in';
  const outType=category==='raw'?'raw_out':category==='semi'?'semi_out':'fin_out';
  const rejType=category==='raw'?'raw_rejection':category==='semi'?'semi_rejection':'fin_rejection';
  const isKg=false; // all groups now in pcs
  const catLabel=category==='raw'?'📦 RAW (Pipes)':category==='semi'?'🔧 Semi-Finished':'✅ Finished';
  const catColor=category==='raw'?'#E65100':category==='semi'?'#1565C0':'#2E7D32';
  const catBg=category==='raw'?'#FFF8E1':category==='semi'?'#E3F2FD':'#E8F5E9';
  const catBorder=category==='raw'?'#FFD54F':category==='semi'?'#90CAF9':'#A5D6A7';
  const unit='pcs';
  const periodLabel=S.invPeriod==='weekly'?'Weekly':S.invPeriod==='yearly'?'Yearly':'Monthly';

  // ── Enrich: build a stage-level row for every design in every order ──────────
  // Each row: {date, vendor, stageName, stageStatus, orderQty, designName, designCode, orderId, orderClient, orderPriority, stageNote, isKg, groupId}
  const stageRows=[];
  S.orders.forEach(order=>{
    (order.designs||[]).forEach(design=>{
      (design.stages||[]).forEach(st=>{
        const tmpl=getTmpl(st.stageId);
        if(!tmpl)return;
        const sg=tmpl.group||getStageGroup(st.stageId);
        if(sg!==groupId)return;
        const stageDate=st.completionDate||order.startDate||null;
        stageRows.push({
          date:stageDate,
          vendor:st.vendor||'',
          stageName:tmpl.name,
          stageLoc:tmpl.loc||'',
          stageStatus:st.status||'pending',
          qty:st.qty!=null?st.qty:null,
          stageNote:st.stageNote||st.note||'',
          designName:design.name,
          designCode:design.code,
          orderId:order.orderId,
          orderClient:order.client,
          orderPriority:order.priority,
          orderRawId:order.id,
          isKg
        });
      });
    });
  });

  // ── Collect all ledger entries for this category (including rejections) ────────
  const catEntries=S.invLedger
    .filter(e=>e.type===inType||e.type===outType||e.type===rejType)
    .sort((a,b)=>a.date.localeCompare(b.date));

  // Collect all periods
  const allPeriodsSet=new Set();
  catEntries.forEach(e=>allPeriodsSet.add(invPeriodKey(e.date)));
  stageRows.forEach(r=>{if(r.date)allPeriodsSet.add(invPeriodKey(r.date));});
  const sortedPeriods=[...allPeriodsSet].sort();

  // ── Vendor summary ────────────────────────────────────────────────────────────
  const vendorMap={};
  catEntries.forEach(e=>{
    const v=e.vendor||'(No vendor)';
    if(!vendorMap[v])vendorMap[v]={in:0,out:0,rej:0,entries:[],stageEntries:[],designs:new Set()};
    const qty=parseInt(e.qty!=null?e.qty:(e.qtySets||e.qtyKg||0))||0;
    if(e.type===inType)vendorMap[v].in+=qty;
    else if(e.type===outType)vendorMap[v].out+=qty;
    else if(e.type===rejType)vendorMap[v].rej+=qty;
    vendorMap[v].entries.push(e);
    vendorMap[v].designs.add(e.designName||e.designCode||'—');
  });
  stageRows.forEach(r=>{
    const v=r.vendor||'(No vendor)';
    if(!vendorMap[v])vendorMap[v]={in:0,out:0,rej:0,entries:[],stageEntries:[],designs:new Set()};
    vendorMap[v].stageEntries.push(r);
    vendorMap[v].designs.add(r.designName||'—');
  });
  const vendorEntries=Object.entries(vendorMap).sort((a,b)=>(b[1].in+b[1].out+b[1].stageEntries.length)-(a[1].in+a[1].out+a[1].stageEntries.length));

  // ── Overall totals ────────────────────────────────────────────────────────────
  const grandIn=catEntries.filter(e=>e.type===inType).reduce((a,e)=>a+(parseInt(e.qty!=null?e.qty:(e.qtySets||e.qtyKg||0))||0),0);
  const grandOut=catEntries.filter(e=>e.type===outType).reduce((a,e)=>a+(parseInt(e.qty!=null?e.qty:(e.qtySets||e.qtyKg||0))||0),0);
  const grandRej=catEntries.filter(e=>e.type===rejType).reduce((a,e)=>a+(parseInt(e.qty!=null?e.qty:(e.qtySets||e.qtyKg||0))||0),0);
  const grandNet=grandIn-grandOut-grandRej;

  const periodRows=sortedPeriods.map(pk=>{
    const pLabel=invPeriodLabel(pk);
    const periodLedger=catEntries.filter(e=>invPeriodKey(e.date)===pk).sort((a,b)=>a.date.localeCompare(b.date));
    const periodStages=stageRows.filter(r=>r.date&&invPeriodKey(r.date)===pk).sort((a,b)=>(a.date||'').localeCompare(b.date||''));
    const designKeys=invGetDesignKeys(field);
    let openBal=0;
    designKeys.forEach(k=>{
      S.invLedger.filter(e=>e[field]===k&&(e.type===inType||e.type===outType||e.type===rejType)&&invPeriodKey(e.date)<pk).forEach(e=>{
        const qty=parseInt(e.qty!=null?e.qty:(e.qtySets||e.qtyKg||0))||0;
        const sign=INV_TYPE_META[e.type]?INV_TYPE_META[e.type].sign:-1;
        openBal+=sign*qty;
      });
    });
    openBal=Math.max(0,openBal);
    let totalIn=0,totalOut=0,totalRej=0;
    periodLedger.forEach(e=>{
      const qty=parseInt(e.qty!=null?e.qty:(e.qtySets||e.qtyKg||0))||0;
      if(e.type===inType)totalIn+=qty;
      else if(e.type===outType)totalOut+=qty;
      else if(e.type===rejType)totalRej+=qty;
    });
    const closeBal=Math.max(0,openBal+totalIn-totalOut-totalRej);
    return{pk,label:pLabel,openBal,totalIn,totalOut,totalRej,closeBal,periodLedger,periodStages};
  });

  // ── Status badge helper ───────────────────────────────────────────────────────
  const stageBadge=st=>{
    const cfg={done:{bg:'#E1F5EE',col:'#085041',icon:'✔'},
      'in progress':{bg:'#E6F1FB',col:'#0C447C',icon:'▶'},
      pending:{bg:'#F1EFE8',col:'#5F5E5A',icon:'○'},
      delayed:{bg:'#FCEBEB',col:'#791F1F',icon:'⚠'}};
    const c=cfg[st]||cfg.pending;
    return`<span style="font-size:9px;padding:2px 7px;border-radius:99px;background:${c.bg};color:${c.col};font-weight:600;white-space:nowrap">${c.icon} ${st}</span>`;
  };
  const prioTag=p=>{
    const cfg={critical:{bg:'#FCEBEB',col:'#791F1F'},urgent:{bg:'#FAEEDA',col:'#633806'},normal:{bg:'#E6F1FB',col:'#0C447C'}};
    const c=cfg[p]||cfg.normal;
    return p?`<span style="font-size:9px;padding:1px 5px;border-radius:4px;background:${c.bg};color:${c.col};font-weight:600">${p}</span>`:'';
  };

  // ── Modal HTML ────────────────────────────────────────────────────────────────
  mc.innerHTML=`<div class="modal-overlay" onclick="if(event.target===this)closeModal()">
    <div class="modal" style="width:900px;max-height:92vh">
      <div class="modal-header" style="background:${catBg};margin:-1.4rem -1.4rem 1rem;padding:14px 20px;border-radius:14px 14px 0 0;border-bottom:2px solid ${catBorder}">
        <div class="modal-icon" style="background:#fff;color:${catColor};box-shadow:0 1px 4px rgba(0,0,0,.1)">${category==='raw'?'📦':category==='semi'?'🔧':'✅'}</div>
        <div style="flex:1">
          <h3 style="color:${catColor};margin:0">${catLabel} — Inventory Detail</h3>
          <div style="font-size:11px;color:${catColor};opacity:.7;margin-top:2px">${periodLabel} view · All designs · All vendors · Stages data included</div>
        </div>
        <button onclick="closeModal()" style="background:none;border:none;font-size:16px;cursor:pointer;color:#999;padding:0 4px">✕</button>
      </div>

      <!-- KPI strip -->
      <div style="display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap">
        <div style="flex:1;min-width:110px;background:${catBg};border:1.5px solid ${catBorder};border-radius:10px;padding:10px 14px;text-align:center">
          <div style="font-size:18px;font-weight:700;color:${catColor}">${grandIn.toLocaleString()}</div>
          <div style="font-size:10px;color:${catColor};opacity:.7;margin-top:2px">Total In (pcs)</div>
        </div>
        <div style="flex:1;min-width:110px;background:#FCEBEB;border:1.5px solid #F09595;border-radius:10px;padding:10px 14px;text-align:center">
          <div style="font-size:18px;font-weight:700;color:#A32D2D">${grandOut.toLocaleString()}</div>
          <div style="font-size:10px;color:#A32D2D;opacity:.8;margin-top:2px">Total Out (pcs)</div>
        </div>
        <div style="flex:1;min-width:110px;background:#FAEEDA;border:1.5px solid #FAC775;border-radius:10px;padding:10px 14px;text-align:center">
          <div style="font-size:18px;font-weight:700;color:#A32D2D">${grandRej.toLocaleString()}</div>
          <div style="font-size:10px;color:#854F0B;opacity:.8;margin-top:2px">⚠ Rejected (pcs)</div>
        </div>
        <div style="flex:1;min-width:110px;background:${grandNet>=0?'#E1F5EE':'#FCEBEB'};border:1.5px solid ${grandNet>=0?'#9FE1CB':'#F09595'};border-radius:10px;padding:10px 14px;text-align:center">
          <div style="font-size:18px;font-weight:700;color:${grandNet>=0?'#0F6E56':'#A32D2D'}">${grandNet>=0?'+':''}${grandNet.toLocaleString()}</div>
          <div style="font-size:10px;color:#555;margin-top:2px">Net Balance (pcs)</div>
        </div>
        <div style="flex:1;min-width:110px;background:#EEEDFE;border:1.5px solid #AFA9EC;border-radius:10px;padding:10px 14px;text-align:center">
          <div style="font-size:18px;font-weight:700;color:#534AB7">${catEntries.length}</div>
          <div style="font-size:10px;color:#534AB7;opacity:.7;margin-top:2px">Ledger Entries</div>
        </div>
        <div style="flex:1;min-width:110px;background:#f7f6f2;border:1.5px solid #D3D1C7;border-radius:10px;padding:10px 14px;text-align:center">
          <div style="font-size:18px;font-weight:700;color:#5F5E5A">${stageRows.length}</div>
          <div style="font-size:10px;color:#888;margin-top:2px">Stage Events</div>
        </div>
      </div>

      <!-- TAB navigation -->
      <div class="tabs" id="inv-cat-tabs" style="margin-bottom:14px">
        <div class="tab active" onclick="invCatSwitchTab('vendor')">👤 Vendor-wise</div>
        <div class="tab" onclick="invCatSwitchTab('period')">📅 Period-wise</div>
        <div class="tab" onclick="invCatSwitchTab('stages')">⚙️ Stages Detail</div>
        <div class="tab" onclick="invCatSwitchTab('design')">🎨 Design-wise</div>
      </div>

      <!-- TAB: VENDOR-WISE -->
      <div id="inv-cat-tab-vendor" class="tab-panel active">
        <div style="font-size:11px;color:#888;margin-bottom:10px;background:#f7f6f2;border-radius:6px;padding:6px 10px">
          👤 Vendor-wise summary for <strong>${catLabel}</strong> across the entire history — drawn from both manual ledger entries and auto-synced stage data.
        </div>
        ${vendorEntries.length?`<div style="overflow-x:auto;border-radius:12px;border:1.5px solid ${catBorder}">
        <table style="width:100%;border-collapse:collapse;font-size:11px">
          <thead>
            <tr style="background:${catBg}">
              <th style="padding:9px 14px;text-align:left;color:${catColor};font-weight:700;border-bottom:2px solid ${catBorder}">Vendor / Party</th>
              <th style="padding:9px 10px;text-align:center;color:#1D9E75;font-weight:700;border-bottom:2px solid ${catBorder}">Total In (${unit})</th>
              <th style="padding:9px 10px;text-align:center;color:#E24B4A;font-weight:700;border-bottom:2px solid ${catBorder}">Total Out (${unit})</th>
              <th style="padding:9px 10px;text-align:center;color:#534AB7;font-weight:700;border-bottom:2px solid ${catBorder}">Net (${unit})</th>
              <th style="padding:9px 10px;text-align:center;color:#888;font-weight:600;border-bottom:2px solid ${catBorder}">Ledger Moves</th>
              <th style="padding:9px 10px;text-align:left;color:#888;font-weight:600;border-bottom:2px solid ${catBorder}">Designs</th>
              <th style="padding:9px 10px;text-align:center;color:#888;font-weight:600;border-bottom:2px solid ${catBorder}">Stage Events</th>
              <th style="padding:9px 10px;text-align:center;color:#888;font-weight:600;border-bottom:2px solid ${catBorder}">Last Activity</th>
            </tr>
          </thead>
          <tbody>
            ${vendorEntries.map(([v,d],vi)=>{
              const net=d.in-d.out;
              const allDates=[...d.entries.map(e=>e.date),...d.stageEntries.map(r=>r.date).filter(Boolean)].sort();
              const lastDate=allDates.slice(-1)[0]||'';
              const designs=[...d.designs].slice(0,3).join(', ')+(d.designs.size>3?` +${d.designs.size-3} more`:'');
              return`<tr style="border-bottom:1px solid #f0eefc;background:${vi%2?'#fafaf8':'#fff'};cursor:pointer" onclick="invCatVendorExpand('${esc(v)}','${category}','${field}')" title="Click to see full detail for ${esc(v)}">
                <td style="padding:8px 14px;font-weight:700;color:#1a1916">${esc(v)} <span style="font-size:9px;color:#aaa;font-weight:400">↗ click for detail</span></td>
                <td style="padding:8px 10px;text-align:center;color:#1D9E75;font-weight:700">${isKg?d.in.toFixed(2):d.in.toLocaleString()}</td>
                <td style="padding:8px 10px;text-align:center;color:#E24B4A;font-weight:700">${isKg?d.out.toFixed(2):d.out.toLocaleString()}</td>
                <td style="padding:8px 10px;text-align:center;font-weight:700;color:${net>=0?'#1D9E75':'#E24B4A'}">${net>=0?'+':''}${isKg?net.toFixed(2):net.toLocaleString()}</td>
                <td style="padding:8px 10px;text-align:center;color:#888">${d.entries.length}</td>
                <td style="padding:8px 10px;font-size:10px;color:#534AB7;max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${[...d.designs].join(', ')}">${esc(designs)}</td>
                <td style="padding:8px 10px;text-align:center;color:#888">${d.stageEntries.length}</td>
                <td style="padding:8px 10px;text-align:center;color:#888;white-space:nowrap;font-size:10px">${lastDate?fmtDate(lastDate):'—'}</td>
              </tr>`;
            }).join('')}
          </tbody>
        </table></div>`:`<div style="text-align:center;padding:2rem;color:#aaa">No vendor data recorded yet for this category.</div>`}
        <div id="inv-cat-vendor-detail"></div>
      </div>

      <!-- TAB: PERIOD-WISE -->
      <div id="inv-cat-tab-period" class="tab-panel">
        <div style="font-size:11px;color:#888;margin-bottom:10px;background:#f7f6f2;border-radius:6px;padding:6px 10px">
          📅 ${periodLabel} breakdown — each period shows opening balance, movements (in/out) by vendor, and closing stock.
        </div>
        ${periodRows.length?periodRows.map(pr=>`

// ── Tab switcher for inv category modal ───────────────────────────────────────
function invCatSwitchTab(name){
  document.querySelectorAll('#inv-cat-tabs .tab').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('[id^="inv-cat-tab-"]').forEach(p=>p.classList.remove('active'));
  const tabEl=document.querySelector(`#inv-cat-tabs .tab:nth-child(${['vendor','period','stages','design'].indexOf(name)+1})`);
  if(tabEl)tabEl.classList.add('active');
  const panelEl=document.getElementById(`inv-cat-tab-${name}`);
  if(panelEl)panelEl.classList.add('active');
}

// ── Export CSV for a category ─────────────────────────────────────────────────
function exportInvCategoryCSV(category,field){
  const inType=category==='raw'?'raw_in':category==='semi'?'semi_in':'fin_in';
  const outType=category==='raw'?'raw_out':category==='semi'?'semi_out':'fin_out';
  const rejType=category==='raw'?'raw_rejection':category==='semi'?'semi_rejection':'fin_rejection';
  const groupId=category==='finished'?'finished':category;
  const catLabel=category==='raw'?'RAW':category==='semi'?'SEMI-FINISHED':'FINISHED';

  const catEntries=S.invLedger.filter(e=>e.type===inType||e.type===outType||e.type===rejType).sort((a,b)=>a.date.localeCompare(b.date));
  const rows=[['=== '+catLabel+' INVENTORY DETAIL ==='],['Generated',new Date().toLocaleString()],[]];

  rows.push(['=== LEDGER MOVEMENTS ===']);
  rows.push(['Date','Design Name','Design Code','Type','Qty (pcs)','Vendor/Party','Linked Order','Source','Notes']);
  catEntries.forEach(e=>{
    const qty=parseInt(e.qty!=null?e.qty:(e.qtySets||e.qtyKg||0))||0;
    const lo=e.orderId?S.orders.find(o=>o.id===e.orderId):null;
    rows.push([fmtDate(e.date),e.designName||'',e.designCode||'',INV_TYPE_META[e.type]?INV_TYPE_META[e.type].label:e.type,qty,e.vendor||'',lo?lo.orderId:'',e.source&&e.source.startsWith('auto_')?'Auto':'Manual',e.note||'']);
  });

  rows.push([]);
  rows.push(['=== STAGE EVENTS ===']);
  rows.push(['Date','Stage Name','Stage Location','Vendor/Party','Design Name','Design Code','Order ID','Client','Priority','Qty (pcs)','Status','Notes']);
  S.orders.forEach(order=>{
    (order.designs||[]).forEach(design=>{
      (design.stages||[]).forEach(st=>{
        const tmpl=getTmpl(st.stageId);if(!tmpl)return;
        const sg=tmpl.group||getStageGroup(st.stageId);if(sg!==groupId)return;
        rows.push([st.completionDate?fmtDate(st.completionDate):fmtDate(order.startDate),tmpl.name,tmpl.loc||'',st.vendor||'',design.name,design.code,order.orderId,order.client,order.priority,st.qty!=null?st.qty:'',st.status||'pending',st.stageNote||st.note||'']);
      });
    });
  });

  downloadCSV(csvEncode(rows),`inv_${category}_detail_${new Date().toISOString().split('T')[0]}.csv`);
}

function deleteInvEntry(id,designKey,byField){
  if(!confirm('Delete this inventory entry?'))return;
  S.invLedger=S.invLedger.filter(e=>e.id!==id);
  audit('Inventory delete',`Entry ${id} deleted`);
  save();
  openInvDetail(designKey,byField);
}

// ── INVENTORY CSV EXPORTS ──────────────────────────────────────────────────────
function exportInvCSV(){
  const rows=[['=== INVENTORY EXPORT ==='],['Generated',new Date().toLocaleString()],[]];
  rows.push(['=== ALL MOVEMENTS ===']);

// Must run in capture phase (3rd arg = true) so we block the browser's native
// "Save Page As" dialog BEFORE it fires — bubble-phase listeners are too late
// on some browsers (Chrome/Edge). e.stopImmediatePropagation() also prevents

// ── LOGIN ─────────────────────────────────────────────────────────────────────
async function doLogin(){
  const u   = (document.getElementById('login-user').value||'').trim();
  const p   = document.getElementById('login-pass').value||'';
  const err = document.getElementById('login-err');
  const card= document.getElementById('login-card');
  const btn = document.querySelector('.login-btn');
  if(!u){
    err.textContent='Please select your username from the dropdown.';
    err.classList.add('show');
    card.classList.remove('shake'); void card.offsetWidth; card.classList.add('shake');
    return;
  }
  if(btn){ btn.disabled=true; btn.textContent='Signing in…'; }

  // 1. Try to fetch user list from Firebase
  let fbUsers = null;
  try{
    const r = await fetch(FB_USERS);
    if(r.ok){ const d=await r.json(); if(Array.isArray(d)&&d.length) fbUsers=d; }
  }catch(e){ /* network error — use hardcoded fallback */ }

  // 2. Validate credentials
  let session = null;
  if(fbUsers){
    const found = fbUsers.find(x=>x.username===u && x.password===p);
    if(found) session = {username:found.username, role:found.role||'member'};
  }
  // Fallback: hardcoded owner credentials (backward compat)
  if(!session && u===_AUTH.u && p===_AUTH.p){
    session = {username:u, role:'owner'};
    // First-time: seed the users list in Firebase
    if(!fbUsers){
      try{
        await fetch(FB_USERS,{
          method:'PUT',headers:{'Content-Type':'application/json'},
          body:JSON.stringify([{id:'u_'+Date.now(),username:u,password:p,role:'owner',createdAt:new Date().toISOString()}])
        });
      }catch(e){}
    }
  }

  if(btn){ btn.disabled=false; btn.textContent='Sign in →'; }

  if(!session){
    err.textContent='Incorrect username or password';
    err.classList.add('show');
    card.classList.remove('shake'); void card.offsetWidth; card.classList.add('shake');
    return;
  }

  // 3. Store session
  _currentUser = session;
  sessionStorage.setItem('bt_auth','1');
  sessionStorage.setItem('bt_session', JSON.stringify(session));
  err.classList.remove('show');

  // 4. Show dashboard
  document.getElementById('login-screen').style.display='none';
  document.getElementById('fb-bar').style.display='';
  _updateUserChip();

  // 5. Acquire edit lock and init Firebase in parallel — lock only controls UI write-mode,
  //    data loading is independent and should not be held back by the lock round-trip.
  _tryAcquireLock();
  fbInit();
}

async function doLogout(){
  // Stop all timers first so nothing fires during async cleanup
  if(_lockHbTimer){ clearInterval(_lockHbTimer); _lockHbTimer=null; }
  if(_lockPollTimer){ clearInterval(_lockPollTimer); _lockPollTimer=null; }
  if(_lockOwnerCheckTimer){ clearInterval(_lockOwnerCheckTimer); _lockOwnerCheckTimer=null; }
  if(_reqWatchTimer){ clearInterval(_reqWatchTimer); _reqWatchTimer=null; }
  _grantBannerUp=false;
  const gb=document.getElementById('grant-request-banner');if(gb)gb.remove();

  // CRITICAL: delete the Firebase lock BEFORE reloading so the next user can
  // acquire it immediately.  _releaseLock() is async — we must await it here,
  // otherwise location.reload() fires before the DELETE request completes.
  if(_hasLock){

    _hasLock=false;

  try{ await fetch(FB_ACCESS_REQUEST,{method:'DELETE'}); }catch(e){}

  sessionStorage.removeItem('bt_session');
  if(_fb.es){ try{_fb.es.close();}catch(e){} }

}

// ── PUSH TO FIREBASE ──────────────────────────────────────────────────────────
// NOTE: We wrap state as a JSON string inside {data:"..."} because the app uses
// bangle size keys like "2/2", "2/4" — Firebase treats "/" as a path separator
// and rejects such keys. Storing as a string value sidesteps this entirely.
async function fbPush(silent){
  _fb.lastPush = Date.now();
  try{
    // forFirebase=true: small images stay inline in payload so every device
    // receives full-quality images via Firebase without needing local IDB.
    const { stateNoImages } = extractImages({
      ...S, openOrders:[...S.openOrders], openClients:[...S.openClients], openDesignStages:[...(S.openDesignStages||[])]
    }, true);
    // Wrap state as a plain string so Firebase never sees the "/" keys
    const payload = JSON.stringify({
      data    : JSON.stringify({...stateNoImages, openOrders:[...S.openOrders], openClients:[...S.openClients], openDesignStages:[...(S.openDesignStages||[])]}),
      savedAt : new Date().toISOString(),
      device  : FB_DEVICE_ID
    });
    const r = await fetch(FB_DATA, {
      method : 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body   : payload
    });
    if(!r.ok){ const msg = await r.text(); throw new Error('HTTP ' + r.status + ' — ' + msg); }
    // Our local changes are now safely in Firebase — clear the "dirty" flag
    // so incoming remote updates are allowed to apply again.
    _fb.pendingLocal = false;
    const t = new Date().toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'});
    fbSetStatus('connected', 'Live · saved ' + t);
  } catch(e){
    // Keep pendingLocal = true so we retry and keep protecting local edits
    fbSetStatus('error', 'Save failed — ' + e.message);
    if(!silent) showToast('⚠ Database save failed', 'red');
  }
}

// ── PUSH THROTTLE — sync to Firebase at most once every 10 seconds ───────────
// Instead of pushing 1.5s after every keystroke (heavy), we throttle: the first
// change schedules a push 10s out, and every change within that window is
// included in that single push (fbPush always reads the current live state).
// This keeps the dashboard light and operations smooth.
function fbSchedulePush(){
  if(_isDemoMode()) return;        // demo mode never pushes to the real DB
  // Mark local changes BEFORE the ready check — this protects a just-created
  // order even if Firebase isn't connected yet (e.g. first-load race or
  // reconnection window). When Firebase comes online, pendingLocal=true
  // prevents _applyRemoteState from overwriting the unpushed local state.
  _fb.pendingLocal = true;
  if(!_fb.ready) return;
  if(_fb.pushTimer) return;        // a push is already queued — it'll include this change
  fbSetStatus('syncing', 'Saving…');
  _fb.pushTimer = setTimeout(()=>{
    _fb.pushTimer = null;
    fbPush(false);
  }, 2000);
}

// Push to Firebase RIGHT NOW — used for structural changes (create / delete
// an order) so they reach the cloud immediately and can't be lost if the tab
// is closed, or wiped by a stale remote sync arriving in the meantime.
function fbPushNow(){
  if(_isDemoMode()) return;
  // Set pendingLocal BEFORE the ready check so a newly created order is
  // protected from stale SSE overwrites even if Firebase isn't ready yet.
  _fb.pendingLocal = true;
  if(!_fb.ready) return;
  clearTimeout(_fb.pushTimer);
  _fb.pushTimer = null;
  fbPush(false);
}

// ── USER-EDITING GUARD ───────────────────────────────────────────────────────
// Tracks whether the user is actively typing/editing. Remote SSE updates are
// DEFERRED while the user is editing so a sync can never wipe an in-progress
// edit. The deferred update is applied once the user pauses.
let _lastUserInput = 0;
let _pendingRemote = null;
function _userIsEditing(){
  // Editing if a text field is focused, OR the user typed within the last 5s
  const ae = document.activeElement;
  const focused = ae && (ae.tagName==='INPUT' || ae.tagName==='TEXTAREA' || ae.tagName==='SELECT');
  return focused || (Date.now() - _lastUserInput < 5000);
}
document.addEventListener('input', ()=>{ _lastUserInput = Date.now(); }, true);
document.addEventListener('focusin', e=>{
  if(e.target && (e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA'||e.target.tagName==='SELECT'))
    _lastUserInput = Date.now();
}, true);

// Applies a queued remote update once the user has stopped editing
function _flushPendingRemote(){
  if(!_pendingRemote) return;
  // If we now have unpushed local changes, the queued remote snapshot is
  // stale — discard it rather than overwrite the user's newer edits.
  if(_fb.pendingLocal){ _pendingRemote = null; return; }
  if(_userIsEditing()){
    setTimeout(_flushPendingRemote, 1500);   // still editing — check again shortly
    return;
  }
  const { parsed, savedAt } = _pendingRemote;
  _pendingRemote = null;
  _applyRemoteState(parsed, savedAt);
}

// ── CROSS-DEVICE ORDER MERGE ──────────────────────────────────────────────────
// Firebase is the single source of truth for shared state.  However, a device
// can push stale local data that overwrites orders created on another device.
// This function does two things:
//   1. STRIPS any orders in the remote snapshot that were deleted locally/remotely
//      (prevents a stale push from another device from resurrecting deleted orders)
//   2. RESCUES orders that exist locally but are absent from remote due to a sync
//      race — only if they are NOT in the combined deletedOrderIds list.
// Returns { merged: state, added: boolean, count: number, needsPush: boolean }.
function _mergeLocalIntoRemote(remoteState){
  let localState=null;
  try{
    const raw=localStorage.getItem('bangle_prod_tracker');
    localState=raw?JSON.parse(raw):null;
  }catch(e){}

  // Union of explicitly-deleted IDs from both remote and local (client orders)
  const deletedIds=new Set([
    ...(remoteState.deletedOrderIds||[]),
    ...((localState&&localState.deletedOrderIds)||[])
  ]);
  // Same for vendor orders
  const deletedVendorIds=new Set([
    ...(remoteState.deletedVendorOrderIds||[]),
    ...((localState&&localState.deletedVendorOrderIds)||[])
  ]);

  // CRITICAL: Strip remote orders that belong to the combined deleted set.
  // A stale push from another device can include an order we already deleted —
  // without this filter it would silently come back every time that device syncs.
  const cleanedOrders=(remoteState.orders||[]).filter(o=>!o.id||!deletedIds.has(o.id));
  const cleanedVendorOrders=(remoteState.vendorOrders||[]).filter(o=>!o.id||!deletedVendorIds.has(o.id));
  const ordersFiltered=cleanedOrders.length!==(remoteState.orders||[]).length;
  const vendorFiltered=cleanedVendorOrders.length!==(remoteState.vendorOrders||[]).length;

  // IDs present in the cleaned remote — used for rescue check below
  const cleanedIds=new Set(cleanedOrders.map(o=>o.id));

  // Rescue local-only client orders (created on this device but absent from remote
  // due to a sync race — e.g. another device pushed before our new order reached FB)
  const rescued=localState&&localState.orders
    ?(localState.orders).filter(o=>o.id&&!cleanedIds.has(o.id)&&!deletedIds.has(o.id))
    :[];

  const needsPush=rescued.length>0||ordersFiltered||vendorFiltered;
  if(!needsPush)return{merged:remoteState,added:false,count:0,needsPush:false};

  const merged={
    ...remoteState,
    orders:[...cleanedOrders,...rescued],
    vendorOrders:cleanedVendorOrders,
    deletedOrderIds:[...deletedIds],
    deletedVendorOrderIds:[...deletedVendorIds]
  };
  return{merged,added:rescued.length>0,count:rescued.length,needsPush:true};
}

// Applies a remote Firebase state to the app.
// Always merges local-only orders back in before overwriting state, so that
// a stale push from another device never silently erases orders.
function _applyRemoteState(parsed, savedAt){
  // Merge: strips deleted orders from remote snapshot + rescues local-only orders
  const{merged,added,count,needsPush}=_mergeLocalIntoRemote(parsed);

  // Preserve LOCAL UI state — panel expansion is per-device, not shared data
  const keepDesignStages = S.openDesignStages;
  Object.assign(S, merged);
  S.filters     = {client:'',dname:'',dcode:'',status:''};  // always reset — never inherit stale filter from remote
  S.openOrders  = new Set(merged.openOrders  || []);
  S.openClients = new Set(merged.openClients || []);
  S.openDesignStages = keepDesignStages || new Set();
  renumberOrders();
  _origSave();
  localStorage.setItem('bangle_saved_at', savedAt || new Date().toISOString());
  // Re-inject IDB images after every Firebase sync — without this, Firebase
  // __IDB__ placeholders overwrite locally-loaded image data on every sync.
  _injectIDBImages().then(()=>render());
  if(needsPush){
    // Push cleaned/merged state back so all other devices also get the correction
    fbSchedulePush();
    if(added) showToast(`✅ ${count} order(s) restored — cloud was missing them`,'green');
  }
  fbSetStatus('connected', 'Live · synced');
}

// ── EDIT LOCK ─────────────────────────────────────────────────────────────────
async function _tryAcquireLock(){
  try{
    const r = await fetch(FB_LOCK);
    const lock = r.ok ? await r.json() : null;
    const now  = Date.now();
    const expired = !lock || !lock.heartbeat
                  ||(now - new Date(lock.heartbeat).getTime()) > LOCK_EXPIRE_MS;
    const isMine  = lock && lock.deviceId === FB_DEVICE_ID;

    if(expired || isMine || !lock){
      // Lock is free (or ours) — acquire it
      await fetch(FB_LOCK,{
        method:'PUT', headers:{'Content-Type':'application/json'},
        body:JSON.stringify({
          user:_currentUser?.username||'?', deviceId:FB_DEVICE_ID,
          lockedAt:new Date().toISOString(), heartbeat:new Date().toISOString()
        })
      });
      const wasReadOnly = _readOnly;
      _hasLock=true; _readOnly=false; _lockHolder=_currentUser?.username||'?';
      try{ await fetch(FB_ACCESS_REQUEST,{method:'DELETE'}); }catch(e){}
      _waitingForGrant=false;
      if(_grantPollTimer){clearInterval(_grantPollTimer);_grantPollTimer=null;}
      if(_lockPollTimer){clearInterval(_lockPollTimer);_lockPollTimer=null;}
      if(_lockOwnerCheckTimer){clearInterval(_lockOwnerCheckTimer);_lockOwnerCheckTimer=null;}
      _setReadOnlyUI(false);
      _startHeartbeat();
      _startLockOwnershipCheck();
      if(wasReadOnly) showToast('✅ Edit access acquired — you can now make changes','green');
    } else {
      // Lock held by someone else
      _hasLock=false; _readOnly=true; _lockHolder=lock.user||'another user';
      _setReadOnlyUI(true, lock.user);
      _startLockPolling();
    }
  }catch(e){
    // Network error — default to edit mode (graceful degradation)
    _hasLock=true; _readOnly=false; _setReadOnlyUI(false); _startHeartbeat();
  }
}

function _startHeartbeat(){
  if(_lockHbTimer) clearInterval(_lockHbTimer);
  _lockHbTimer = setInterval(async()=>{
    if(!_hasLock) return;
    try{
      await fetch(FB_LOCK,{
        method:'PUT', headers:{'Content-Type':'application/json'},
        body:JSON.stringify({
          user:_currentUser?.username||'?', deviceId:FB_DEVICE_ID,
          lockedAt:new Date().toISOString(), heartbeat:new Date().toISOString()
        })
      });
    }catch(e){}
  }, 60000);
  // Watch for incoming access requests every 3 s while holding the lock
  _startRequestWatcher();
}

// Device 2: poll the lock.  fast=true → 2 s (used after requesting access).
// Normal interval is 10 s (auto-detect if the other person logs out / times out).
function _startLockPolling(fast){
  if(_lockPollTimer) clearInterval(_lockPollTimer);
  _lockPollTimer = setInterval(async()=>{
    try{
      const r   = await fetch(FB_LOCK);
      const lock= r.ok ? await r.json() : null;
      const expired = !lock || !lock.heartbeat
                    ||(Date.now()-new Date(lock.heartbeat).getTime()) > LOCK_EXPIRE_MS;
      if(expired || !lock){
        clearInterval(_lockPollTimer); _lockPollTimer=null;
        if(_grantPollTimer){clearInterval(_grantPollTimer);_grantPollTimer=null;}
        _waitingForGrant=false;
        await _tryAcquireLock();
        // (toast is shown inside _tryAcquireLock when wasReadOnly)
      }
    }catch(e){}
  }, fast ? 2000 : 10000);
}

async function _releaseLock(){
  if(_lockHbTimer){ clearInterval(_lockHbTimer); _lockHbTimer=null; }
  if(_reqWatchTimer){ clearInterval(_reqWatchTimer); _reqWatchTimer=null; }
  if(_lockOwnerCheckTimer){ clearInterval(_lockOwnerCheckTimer); _lockOwnerCheckTimer=null; }
  _grantBannerUp=false;
  const banner=document.getElementById('grant-request-banner');
  if(banner) banner.remove();
  if(!_hasLock) return;
  try{
    const r=await fetch(FB_LOCK);
    if(r.ok){
      const lock=await r.json();
      if(lock && lock.deviceId===FB_DEVICE_ID)
        await fetch(FB_LOCK,{method:'DELETE'});
    }
  }catch(e){}
  _hasLock=false;
}

// ── AUTO-RELEASE LOCK WHEN TAB IS CLOSED ──────────────────────────────────────
// Uses fetch with keepalive:true — specifically designed to send a request even
// as the page is unloading (tab close, browser close, navigation away).
// This means Person A closing the tab immediately frees the lock for Person B.
window.addEventListener('beforeunload', function(){
  if(!_hasLock) return; // only act if we hold the lock
  try{
    // keepalive:true guarantees the request completes even after page unload
    fetch(FB_LOCK, { method:'DELETE', keepalive:true });
  }catch(e){}
});
