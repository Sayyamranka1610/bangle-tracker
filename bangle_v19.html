// Load library from Firebase (lazy — only when Library tab or picker first opens)
async function _ensureLibraryLoaded(){
  if(_libLoaded)return;
  _libLoaded=true;
  try{
    const resp=await fetch(FB_LIB+'.json',{signal:AbortSignal.timeout(15000)});
    const data=resp.ok?(await resp.json()||{}):{};
    _imageLibrary=Object.entries(data).map(([id,v])=>({...v,_id:id,segment:v.segment||'CNC'}));
  }catch(e){
    console.warn('Library load failed:',e.message);
    _imageLibrary=[];
    _libLoaded=false; // allow retry
  }
}

// Write one entry to Firebase + in-memory list (used by picker "upload new")
async function _addLibraryEntry(r2url,designCode,folder,fileName){
  const entry={designCode:designCode||'',folder:folder||'General',r2url,fileName:fileName||'',uploadedAt:Date.now()};
  try{
    const resp=await fetch(FB_LIB+'.json',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(entry)});
    const result=resp.ok?await resp.json():null;
    const key=(result&&result.name)||('tmp-'+Date.now());
    _imageLibrary.push({...entry,_id:key});
  }catch(e){
    console.warn('Library entry save failed:',e.message);
    _imageLibrary.push({...entry,_id:'tmp-'+Date.now()});
  }
}

// Batch-write many entries to Firebase in ONE call (used by bulk import and copy)
async function _batchAddLibraryEntries(entries,defaultSeg){
  if(!entries.length)return;
  const updates={};
  entries.forEach(e=>{
    const key='-lib'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
    const entry={...e,segment:e.segment||defaultSeg||_libSegment||'CNC'};
    updates['imageLibrary/'+key]=entry;
    _imageLibrary.push({...entry,_id:key});
  });
  try{
    const FB_ROOT='https://bangle-tracker-default-rtdb.firebaseio.com';
    await fetch(FB_ROOT+'/.json',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify(updates)});
  }catch(e){ console.warn('Batch library write failed:',e.message); }
}

// Remove a library entry (designs that use it keep showing the R2 URL)
async function deleteLibraryEntry(id){
  if(!confirm('Remove this photo from the library?\n\nDesigns already using it will keep showing it.'))return;
  try{
    await fetch(FB_LIB+'/'+id+'.json',{method:'DELETE'});
    _imageLibrary=_imageLibrary.filter(e=>e._id!==id);
    renderLibrary();
    showToast('Photo removed from library','green',2000);
  }catch(e){showToast('Delete failed: '+e.message,'red',4000);}
}

// ── LIBRARY VIEW ───────────────────────────────────────────────────────────────
async function openLibraryView(){
  _libPage=0;_libFolder='';_libSegment='';_libSelected=new Set();
  await _ensureLibraryLoaded();
  await _loadLibFolders();
  renderLibrary();
}
async function _loadLibFolders(){
  if(_libFoldersLoaded)return;
  _libFoldersLoaded=true;
  try{
    const resp=await fetch(FB_FOLDERS+'.json',{signal:AbortSignal.timeout(10000)});
    const data=resp.ok?(await resp.json()||{}):{};
    _libFolders=Object.entries(data).map(([id,v])=>({...v,_id:id}));
  }catch(e){_libFolders=[];_libFoldersLoaded=false;}
}
// Merge image-derived folders + registry folders for a segment, sorted
function _libGetFolders(seg){
  const map={};
  _imageLibrary.filter(e=>(e.segment||'CNC')===seg).forEach(e=>{
    const f=e.folder||'General';
    if(!map[f]){map[f]={name:f,count:0,preview:null};}
    map[f].count++;
    if(!map[f].preview)map[f].preview=e.r2url;
  });
  // Add empty folders from registry
  _libFolders.filter(f=>f.segment===seg).forEach(f=>{
    if(!map[f.name])map[f.name]={name:f.name,count:0,preview:null,_regId:f._id};
    else map[f.name]._regId=f._id;
  });
  return Object.values(map).sort((a,b)=>a.name.localeCompare(b.name));
}

    </div>
    ${shown.length<filtered.length?'<div id="lib-scroll-sentinel" style="height:40px;margin-top:8px"></div>':''}
    `}
    </div>`;
  }
  // Infinite scroll — watch sentinel, auto-load next page when it enters view
  if(window._libScrollObs){window._libScrollObs.disconnect();window._libScrollObs=null;}
  const _libSent=document.getElementById('lib-scroll-sentinel');
  if(_libSent){
    window._libScrollObs=new IntersectionObserver(entries=>{
      if(entries[0].isIntersecting){_libPage++;renderLibrary();}
    },{threshold:0.1});
    window._libScrollObs.observe(_libSent);
  }
}

async function _libNewFolderProceed(uploadAfter){
  const nameEl=document.getElementById('lib-new-folder-name');
  const segEl=document.getElementById('lib-nf-seg-val');
  const name=(nameEl?nameEl.value:'').trim();
  const seg=(segEl?segEl.value:'CNC');
  if(!name){if(nameEl){nameEl.style.borderColor='#E24B4A';nameEl.focus();}return;}
  document.getElementById('lib-new-folder-modal').remove();
  // Register folder in Firebase so it persists even when empty
  await _libRegisterFolder(seg,name);
  _libSegment=seg;_libFolder=name;
  renderLibrary();
  showToast(`📁 Folder "${name}" created in ${seg}`,'green',3000);
  if(uploadAfter){
    setTimeout(()=>_libUploadMoreToFolder(name),200);
  }
}
async function _libRegisterFolder(seg,name){
  // Check if already registered
  if(_libFolders.some(f=>f.segment===seg&&f.name===name))return;
  const entry={name,segment:seg,createdAt:Date.now()};
  try{
    const resp=await fetch(FB_FOLDERS+'.json',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(entry)});
    const result=resp.ok?await resp.json():null;
    const key=(result&&result.name)||('tmp-'+Date.now());
    _libFolders.push({...entry,_id:key});
  }catch(e){_libFolders.push({...entry,_id:'tmp-'+Date.now()});}
}
function _libRenameFolder(seg,oldName){
  const newName=prompt(`Rename folder "${oldName}" to:`,oldName);
  if(!newName||newName.trim()===oldName)return;
  const trimmed=newName.trim();
  // Update all images in this folder
  const toUpdate=_imageLibrary.filter(e=>(e.segment||'CNC')===seg&&(e.folder||'General')===oldName);
  const updates={};
  toUpdate.forEach(e=>{updates['imageLibrary/'+e._id+'/folder']=trimmed;e.folder=trimmed;});
  // Update folder registry
  _libFolders.filter(f=>f.segment===seg&&f.name===oldName).forEach(f=>{
    updates['imageFolders/'+f._id+'/name']=trimmed;f.name=trimmed;
  });
  if(Object.keys(updates).length){
    fetch('https://bangle-tracker-default-rtdb.firebaseio.com/.json',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify(updates)}).catch(()=>{});
  }
  if(_libFolder===oldName)_libFolder=trimmed;
  renderLibrary();
  showToast(`📁 Renamed to "${trimmed}"`,'green',2500);
}
function _libDeleteFolder(seg,name){
  const imgs=_imageLibrary.filter(e=>(e.segment||'CNC')===seg&&(e.folder||'General')===name);
  if(!confirm(`Delete folder "${name}"?\n\n${imgs.length>0?`This will also DELETE all ${imgs.length} photos inside it.\n`:'(Folder is empty)\n'}\nThis cannot be undone.`))return;
  // Delete all images in folder
  const delFetches=imgs.map(e=>fetch(FB_LIB+'/'+e._id+'.json',{method:'DELETE'}));
  _imageLibrary=_imageLibrary.filter(e=>!(( e.segment||'CNC')===seg&&(e.folder||'General')===name));
  // Delete folder registry entry
  _libFolders.filter(f=>f.segment===seg&&f.name===name).forEach(f=>{
    fetch(FB_FOLDERS+'/'+f._id+'.json',{method:'DELETE'}).catch(()=>{});
  });
  _libFolders=_libFolders.filter(f=>!(f.segment===seg&&f.name===name));
  Promise.all(delFetches).catch(()=>{});
  if(_libFolder===name)_libFolder='';
  renderLibrary();
  showToast(`🗑️ Folder "${name}" deleted`+(imgs.length?` with ${imgs.length} photos`:''),'green',3000);
}

// ── DELETE ALL LIBRARY ENTRIES FOR A SEGMENT ──────────────────────────────────
async function deleteAllLibraryEntries(seg){
  const toDelete=_imageLibrary.filter(e=>(e.segment||'CNC')===seg);
  const total=toDelete.length;
  if(total===0){showToast('No entries to delete in '+seg,'red',3000);return;}
  if(!confirm(`Delete ALL ${total.toLocaleString()} library entries in ${seg}?\n\nThe actual photos in R2 are NOT deleted — only the library listing is cleared.\nYou can Sync from R2 again afterwards to re-add them correctly.`))return;

  // Show progress modal
  const old=document.getElementById('_delall-modal');if(old)old.remove();
  const wrap=document.createElement('div');
  wrap.id='_delall-modal';
  wrap.style.cssText='position:fixed;inset:0;z-index:10020;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:12px';
  wrap.innerHTML=`
  <div style="background:#fff;border-radius:14px;padding:24px;width:min(400px,96vw);display:flex;flex-direction:column;gap:12px">
    <div style="font-size:15px;font-weight:700;color:#C0392B">🗑️ Deleting ${seg} Library</div>
    <div id="_da-status" style="font-size:13px;color:#555">Starting…</div>
    <div style="background:#F0EFEA;border-radius:20px;height:8px;overflow:hidden">
      <div id="_da-fill" style="height:100%;background:#C0392B;width:0%;transition:width .2s;border-radius:20px"></div>
    </div>
    <div id="_da-detail" style="font-size:12px;color:#888">0 / ${total.toLocaleString()} deleted</div>
  </div>`;
  document.body.appendChild(wrap);

  const setP=(done)=>{
    const pct=Math.round((done/total)*100);
    const s=document.getElementById('_da-status');if(s)s.textContent=`Deleting… ${pct}% done`;
    const f=document.getElementById('_da-fill');if(f)f.style.width=pct+'%';
    const d=document.getElementById('_da-detail');if(d)d.textContent=`${done.toLocaleString()} / ${total.toLocaleString()} deleted`;
  };

  const FB_ROOT='https://bangle-tracker-default-rtdb.firebaseio.com';
  // If ALL library entries belong to this segment, wipe the entire node in one REST call (instant)
  // Otherwise batch-delete only the matching entries via PATCH with null values
  if(toDelete.length===_imageLibrary.length){
    setP(Math.floor(total*0.5));
    await fetch(FB_ROOT+'/imageLibrary.json',{method:'DELETE'});
    setP(total);
  } else {
    const BATCH=200;
    let done=0;
    for(let i=0;i<toDelete.length;i+=BATCH){
      const slice=toDelete.slice(i,i+BATCH);
      const updates={};
      slice.forEach(e=>{ updates['imageLibrary/'+e._id]=null; });
      await fetch(FB_ROOT+'/.json',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify(updates)});
      done+=slice.length;
      setP(done);
    }
  }

  _imageLibrary=_imageLibrary.filter(e=>(e.segment||'CNC')!==seg);

  // Done — show success then close
  const s=document.getElementById('_da-status');if(s)s.textContent=`✅ All ${total.toLocaleString()} entries deleted!`;
  const f=document.getElementById('_da-fill');if(f){f.style.width='100%';f.style.background='#1D9E75';}
  const d=document.getElementById('_da-detail');if(d)d.textContent='Photos in R2 are safe. You can now Sync from R2 to re-add them correctly.';
  setTimeout(()=>{ const m=document.getElementById('_delall-modal');if(m)m.remove(); },3000);
  showToast(`✅ ${total.toLocaleString()} entries cleared from ${seg}`,'green',5000);
  renderLibrary();
}

// ── SYNC FROM R2 (rclone-uploaded images) ─────────────────────────────────────
// Scans the R2 bucket for objects uploaded via rclone and catalogs any that are
// not yet in Firebase. Expected rclone path: SEGMENT/FOLDER NAME/filename.jpg
// e.g.  CNC/8MM CNC/8001.jpg  →  segment=CNC, folder=8MM CNC, designCode=8001
async function syncLibraryFromR2(forceSeg){
  const old=document.getElementById('_r2sync-modal');if(old)old.remove();
  const wrap=document.createElement('div');
  wrap.id='_r2sync-modal';
  wrap.style.cssText='position:fixed;inset:0;z-index:10010;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:12px';
  wrap.innerHTML=`
  <div style="background:#fff;border-radius:14px;padding:22px 24px;width:min(480px,96vw);display:flex;flex-direction:column;gap:10px">
    <div style="font-size:15px;font-weight:700;color:#185FA5">🔄 Sync from R2 Bucket</div>
    <div id="_r2s-status" style="font-size:13px;color:#555">Scanning R2 bucket…</div>
    <div style="background:#E8E7E0;border-radius:20px;height:7px;overflow:hidden">
      <div id="_r2s-fill" style="height:100%;background:#185FA5;width:0%;transition:width .3s;border-radius:20px"></div>
    </div>
    <div id="_r2s-detail" style="font-size:11px;color:#888;min-height:18px"></div>
    <button onclick="document.getElementById('_r2sync-modal').remove()" style="margin-top:4px;padding:8px;border:1px solid #ccc;border-radius:8px;font-size:12px;cursor:pointer;background:#f5f4f2">Close</button>
  </div>`;
  document.body.appendChild(wrap);

  const setStatus=(msg,pct,detail)=>{
    const s=document.getElementById('_r2s-status');if(s)s.textContent=msg;
    const f=document.getElementById('_r2s-fill');if(f)f.style.width=(pct||0)+'%';
    const d=document.getElementById('_r2s-detail');if(d)d.textContent=detail||'';
  };

  try{
    await _ensureLibraryLoaded();
    // Build set of already-known R2 keys (from r2url path) to skip duplicates
    const knownKeys=new Set(_imageLibrary.map(e=>{
      try{const u=new URL(e.r2url||'');return u.pathname.replace(/^\//,'');}catch{return '';}
    }).filter(Boolean));

    // Fetch all objects from bucket (paginated)
    let allObjects=[],cursor=null,page=0;
    do{
      page++;
      setStatus(`Scanning bucket… (page ${page})`,10+page*2,'This may take a moment for large buckets');
      const qs=cursor?`&cursor=${encodeURIComponent(cursor)}`:'';
      const resp=await fetch(`${R2_WORKER_URL}?action=list&key=${encodeURIComponent(R2_UPLOAD_KEY)}${qs}`);
      if(!resp.ok)throw new Error(`Worker returned ${resp.status}`);
      const data=await resp.json();
      if(data.error)throw new Error(data.error);
      allObjects=allObjects.concat(data.objects||[]);
      cursor=data.cursor||null;
    }while(cursor);

    setStatus(`Found ${allObjects.length.toLocaleString()} objects in R2`,40,'Checking which are new…');

    // Filter to rclone-style paths: SEGMENT/FOLDER/filename.ext
    // Skip app-uploaded images (those start with "bt/")
    const toAdd=allObjects.filter(o=>{
      if(!o.key||o.key.startsWith('bt/'))return false; // skip app-uploaded
      const parts=o.key.split('/');
      if(parts.length<3)return false; // must have segment/folder/file
      if(knownKeys.has(o.key))return false; // already cataloged
      return true;
    });

    setStatus(`${toAdd.length.toLocaleString()} new images to catalog`,60,`${allObjects.length-toAdd.length} already in library`);

    if(toAdd.length===0){
      setStatus('✅ Library is up to date — nothing new to add',100,'All R2 images are already cataloged');
      return;
    }

    // Build entries and batch-write to Firebase
    const entries=toAdd.map(o=>{
      const parts=o.key.split('/');
      const segment=parts[0]||'CNC';
      const folder=parts[1]||'General'; // use only top-level folder, not sub-paths
      const fileName=parts[parts.length-1]||'';
      const designCode=fileName.replace(/\.[^.]+$/,'').trim();
      const r2url=`${R2_WORKER_URL.replace('bt-image-upload.sayyamranka09.workers.dev','pub-0df3d745e87346ad8148f93b28cc4bac.r2.dev').replace('https://bt-image-upload.sayyamranka09.workers.dev','https://pub-0df3d745e87346ad8148f93b28cc4bac.r2.dev')}/${o.key}`;
      // Use the public R2 URL constant
      const pubUrl=`https://pub-0df3d745e87346ad8148f93b28cc4bac.r2.dev/${o.key}`;
      return{designCode,folder,segment,r2url:pubUrl,fileName,uploadedAt:o.uploaded||Date.now()};
    });

    // Save in batches of 200
    const SBATCH=200;
    for(let i=0;i<entries.length;i+=SBATCH){
      const slice=entries.slice(i,i+SBATCH);
      await _batchAddLibraryEntries(slice);
      const pct=60+Math.round(((i+SBATCH)/entries.length)*38);
      setStatus(`Saving to library… ${Math.min(i+SBATCH,entries.length).toLocaleString()} / ${entries.length.toLocaleString()}`,pct,'');
    }

    setStatus(`✅ Done! ${entries.length.toLocaleString()} new images added to library`,100,'Library synced from R2 successfully');
    showToast(`✅ ${entries.length.toLocaleString()} images synced from R2`,'green',6000);
    if(S.mainView==='library')renderLibrary();

  }catch(e){
    setStatus(`❌ Sync failed: ${e.message}`,0,'Check that the Worker is deployed and the upload key is correct');
    showToast('R2 sync failed: '+e.message,'red',6000);
  }
}

async function _libExecuteMove(mode){

  const selFolder=document.getElementById('lib-mv-folder')?.value||'';

  if(!toFolder){showToast('Please select or type a destination folder','orange',3000);return;}
  document.getElementById('lib-move-modal').remove();
  if(newFolder)await _libRegisterFolder(toSeg,newFolder);
  const ids=[..._libSelected];
  const updates={};
  if(mode==='move'){
    ids.forEach(id=>{
      const e=_imageLibrary.find(x=>x._id===id);
      if(!e)return;
      updates['imageLibrary/'+id+'/segment']=toSeg;
      updates['imageLibrary/'+id+'/folder']=toFolder;
      e.segment=toSeg;e.folder=toFolder;
    });
    fetch('https://bangle-tracker-default-rtdb.firebaseio.com/.json',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify(updates)}).catch(()=>{});
    showToast(`📂 ${ids.length} photo${ids.length!==1?'s':''} moved to ${toSeg} › ${toFolder}`,'green',4000);
  } else {
    // Copy: create new entries with same r2url
    const copies=ids.map(id=>{
      const e=_imageLibrary.find(x=>x._id===id);
      if(!e)return null;
      return{designCode:e.designCode||'',folder:toFolder,segment:toSeg,r2url:e.r2url,fileName:e.fileName||'',uploadedAt:Date.now()};
    }).filter(Boolean);

    showToast(`📋 ${copies.length} photo${copies.length!==1?'s':''} copied to ${toSeg} › ${toFolder}`,'green',4000);
  }
  _libSelected=new Set();
  renderLibrary();
}

    fill=document.getElementById('_lib-fp-fill');
    sub=document.getElementById('_lib-fp-sub');
    statsEl=document.getElementById('_lib-fp-stats');
  }

  // No filtering — upload every file the user selected, exactly as chosen
  const systemSkipped=0;
  const files=allFiles;

  // Parse folder + design code from webkitRelativePath
  const plan=files.map(f=>{
    const rel=f.webkitRelativePath||f.name;
    const parts=rel.split('/');
    let folder,designCode;
    if(forceFolder){
      folder=forceFolder;
      designCode=f.name.replace(/\.[^.]+$/,'').trim();
    } else if(parts.length>=3){
      folder=parts.slice(1,-1).join('/'); // preserve nested folders
      designCode=parts[parts.length-1].replace(/\.[^.]+$/,'').trim();
    } else if(parts.length===2){
      folder='General';
      designCode=parts[1].replace(/\.[^.]+$/,'').trim();
    } else {
      folder='General';
      designCode=f.name.replace(/\.[^.]+$/,'').trim();
    }
    return {file:f,folder,designCode,fileName:f.name};
  });

  // Upload everything — no duplicate check (user manages duplicates themselves)
  const toUpload=plan;
  const skipCount=0;

  const total=toUpload.length;
  let done=0,failed=0;
  const folderCounts={};
  const failedFiles=[];        // track exactly which files failed
  const BATCH=4, SAVE_EVERY=50; // 4 concurrent — prevents network saturation with high-quality files
  let pending=[];

  const _upd=()=>{
    const pct=Math.round((done/total)*100);
    if(fill)fill.style.width=pct+'%';
    let topLine=`Uploading ${done.toLocaleString()} / ${total.toLocaleString()} photos (${pct}%)…`;
    if(label)label.textContent=topLine;
    if(sub)sub.textContent=failed?`${failed} failed — will show list at end`:'All uploads successful so far ✓';
    if(statsEl)statsEl.innerHTML=Object.entries(folderCounts).map(([f,n])=>`<span style="background:#f0efff;border-radius:5px;padding:2px 8px">${esc(f)}: ${n}</span>`).join('');
  };
  _upd();

  for(let i=0;i<total;i+=BATCH){
    const batch=toUpload.slice(i,i+BATCH);
    await Promise.all(batch.map(async p=>{
      try{
        const dataUrl=await new Promise((res,rej)=>{const r=new FileReader();r.onload=e=>res(e.target.result);r.onerror=rej;r.readAsDataURL(p.file);});
        // Compress to 2400px max / 92% quality — visually indistinguishable from original on any screen,
        // but keeps each file ~200-600 KB so the R2 Worker never times out or fails.
        const compressed=await compressImageToThumb(dataUrl,2400);
        const r2url=await uploadToR2(compressed);
        if(!r2url)throw new Error('R2 upload failed — check network or try again');
        const entry={designCode:p.designCode,folder:p.folder,segment:forceSeg||_libSegment||'CNC',r2url,fileName:p.fileName,uploadedAt:Date.now()};
        pending.push(entry);
        folderCounts[p.folder]=(folderCounts[p.folder]||0)+1;
        done++;
      }catch(e){
        failed++;done++;
        failedFiles.push({folder:p.folder,fileName:p.fileName,reason:e.message});
        console.warn('Library import failed:',p.folder+'/'+p.fileName,e.message);
      }
      _upd();
    }));
    if(pending.length>=SAVE_EVERY){
      await _batchAddLibraryEntries([...pending]);
      pending=[];
    }
  }
  if(pending.length)await _batchAddLibraryEntries(pending);

  const ok=done-failed;
  let finalMsg=`✅ ${ok.toLocaleString()} photos imported!`;
  if(skipCount)finalMsg+=` · ${skipCount} already existed`;
  if(systemSkipped)finalMsg+=` · ${systemSkipped} Picasa/system files skipped automatically`;
  if(failed)finalMsg+=` · ${failed} failed`;
  if(label)label.textContent=finalMsg;
  if(fill){fill.style.width='100%';fill.style.background=failed?'#F59E0B':'#22C55E';}

  // Show failed files list if any
  if(failed>0&&statsEl){
    const byFolder={};
    failedFiles.forEach(f=>{if(!byFolder[f.folder])byFolder[f.folder]=[];byFolder[f.folder].push(f.fileName);});
    const retryNote='<div style="margin-top:8px;padding:8px 10px;background:#FFF7E6;border:1px solid #FAC775;border-radius:8px;font-size:11px">'
      +'<strong style="color:#BA7517">⚠ '+failed+' files failed to upload:</strong><br>'
      +Object.entries(byFolder).map(([folder,names])=>
        '<div style="margin-top:4px"><strong>'+esc(folder)+':</strong> '+names.map(n=>esc(n)).join(', ')+'</div>'
      ).join('')
      +'<div style="margin-top:6px;color:#555">Re-run the import to retry — files already imported will be skipped automatically.</div>'
      +'</div>';
    statsEl.innerHTML=statsEl.innerHTML+retryNote;
  }

  showToast(finalMsg,'green',10000);
  if(S.mainView==='library')renderLibrary();
  input.value='';
  // Auto-dismiss the floating overlay after 10s (keep it longer if there were failures)
  if(_floatOverlay){
    setTimeout(()=>{const o=document.getElementById('_lib-fp');if(o)o.remove();}, failed>0?20000:8000);
  }
}

function _lpRender(oi,di,vi){
  const search=(document.getElementById('lp-search')||{}).value||'';
  const folder=(document.getElementById('lp-folder')||{}).value||'';
  const lib=_imageLibrary;
  const q=search.trim().toLowerCase();
  let items=lib.filter(e=>{
    if(folder&&(e.folder||'')!==folder)return false;
    if(q)return (e.designCode||'').toLowerCase().includes(q)||(e.folder||'').toLowerCase().includes(q)||(e.fileName||'').toLowerCase().includes(q);
    return true;
  });
  // Sort by design code ascending — numeric-aware so 8002 < 8010 < 8100
  items.sort((a,b)=>(a.designCode||'').localeCompare(b.designCode||'',undefined,{numeric:true,sensitivity:'base'}));
  const shown=items.slice(0,(_lpPage+1)*LIB_PAGE);
  const grid=document.getElementById('lp-grid');
  const moreWrap=document.getElementById('lp-load-more-wrap');
  if(!grid)return;
  grid.innerHTML=shown.map(e=>`
    <div onclick="_lpAttachById('${e._id}',${oi},${di},${vi})" title="${esc(e.designCode)} · ${esc(e.folder||'')}" style="cursor:pointer;border-radius:8px;border:2px solid #E8E7E0;overflow:hidden;transition:all .13s;background:#fff" onmouseover="this.style.borderColor='#534AB7';this.style.transform='scale(1.03)'" onmouseout="this.style.borderColor='#E8E7E0';this.style.transform=''">
      <img src="${esc(e.r2url)}" loading="lazy" style="width:100%;height:70px;object-fit:cover;display:block">

        <div style="font-size:10px;font-weight:700;color:#222;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(e.designCode)||'—'}</div>
        <div style="font-size:9px;color:#888;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(e.folder||'')}</div>
      </div>
    </div>`).join('');
  if(moreWrap){
    if(shown.length<items.length){
      moreWrap.innerHTML='<div id="lp-scroll-sentinel" style="height:30px"></div>';
      const _lpSent=document.getElementById('lp-scroll-sentinel');
      if(window._lpScrollObs){window._lpScrollObs.disconnect();window._lpScrollObs=null;}
      if(_lpSent){
        const root=document.getElementById('lp-grid-wrap');
        window._lpScrollObs=new IntersectionObserver(entries=>{
          if(entries[0].isIntersecting){_lpPage++;_lpRender(oi,di,vi);}
        },{root:root||null,threshold:0.1});
        window._lpScrollObs.observe(_lpSent);

      if(window._lpScrollObs){window._lpScrollObs.disconnect();window._lpScrollObs=null;}
    }
  }
}

function _lpAttachById(id,oi,di,vi){

  const order=S.orders&&S.orders[oi];

  save();render();
  const m=document.getElementById('lib-picker-modal');if(m)m.remove();

async function _lpUploadNew(input,oi,di,vi){
  const files=Array.from(input.files);
  if(!files.length)return;

  // Ask user which folder to save these photos in
  const existingFolders=[...new Set(_imageLibrary.map(e=>e.folder||'').filter(Boolean))].sort();
  const design=S.orders&&S.orders[oi]&&S.orders[oi].designs&&S.orders[oi].designs[di];
  const designCode=design?(design.code||design.name||''):'';
  // Pre-suggest current folder selection if active, else design code
  const curFolderSel=(document.getElementById('lp-folder')||{}).value||'';
  const suggested=curFolderSel||designCode||'';
  const targetFolder=await _lpPickFolder(existingFolders,suggested);
  if(targetFolder===null){input.value='';return;} // user cancelled

  const btn=input.closest('label');
  if(btn)btn.style.opacity='0.6';
  showToast('Uploading '+files.length+' photo'+(files.length!==1?'s':'')+' to library…','blue',15000);
  let attached=0;
  for(const f of files){
    try{
      const dataUrl=await new Promise((res,rej)=>{const r=new FileReader();r.onload=e=>res(e.target.result);r.onerror=rej;r.readAsDataURL(f);});
      const compressed=await compressImageToThumb(dataUrl,1200);
      const r2url=await uploadToR2(compressed);
      if(!r2url)throw new Error('Upload failed');
      const dcFromFile=f.name.replace(/\.[^.]+$/,'').trim();
      await _addLibraryEntry(r2url,dcFromFile||designCode,targetFolder,f.name);
      _lpAttachById(_imageLibrary[_imageLibrary.length-1]._id,oi,di,vi);
      attached++;
    }catch(e){
      showToast('Upload failed for '+f.name+': '+e.message,'red',4000);
    }
  }
  if(btn)btn.style.opacity='';
  input.value='';
  if(attached)showToast(`✅ ${attached} photo${attached!==1?'s':''} saved to "${targetFolder}"  ✓`,'green',3000);
}

function doRestoreFromFile(input){
  const file = input.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = e=>{
    try{
      const parsed = JSON.parse(e.target.result);
      const state = parsed.state || parsed; // support both wrapped and raw
      if(!state.orders){ showToast('⚠ Invalid backup file','red'); return; }
      if(!confirm(`Restore backup from ${parsed._meta?.exportedAt||'unknown date'}?\nThis will REPLACE all current data.\n${state.orders.length} orders will be loaded.`)) return;
      histPush(); // save current state before overwrite so user can undo
      Object.assign(S, state);
      S.openOrders = new Set(state.openOrders||[]);
      S.openClients = new Set(state.openClients||[]);
      save(); render();
      audit('Restore','Data restored from backup file');
      showToast('📥 Restore successful — '+state.orders.length+' orders loaded','green');
    }catch(err){ showToast('⚠ Could not parse backup: '+err.message,'red'); }
  };
  reader.readAsText(file);
  input.value='';
}

let _toastTimer=null;
function showToast(msg, type='green'){

  _toastTimer=setTimeout(()=>{el.style.opacity='0';setTimeout(()=>{el.style.display='none';},400);},2800);
}
function audit(action,detail){

  S.auditLog.unshift({id:uid(),ts:new Date().toISOString(),action,detail,user:(_currentUser?.username||'—')});

// ── AUTO-NUMBERING ────────────────────────────────────────────────────────────
// Order numbers (ORD-001, ORD-002, ...) are auto-assigned based on:
//   1) Start date ascending (earliest date gets ORD-001)
//   2) Creation timestamp ascending (within the same date, first-entered wins)
// Whenever a new order is added or an existing order's startDate is changed,
// renumberOrders() recalculates every order's orderId so the sequence stays
// in strict chronological order.
function renumberOrders(){
  if(!Array.isArray(S.orders) || !S.orders.length) return;
  // Ensure every order has a createdAt timestamp (migration for old data)
  S.orders.forEach(o=>{
    if(!o.createdAt) o.createdAt = new Date(0).toISOString(); // pre-dated to keep existing order
  });
  // Stable sort: by startDate, then createdAt. Don't mutate S.orders directly
  // since some screens depend on insertion order; build an index map instead.
  const sorted = [...S.orders].sort((a,b)=>{
    const da = (a.startDate||'') + ' ' + (a.createdAt||'');
    const db = (b.startDate||'') + ' ' + (b.createdAt||'');
    return da.localeCompare(db);
  });
  sorted.forEach((o,i)=>{
    const newId = 'ORD-' + String(i+1).padStart(3,'0');
    if(o.orderId !== newId) o.orderId = newId;
  });
}

function rebuildVocab(){
  // Units stay persistent (not derived from orders).
  const existingUnits=(S.vocabulary&&S.vocabulary.units)||['pcs','pairs','jotta'];
  // Manually-added master entries are preserved separately so they survive
  // a fresh rebuild. (S.vocabularyManual is populated by the Masters panel.)
  const man=S.vocabularyManual||{clients:[],vendors:[],dnames:[],dcodes:[]};
  // ── Build clients/vendors/dnames/dcodes FRESH from current orders ──────────
  // Fresh (not merged) so an edited design name / client name REPLACES the old
  // value in the masters instead of leaving the stale one behind forever.
  const clients=new Set(man.clients||[]);
  const vendors=new Set(man.vendors||[]);
  const dnames=new Set(man.dnames||[]);
  const dcodes=new Set(man.dcodes||[]);
  S.orders.forEach(o=>{
    if(o.client)clients.add(o.client);
    (o.designs||[]).forEach(d=>{if(d.name)dnames.add(d.name);if(d.code)dcodes.add(d.code);});
  });
  S.vendorOrders.forEach(vo=>{if(vo.vendor)vendors.add(vo.vendor);});
  S.vocabulary={
    clients:[...clients].filter(Boolean).sort(),
    vendors:[...vendors].filter(Boolean).sort(),
    dnames:[...dnames].filter(Boolean).sort(),
    dcodes:[...dcodes].filter(Boolean).sort(),
    units:existingUnits
  };
}

// ── STAGE/DESIGN LOGIC ────────────────────────────────────────────────────────
function getEffDays(order,design,si){
  const st=design.stages[si];
  if(st.days!=null)return parseInt(st.days);
  const t=getTmpl(st.stageId);if(!t)return 1;
  return order.priority!=='normal'?t.urgDays:t.days;
}
function designDeadline(order,design,si){
  const base=new Date(order.startDate+'T00:00:00');let days=0;
  for(let i=0;i<=si;i++)days+=getEffDays(order,design,i);
  const d=new Date(base);d.setDate(d.getDate()+days);return d;
}
function designStageAlert(order,design,i){
  const st=design.stages[i].status;
  if(st==='done')return'done';
  if(design.stages[i].completionDate){
    const cd=new Date(design.stages[i].completionDate+'T00:00:00');
    if(cd<today()&&st!=='done')return'late';
  }
  const diff=Math.ceil((designDeadline(order,design,i)-today())/864e5);
  if(diff<0)return'late';if(diff<=1)return'warn';return'ok';
}
function designAlert(order,design){
  const a=design.stages.map((_,i)=>designStageAlert(order,design,i));
  if(a.includes('late'))return'late';if(a.includes('warn'))return'warn';
  if(design.stages.every(s=>s.status==='done'))return'done';return'ok';
}
function orderAlert(order){
  // Simple two-state: 'done' = all stages complete, 'pending' = anything else
  return orderPct(order)===100?'done':'pending';
}
function orderPct(order){
  let total=0,done=0;
  order.designs.forEach(d=>{total+=d.stages.length;done+=d.stages.filter(s=>s.status==='done').length;});
  return total?Math.round(done/total*100):0;
}
function designQty(d){
  if(d.varieties&&d.varieties.length>0)
    return d.varieties.reduce((a,v)=>a+Object.values(v.sizes||{}).reduce((x,q)=>x+(parseInt(q)||0),0),0);
  return Object.values(d.sizes||{}).reduce((a,v)=>a+(parseInt(v)||0),0);
}
function totalQty(order){return order.designs.reduce((a,d)=>a+designQty(d),0)}

// ── UNIT-AWARE TOTALS ────────────────────────────────────────────────────────
// Quantities are tracked per variety. Each variety has its own unit (pcs/pairs/jotta).
// These helpers group totals by unit so they're NOT clubbed together.
// Returns: {pcs: 380, pairs: 50, jotta: 10}
function designQtyByUnit(d){
  const out={};
  if(d.varieties&&d.varieties.length>0){
    d.varieties.forEach(v=>{
      const u=(v.unit||'pcs').toLowerCase();
      const qty=Object.values(v.sizes||{}).reduce((a,q)=>a+(parseInt(q)||0),0);
      out[u]=(out[u]||0)+qty;
    });
  } else {
    const qty=Object.values(d.sizes||{}).reduce((a,v)=>a+(parseInt(v)||0),0);
    if(qty>0) out['pcs']=qty;
  }
  return out;
}
function orderQtyByUnit(order){
  const out={};
  (order.designs||[]).forEach(d=>{
    const dq=designQtyByUnit(d);
    Object.keys(dq).forEach(u=>{out[u]=(out[u]||0)+dq[u];});
  });
  return out;
}
function vendorOrderQtyByUnit(vo){
  const out={};
  (vo.designs||[]).forEach(d=>{
    const dq=designQtyByUnit(d);
    Object.keys(dq).forEach(u=>{out[u]=(out[u]||0)+dq[u];});
  });
  return out;
}
// Format like "380 pcs, 50 pairs, 10 jotta" — only includes units with >0 qty
function formatQtyByUnit(qByUnit){
  const parts=Object.keys(qByUnit||{}).filter(u=>(qByUnit[u]||0)>0).sort()
    .map(u=>qByUnit[u]+' '+u);
  return parts.length?parts.join(', '):'0 pcs';
}

function dotCls(order,design,i){

  if(st==='done')return'sd-done';

function dotLbl(design,i){const st=design.stages[i].status;if(st==='done')return'✓';if(st==='delayed')return'!';return(i+1)+'';}
function siCls(order,design,i){

// ── FILTERS ────────────────────────────────────────────────────────────────────
function updateFilterOptions(){
  rebuildVocab();
  const activeId = document.activeElement && document.activeElement.id;
  ['client','dname','dcode'].forEach(k=>{
    const el=document.getElementById('f-'+k);if(!el)return;
    // Don't rebuild a dropdown the user is currently interacting with —
    // rebuilding its <option>s mid-interaction makes the picker misbehave.
    if(el.id===activeId) return;
    const cur=el.value;
    const arr=k==='client'?S.vocabulary.clients:k==='dname'?S.vocabulary.dnames:S.vocabulary.dcodes;
    const lbl=k==='client'?'All clients':k==='dname'?'All designs':'All codes';
    const newHtml=`<option value="">${lbl}</option>`+arr.map(v=>`<option value="${esc(v)}"${cur===v?' selected':''}>${esc(v)}</option>`).join('');
    // Only touch the DOM if the option list actually changed (avoids flicker)
    if(el.innerHTML!==newHtml) el.innerHTML=newHtml;
  });
}
// Applying a filter only re-renders the order/design LIST — it must NOT
// rebuild the filter dropdowns themselves (that breaks the picker on mobile).
function applyFilters(){
  S.filters={client:document.getElementById('f-client')?.value||'',dname:document.getElementById('f-dname')?.value||'',dcode:document.getElementById('f-dcode')?.value||'',status:document.getElementById('f-status')?.value||''};

  else if(S.mainView==='design')renderDesignView();

  else if(S.mainView==='inventory')renderInventory();
  scheduleAutosave();
}
function clearFilters(){
  S.filters={client:'',dname:'',dcode:'',status:''};
  ['f-client','f-dname','f-dcode','f-status'].forEach(id=>{const e=document.getElementById(id);if(e)e.value='';});
  render();

function orderMatchesFilter(order){
  const f=S.filters;
  if(f.client&&order.client!==f.client)return false;
  if(f.dname&&!order.designs.some(d=>d.name===f.dname))return false;
  if(f.dcode&&!order.designs.some(d=>d.code===f.dcode))return false;
  if(f.status){const al=orderAlert(order);if(f.status==='on track'&&al!=='ok')return false;if(f.status==='due soon'&&al!=='warn')return false;if(f.status==='overdue'&&al!=='late')return false;if(f.status==='done'&&al!=='done')return false;}
  return true;
}

function render(){
  // Ensure order IDs are always in date-ascending order before any rendering.
  // This runs on every render so adding/editing an order's start date always
  // immediately reflects the correct ORD-XXX number everywhere in the UI.
  renumberOrders();
  // ── PRESERVE FOCUSED INPUT (critical for mobile typing) ────────────────────
  // render() rebuilds large chunks of DOM. If the user is mid-type in an
  // input, the rebuilt DOM gets the OLD value from state and the user's
  // unsaved keystrokes are lost (the dreaded "my edit reverted" bug).
  // We snapshot the focused input's id, value, and selection range here,
  // then re-apply them after render so the user's typing is preserved.
  const ae = document.activeElement;
  const focusInfo = (ae && (ae.tagName==='INPUT'||ae.tagName==='TEXTAREA') && ae.id) ? {
    id: ae.id,
    value: ae.value,
    selStart: (typeof ae.selectionStart === 'number') ? ae.selectionStart : null,
    selEnd:   (typeof ae.selectionEnd   === 'number') ? ae.selectionEnd   : null,
    inputType: ae.type
  } : null;

  updateFilterOptions();renderStats();
  if(S.mainView==='orders')renderOrdersView();
  else if(S.mainView==='vendor')renderVendorOrders();
  else if(S.mainView==='design')renderDesignView();
  else if(S.mainView==='inventory')renderInventory();
  else if(S.mainView==='masters')renderMasters();
  else if(S.mainView==='library')renderLibrary();
  else if(S.mainView==='dispatch')renderDispatchView();
  else renderAnalytics();
  scheduleAutosave();
  // Sync view div visibility + tab highlights with S.mainView.
  {const _mv=S.mainView||'orders';
  const _vn=['orders','design','analytics','inventory','vendor','masters','library','dispatch'];
  _vn.forEach(v=>{const el=document.getElementById('view-'+v);if(el)el.style.display=_mv===v?'':'none';});
  const _fb=document.getElementById('filter-bar');if(_fb)_fb.style.display=_mv==='design'?'':'none';
  document.querySelectorAll('.main-tab').forEach((t,i)=>{t.classList.toggle('active',_vn[i]===_mv);});}

  // ── RESTORE FOCUS + VALUE + SELECTION ──────────────────────────────────────
  if(focusInfo){
    const newEl = document.getElementById(focusInfo.id);
    if(newEl && (newEl.tagName==='INPUT' || newEl.tagName==='TEXTAREA')){
      try{ newEl.value = focusInfo.value; }catch(e){}
      try{ newEl.focus({preventScroll:true}); }catch(e){ try{ newEl.focus(); }catch(e2){} }
      // setSelectionRange is only valid for some input types — guard it
      if(focusInfo.selStart!=null && focusInfo.selEnd!=null
         && ['text','search','url','tel','password','textarea'].includes(focusInfo.inputType||newEl.type)){
        try{ newEl.setSelectionRange(focusInfo.selStart, focusInfo.selEnd); }catch(e){}
      }
    }
  }
}
function renderStats(){
  const o=S.orders;

    <div class="stat-card stat-done"><div class="stat-val" style="color:#0F6E56">${dc}</div><div class="stat-lbl">Completed</div></div>`;

// ── ORDERS VIEW ────────────────────────────────────────────────────────────────
function renderOrdersView(){
  // Preserve search input focus across re-renders (typing shouldn't lose cursor)
  const _sf=document.activeElement;
  const _sfWas=_sf&&_sf.id==='ord-search-inp';
  const _sfSel=[_sf&&_sf.selectionStart,_sf&&_sf.selectionEnd];

  const container=document.getElementById('view-orders');
  const empty=document.getElementById('empty-msg');
  if(!S.orders.length){container.innerHTML='';empty.style.display='block';return;}
  empty.style.display='none';

  // Build full client map from ALL orders (sidebar always shows every client)
  const allClientMap={};
  S.orders.forEach(o=>{
    if(!allClientMap[o.client])allClientMap[o.client]={orders:[],done:0,pending:0};
    allClientMap[o.client].orders.push(o);
    if(orderAlert(o)==='done')allClientMap[o.client].done++;
    else allClientMap[o.client].pending++;
  });
  const allClients=Object.keys(allClientMap).sort();

  // Auto-select first client if none chosen or chosen client no longer exists
  if(!S.selectedClient||!allClientMap[S.selectedClient])S.selectedClient=allClients[0]||'';

  const q=(S.orderSearchQ||'').toLowerCase().trim();
  const sf=S.orderStatusFilter||'';
  const chipA=v=>(S.orderStatusFilter||'')===v?' active':'';

  // ── Search mode: when query is typed, search ACROSS ALL CLIENTS ──────────
  // Normal mode: show only the selected client's orders
  let clientOrders,isGlobalSearch=false,sectionIcon='👤',sectionName='',sectionMeta='';
  if(q){
    isGlobalSearch=true;
    clientOrders=S.orders.filter(o=>
      (o.orderId||'').toLowerCase().includes(q)||
      (o.client||'').toLowerCase().includes(q)||
      (o.notes||'').toLowerCase().includes(q)||
      (o.designs||[]).some(d=>(d.code||'').toLowerCase().includes(q)||(d.name||'').toLowerCase().includes(q))
    );
    if(sf)clientOrders=clientOrders.filter(o=>orderAlert(o)===sf);
    clientOrders.sort((a,b)=>new Date(a.startDate)-new Date(b.startDate));
    sectionIcon='🔍';
    sectionName=`Results for "${S.orderSearchQ}"`;
    sectionMeta=`${clientOrders.length} order${clientOrders.length!==1?'s':''} across all clients`;
  } else {
    const ci=allClientMap[S.selectedClient]||{orders:[],done:0,pending:0};
    clientOrders=[...ci.orders];
    if(sf)clientOrders=clientOrders.filter(o=>orderAlert(o)===sf);
    clientOrders.sort((a,b)=>new Date(a.startDate)-new Date(b.startDate));
    const totalOrds=ci.orders.length,doneOrds=ci.done,pendingOrds=ci.pending;
    sectionIcon='👤';sectionName=S.selectedClient;
    sectionMeta=`${totalOrds} order${totalOrds!==1?'s':''} · ${pendingOrds} pending · ${doneOrds} completed`;
  }

  const sidebarHTML=allClients.map(c=>{
    const cd=allClientMap[c];
    return`<div class="orders-sb-item${!isGlobalSearch&&c===S.selectedClient?' active':''}" onclick="selectOrderClient('${esc(c)}')">
      <span class="orders-sb-name">👤 ${esc(c)}</span>
      ${_sbStatusDots(cd.done,cd.pending)}
    </div>`;
  }).join('');

  const cardsHTML=clientOrders.length
    ?clientOrders.map(o=>buildOrderCard(o,S.orders.indexOf(o))).join('')
    :`<div class="empty-state" style="margin:0">${q?`No orders found for "${esc(q)}"`:isGlobalSearch?'No matching orders':'No orders for this client'}</div>`;

  container.innerHTML=`
  <div class="orders-split">
    <div class="orders-sidebar">
      <div class="orders-sidebar-hd">Clients (${allClients.length})</div>
      ${sidebarHTML}
    </div>
    <div class="orders-main-wrap">
      <div class="orders-top-bar">
        <input id="ord-search-inp" class="orders-search" placeholder="Search client, order ID, design code…"
          value="${esc(S.orderSearchQ||'')}"
          oninput="S.orderSearchQ=this.value;renderOrdersView()">
        <button class="orders-chip${chipA('')}" onclick="S.orderStatusFilter='';renderOrdersView()">All</button>
        <button class="orders-chip${chipA('pending')}" onclick="S.orderStatusFilter='pending';renderOrdersView()">🔴 Pending</button>
        <button class="orders-chip${chipA('done')}" onclick="S.orderStatusFilter='done';renderOrdersView()">✅ Completed</button>
      </div>
      <div class="orders-section-hd">
        <div style="display:flex;align-items:center;gap:9px;flex:1;min-width:0">
          <span style="font-size:18px">${sectionIcon}</span>
          <div style="min-width:0">
            <div class="orders-section-name">${esc(sectionName)}</div>
            <div class="orders-section-meta">${sectionMeta}</div>
          </div>
        </div>
        ${!isGlobalSearch?`<div class="orders-section-acts">
          <button class="sm no-print" style="background:rgba(255,255,255,.15);color:#fff;border-color:rgba(255,255,255,.3)" onclick="askClientExport('${esc(S.selectedClient)}')">📥 Export</button>
          <button class="sm no-print" style="background:rgba(255,255,255,.15);color:#fff;border-color:rgba(255,255,255,.3)" onclick="askClientPrint('${esc(S.selectedClient)}')">🖨️ Print</button>
        </div>`:''}
      </div>
      <div class="orders-cards-list">${cardsHTML}</div>
    </div>
  </div>`;
  // Restore search focus if user was typing
  if(_sfWas){const el=document.getElementById('ord-search-inp');if(el){el.focus({preventScroll:true});try{el.setSelectionRange(_sfSel[0],_sfSel[1]);}catch(e){}}}
}

  S.selectedClient=name;S.orderSearchQ='';S.orderStatusFilter='';

}

function markOrderComplete(oi){
  const order=S.orders[oi];
  if(!order)return;
  const total=order.designs.reduce((a,d)=>a+(d.stages||[]).length,0);
  if(!confirm(`Mark ALL ${total} production stage${total!==1?'s':''} of ${order.orderId} as Done?\n\nUse this when the order is dispatched and you want to skip filling each stage manually.\n\nThis cannot be undone automatically.`))return;
  const today=new Date().toISOString().split('T')[0];
  order.designs.forEach(d=>{
    (d.stages||[]).forEach(st=>{
      st.status='done';
      if(!st.completionDate)st.completionDate=today;
    });
  });
  histPush();
  save();
  render();
  showToast(`✅ ${order.orderId} marked complete — all ${total} stage${total!==1?'s':''} set to Done`,'green',5000);
  audit('Mark Complete',`${order.orderId} (${order.client}): all ${total} stages marked done`);
}

function markDesignComplete(oi,di){
  const order=S.orders[oi];
  const design=order&&order.designs[di];
  if(!design)return;
  const stages=design.stages||[];
  const pending=stages.filter(st=>st.status!=='done').length;
  const label=design.code||(design.name||'this design');
  if(!confirm(`Mark all ${stages.length} production stage${stages.length!==1?'s':''} of "${label}" as Done?\n\nUse this when the design is dispatched.\n${pending} stage${pending!==1?'s are':' is'} currently not done.`))return;
  const today=new Date().toISOString().split('T')[0];
  stages.forEach(st=>{
    st.status='done';
    if(!st.completionDate)st.completionDate=today;
  });
  design.receivedFromKarigar=true;
  design.dispatchedToClient=true;
  histPush();
  save();
  render();
  showToast(`✅ "${label}" — all ${stages.length} stage${stages.length!==1?'s':''} marked Done`,'green',4000);
  audit('Design Complete',`${order.orderId} › ${label}: all ${stages.length} stages marked done`);
}

function markVarietyDone(oi,di,vi){
  const v=S.orders[oi]&&S.orders[oi].designs[di]&&S.orders[oi].designs[di].varieties[vi];
  if(!v)return;
  v.done=!v.done;
  if(v.done){v.receivedFromKarigar=true;v.dispatchedToClient=true;}
  else{v.receivedFromKarigar=false;v.dispatchedToClient=false;}
  save();render();
  showToast(v.done?'✅ Variety marked complete':'↩️ Variety marked pending',v.done?'green':'red',2500);
}

function upDesignReceived(oi,di){
  const d=S.orders[oi]&&S.orders[oi].designs[di];if(!d)return;

function upVarietyReceived(oi,di,vi){

  v.receivedFromKarigar=!v.receivedFromKarigar;

}

// ── DISPATCH VIEW — all assignable rows from customer orders ─────────────────
function _dispatchRows(){
  const rows=[];
  S.orders.forEach((o,oi)=>{
    (o.designs||[]).forEach((d,di)=>{
      const isCnc=(o.bangleType==='cnc'||d.bangleType==='cnc');
      const hasOnlyDefault=d.varieties&&d.varieties.length===1&&(d.varieties[0].name||'').trim().toLowerCase()==='default';
      if(isCnc||!d.varieties||d.varieties.length===0||hasOnlyDefault){
        const rowSizes=hasOnlyDefault?(d.varieties[0].sizes||{}):(d.sizes||{});
        const qty=Object.values(rowSizes).reduce((a,v)=>a+(parseInt(v)||0),0);
        const unit=d.unit||(d.varieties&&d.varieties[0]&&d.varieties[0].unit)||'pcs';
        rows.push({type:'design',oi,di,vi:-1,client:o.client,orderId:o.orderId,
          startDate:o.startDate,deliveryDate:o.deliveryDate,
          code:d.code||'',name:d.name||'',varName:'',
          qty,unit,sizes:rowSizes,assignedVendor:d.assignedVendor||'',
          done:!!(d.done||(d.stages||[]).length>0&&(d.stages||[]).every(s=>s.status==='done')),
          receivedFromKarigar:!!d.receivedFromKarigar,dispatchedToClient:!!d.dispatchedToClient});
      } else {
        d.varieties.forEach((v,vi)=>{
          const qty=Object.values(v.sizes||{}).reduce((a,b)=>a+(parseInt(b)||0),0);
          rows.push({type:'variety',oi,di,vi,client:o.client,orderId:o.orderId,
            startDate:o.startDate,deliveryDate:o.deliveryDate,
            code:d.code||'',name:d.name||'',varName:v.name||'',
            qty,unit:v.unit||'pcs',sizes:v.sizes||{},assignedVendor:v.assignedVendor||'',
            done:!!v.done,receivedFromKarigar:!!v.receivedFromKarigar,dispatchedToClient:!!v.dispatchedToClient});
        });
      }
    });
  });
  return rows;
}

function renderDispatchView(){
  const container=document.getElementById('view-dispatch');if(!container)return;
  const subTab=window._dispSubTab||'customer';
  const allRows=_dispatchRows();
  const masterVendors=S.vocabulary.vendors||[];
  const assignedVendors=[...new Set(allRows.map(r=>r.assignedVendor).filter(Boolean))];
  const allVendors=[...new Set([...masterVendors,...assignedVendors])].sort();
  container.innerHTML=`
  <div style="padding:14px 0 20px">
    <div class="inv-sub-tabs no-print">
      <button class="inv-sub-tab${subTab==='customer'?' active':''}" onclick="window._dispSubTab='customer';renderDispatchView()">👤 By Customer</button>
      <button class="inv-sub-tab${subTab==='vendor'?' active':''}" onclick="window._dispSubTab='vendor';window._dispSelVendor=undefined;renderDispatchView()">🏭 By Karigar</button>
    </div>
    <div id="dispatch-body"></div>
  </div>`;
  if(subTab==='customer')_renderDispCustomer(allRows,allVendors);
  else _renderDispVendor(allRows,allVendors);
}

      </div>

          <th style="padding:7px 10px;text-align:left;font-weight:700;color:#534AB7">Name</th>
          <th style="padding:7px 10px;text-align:center;font-weight:700;color:#534AB7">Qty</th>
          <th style="padding:7px 10px;text-align:center;font-weight:700;color:#534AB7">Unit</th>
          <th style="padding:7px 10px;text-align:left;font-weight:700;color:#534AB7">Reassign Karigar</th>
          <th style="padding:7px 10px;text-align:center;font-weight:700;color:#534AB7">Received from Karigar</th>
        </tr></thead>
        <tbody>${o.rows.map(r=>_dispRowHtml(r,allVendors,true)).join('')}</tbody>
      </table></div></div>`;
  }).join(''):`<div style="text-align:center;padding:40px;color:#aaa;font-size:13px">${sel?'No rows for '+esc(selLabel):'No vendors assigned yet — assign karigars from Customer Orders'}</div>`;
  cont.innerHTML=`<div style="display:flex;gap:14px;padding-top:12px;min-height:300px">
    <div class="orders-sidebar" style="flex-shrink:0;width:190px">${sidebarHtml||'<div style="padding:20px;color:#aaa;font-size:12px">No assignments yet</div>'}</div>
    <div style="flex:1;min-width:0"><div style="margin-bottom:10px"><strong style="font-size:13px;color:#534AB7">${esc(selLabel)}</strong></div>${mainHtml}</div>
  </div>`;
}

function _dispRowHtml(r,allVendors,isKarigarView){
  // Vendor reassignment cell
  const vFn=r.type==='design'?`upDesignVendor(${r.oi},${r.di},this.value)`:`upVarietyVendor(${r.oi},${r.di},${r.vi},this.value)`;
  const opts=`<option value="">— assign karigar —</option>`+allVendors.map(v=>`<option value="${esc(v)}"${r.assignedVendor===v?' selected':''}>${esc(v)}</option>`).join('');
  const vendorCell=r.assignedVendor
    ?`<div style="display:flex;align-items:center;gap:5px;flex-wrap:wrap">
        <span style="background:#EEEDFE;color:#3C3489;font-size:10px;font-weight:700;padding:2px 9px;border-radius:99px;white-space:nowrap">${esc(r.assignedVendor)}</span>
        <select onchange="${vFn}" style="font-size:10px;padding:2px 4px;border:1px solid #AFA9EC;border-radius:4px;color:#534AB7;background:#fafaff">${opts}</select>
      </div>`
    :`<select onchange="${vFn}" style="font-size:11px;padding:4px 7px;border:1.5px solid #F5A0A0;border-radius:5px;color:#C0392B;background:#FFF0EE">${opts}</select>`;
  // Status toggle buttons
  const rFn=r.type==='design'?`upDesignReceived(${r.oi},${r.di})`:`upVarietyReceived(${r.oi},${r.di},${r.vi})`;
  const dFn=r.type==='design'?`upDesignDispatched(${r.oi},${r.di})`:`upVarietyDispatched(${r.oi},${r.di},${r.vi})`;
  const _btn=(active,fn,labelDone,labelPend)=>active
    ?`<button onclick="${fn}" style="background:#E1F5EE;color:#0F6E56;border:1.5px solid #9FE1CB;border-radius:6px;padding:4px 10px;font-size:10px;font-weight:700;cursor:pointer;white-space:nowrap">✓ ${labelDone}</button>`
    :`<button onclick="${fn}" style="background:#FCEBEB;color:#C0392B;border:1.5px solid #F5A0A0;border-radius:6px;padding:4px 10px;font-size:10px;font-weight:600;cursor:pointer;white-space:nowrap">Pending</button>`;
  const receivedBtn=_btn(r.receivedFromKarigar,rFn,'Received','Pending');
  // Dispatched button: locked (grey) when Received is not done yet
  const dispatchedBtn=r.receivedFromKarigar
    ?_btn(r.dispatchedToClient,dFn,'Dispatched','Pending')
    :`<button disabled title="Mark Received from Karigar first" style="background:#f5f4f2;color:#bbb;border:1.5px solid #e0e0e0;border-radius:6px;padding:4px 10px;font-size:10px;font-weight:600;cursor:not-allowed;white-space:nowrap">🔒 Locked</button>`;
  const sizeHint=Object.entries(r.sizes).filter(([,v])=>parseInt(v)>0).map(([sz,v])=>`${sz}:${v}`).join(' ');
  // Separate variety / name columns
  const varietyCell=r.varName?`<span style="color:#534AB7;font-weight:600">${esc(r.varName)}</span>`:`<span style="color:#bbb">—</span>`;
  const nameCell=r.name?`<span style="color:#555;font-size:11px">${esc(r.name)}</span>`:`<span style="color:#bbb">—</span>`;
  return`<tr style="border-bottom:1px solid #F1EFE8">
    <td style="padding:7px 10px;font-weight:700;color:#1a1916;white-space:nowrap">${esc(r.code)||'<span style="color:#aaa">—</span>'}</td>
    <td style="padding:7px 10px">${varietyCell}</td>
    <td style="padding:7px 10px">${nameCell}</td>
    <td style="padding:7px 10px;text-align:center;font-weight:600" title="${sizeHint}">${r.qty}</td>
    <td style="padding:7px 10px;text-align:center;color:#666;font-size:11px">${esc(r.unit)}</td>
    <td style="padding:7px 10px">${vendorCell}</td>
    <td style="padding:7px 10px;text-align:center">${receivedBtn}</td>
    ${isKarigarView?'':`<td style="padding:7px 10px;text-align:center">${dispatchedBtn}</td>`}
  </tr>`;
}

      <div class="ac-list" id="ac-clients-${oi}--1" style="display:none"></div>

      <input type="date" value="${order.startDate}" onchange="upOrder(${oi},'startDate',this.value)">
    </div>
    <div class="field-group" style="max-width:105px"><label>Priority</label>
      <select onchange="upOrder(${oi},'priority',this.value)">${PRIO_OPTS.map(p=>`<option value="${p}"${order.priority===p?' selected':''}>${p}</option>`).join('')}</select>
    </div>
    <div class="field-group" style="max-width:120px"><label>Bangle type</label>

  <label style="font-size:11px;color:#777;font-weight:500">Order notes</label>

function buildDesignsPanel(order,oi){
  // Group designs by Design Name. All codes sharing a name appear in ONE
  // combined table under that name's header — matching the Excel layout.
  const groups=[];
  const byName={};
  order.designs.forEach((d,di)=>{
    const key=(d.name||'(unnamed)');
    let g=byName[key];
    if(!g){g={name:key,items:[]};byName[key]=g;groups.push(g);}
    g.items.push({d,di});
  });
  const groupsHtml=groups.map(g=>{
    const groupQty={};
    g.items.forEach(it=>{
      const dq=designQtyByUnit(it.d);
      Object.keys(dq).forEach(u=>{groupQty[u]=(groupQty[u]||0)+dq[u];});
    });
    // Aggregate ALL images for this design name group (design-level + all variety images)
    const allGroupImgs=g.items.flatMap(({d})=>[
      ...(d.images||[]).map(img=>({img,label:d.code||d.name})),
      ...d.varieties.flatMap(v=>(v.images||[]).map(img=>({img,label:v.name||d.code})))
    ]);
    const imgGallery=allGroupImgs.length
      ?'<div style="display:flex;flex-wrap:wrap;gap:12px;padding:10px 12px 4px">'
        +allGroupImgs.map(({img,label})=>
          '<div style="display:flex;flex-direction:column;align-items:center;gap:4px">'
            +'<img src="'+(img.data||'')+'" onclick="openLbDirect(\''+(img.data||'')+'\')" style="width:100px;height:100px;object-fit:cover;border-radius:8px;border:1.5px solid #AFA9EC;cursor:zoom-in;box-shadow:0 2px 6px rgba(83,74,183,.12)">'
            +'<span style="font-size:10px;font-weight:600;color:#3C3489;max-width:100px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(label)+'</span>'
          +'</div>'
        ).join('')
        +'</div>'
      :'';
    const tableHtml=buildDesignsGroupTable(order,oi,g);
    const gId='dng-'+g.items[0].d.id;
    return `<div class="design-name-group">
      <div class="design-name-group-head">
        <div style="display:flex;align-items:center;gap:8px;flex:1;min-width:0">
          <span style="font-size:13px;opacity:.75;flex-shrink:0">🎨</span>
          <div style="position:relative;flex:1;min-width:0">
            <input class="inline-edit" id="${gId}-inp" value="${esc(g.name)}"
              data-origname="${esc(g.name)}"
              data-oi="${oi}"
              data-dids="${g.items.map(({d})=>d.id).join(',')}"
              style="font-size:14px;font-weight:700;color:#fff;background:rgba(255,255,255,.15);border-bottom-color:rgba(255,255,255,.5);min-width:120px;padding:2px 6px;border-radius:4px;width:100%"
              onfocus="try{_fb.pendingLocal=true;}catch(e){};showDNameAC('${gId}',true)"
              oninput="showDNameAC('${gId}')"
              onkeydown="if(event.key==='Enter'){event.preventDefault();this.blur();}if(event.key==='Escape'){hideDNameAC('${gId}');}"
              onblur="hideDNameAC('${gId}');renameDesignGroup(this)"
              title="Click to rename — Enter or click away to save">
            <div id="${gId}-ac" class="ac-list" style="display:none;background:#fff;color:#333;min-width:220px"></div>
          </div>
        </div>
        <span class="dng-meta">${g.items.length} code${g.items.length!==1?'s':''} · ${formatQtyByUnit(groupQty)}</span>
      </div>
      <div class="design-name-group-body" style="padding:0 0 6px">
        ${imgGallery}
        ${tableHtml}
      </div>
    </div>`;
  }).join('');
  return `<div class="section-head" style="margin-top:0">
    <span>Designs &amp; Varieties (${order.designs.length}) — Order total: <strong>${formatQtyByUnit(orderQtyByUnit(order))}</strong></span>
    <button class="icon-btn primary no-print" onclick="addDesign(${oi})">+ Add design</button>
  </div>
  ${groupsHtml}
  ${!order.designs.length?'<div style="font-size:12px;color:#aaa;text-align:center;padding:1rem">No designs yet.</div>':''}`;
}

// ── COMBINED TABLE per design-name group (matches Excel template layout) ────────
// Each design code is ONE row. For Dye Gold designs that have varieties, the
// code row shows aggregated images + total; variety sub-rows (indented) hold
// the per-size quantities. CNC / no-variety designs use a single flat row.
function buildDesignsGroupTable(order,oi,g){
  // Union of all size keys across every design in the group.
  // For legacy designs that have only a single "Default" variety, sizes live
  // inside that variety — pull them out into d.sizes so the table renders correctly.
  const szSet=new Set();
  g.items.forEach(({d})=>{
    if(_hasOnlyDefault(d)&&(!d.sizes||!Object.keys(d.sizes).length)){
      d.sizes=Object.assign({},d.varieties[0].sizes||{});
    }
    if(!d.sizes||!Object.keys(d.sizes).length){d.sizes={};DEFAULT_SIZES.forEach(s=>d.sizes[s]=0);}
    Object.keys(d.sizes).forEach(s=>szSet.add(s));
  });
  const szKeys=[...szSet];

  let tbody='';
  const grpTotals={};
  szKeys.forEach(sz=>grpTotals[sz]=0);

  g.items.forEach(({d,di})=>{
    if(!d.varieties)d.varieties=[];
    const isCnc=(order.bangleType==='cnc'||d.bangleType==='cnc');
    // Designs that were auto-created with a single "Default" variety (legacy data)
    // are treated as flat rows — same as CNC. Sizes are read from that variety.
    const hasOnlyDefault=d.varieties.length===1&&(d.varieties[0].name||'').trim().toLowerCase()==='default';
    const al=designAlert(order,d);
    // All images for this design code (design-level + every variety's images)
    // Design-level images — each with ✕ delete button; click opens HQ lightbox
    const dImages=d.images||[];
    const vImagesFlat=d.varieties.flatMap((v,vi)=>(v.images||[]).map((img,ii)=>({img,vi,ii})));
    const designImgThumbs=dImages.map((img,ii)=>
      `<img class="variety-thumb" src="${img.data||''}" onclick="openDesignImgsLb(${oi},${di},${ii})" style="cursor:zoom-in" title="${esc(img.name||'Image')}">`+
      `<button class="del-img no-print" style="width:auto" onclick="deleteImg(${oi},${di},${ii})" title="Remove image">✕</button>`
    ).join('');
    const varImgThumbs=vImagesFlat.map(({img,vi,ii},gOff)=>
      `<img class="variety-thumb" src="${img.data||''}" onclick="openDesignImgsLb(${oi},${di},${dImages.length+gOff})" style="cursor:zoom-in">`+
      `<button class="del-img no-print" style="width:auto" onclick="delVarietyImg(${oi},${di},${vi},${ii})" title="Remove image">✕</button>`
    ).join('');
    const imgThumbs=designImgThumbs+varImgThumbs;
    const addImgBtn=`<button class="variety-img-add no-print" onclick="openLibraryPicker(${oi},${di},-1)" title="Choose from library or upload new photo" style="display:flex;align-items:center;justify-content:center"><span style="font-size:16px;line-height:1">+</span></button>`;
    const imgCell=`<div class="variety-img-cell">${imgThumbs}${addImgBtn}</div>`;

    if(isCnc||d.varieties.length===0||hasOnlyDefault){
      // ── FLAT ROW (CNC, no varieties, or legacy single-Default variety) ───────
      // For legacy Default-variety designs, read sizes from that variety's sizes
      const rowSizes=hasOnlyDefault?(d.varieties[0].sizes||{}):(d.sizes||{});
      const rowTotal=szKeys.reduce((a,sz)=>a+(parseInt(rowSizes[sz])||0),0);
      szKeys.forEach(sz=>{grpTotals[sz]+=(parseInt(rowSizes[sz])||0);});
      const sizeCells=szKeys.map((sz,szI)=>
        '<td><input type="number" class="qty-inp" min="0" value="'+(parseInt(rowSizes[sz])||0)+'"'
        +' oninput="upDesignDirectSizeSilent('+oi+','+di+',\''+esc(sz)+'\',this.value);this._dirty=true"'
        +' onblur="if(this._dirty&&!this._skipBlur){this._dirty=false;upDesignDirectSize('+oi+','+di+',\''+esc(sz)+'\',this.value)}"'
        +' onfocus="this.select()"'
        +' onkeydown="handleFlatTabKey(event,'+oi+','+di+','+szI+')"'
        +' tabindex="0"></td>'
      ).join('');
      // Unit: read from d.unit first, then fall back to first variety's unit (for CNC / legacy data)
      const flatUnit=d.unit||(d.varieties&&d.varieties[0]&&d.varieties[0].unit)||'pcs';
      const unitOpts=(S.vocabulary.units||['pcs','pairs','jotta']).map(u=>'<option value="'+u+'"'+(u===flatUnit?' selected':'')+'>'+u+'</option>').join('');
      const codeEmpty=!(d.code||'').trim();
      const allStagesDone=(d.stages||[]).length>0&&(d.stages||[]).every(st=>st.status==='done');
      const tickSty=allStagesDone?'background:#E1F5EE;color:#0F6E56;border-color:#9FE1CB':'background:#FCEBEB;color:#C0392B;border-color:#F5A0A0';
      tbody+='<tr style="background:#fff">'
        +'<td>'
          +'<div style="display:flex;flex-direction:column;gap:3px">'
            +badgeHtml(al)
            +(codeEmpty?'<span style="font-size:9px;font-weight:700;color:#BA7517;letter-spacing:.04em">ADD CODE ↓</span>':'')
            +'<input class="variety-name-inp" value="'+esc(d.code||'')+'" placeholder="e.g. DC-001"'
            +' oninput="if(S.orders['+oi+']&&S.orders['+oi+'].designs['+di+']){S.orders['+oi+'].designs['+di+'].code=this.value;scheduleAutosave();}"'
            +' onkeydown="handleCodeTabKey(event)"'
            +' onblur="rebuildVocab()" tabindex="0"'
            +' title="Design code — click to add or edit (e.g. DC-001, 12MM CNC)"'
            +' style="min-width:120px;font-weight:600;'+(codeEmpty?'border-color:#EF9F27;background:#FFFBF0;':'border-color:#AFA9EC;')+'font-size:12px">'
          +'</div>'
        +'</td>'
        +'<td>'+imgCell+'</td>'
        +sizeCells
        +'<td class="total-col">'+rowTotal+'</td>'
        +'<td><select style="font-size:11px;padding:3px 4px;border-radius:5px;border:1px solid #AFA9EC;background:#f7f6ff;color:#3C3489;width:100%"'
          +' onchange="upDesignUnit('+oi+','+di+',this.value)">'+unitOpts+'</select></td>'
        +'<td><input type="number" min="0" step="0.01" placeholder="₹" style="font-size:11px;padding:3px 5px;border:1px solid #AFA9EC;border-radius:5px;width:72px;text-align:right" value="'+(d.rate||'')+'" onchange="upDesignRate('+oi+','+di+',this.value)"></td>'
        +'<td class="no-print" style="padding:2px 4px">'
          +'<select style="font-size:10px;padding:3px 5px;border-radius:5px;min-width:95px;border:1.5px solid '+(d.assignedVendor?'#AFA9EC':'#F5A0A0')+';background:'+(d.assignedVendor?'#f7f6ff':'#FFF0EE')+';color:'+(d.assignedVendor?'#3C3489':'#C0392B')+'" onchange="upDesignVendor('+oi+','+di+',this.value)">'
            +'<option value="">— karigar —</option>'
            +(S.vocabulary.vendors||[]).map(v=>'<option value="'+esc(v)+'"'+(d.assignedVendor===v?' selected':'')+'>'+esc(v)+'</option>').join('')
          +'</select>'
        +'</td>'
        +'<td class="no-print"><div style="display:flex;gap:3px;flex-wrap:wrap">'
          +'<button class="icon-btn sm" style="'+tickSty+';font-weight:700" onclick="markDesignComplete('+oi+','+di+')" title="Mark this design\'s production stages as Done">✓</button>'
          +(!isCnc?'<button class="icon-btn sm" onclick="addVariety('+oi+','+di+')" title="Add variety">+Var</button>':'')
          +'<button class="icon-btn danger sm" onclick="removeDesign('+oi+','+di+')" title="Remove">✕</button>'
        +'</div></td>'
      +'</tr>';

    } else {
      // ── DESIGN-CODE HEADER ROW + VARIETY SUB-ROWS ───────────────────────────
      const colTotals={};
      szKeys.forEach(sz=>{
        colTotals[sz]=d.varieties.reduce((a,v)=>a+(parseInt((v.sizes||{})[sz])||0),0);
        grpTotals[sz]+=colTotals[sz];
      });
      const dTotal=Object.values(colTotals).reduce((a,v)=>a+v,0);

      // Header row for the design code (purple-tinted, shows images + total)
      const codeEmptyH=!(d.code||'').trim();
      tbody+='<tr style="background:#EEEDFE">'
        +'<td style="font-weight:700">'
          +'<div style="display:flex;flex-direction:column;gap:3px">'
            +badgeHtml(al)
            +(codeEmptyH?'<span style="font-size:9px;font-weight:700;color:#BA7517;letter-spacing:.04em">ADD CODE ↓</span>':'')
            +'<input class="variety-name-inp" value="'+esc(d.code||'')+'" placeholder="e.g. DC-001"'
            +' oninput="if(S.orders['+oi+']&&S.orders['+oi+'].designs['+di+']){S.orders['+oi+'].designs['+di+'].code=this.value;scheduleAutosave();}"'
            +' onblur="rebuildVocab()" tabindex="0"'
            +' title="Design code — click to add or edit (e.g. DC-001, 12MM CNC)"'
            +' style="min-width:120px;font-weight:700;'+(codeEmptyH?'border-color:#EF9F27;background:#FFFBF0;':'border-color:#AFA9EC;')+'font-size:12px">'
          +'</div>'
        +'</td>'
        +'<td>'+imgCell+'</td>'
        +'<td colspan="'+szKeys.length+'" style="text-align:center;font-size:10px;color:#6C64CC;font-style:italic;padding:6px">'
          +d.varieties.length+' variet'+(d.varieties.length===1?'y':'ies')+' — see rows below'
        +'</td>'
        +'<td class="total-col" style="font-weight:800;font-size:12px;color:#3C3489">'+dTotal+'</td>'
        +'<td></td>'
        +'<td></td>'
        +'<td class="no-print"></td>'
        +'<td class="no-print"><div style="display:flex;gap:3px;flex-wrap:wrap">'
          +'<button class="icon-btn sm" onclick="addVariety('+oi+','+di+')" title="Add variety">+Var</button>'
          +'<button class="icon-btn danger sm" onclick="removeDesign('+oi+','+di+')" title="Remove">✕</button>'
        +'</div></td>'
      +'</tr>';

      // Variety sub-rows (indented, white background)
      d.varieties.forEach((v,vi)=>{
        const rowTotal=szKeys.reduce((a,sz)=>a+(parseInt((v.sizes||{})[sz])||0),0);
        const varImgs=(v.images||[]).map((img,ii)=>
          '<img class="variety-thumb" src="'+(img.data||'')+'" onclick="openVarietyImgsLb('+oi+','+di+','+vi+','+ii+')" style="cursor:zoom-in">'
          +'<button class="del-img no-print" style="width:auto" onclick="delVarietyImg('+oi+','+di+','+vi+','+ii+')" title="Remove">✕</button>'
        ).join('');
        const addVarImg='<button class="variety-img-add no-print" onclick="openLibraryPicker('+oi+','+di+','+vi+')" title="Choose from library or upload new photo" style="display:flex;align-items:center;justify-content:center"><span style="font-size:16px;line-height:1">+</span></button>';
        const unitOpts2=(S.vocabulary.units||['pcs','pairs','jotta']).map(u=>'<option value="'+u+'"'+(u===(v.unit||'pcs')?' selected':'')+'>'+u+'</option>').join('');
        const szCells2=szKeys.map((sz,szI)=>
          '<td><input type="number" class="qty-inp" min="0" value="'+(parseInt((v.sizes||{})[sz])||0)+'"'

function addDesignCodeToGroup(oi,groupName){
  const order=S.orders[oi];if(!order)return;
  const newStages=S.stageTemplates.map(s=>({stageId:s.id,status:'pending',note:'',days:null,completionDate:null,vendor:'',stageNote:'',qty:null}));
  const newId=uid();
  // Inherit sizes from THIS GROUP ONLY — never borrow from other groups or DEFAULT_SIZES
  const sameGroupDesign=order.designs.find(d=>d.name===groupName&&d.sizes&&Object.keys(d.sizes).length);
  const useSizes=sameGroupDesign?Object.keys(sameGroupDesign.sizes):DEFAULT_SIZES;
  order.designs.push({id:newId,name:groupName,code:'',sizesLocked:false,sizes:Object.fromEntries(useSizes.map(s=>[s,0])),images:[],stages:newStages,varieties:[]});
  S.activeTabs[order.id]='designs';
  audit('Add design code',`${order.orderId}: new code added to group "${groupName}"`);
  render();
  requestAnimationFrame(()=>{
    const orderEl=document.getElementById('oc-'+order.id);
    if(orderEl){
      const emptyInps=[...orderEl.querySelectorAll('.variety-name-inp')].filter(el=>!el.value.trim());
      const target=emptyInps[emptyInps.length-1];
      if(target){target.scrollIntoView({behavior:'smooth',block:'nearest'});target.focus();}
    }
  });
}

        +'<button class="icon-btn" onclick="mvDesignStage('+oi+','+di+','+si+',1)">↓</button>'

      +'<div style="display:flex;flex-direction:column;gap:3px;min-width:130px">'

        +'<input type="number" min="0" step="1" style="width:90px!important;font-size:11px;padding:4px 5px;border-color:'+gDef.border+';background:'+gDef.light+'" value="'+(st.qty!=null?st.qty:'')+'" placeholder="e.g. 200 pcs" onblur="upDesignStageQty('+oi+','+di+','+si+',this.value,\''+gDef.id+'\')" tabindex="0">'

function buildStagesPanel(order,oi){
  const allDesigns=order.designs;
  if(!allDesigns.length)return '<div style="font-size:12px;color:#aaa;text-align:center;padding:1rem">No designs — add a design first.</div>';
  if(!S.openDesignStages)S.openDesignStages=new Set();
  // Compact "Expand all / Collapse all" header for quick control
  const allOpen=allDesigns.every(d=>S.openDesignStages.has(d.id));
  const ctrlBar='<div class="no-print" style="display:flex;justify-content:flex-end;gap:8px;margin-bottom:8px">'
    +'<button class="icon-btn" onclick="toggleAllDesignStages(\''+order.id+'\','+(allOpen?'false':'true')+')">'
    +(allOpen?'▾ Collapse all':'▸ Expand all')+'</button>'
    +'</div>';
  const sections=allDesigns.map(function(d,di){
    const isOpen=S.openDesignStages.has(d.id);
    const grouped={raw:[],semi:[],finished:[]};
    d.stages.forEach(function(st,si){
      const g=stGroup(st);
      if(!grouped[g])grouped[g]=[];
      grouped[g].push({st:st,si:si});
    });
    // Status summary chip: "X / Y stages done"
    const doneCount=d.stages.filter(s=>s.status==='done').length;
    const totalCount=d.stages.length;
    const statusChip='<span style="font-size:11px;color:#666;background:#f0efff;border:1px solid #AFA9EC;border-radius:14px;padding:2px 10px;font-weight:600">'
      +doneCount+' / '+totalCount+' stages done</span>';
    const chevron='<span class="chevron'+(isOpen?' open':'')+'" style="margin-right:6px;display:inline-block;transition:transform .15s;'+(isOpen?'transform:rotate(90deg)':'')+'">▶</span>';
    // Click header to toggle — but stop click on action buttons from toggling
    const headHtml='<div class="design-stages-head" style="cursor:pointer" onclick="toggleDesignStages(\''+d.id+'\')">'
      +'<span style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">'
        +chevron+'🎨 '+esc(d.name)+' <span style="color:#AFA9EC;font-weight:400">['+esc(d.code)+']</span>'
        +' <span style="color:#888;font-weight:400">— '+d.stages.length+' stages</span>'
        +' '+statusChip
      +'</span>'
      +'<div style="display:flex;gap:5px" onclick="event.stopPropagation()">'
        +'<button class="icon-btn no-print" onclick="exportOrderCSV(\''+order.id+'\')" title="Export this order">📥</button>'
        +'<button class="icon-btn no-print" onclick="printDesignWise(\''+order.id+'\',\''+d.id+'\')">🖨️</button>'
      +'</div>'
    +'</div>';
    // Stage-flow pills — ALWAYS shown (collapsed or expanded) so the current
    // stage is visible at a glance without expanding the section.
    const pillsHtml=d.stages.map(function(st,si){
      const info=stageInfo(st);
      const done=st.status==='done';
      return '<span class="stage-pill '+(done?'sp-done':'sp-idle')+'">'+(done?'✓':(si+1))+' '+esc(info.name)+'</span>'+(si<d.stages.length-1?'<span class="stage-arrow">›</span>':'');
    }).join('');
    const flowHtml=d.stages.length?'<div class="stage-flow stage-flow-peek" onclick="toggleDesignStages(\''+d.id+'\')">'+pillsHtml+'</div>':'';
    // Full editable stage groups — only when expanded
    let bodyHtml='';
    if(isOpen){
      bodyHtml=buildStageGroup(order,oi,d,di,'raw',grouped)
        +buildStageGroup(order,oi,d,di,'semi',grouped)
        +buildStageGroup(order,oi,d,di,'finished',grouped);
    }
    return '<div class="design-stages-section">'+headHtml+flowHtml+bodyHtml+'</div>';
  }).join('');
  return ctrlBar+sections;
}

// Toggle a design's production-stage section open/closed
function toggleDesignStages(designId){
  if(!S.openDesignStages)S.openDesignStages=new Set();
  if(S.openDesignStages.has(designId))S.openDesignStages.delete(designId);
  else S.openDesignStages.add(designId);
  save();render();
}
// Expand or collapse all designs in an order at once
function toggleAllDesignStages(orderId,openIt){
  if(!S.openDesignStages)S.openDesignStages=new Set();
  const order=S.orders.find(o=>o.id===orderId);
  if(!order)return;
  order.designs.forEach(d=>{
    if(openIt)S.openDesignStages.add(d.id);
    else S.openDesignStages.delete(d.id);
  });
  save();render();
}
