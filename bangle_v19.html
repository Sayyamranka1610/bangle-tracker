        <button id="btn-modal-cancel" onclick="closeModal()">Cancel</button>
        <button class="primary" id="btn-modal-create" onclick="createOrder()">Create order</button>
      </div>
    </div>
  </div>`;
  renderModalSizeHeaders();
  renderModalVarieties();
  // Disable all background focusable elements so Tab stays inside modal
  _modalDisableBackground();
  // Install focus trap keydown handler on the overlay
  const overlay=document.getElementById('modal-overlay-main');
  if(overlay){
    overlay.addEventListener('click',e=>{if(e.target===overlay)closeModal();});
    overlay.addEventListener('keydown',_modalFocusTrap);
  }
  // Focus the first field
  setTimeout(()=>{const f=document.getElementById('no-id');if(f)f.focus();},30);
}

// ── MODAL FOCUS TRAP ──────────────────────────────────────────────────────────
// Intercepts Tab/Shift-Tab so focus cycles only within the modal.
// Also closes on Escape.
function _modalFocusTrap(e){
  if(e.key==='Escape'){closeModal();return;}
  // Let handleModalQtyTab handle Tab inside qty cells — it calls e.preventDefault() itself
  // For all other Tab presses, we enforce the cycle inside the modal
  if(e.key!=='Tab')return;
  const focusable=_modalFocusable();
  if(!focusable.length)return;
  const first=focusable[0],last=focusable[focusable.length-1];
  if(e.shiftKey){
    if(document.activeElement===first){e.preventDefault();last.focus();}
  } else {
    if(document.activeElement===last){e.preventDefault();first.focus();}
  }
}

function renderModalSizeHeaders(){
  const wrap=document.getElementById('no-size-headers');if(!wrap)return;
  wrap.innerHTML=window._modalSizes.map((sz,i)=>{
    const parts=sz.split('/');
    return `<div style="display:flex;flex-direction:column;align-items:center;gap:3px">
      <span style="font-size:10px;color:#AFA9EC;font-weight:500">Size ${i+1}</span>
      <div style="display:flex;align-items:center;border:1px solid #AFA9EC;border-radius:6px;overflow:hidden;background:#fff">
        <span style="padding:5px 5px 5px 8px;font-size:11px;font-weight:600;color:#534AB7;background:#f0efff;border-right:1px solid #AFA9EC">2/</span>
        <input type="number" min="1" max="99" value="${parts[1]||''}" data-modal-size-idx="${i}"
          style="width:40px;padding:5px 3px;font-size:11px;font-weight:600;color:#534AB7;text-align:center;border:none;border-radius:0;background:#fff;box-shadow:none"
          onblur="changeModalSizeDenom(${i},this.value)" onkeydown="handleModalSizeHeaderTab(event,${i})">
      </div>
      ${window._modalSizes.length>1?`<button class="icon-btn danger" style="font-size:9px;padding:2px 5px" tabindex="-1" onclick="removeModalSize(${i})">✕</button>`:''}
    </div>`;
  }).join('');
}
function addModalSize(){
  const denoms=window._modalSizes.map(s=>parseInt(s.split('/')[1])).filter(n=>!isNaN(n));
  const next=(denoms.length?Math.max(...denoms):12)+2;
  window._modalSizes.push('2/'+next);
  window._modalVarieties.forEach(v=>{if(!v.sizes)v.sizes={};v.sizes['2/'+next]=0;});
  renderModalSizeHeaders();renderModalVarieties();
}
function removeModalSize(i){
  if(window._modalSizes.length<=1){alert('At least one size is required');return;}
  const sz=window._modalSizes[i];
  window._modalSizes.splice(i,1);
  window._modalVarieties.forEach(v=>{if(v.sizes)delete v.sizes[sz];});
  renderModalSizeHeaders();renderModalVarieties();
}
function changeModalSizeDenom(i,val){
  const n=parseInt(val);if(isNaN(n)||n<1)return;
  const oldSz=window._modalSizes[i],newSz='2/'+n;
  if(newSz===oldSz)return;
  // Prevent duplicate size keys
  if(window._modalSizes.includes(newSz)){alert('Size '+newSz+' already exists. Please choose a different value.');renderModalSizeHeaders();return;}
  window._modalSizes[i]=newSz;
  window._modalVarieties.forEach(v=>{if(!v.sizes)return;const ov=v.sizes[oldSz]||0;delete v.sizes[oldSz];v.sizes[newSz]=ov;});
  renderModalSizeHeaders();renderModalVarieties();
}

// Tab navigation between size header inputs: Tab moves to next size, Shift-Tab to previous.
// After last size header → Tab moves to first variety name input (or "Add variety" button).
function handleModalSizeHeaderTab(e, szI){
  if(e.key==='Tab'&&!e.shiftKey){
    e.preventDefault();
    const nextSzI=szI+1;
    if(nextSzI<window._modalSizes.length){
      // Move to next size header input
      const all=document.querySelectorAll('#no-size-headers input[type="number"]');
      if(all[nextSzI]){all[nextSzI].focus();all[nextSzI].select();}
    } else {
      // Last size — move to first variety name input or "Add variety" button
      const firstVarName=document.querySelector('#no-variety-rows .modal-variety-row input:not([type="number"])');
      const firstVarQty=document.querySelector('#no-variety-rows input[type="number"]');
      const addBtn=document.getElementById('btn-add-variety');
      if(firstVarName){firstVarName.focus();firstVarName.select();}
      else if(firstVarQty){firstVarQty.focus();firstVarQty.select();}
      else if(addBtn){addBtn.focus();}
    }
  } else if(e.key==='Tab'&&e.shiftKey){
    e.preventDefault();
    const prevSzI=szI-1;
    if(prevSzI>=0){
      const all=document.querySelectorAll('#no-size-headers input[type="number"]');
      if(all[prevSzI]){all[prevSzI].focus();all[prevSzI].select();}
    } else {
      // First size — go back to Design code
      const dcode=document.getElementById('no-dcode');
      if(dcode)dcode.focus();
    }
  }
}

        <input value="${esc(v.name||'Variety '+(vi+1))}" placeholder="Variety name" style="max-width:200px"
          onblur="if(this.value!==window._modalVarieties[${vi}].name){window._modalVarieties[${vi}].name=this.value;}"
          onkeydown="handleModalVarietyNameTab(event,${vi})">

function addModalVariety(){

// Update just the "Total" span for a variety row without re-rendering everything
function updateModalVarietyTotal(vi){
  const v=window._modalVarieties[vi];
  const total=window._modalSizes.reduce((a,sz)=>a+(parseInt((v.sizes||{})[sz])||0),0);
  const rows=document.querySelectorAll('#no-variety-rows .modal-variety-row');

// Tab on variety name input: Tab → first qty cell of same variety; Shift-Tab → last size header or prev variety last qty
function handleModalVarietyNameTab(e,vi){
  if(e.key!=='Tab')return;
  e.preventDefault();
  if(!e.shiftKey){
    // Forward: go to first qty cell of this variety
    const rows=document.querySelectorAll('#no-variety-rows .modal-variety-row');
    if(rows[vi]){
      const inp=rows[vi].querySelectorAll('input[type="number"]')[0];
      if(inp){inp.focus();inp.select();}
    }
  } else {
    // Backward: go to last qty cell of previous variety, or last size header
    if(vi>0){
      const rows=document.querySelectorAll('#no-variety-rows .modal-variety-row');
      const prevRow=rows[vi-1];
      if(prevRow){
        const inputs=prevRow.querySelectorAll('input[type="number"]');
        const last=inputs[inputs.length-1];
        if(last){last.focus();last.select();}
      }
    } else {
      // First variety name → back to last size header
      const sizeInputs=document.querySelectorAll('#no-size-headers input[type="number"]');
      if(sizeInputs.length){const last=sizeInputs[sizeInputs.length-1];last.focus();last.select();}
    }
  }
}

// Tab navigation between modal variety qty cells
function handleModalQtyTab(e,vi,szI){
  if(e.key!=='Tab'&&e.key!=='Enter')return;
  e.preventDefault();
  const numSizes=window._modalSizes.length;
  const numVars=window._modalVarieties.length;
  const rows=document.querySelectorAll('#no-variety-rows .modal-variety-row');

  if(e.key==='Enter'){
    // Enter: go down same column to next variety
    const nextVi=(vi+1)%numVars;
    if(rows[nextVi]){
      const inputs=rows[nextVi].querySelectorAll('input[type="number"]');
      if(inputs[szI]){inputs[szI].focus();inputs[szI].select();}
    }
    return;
  }

  if(!e.shiftKey){
    // Forward Tab
    const nextSzI=szI+1;
    if(nextSzI<numSizes){
      // Next size in same variety
      if(rows[vi]){
        const inp=rows[vi].querySelectorAll('input[type="number"]')[nextSzI];
        if(inp){inp.focus();inp.select();}
      }
    } else {
      // End of this variety's sizes — go to next variety's name input
      const nextVi=vi+1;
      if(nextVi<numVars){
        const nameInp=rows[nextVi]?rows[nextVi].querySelector('input:not([type="number"])'):null;
        if(nameInp){nameInp.focus();nameInp.select();}
      } else {
        // Last cell of last variety — move to "Create order" button
        const createBtn=document.getElementById('btn-modal-create');
        if(createBtn)createBtn.focus();
      }
    }
  } else {
    // Backward Shift+Tab
    const prevSzI=szI-1;
    if(prevSzI>=0){
      // Prev size in same variety
      if(rows[vi]){
        const inp=rows[vi].querySelectorAll('input[type="number"]')[prevSzI];
        if(inp){inp.focus();inp.select();}
      }
    } else {
      // Start of this variety's sizes — go to this variety's name input
      if(rows[vi]){
        const nameInp=rows[vi].querySelector('input:not([type="number"])');
        if(nameInp){nameInp.focus();nameInp.select();}
      }
    }
  }
}

function showFieldError(id,msg){
  const inp=document.getElementById(id);const err=document.getElementById('err-'+id);
  if(inp){inp.classList.add('err');}
  if(err){err.textContent=msg||err.textContent;err.style.display='block';}

function clearFieldError(id){
  const inp=document.getElementById(id);const err=document.getElementById('err-'+id);
  if(inp)inp.classList.remove('err');if(err)err.style.display='none';
}
function createOrder(){
  // Clear all errors first
  ['no-id','no-client','no-date','no-dname','no-dcode'].forEach(clearFieldError);
  const errV=document.getElementById('err-no-varieties');if(errV)errV.style.display='none';

  const orderId=document.getElementById('no-id').value.trim();
  const client=document.getElementById('no-client').value.trim();
  const startDate=document.getElementById('no-date').value;
  const dname=document.getElementById('no-dname').value.trim();
  const dcode=document.getElementById('no-dcode').value.trim();

  let hasErr=false;
  if(!orderId){showFieldError('no-id','Order ID is required');hasErr=true;}
  if(!client){showFieldError('no-client','Client name is required');hasErr=true;}
  if(!startDate){showFieldError('no-date','Start date is required');hasErr=true;}
  if(!dname){showFieldError('no-dname','Design name is required');hasErr=true;}
  if(!dcode){showFieldError('no-dcode','Design code is required');hasErr=true;}

  // Validate varieties
  const validVarieties=window._modalVarieties.filter(v=>Object.values(v.sizes||{}).reduce((a,x)=>a+(parseInt(x)||0),0)>0);
  if(!window._modalVarieties.length||!validVarieties.length){
    if(errV)errV.style.display='block';hasErr=true;
  }
  if(hasErr)return;

  // Build design object
  const sizes=Object.fromEntries(window._modalSizes.map(sz=>[sz,0]));
  // Aggregate sizes from varieties
  window._modalVarieties.forEach(v=>window._modalSizes.forEach(sz=>{sizes[sz]=(sizes[sz]||0)+(parseInt((v.sizes||{})[sz])||0);}));
  const newStages=S.stageTemplates.map(s=>({stageId:s.id,status:'pending',note:'',days:null,completionDate:null,vendor:'',stageNote:'',qty:null}));
  const design={id:uid(),name:dname,code:dcode,sizesLocked:true,sizes,images:[],stages:newStages,varieties:JSON.parse(JSON.stringify(window._modalVarieties))};

  const newOrder={
    id:uid(),orderId,client,startDate,
    priority:document.getElementById('no-prio').value,
    notes:document.getElementById('no-notes').value,
    designs:[design]
  };
  S.orders.unshift(newOrder);
  S.openOrders.add(newOrder.id);
  S.openClients.add(client);
  S.activeTabs[newOrder.id]='designs';
  audit('Create order',`New order ${orderId} for ${client} created with ${window._modalVarieties.length} varieties`);
  rebuildVocab();closeModal();render();
}

// ── FILE IMPORT (Mock / hookable) ──────────────────────────────────────────────
function handleOrderDrop(e){
  e.preventDefault();document.getElementById('upload-zone').classList.remove('drag-over');
  const file=e.dataTransfer.files[0];if(file)processOrderFile(file);
}
function handleOrderFileInput(input){const file=input.files[0];if(file)processOrderFile(file);}
function processOrderFile(file){
  const status=document.getElementById('import-status');
  if(!status)return;
  const name=file.name.toLowerCase();
  if(name.endsWith('.csv')){
    // Real CSV parsing
    const reader=new FileReader();
    reader.onload=e=>{
      const text=e.target.result;
      const rows=text.split('\n').map(r=>r.split(',').map(c=>c.replace(/^"|"$/g,'').trim()));
      if(rows.length<2){status.textContent='CSV appears empty.';status.style.display='block';return;}
      const headers=rows[0].map(h=>h.toLowerCase());
      const data=rows[1];// first data row
      const get=(...keys)=>{for(const k of keys){const i=headers.findIndex(h=>h.includes(k));if(i>=0&&data[i])return data[i];}return '';};
      const prefill={orderId:get('order id','order_id','orderid'),client:get('client','customer'),startDate:get('date','start'),dname:get('design name','design'),dcode:get('code','design code')};
      status.textContent=`✅ CSV parsed — fields prefilled below. Review and create.`;status.style.display='block';
      closeModal();openNewOrderModal(prefill);
    };reader.readAsText(file);
  } else if(name.endsWith('.xlsx')||name.endsWith('.xls')){
    // Mock — SheetJS CDN hook point
    status.textContent='ℹ️ Excel detected. To enable real Excel parsing, include SheetJS (https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js) and connect via the parseExcelFile() function. Fields below are ready for manual entry.';
    status.style.display='block';
  } else if(file.type.startsWith('image/')){
    // Image upload — show preview in zone
    const reader=new FileReader();
    reader.onload=e=>{
      const zone=document.getElementById('upload-zone');
      if(zone)zone.innerHTML=`<img src="${e.target.result}" style="max-height:120px;border-radius:8px;margin:0 auto;display:block"><p style="margin-top:6px">Image uploaded. Fill in the fields manually below based on the order sheet.</p>`;
    };reader.readAsDataURL(file);
    status.textContent='📷 Order image loaded for reference. Fill fields manually.';status.style.display='block';
  }
}

function csvEncode(rows){

}
function downloadCSV(csv,filename){
  const blob=new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8;'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(url);
}

// ══════════════════════════════════════════════════════════════════════════════
// ── INVENTORY MODULE ──────────────────────────────────────────────────────────
// ══════════════════════════════════════════════════════════════════════════════

// Movement types: raw_in | raw_out | semi_in | semi_out | fin_in | fin_out | *_rejection
// qty used for ALL groups in pieces (raw pipes measured in pcs now)

const INV_TYPE_META = {
  raw_in:        {label:'Raw In',           col:'raw',  sign:+1, badge:'mv-raw-in',       icon:'⬇️', colLabel:'RAW (Pipes in pcs)'},
  raw_out:       {label:'Raw Out',          col:'raw',  sign:-1, badge:'mv-raw-out',      icon:'⬆️', colLabel:'RAW (Pipes in pcs)'},
  raw_rejection: {label:'Raw Rejected',     col:'raw',  sign:-1, badge:'mv-raw-out',      icon:'🚫', colLabel:'RAW (Pipes in pcs)', isRejection:true},
  semi_in:       {label:'Semi In',          col:'semi', sign:+1, badge:'mv-semi-in',      icon:'⬇️', colLabel:'Semi-Finished'},
  semi_out:      {label:'Semi Out',         col:'semi', sign:-1, badge:'mv-semi-out',     icon:'⬆️', colLabel:'Semi-Finished'},
  semi_rejection:{label:'Semi Rejected',    col:'semi', sign:-1, badge:'mv-semi-out',     icon:'🚫', colLabel:'Semi-Finished',      isRejection:true},
  fin_in:        {label:'Finish In',        col:'fin',  sign:+1, badge:'mv-fin-in',       icon:'⬇️', colLabel:'Finished'},
  fin_out:       {label:'Finish Out',       col:'fin',  sign:-1, badge:'mv-fin-out',      icon:'⬆️', colLabel:'Finished'},
  fin_rejection: {label:'Finish Rejected',  col:'fin',  sign:-1, badge:'mv-fin-out',      icon:'🚫', colLabel:'Finished',           isRejection:true},
};

function invIsoDate(d){
  // returns YYYY-MM-DD string from Date or string
  if(!d)return new Date().toISOString().split('T')[0];
  if(typeof d==='string')return d.split('T')[0];
  return d.toISOString().split('T')[0];
}

function invWeekKey(dateStr){
  const d=new Date(dateStr+'T00:00:00');
  const jan1=new Date(d.getFullYear(),0,1);
  const wk=Math.ceil(((d-jan1)/864e5+jan1.getDay()+1)/7);
  return `${d.getFullYear()}-W${String(wk).padStart(2,'0')}`;
}
function invWeekLabel(key){
  const [yr,wp]=key.split('-W');
  return `Week ${wp}, ${yr}`;
}
function invMonthKey(dateStr){return dateStr.slice(0,7);}
function invMonthLabel(key){
  const [y,m]=key.split('-');
  const mNames=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return `${mNames[parseInt(m)-1]} ${y}`;
}
function invYearKey(dateStr){return dateStr.slice(0,4);}
function invPeriodKey(dateStr){
  if(S.invPeriod==='weekly')return invWeekKey(dateStr);
  if(S.invPeriod==='yearly')return invYearKey(dateStr);
  return invMonthKey(dateStr);
}
function invPeriodLabel(key){
  if(S.invPeriod==='weekly')return invWeekLabel(key);
  if(S.invPeriod==='yearly')return key;
  return invMonthLabel(key);
}

// Compute running balance for a design key (name or code) up to a given date
// All quantities now in pcs (raw pipes also tracked in pcs)
function invBalance(designKey,byField,upToDate){
  const entries=S.invLedger.filter(e=>e[byField]===designKey&&e.date<=upToDate)
    .sort((a,b)=>a.date.localeCompare(b.date));
  let raw=0,semi=0,fin=0;
  entries.forEach(e=>{
    const m=INV_TYPE_META[e.type];if(!m)return;
    // Support both old qtyKg/qtySets format and new unified qty field
    const v=parseInt(e.qty!=null?e.qty:(m.col==='raw'?(e.qtyKg||0):(e.qtySets||0)))||0;
    if(m.col==='raw')raw+=m.sign*v;
    else if(m.col==='semi')semi+=m.sign*v;
    else fin+=m.sign*v;
  });
  return{raw:Math.max(0,raw),semi:Math.max(0,semi),fin:Math.max(0,fin)};
}

// Build period summary rows for a design key
function invBuildPeriodRows(designKey,byField){
  const field=byField||'designName';
  const relevant=S.invLedger.filter(e=>e[field]===designKey).sort((a,b)=>a.date.localeCompare(b.date));
  if(!relevant.length)return[];
  const periods={};
  relevant.forEach(e=>{
    const pk=invPeriodKey(e.date);
    if(!periods[pk])periods[pk]={key:pk,moves:[]};
    periods[pk].moves.push(e);
  });
  const sortedPeriods=Object.keys(periods).sort();
  const rows=[];

  sortedPeriods.forEach((pk)=>{
    const periodEntries=periods[pk].moves.sort((a,b)=>a.date.localeCompare(b.date));
    // Opening: balance using all entries strictly before this period
    const prevEntries=S.invLedger.filter(e=>e[field]===designKey&&invPeriodKey(e.date)<pk);
    let openRaw=0,openSemi=0,openFin=0;
    prevEntries.forEach(e=>{
      const m=INV_TYPE_META[e.type];if(!m)return;
      const v=parseInt(e.qty!=null?e.qty:(m.col==='raw'?(e.qtyKg||0):(e.qtySets||0)))||0;
      if(m.col==='raw')openRaw+=m.sign*v;
      else if(m.col==='semi')openSemi+=m.sign*v;
      else openFin+=m.sign*v;
    });
    openRaw=Math.max(0,openRaw);openSemi=Math.max(0,openSemi);openFin=Math.max(0,openFin);
    // Movements in period (rejections included under Out)
    let rawIn=0,rawOut=0,rawRej=0,semiIn=0,semiOut=0,semiRej=0,finIn=0,finOut=0,finRej=0;
    periodEntries.forEach(e=>{
      const v=parseInt(e.qty!=null?e.qty:(e.qtyKg||e.qtySets||0))||0;
      if(e.type==='raw_in')rawIn+=v;
      else if(e.type==='raw_out')rawOut+=v;
      else if(e.type==='raw_rejection')rawRej+=v;
      else if(e.type==='semi_in')semiIn+=v;
      else if(e.type==='semi_out')semiOut+=v;
      else if(e.type==='semi_rejection')semiRej+=v;
      else if(e.type==='fin_in')finIn+=v;
      else if(e.type==='fin_out')finOut+=v;
      else if(e.type==='fin_rejection')finRej+=v;
    });
    const closeRaw=Math.max(0,openRaw+rawIn-rawOut-rawRej);
    const closeSemi=Math.max(0,openSemi+semiIn-semiOut-semiRej);
    const closeFin=Math.max(0,openFin+finIn-finOut-finRej);
    rows.push({pk,label:invPeriodLabel(pk),
      openRaw,openSemi,openFin,
      rawIn,rawOut,rawRej,
      semiIn,semiOut,semiRej,
      finIn,finOut,finRej,
      closeRaw,closeSemi,closeFin,
      moves:periodEntries});
  });
  return rows;
}

// Gather all unique design keys
function invGetDesignKeys(byField){
  const set=new Set();
  S.invLedger.forEach(e=>set.add(e[byField]));
  // Also add from orders (so designs appear even with no manual entries yet)
  S.orders.forEach(o=>o.designs.forEach(d=>{
    if(byField==='designName')set.add(d.name);
    else set.add(d.code);
  }));
  return[...set].filter(Boolean).sort();
}

// Get current totals for all designs (for summary cards)
function invGetCurrentTotals(){
  const today=invIsoDate(new Date());
  let totalRaw=0,totalSemi=0,totalFin=0;
  const designKeys=invGetDesignKeys('designName');
  designKeys.forEach(k=>{
    const b=invBalance(k,'designName',today);
    totalRaw+=b.raw;totalSemi+=b.semi;totalFin+=b.fin;
  });
  return{totalRaw,totalSemi,totalFin,totalMoves:S.invLedger.length};
}

// ── INVENTORY CATEGORY DETAIL MODAL (vendor-wise, all periods, stages-enriched) ──
function openInvCategoryDetail(category,byField){
  const mc=document.getElementById('modal-container');
  const field=byField||'designName';

  const groupId=category==='finished'?'finished':category;
  const inType=category==='raw'?'raw_in':category==='semi'?'semi_in':'fin_in';
  const outType=category==='raw'?'raw_out':category==='semi'?'semi_out':'fin_out';
  const rejType=category==='raw'?'raw_rejection':category==='semi'?'semi_rejection':'fin_rejection';
  const isKg=false; // all groups now in pcs
  const catLabel=category==='raw'?'📦 RAW (Pipes)':category==='semi'?'🔧 Semi-Finished':'✅ Finished';
  const catColor=category==='raw'?'#E65100':category==='semi'?'#1565C0':'#2E7D32';
  const catBg=category==='raw'?'#FFF8E1':category==='semi'?'#E3F2FD':'#E8F5E9';
  const catBorder=category==='raw'?'#FFD54F':category==='semi'?'#90CAF9':'#A5D6A7';
  const unit='pcs';
  const periodLabel=S.invPeriod==='weekly'?'Weekly':S.invPeriod==='yearly'?'Yearly':'Monthly';

  // ── Enrich: build a stage-level row for every design in every order ──────────
  // Each row: {date, vendor, stageName, stageStatus, orderQty, designName, designCode, orderId, orderClient, orderPriority, stageNote, isKg, groupId}
  const stageRows=[];
  S.orders.forEach(order=>{
    (order.designs||[]).forEach(design=>{
      (design.stages||[]).forEach(st=>{
        const tmpl=getTmpl(st.stageId);
        if(!tmpl)return;
        const sg=tmpl.group||getStageGroup(st.stageId);
        if(sg!==groupId)return;
        const stageDate=st.completionDate||order.startDate||null;
        stageRows.push({
          date:stageDate,
          vendor:st.vendor||'',
          stageName:tmpl.name,
          stageLoc:tmpl.loc||'',
          stageStatus:st.status||'pending',
          qty:st.qty!=null?st.qty:null,
          stageNote:st.stageNote||st.note||'',
          designName:design.name,
          designCode:design.code,
          orderId:order.orderId,
          orderClient:order.client,
          orderPriority:order.priority,
          orderRawId:order.id,
          isKg
        });
      });
    });
  });

  // ── Collect all ledger entries for this category (including rejections) ────────
  const catEntries=S.invLedger
    .filter(e=>e.type===inType||e.type===outType||e.type===rejType)
    .sort((a,b)=>a.date.localeCompare(b.date));

  // Collect all periods
  const allPeriodsSet=new Set();
  catEntries.forEach(e=>allPeriodsSet.add(invPeriodKey(e.date)));
  stageRows.forEach(r=>{if(r.date)allPeriodsSet.add(invPeriodKey(r.date));});
  const sortedPeriods=[...allPeriodsSet].sort();

  // ── Vendor summary ────────────────────────────────────────────────────────────
  const vendorMap={};
  catEntries.forEach(e=>{
    const v=e.vendor||'(No vendor)';
    if(!vendorMap[v])vendorMap[v]={in:0,out:0,rej:0,entries:[],stageEntries:[],designs:new Set()};
    const qty=parseInt(e.qty!=null?e.qty:(e.qtySets||e.qtyKg||0))||0;
    if(e.type===inType)vendorMap[v].in+=qty;
    else if(e.type===outType)vendorMap[v].out+=qty;
    else if(e.type===rejType)vendorMap[v].rej+=qty;
    vendorMap[v].entries.push(e);
    vendorMap[v].designs.add(e.designName||e.designCode||'—');
  });
  stageRows.forEach(r=>{
    const v=r.vendor||'(No vendor)';
    if(!vendorMap[v])vendorMap[v]={in:0,out:0,rej:0,entries:[],stageEntries:[],designs:new Set()};
    vendorMap[v].stageEntries.push(r);
    vendorMap[v].designs.add(r.designName||'—');
  });
  const vendorEntries=Object.entries(vendorMap).sort((a,b)=>(b[1].in+b[1].out+b[1].stageEntries.length)-(a[1].in+a[1].out+a[1].stageEntries.length));

  // ── Overall totals ────────────────────────────────────────────────────────────
  const grandIn=catEntries.filter(e=>e.type===inType).reduce((a,e)=>a+(parseInt(e.qty!=null?e.qty:(e.qtySets||e.qtyKg||0))||0),0);

  const catEntries=S.invLedger.filter(e=>e.type===inType||e.type===outType||e.type===rejType).sort((a,b)=>a.date.localeCompare(b.date));
  const rows=[['=== '+catLabel+' INVENTORY DETAIL ==='],['Generated',new Date().toLocaleString()],[]];

  rows.push(['=== LEDGER MOVEMENTS ===']);
  rows.push(['Date','Design Name','Design Code','Type','Qty (pcs)','Vendor/Party','Linked Order','Source','Notes']);
  catEntries.forEach(e=>{
    const qty=parseInt(e.qty!=null?e.qty:(e.qtySets||e.qtyKg||0))||0;
    const lo=e.orderId?S.orders.find(o=>o.id===e.orderId):null;
    rows.push([fmtDate(e.date),e.designName||'',e.designCode||'',INV_TYPE_META[e.type]?INV_TYPE_META[e.type].label:e.type,qty,e.vendor||'',lo?lo.orderId:'',e.source&&e.source.startsWith('auto_')?'Auto':'Manual',e.note||'']);
  });

  rows.push([]);
  rows.push(['=== STAGE EVENTS ===']);
  rows.push(['Date','Stage Name','Stage Location','Vendor/Party','Design Name','Design Code','Order ID','Client','Priority','Qty (pcs)','Status','Notes']);
  S.orders.forEach(order=>{
    (order.designs||[]).forEach(design=>{
      (design.stages||[]).forEach(st=>{
        const tmpl=getTmpl(st.stageId);if(!tmpl)return;
        const sg=tmpl.group||getStageGroup(st.stageId);if(sg!==groupId)return;
        rows.push([st.completionDate?fmtDate(st.completionDate):fmtDate(order.startDate),tmpl.name,tmpl.loc||'',st.vendor||'',design.name,design.code,order.orderId,order.client,order.priority,st.qty!=null?st.qty:'',st.status||'pending',st.stageNote||st.note||'']);
      });
    });
  });

  downloadCSV(csvEncode(rows),`inv_${category}_detail_${new Date().toISOString().split('T')[0]}.csv`);
}

  if((e.ctrlKey||e.metaKey)&&!isTextInput&&!e.shiftKey&&e.key.toLowerCase()==='z'){e.preventDefault();histUndo();}

  if((e.ctrlKey||e.metaKey)&&e.key==='s'){e.preventDefault();manualSave();}
});

// ── GLOBAL MODAL FOCUS TRAP ────────────────────────────────────────────────────
// For all modals (not just New Order), prevent Tab from reaching the background.
// This is a capture-phase listener on the modal-container so it fires before
// the focusable element in the background even receives focus.
document.addEventListener('focusin', e=>{
  const mc=document.getElementById('modal-container');
  if(!mc||!mc.innerHTML.trim())return; // no modal open
  if(!mc.contains(e.target)){
    // Focus escaped the modal — pull it back to first focusable in modal
    e.preventDefault();
    e.stopPropagation();
    const focusable=_modalFocusable();
    if(focusable.length)focusable[0].focus();
  }
},true); // capture phase

function closeModal(){
  const overlay=document.getElementById('modal-overlay-main');
  if(overlay)overlay.removeEventListener('keydown',_modalFocusTrap);
  _modalRestoreBackground();
  document.getElementById('modal-container').innerHTML='';
}

// ── PUSH TO FIREBASE ──────────────────────────────────────────────────────────
async function fbPush(silent){
  _fb.lastPush = Date.now();
  try{
    const { stateNoImages } = extractImages({
      ...S, openOrders:[...S.openOrders], openClients:[...S.openClients]
    });
    const payload = JSON.stringify({
      ...stateNoImages,
      _savedAt : new Date().toISOString(),
      _device  : FB_DEVICE_ID
    });
    const r = await fetch(FB_DATA, {
      method : 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body   : payload
    });
    if(!r.ok) throw new Error('HTTP ' + r.status);
    const t = new Date().toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'});
    fbSetStatus('connected', 'Live · saved ' + t);
  } catch(e){
    fbSetStatus('error', 'Save failed — ' + e.message);
    if(!silent) showToast('⚠ Database save failed', 'red');
  }
}

function fbSchedulePush(){
  if(!_fb.ready) return;
  clearTimeout(_fb.pushTimer);
  fbSetStatus('syncing', 'Saving…');
  _fb.pushTimer = setTimeout(()=> fbPush(false), 1500);
}

// ── INIT: LOAD THEN LISTEN ────────────────────────────────────────────────────
async function fbInit(){
  fbSetStatus('syncing', 'Connecting…');
  try{
    const resp = await fetch(FB_DATA);
    if(!resp.ok) throw new Error('HTTP ' + resp.status);
    const data = await resp.json();

    if(data && data.orders){
      const remoteMs = data._savedAt ? new Date(data._savedAt).getTime() : 0;
      const localMs  = localStorage.getItem('bangle_saved_at')
                        ? new Date(localStorage.getItem('bangle_saved_at')).getTime() : 0;
      if(remoteMs > localMs + 2000){
        // Firebase is newer → load it
        histPush();
        Object.assign(S, data);
        S.openOrders  = new Set(data.openOrders  || []);
        S.openClients = new Set(data.openClients || []);
        save(); render();
        fbSetStatus('connected', 'Live · loaded latest data');
        showToast('⬇ Loaded latest data from database', 'green');
      } else {
        await fbPush(true);
      }
    } else {
      await fbPush(true);
      fbSetStatus('connected', 'Live · data uploaded');
    }
    _fb.ready = true;
    fbStartListener();
  } catch(e){
    fbSetStatus('error', 'Connection error — ' + e.message);
    showToast('⚠ Could not connect to database', 'red');
    // Retry after 8s
    setTimeout(fbInit, 8000);
  }
}

// ── REAL-TIME LISTENER (Server-Sent Events) ───────────────────────────────────
function fbStartListener(){
  if(_fb.es){ try{ _fb.es.close(); }catch(e){} }
  _fb.es = new EventSource(FB_DATA);

  _fb.es.addEventListener('put', (ev)=>{
    try{
      const msg  = JSON.parse(ev.data);
      const data = msg.data;
      if(!data || !data.orders) return;
      if(data._device === FB_DEVICE_ID) return; // own update — ignore
      const remoteMs = data._savedAt ? new Date(data._savedAt).getTime() : 0;
      const localMs  = localStorage.getItem('bangle_saved_at')
                        ? new Date(localStorage.getItem('bangle_saved_at')).getTime() : 0;
      if(remoteMs <= localMs) return; // we already have this or newer
      // Apply remote state
      Object.assign(S, data);
      S.openOrders  = new Set(data.openOrders  || []);
      S.openClients = new Set(data.openClients || []);
      save(); render();
      fbSetStatus('connected', 'Live · updated from another device');
      showToast('🔄 Updated from another device', 'amber');
    } catch(e){ /* ignore malformed events */ }
  });

  _fb.es.onerror = ()=>{
    fbSetStatus('error', 'Connection lost — reconnecting…');
    try{ _fb.es.close(); }catch(e){}
    _fb.es = null;
    setTimeout(fbStartListener, 5000);
  };
}

// ── HOOK INTO EXISTING save() ─────────────────────────────────────────────────
const _origSave = save;
window.save = function(){
  _origSave();
  fbSchedulePush();
};
